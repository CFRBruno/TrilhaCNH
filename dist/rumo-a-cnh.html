rio de água, que deve estar com água limpa e um pouco de detergente neutro.",["Usar um produto químico forte para dissolver a sujeira rapidamente.","Parar o carro e esfregar o vidro com a mão.","Não usar o limpador, pois ele pode riscar o vidro nessas condições."],"O material recomenda manter o reservatório com \"água limpa, misturada a um pouco de detergente neutro\" para ajudar a remover sujeiras.",""],["1-4-180",1,4,1,64,"Você nota que o vidro do carro está sempre sujo por dentro, com uma camada de gordura e poeira que se acentua à noite, quando as luzes dos faróis batem. Qual a simples ação de limpeza que deve ser feita regularmente?","Limpar os vidros por dentro e por fora regularmente, pois gordura e poeira prejudicam muito a visão noturna.",["Limpar apenas por fora com água do reservatório.","Limpar apenas por dentro, pois a sujeira externa não é relevante.","Usar o desembaçador para remover a gordura do vidro."],"O material enfatiza a importância de limpar os vidros \"por dentro e por fora regularmente\", pois gordura e poeira prejudicam muito a visão noturna.",""],["1-4-181",1,4,0,63,"Você está no começo de uma longa viagem, com previsão de tráfego intenso. Qual a atitude preventiva você deve ter em relação aos freios, mesmo que a manutenção periódica esteja em dia?","Sempre testar os freios antes de viagens longas para certificar que estão respondendo bem e sem ruídos.",["Aumentar o nível do óleo do motor em 50%.","Esvaziar completamente o reservatório do limpador.","Fazer o rodízio dos pneus no momento da saída."],"O material sugere que \"sempre teste os freios\" antes de viagens longas.",""],["1-4-182",1,4,1,68,"Você tem observado que o veículo está mais lento, com dificuldade em acelerar, e o consumo de combustível aumentou. Qual componente sujo ou entupido pode ser o responsável por essa dupla consequência?","Os filtros de ar, óleo e combustível, que entupidos prejudicam o desempenho e aumentam o consumo.",["O reservatório de água do limpador de para-brisa.","O sistema de luzes da placa.","Os terminais da bateria."],"O material afirma que \"Filtros entupidos prejudicam o desempenho e aumentam o consumo\" e que a troca deve ser feita conforme o manual.",""],["1-4-183",1,4,2,65,"Qual a dupla de fluidos de segurança que deve ter seu nível checado pelo menos uma vez por mês, sendo que um deve ser checado com o carro frio e o outro com verificação mensal do nível?","Óleo do motor (carro frio e plano) e Fluido de Freio (observação mensal).",["Fluido de Freio (semanalmente) e Água do Radiador (somente na revisão anual).","Óleo do motor (carro quente) e Fluido de Direção Hidráulica (mensalmente).","Água do Radiador (somente com o carro quente) e Fluido de Freio (anualmente)."],"O material indica checar o nível do óleo \"pelo menos uma vez por mês, com o carro frio e em terreno plano\" e \"Observar o nível do fluido de freio\" mensalmente, alertando que a baixa pode indicar vazamento.",""],["1-4-184",1,4,2,68,"Você nota o desgaste irregular dos pneus e ruídos estranhos ao passar em lombadas. Qual a consequência adicional imediata de segurança associada a um escapamento furado (outro problema) que não pode ser ignorada?","Um escapamento furado pode intoxicar os ocupantes com gases, exigindo conserto imediato.",["O escapamento furado indica que a bateria precisa ser trocada.","O ruído estranho indica que o fluido de freio está baixo.","O desgaste irregular dos pneus indica a falha total das luzes de ré."],"A seção \"Escapamento\" alerta que um escapamento furado \"pode intoxicar os ocupantes com gases. Conserte assim que notar problemas\", sendo um risco de segurança imediato.",""],["1-4-185",1,4,2,65,"Qual o risco para o sistema de alimentação que o motorista corre ao andar constantemente com o veículo na reserva de combustível?","O risco de sugar sujeira do tanque e entupir o sistema de combustível.",["O risco de o fluido de freio secar mais rápido.","O risco de a bateria descarregar por falta de energia.","O risco de o óleo do motor vazar pela vareta medidora."],"O material alerta para a \"Sabedoria automotiva\": \"Evite andar na reserva. Você pode sugar sujeira do tanque e entupir o sistema.\"",""],["1-4-186",1,4,2,61,"É possível ter o melhor volante, pneus e motor potente, mas se este sistema falhar, \"nada disso importa\". Qual é o sistema de segurança ao qual essa afirmação se refere, devendo ser prioridade absoluta na manutenção?","O sistema de freios, que é o componente de segurança mais importante do veículo.",["O sistema de suspensão.","O sistema de iluminação de emergência.","O sistema de arrefecimento."],"O material define explicitamente o sistema de freios como o \"componente de segurança mais importante do veículo\" e usa a frase citada para reforçar sua prioridade.",""],["1-4-187",1,4,2,66,"Qual é a distinção entre a revisão preventiva e o conserto corretivo, usando a analogia da saúde?","A preventiva é feita antes que os problemas apareçam, como ir ao médico fazer exames, enquanto o conserto é o remédio após a doença.",["A preventiva é apenas para cumprir o cronograma do manual, e o conserto é mais caro, mas mais rápido.","A preventiva é mais demorada, mas garante que o óleo do motor seja trocado junto com o filtro.","O conserto é sempre mais barato, mas a preventiva valoriza o carro."],"O material define a preventiva como a \"melhor forma de identificar pequenos problemas antes que se tornem grandes e caros\" e usa a analogia de \"ir ao médico e fazer exames de rotina\".",""],["1-4-188",1,4,2,68,"Você leva seu carro ao mecânico e ele nota desgaste irregular nos seus pneus. Qual é o sistema, além da suspensão, que deve ser imediatamente verificado para solucionar a causa do desgaste irregular?","A suspensão e o alinhamento do veículo, que, se desregulados, causam desgaste irregular e ruídos.",["A calibragem do estepe, que afeta o alinhamento.","O escapamento, que, se furado, causa o desgaste do pneu.","O sistema de lubrificação, que, se falhar, causa desgaste nos pneus."],"O material relaciona o desgaste irregular dos pneus a problemas na suspensão, e o alinhamento (que não é um item de suspensão, mas um ajuste) é a principal causa desse desgaste, devendo ser verificado junto.",""],["1-4-189",1,4,2,62,"Em quais situações o farol baixo é essencial para a segurança, sendo que em uma delas ele deve ser usado mesmo durante o dia?","Deve ser usado durante o dia, especialmente em rodovias, e à noite, em vias com iluminação ou com tráfego contrário.",["Deve ser usado apenas à noite em vias sem iluminação e sem tráfego contrário.","Deve ser usado apenas ao frear para avisar o veículo de trás.","Deve ser usado apenas em dias de neblina e chuva intensa."],"O material instrui o uso do farol baixo \"durante o dia (principalmente nas rodovias)\" e à noite em \"vias iluminadas ou quando houver veículo vindo em sentido contrário\".",""],["1-4-190",1,4,0,70,"Qual o conjunto de atitudes práticas, simples e acessíveis que, além de proteger o meio ambiente, economizam dinheiro no bolso do motorista?","Condução sustentável.",["Condução esportiva.","Condução de alto risco.","Condução de luxo."],"A Condução Sustentável é definida como um conjunto de atitudes que economizam dinheiro e protegem o meio ambiente.",""],["1-4-191",1,4,1,69,"Modificações irregulares, como alterar suspensão ou faróis sem autorização, comprometem a segurança do veículo e geram quais consequências?","Aumentam o risco de sinistros, a emissão de poluentes e podem gerar multas e remoção do veículo.",["Reduzem o consumo de combustível e a poluição sonora.","São permitidas, desde que a modificação seja estética.","Melhoram a segurança e a visibilidade noturna."],"Modificações irregulares comprometem a segurança, aumentam o risco de sinistros, a emissão de poluentes e podem gerar multas.",""],["1-4-192",1,4,0,70,"Qual o Resultado Positivo de se fazer a manutenção preventiva regularmente?","Evita fumaça preta, vazamentos e consumo excessivo.",["Aumenta o peso do carro e o esforço do motor.","Obriga o motorista a usar o farol alto.","Prejudica a visibilidade noturna."],"Fazer a manutenção preventiva evita fumaça preta, vazamentos e consumo excessivo.",""],["1-4-193",1,4,0,70,"Qual Boa Prática resulta na redução da emissão de gases e da poluição sonora?","Desligar o motor em paradas longas.",["Acelerar bruscamente em semáforos.","Usar escapamento esportivo.","Evitar o uso do ar-condicionado."],"Desligar o motor em paradas longas reduz a emissão de gases e a poluição sonora.",""],["1-4-194",1,4,0,70,"Qual o Resultado Positivo da prática de retirar peso desnecessário do porta-malas?","Menos esforço do motor e menor consumo.",["Maior desgaste dos freios e pneus.","Aumento do tempo gasto em rotas.","Redução da poluição sonora."],"Retirar peso desnecessário do porta-malas resulta em menos esforço do motor e menor consumo.",""],["1-4-195",1,4,0,70,"Qual combustível renovável, produzido a partir da cana-de-açúcar, é um dos principais responsáveis pela redução de emissões de gases poluentes na frota de veículos leves no Brasil?","Etanol.",["Gasolina pura.","Óleo diesel.","Gás Natural Veicular (GNV)."],"O etanol é um combustível renovável produzido a partir da cana-de-açúcar.",""],["1-4-196",1,4,0,70,"O que a prática de aceleração suave e progressiva resulta em termos de consumo e emissões?","Menos consumo de combustível e redução de emissões.",["Maior consumo de combustível e aumento de emissões.","Maior desgaste dos freios.","Menor durabilidade do motor."],"Acelerar suavemente e progressivamente gera menos consumo de combustível e redução de emissões.",""],["1-4-197",1,4,1,68,"O que a alteração irregular de suspensão, faróis ou outras modificações sem autorização compromete, além da segurança e emissão de poluentes?","Aumentam o risco de sinistros e podem gerar multas.",["Apenas o valor de revenda do veículo.","Apenas o consumo de água do radiador.","Apenas a durabilidade das palhetas."],"As modificações irregulares aumentam o risco de sinistros e podem gerar multas e remoção do veículo.",""],["1-4-198",1,4,0,70,"Qual a Boa Prática que resulta em \"Menos esforço do motor e menor consumo\"?","Retirar peso desnecessário do porta-malas.",["Dirigir com o motor desligado.","Fazer o rodízio dos pneus a cada 1.000 km.","Acelerar o máximo possível."],"A prática de retirar peso desnecessário do porta-malas resulta em menos esforço do motor e menor consumo.",""],["1-4-199",1,4,2,69,"Qual é a infração de trânsito que indica \"problemas graves no motor e emissão altíssima de poluentes\"?","Circular com o carro soltando fumaça preta.",["Estacionar sobre a calçada.","Avançar o sinal vermelho.","Dirigir sem cinto de segurança."],"Fumaça preta excessiva indica problemas e é classificada como infração de trânsito grave.",""],["1-4-200",1,4,0,70,"O que a prática de evitar freadas bruscas preserva no veículo, além dos freios e pneus?","A suspensão.",["O óleo do motor.","O fluido do limpador de para-brisa.","O sistema de arrefecimento."],"Evitar freadas bruscas resulta em menor desgaste de freios, pneus e suspensão.",""],["1-4-201",1,4,0,53,"João dirigia ao amanhecer, mas bocejou três vezes seguidas e percebeu os olhos pesados. O que ele deveria fazer antes de continuar?","Parar e descansar um pouco antes de seguir viagem",["Aumentar a velocidade para chegar mais rápido","Abrir a janela e seguir mesmo com sono","Forçar-se a ficar acordado ouvindo música alta"],"O texto reforça que o sono reduz reflexos e pode causar sinistros.",""],["1-4-202",1,4,0,54,"Clara saiu de casa irritada após uma discussão e notou que estava acelerando mais do que o normal. Qual a atitude correta?","Respirar fundo e esperar as emoções acalmarem antes de seguir",["Continuar acelerando para liberar o estresse","Dirigir enquanto fala ao telefone para desabafar","Frear bruscamente para ‘descontar’ a raiva"],"Emoções alteradas afetam a direção e aumentam o risco.",""],["1-4-203",1,4,0,53,"Pedro percebeu que não lembrava dos últimos metros dirigidos. Qual comportamento explica isso?","Ele teve um microssono",["Ele estava muito atento","O carro estava desregulado","Havia pouco combustível"],"Microssono é quando o cérebro “desliga” por alguns segundos.",""],["1-4-204",1,4,0,56,"Marta ouviu uma batida leve atrás dela. Antes de descer do carro, o que deve fazer?","Ligar o pisca-alerta e garantir a própria segurança",["Sair correndo para ver o dano","Ligar imediatamente para um amigo","Ficar parada no meio da via para discutir"],"Segurança própria vem sempre em primeiro lugar.",""],["1-4-205",1,4,0,55,"Ao parar para ajudar em um sinistro, Caio se aproximou do carro acidentado. O que ele deveria verificar primeiro?","Se há riscos como fumaça, vazamentos ou fios soltos",["Se ele reconhece alguém no carro","Se as vítimas têm documentos","Se os carros precisam ser movidos"],"Avaliar riscos evita se tornar mais uma vítima.",""],["1-4-206",1,4,0,55,"Durante a noite, Ana avistou um veículo parado após um sinistro em uma curva. O que ela deve fazer para evitar novos sinistros?","Sinalizar colocando o triângulo a pelo menos 30 metros",["Ficar no escuro para não atrair atenção","Seguir sem avisar ninguém","Ligar o farol alto diretamente para o veículo parado"],"A sinalização adequada evita novos sinistros.",""],["1-4-207",1,4,0,58,"Lucas encontrou uma vítima caída e consciente. Qual atitude é correta enquanto aguarda socorro?","Conversar para mantê-la calma",["Movimentá-la para deixá-la mais confortável","Dar água imediatamente","Levantar a pessoa para ver se consegue andar"],"Manter a vítima calma ajuda a estabilizar a situação.",""],["1-4-208",1,4,0,53,"Ricardo dirigia há horas sem parar e começou a sentir a visão turva. Qual a atitude correta?","Encostar em local seguro e descansar",["Ignorar e continuar","Aumentar o volume do rádio","Abrir a janela e seguir assim mesmo"],"O cansaço pode ser tão perigoso quanto álcool.",""],["1-4-209",1,4,0,56,"Paula presenciou um sinistro sem vítimas. Qual é o procedimento correto?","Retirar o veículo da via, se possível, após registrar as informações",["Manter o carro parado no meio da pista","Discutir com o outro motorista antes de qualquer atitude","Ligar o farol alto para sinalizar"],"Sinistros sem vítima devem ser removidos da via para evitar novos riscos.",""],["1-4-210",1,4,1,64,"Durante uma tempestade, Bruno percebeu que os limpadores estavam falhando. O que ele deveria ter feito antes?","Revisado e trocado as palhetas desgastadas",["Deixado para arrumar quando algo quebrasse","Usado apenas o desembaçador","Dirigido mais rápido para sair da chuva"],"Manutenção preventiva evita perda de visibilidade.",""],["1-4-211",1,4,1,55,"Fernanda viu fumaça saindo do motor após uma batida leve. O que ela deve fazer?","Afastar-se e não tentar mexer no veículo",["Abrir o capô imediatamente","Continuar dirigindo","Soprar a fumaça para ver melhor"],"Situações com risco de incêndio exigem distanciamento.",""],["1-4-212",1,4,1,61,"Gustavo esqueceu de calibrar os pneus e, na viagem, notou o carro instável. Qual o erro?","Não calibrar semanalmente com pneus frios",["Parar para calibrar só no fim da viagem","Usar pneus de marcas diferentes","Dirigir em estrada sem ar-condicionado"],"Pneus mal calibrados aumentam consumo e risco de sinistros.",""],["1-4-213",1,4,1,58,"Em um sinistro com vítimas, Laura queria ajudar mas pensou em movê-las. Por que não deve?","Mover pode agravar lesões internas",["As vítimas preferem ficar em pé","É proibido por lei","Pode sujar o banco do carro"],"Movimentação incorreta agrava danos.",""],["1-4-214",1,4,1,63,"Carlos percebeu que o freio estava fazendo ruído estranho. Qual deve ser sua atitude?","Procurar um mecânico imediatamente",["Usar mais força no pedal","Ignorar até piorar","Usar apenas o freio de mão"],"Ruídos anormais podem ser sinais de falha grave.",""],["1-4-215",1,4,1,58,"Luana, ao ver um motociclista caído, pensou em tirar o capacete. Por que isso é errado?","Retirar o capacete pode agravar lesões no pescoço",["O capacete é caro","Pode sujar as mãos","O motociclista pode fugir"],"Primeiros socorros incluem NÃO retirar capacete.",""],["1-4-216",1,4,1,57,"Em uma emergência, Rafael tentou ligar para a família antes do socorro. Qual é o procedimento correto?","Ligar primeiro para os números de emergência",["Ligar para amigos","Postar em redes sociais","Gravar um vídeo do sinistro"],"Acionar o socorro imediatamente é essencial.",""],["1-4-217",1,4,1,63,"Sofia percebeu que o carro puxava para o lado ao frear. Qual o risco disso?","Falha no sistema de freios",["Pneu muito novo","Combustível de má qualidade","Espelho mal ajustado"],"Freios assimétricos são extremamente perigosos.",""],["1-4-218",1,4,1,64,"Cléo percebeu que o para-brisa estava sempre embaçando. O que pode ter faltado?","Manutenção ou troca das palhetas",["Mais velocidade","Dirigir com vidro aberto","Usar água suja no reservatório"],"Limpadores ruins prejudicam visibilidade.",""],["1-4-219",1,4,2,60,"Após um sinistro grave, Eduardo tentou retirar uma vítima presa. Por que isso é perigoso?","Situações complexas exigem equipamentos especializados",["Vítimas preferem ficar sozinhas","O carro provavelmente está sem risco","É sempre melhor agir rápido sem pensar"],"Ação mal orientada pode gerar sequelas graves.",""],["1-4-220",1,4,2,60,"Beatriz viu cabos elétricos caídos após um sinistro. Qual o comportamento seguro?","Manter distância e acionar autoridades",["Tentar retirar com um galho","Aproximar-se para ver melhor","Chutar o fio para longe"],"Cenários especiais exigem cautela absoluta.",""],["1-4-221",1,4,2,53,"Marcos ignorou sinais de sonolência. Por que isso é arriscado?","Cochilos de 3 segundos equivalem a até 100m sem controle",["Porque o carro aquece","Porque gasta mais combustível","Porque a viagem fica chata"],"Microssono é um dos maiores riscos ao volante.",""],["1-4-222",1,4,2,58,"Durante um sinistro, André queria filmar antes de ajudar. Por que isso é inadequado?","Prioriza exposição em vez de segurança",["Vídeos são proibidos","O celular estraga fácil","O seguro não aceita vídeos"],"O foco deve ser salvar vidas, não registrar imagens.",""],["1-4-223",1,4,2,58,"Uma vítima estava desmaiada e Joice pensou em dar água. Por que isso é perigoso?","Pode causar engasgo ou aspiração",["A água pode estar quente","A vítima pode não gostar","A garrafa pode cair"],"Vítimas inconscientes não devem ingerir nada.",""],["1-4-224",1,4,2,66,"Luiz decidiu não revisar o carro antes da viagem. Qual risco isso representa?","Falhas mecânicas inesperadas podem causar sinistros graves",["Pode sujar o carro","Gasta mais combustível","Fica menos confortável"],"Manutenção preventiva é fundamental.",""],["2-1-1",2,1,0,6,"A faixa de pedestres, com suas largas listras brancas, concede qual direito ao pedestre?","A prioridade de travessia, exigindo que os veículos parem.",["O direito de atravessar, mas somente quando o semáforo de pedestres estiver verde.","O direito de atravessar apenas se não houver veículos se aproximando.","Direito do pedestre esperar até que não passe mais carro."],"A faixa de pedestres garante ao pedestre prioridade absoluta de passagem sobre os veículos ao atravessar a via.",""],["2-1-2",2,1,1,8,"Qual a função das faixas vermelhas na pavimentação das vias?","Um espaço exclusivo ou preferencial para a circulação de ciclistas.",["Uma área de parada obrigatória para todos os veículos.","Uma faixa de tráfego com velocidade máxima reduzida.","Uma área de cruzamento perigoso que deve ser evitada."],"A pintura de faixas vermelhas no asfalto indica faixas exclusivas para ciclistas (ciclovia/ciclofaixa)",""],["2-1-3",2,1,0,2,"A placa 'Sentido Proibido' indica que:","A entrada de veículos naquela via ou faixa é proibida, pois o tráfego flui no sentido contrário.",["A velocidade máxima permitida é muito baixa.","Não pode virar à direita ou à esquerda no próximo cruzamento.","A rua não tem saída e será preciso retornar."],"A placa \"Sentido Proibido\" indica que os veículos não podem entrar ou trafegar na via naquele sentido.","R-3"],["2-1-4",2,1,0,3,"Ao ver uma placa amarela com o desenho de uma lombada (quebra-molas), o que o condutor deve fazer?","Reduzir a velocidade para passar pela alteração no pavimento com segurança e conforto.",["Acelerar para passar rapidamente pela lombada(quebra-molas).","Desviar para a outra faixa para evitar a lombada (quebra-molas).","Manter a velocidade, pois a placa é apenas um aviso."],"Ao ver uma placa amarela indicando lombada, o condutor deve reduzir a velocidade e ficar atento para passar com segurança e cuidado sobre o obstáculo.","A-18"],["2-1-5",2,1,0,3,"Ao ver uma placa amarela com o desenho de uma lombada, o que o condutor deve fazer?","Reduzir a velocidade e passar com atenção.",["Acelerar para passar rápido.","Ignorar a placa.","Parar o veículo completamente."],"A placa amarela alerta para mudanças nas condições da via, como lombadas ou obstáculos, exigindo redução de velocidade.","A-18"],["2-1-6",2,1,0,3,"Ao ver uma placa amarela indicando 'Aclive acentuado', qual é a recomendação para um motorista de carro manual?","Reduzir a marcha antes de iniciar a subida para não perder força.",["Manter a marcha mais alta possível para economizar combustível.","Acelerar ao máximo antes da subida para ganhar impulso.","Acionar o freio de mão levemente para ajudar no controle do veículo."],"Aconselhável 'reduzir a marcha antes de iniciar o aclive para não perder força no meio do caminho'.","A-20b"],["2-1-7",2,1,1,4,"As placas brancas com mensagens como 'Use o cinto de segurança' pertencem a qual categoria?","Placas de Indicação (Educativas)",["Placas de Sinalização Temporária","Placas de Advertência","Placas de Regulamentação"],"Placas brancas com mensagens como \"Use o cinto de segurança\" pertencem à categoria de placas de indicação educativas, que informam ou orientam condutores e pedestres.",""],["2-1-8",2,1,2,1,"As placas de formato octogonal (oito lados) e triangular invertido são exceções dentro de qual família de placas?","Placas de Regulamentação",["Placas de Advertência","Placas de Sinalização Temporária","Placas de Indicação"],"As Placas \"Pare\" (octogonal) e \"Dê a Preferência (triângulo invertido) pertencem a família das Placas de Regulamentação. Seus formatos são exceção à regra. As demais placas dessa Família são redondas e das cores vermelha, branca e preta",""],["2-1-9",2,1,1,4,"As placas de indicação de cor marrom são utilizadas para sinalizar o quê?","Atrativos turísticos, como cachoeiras e museus.",["Direções e distâncias para outras cidades em rodovias.","Mensagens educativas para um trânsito mais seguro.","Serviços auxiliares, como postos de gasolina e hospitais."],"As placas de indicação marrons são dedicadas ao turismo, servem pra indicar pontos próximos ao local, que podem ser de interesse histórico, cultural ou natural",""],["2-1-10",2,1,1,4,"As placas de indicação de cor verde são mais comuns em qual tipo de ambiente?","Em estradas e rodovias para orientar sobre direções, destinos e distâncias.",["Próximo a parques e reservas naturais para indicar atrativos turísticos.","Em zonas escolares para reforçar a necessidade de atenção.","Dentro de áreas urbanas para indicar nomes de ruas locais."],"As placas verdes são mais comuns em rodovias e vias de circulação rápida, pois servem para orientar e indicar destinos, distâncias e direções.",""],["2-1-11",2,1,0,1,"As placas de regulamentação, com exceção de duas, possuem formato circular. Quais são essas duas exceções e por que têm formatos distintos?","PARE' (octogonal) e 'Dê a Preferência' (triângulo invertido), para serem facilmente reconhecíveis.",["'Proibido Estacionar' (retangular) e 'Alfândega' (quadrada), devido a convenções internacionais.","'Velocidade Máxima Permitida' (quadrada) e 'Sentido Proibido' (retangular), para destacar sua importância.","'Lombada' (losango) e 'Cruz de Santo André' (formato de X), por indicarem perigos e não regras."],"As duas exceções às placas circulares de regulamentação são a placa “PARE”, que tem formato octogonal para ser reconhecida facilmente de longe, e a placa “DÊ A PREFERÊNCIA”, que é triangular invertida para destacar a obrigação de ceder passagem. Esses formatos distintos ajudam a identificar rapidamente a mensagem principal, mesmo sem ler o texto.",""],["2-1-12",2,1,0,1,"As placas de Regulamentação, que estabelecem regras obrigatórias, são predominantemente de que cores?","Vermelha, branca e preta",["Amarela e preta","Azul e branca","Laranja e preta"],"As placas de regulamentação são das cores vermelha, branca e preta, sendo a vermelha a cor predominante",""],["2-1-13",2,1,0,0,"As placas fixadas ao lado da via como a de 'PARE', pertencem a qual tipo de sinalização?","Sinalização Vertical",["Sinalização Horizontal","Sinalização Semafórica","Dispositivos Auxiliares"],"As placas instaladas ao lado ou sobre a via para regulamentar, advertir e orientar os usuários do trânsito são classificadas como sinalização vertical",""],["2-1-14",2,1,0,10,"De acordo com a hierarquia da sinalização, o que tem mais prioridade: uma placa de 'Velocidade Máxima 60 km/h' ou um semáforo vermelho?","O semáforo, pois na hierarquia ele está acima das placas.",["Nenhum dos dois, o condutor deve usar o bom senso.","Depende do horário, durante a noite a placa prevalece.","A placa, pois ela estabelece uma regra permanente para a via."],"O semáforo vermelho tem prioridade, mesmo sobre a placa de “Velocidade Máxima 60 km/h”, pois as ordens do semáforo prevalecem sobre placas e outras sinalizações. Art. 89, CTB.",""],["2-1-15",2,1,1,9,"Dispositivos como cones, balizadores e tachas refletivas (olho de gato) são classificados como qual tipo de sinalização?","Dispositivos Auxiliares",["Sinalização Vertical","Sinalização Horizontal","Sinalização Cicloviária"],"Os dispositivos auxiliares são “ajudantes físicos” que complementam e reforçam a sinalização, como postes, tachas refletivas e balizadores na pista.",""],["2-1-16",2,1,1,6,"É permitido transitar em uma faixa exclusiva de ônibus de transporte público?","Não, é uma infração gravíssima e o condutor deve respeitar a sinalização.",["Sim, se for apenas por poucos metros para fazer uma conversão.","Sim, se o trânsito nas outras faixas estiver completamente parado.","Sim, fora do horário de pico, quando não há muito ônibus circulando."],"Essa conduta é infração gravíssima e o condutor deve observar e respeitar a sinalização. Art. 184, inciso III do CTB",""],["2-1-17",2,1,1,5,"Na sinalização horizontal, o que linhas contínuas amarelas pintadas no centro da pista indicam?","Separação de fluxos em sentidos opostos, com ultrapassagem proibida para ambos os lados.",["Permissão para ultrapassagem para ambos os sentidos.","Separação de fluxos no mesmo sentido, com ultrapassagem proibida.","Área exclusiva para a circulação de bicicletas."],"Na sinalização horizontal, a cor amarela indica fluxos em sentidos opostos e a linha contínua significa que a ultrapassagem é proibida. MBST, volume IV",""],["2-1-18",2,1,0,6,"Na sinalização horizontal, qual é a função da linha de retenção?","Mostrar o local limite onde o veículo deve parar, antes de um semáforo ou placa 'PARE'.",["Separar faixas de tráfego que seguem em sentidos opostos.","Delimitar a área onde os pedestres devem atravessar a rua.","Indicar o local exato onde é permitido ultrapassar outro veículo."],"A linha de retenção é uma faixa grossa pintada no chão que mostra o ponto onde o veículo deve parar completamente, antes dela, em locais de parada obrigatória, como cruzamentos. MBST, volume IV",""],["2-1-19",2,1,0,9,"O que a cor laranja em uma placa de sinalização geralmente indica?","Uma condição temporária na via, como obras ou desvios.",["A proximidade de um ponto turístico de interesse histórico.","Uma área com grande fluxo de pedestres e ciclistas.","Uma regra de trânsito que se aplica apenas durante a noite."],"A cor laranja é usada nas sinalizações temporárias porque é bem visível e indica que há uma mudança nas condições normais da via, como obras ou serviços na pista.",""],["2-1-20",2,1,0,5,"O que indica uma linha contínua amarela pintada no centro de uma pista?","Que a ultrapassagem e o retorno são proibidos naquele trecho.",["Que a via é de mão única.","Que é uma área exclusiva para pedestres.","Que a ultrapassagem é permitida para ambos os sentidos."],"A linha contínua funciona como uma barreira visual, indicando que cruzar para a outra faixa é proibido e perigoso.",""],["2-1-21",2,1,0,7,"O que o motorista deve fazer ao se deparar com a luz amarela do semáforo?","Reduzir a velocidade e se preparar para parar antes da faixa de retenção.",["Parar imediatamente, mesmo que esteja no meio do cruzamento.","Acelerar para conseguir passar antes que o sinal fique vermelho.","Continuar com a mesma velocidade, pois a preferência ainda é sua."],"A luz amarela significa \"atenção\", indicando que o sinal ficará vermelho em breve e o condutor deve se preparar a parada obrigatória",""],["2-1-22",2,1,2,6,"O que são 'marcas de canalização' na sinalização horizontal?","Faixas brancas diagonais que organizam o fluxo, separando ou direcionando os veículos.",["A linha grossa branca antes do semáforo onde os carros devem parar.","As faixas brancas que delimitam vagas de estacionamento.","As setas pintadas no chão que indicam a direção de cada faixa."],"As marcas de canalização são linhas e símbolos pintados no chão que orientam o fluxo de veículos, indicando faixas, desvios ou separações de pistas para organizar o trânsito, e não devem ser ultrapassadas ou trafegadas, pois delimitam o espaço de circulação e mantêm a segurança.",""],["2-1-23",2,1,1,5,"O que significa uma linha dupla na pista, sendo a linha do seu lado contínua e a outra tracejada?","A ultrapassagem é permitida apenas para os veículos no sentido oposto.",["A ultrapassagem é proibida para ambos os sentidos de tráfego.","A ultrapassagem é permitida apenas para o seu sentido de tráfego.","A ultrapassagem é permitida para ambos os sentidos de tráfego."],"Em uma pista dupla com linha contínua e tracejada, vale a regra: se a linha contínua está do seu lado, você não pode ultrapassar",""],["2-1-24",2,1,1,7,"Qual é a atitude correta de um bom condutor ao ver o sinal de trânsito ficar amarelo?","Reduzir a velocidade e se preparar para parar com segurança antes da faixa.",["Acelerar para aproveitar o 'último segundo' e não ter que parar.","Buzinar para avisar o carro de trás que você vai parar.","Frear bruscamente, mesmo que tenha espaço para parar com calma."],"Esta é a conduta do motorista consciente, que entende que o amarelo é um aviso para parar, não para acelerar.",""],["2-1-25",2,1,0,6,"Qual é a função das setas direcionais pintadas no chão?","Indicar a direção obrigatória que cada faixa de tráfego segue.",["Avisar sobre a proximidade de um retorno na via.","Alertar para a presença de ciclistas compartilhando a via.","Sugerir as melhores rotas para evitar congestionamentos."],"As setas direcionais pintadas no chão indicam a direção obrigatória que os veículos devem seguir em cada faixa. MBST Vol. IV",""],["2-1-26",2,1,2,9,"Qual é a principal característica das sinalizações temporárias?","Sua cor laranja e sinaliza que há um evento ou obra no caminho, caracteriza-se por não ser permanente.",["Ela utiliza exclusivamente dispositivos luminosos, como semáforos.","Ela só é válida durante o dia.","É sempre acompanhada por um agente de trânsito."],"A principal característica da sinalização temporária é que ela indica mudanças nas condições normais da via, como obras ou desvios, e pode ser removida ou alterada conforme a situação. MBST Vol. VII",""],["2-1-27",2,1,0,2,"Qual é a principal diferença entre a placa 'Proibido Estacionar' e 'Proibido Parar e Estacionar'?","Em 'Proibido Estacionar' é permitida uma parada rápida para embarque/desembarque, enquanto na outra, nem isso é permitido.",["Não há diferença, ambas proíbem completamente a imobilização do veículo.","Uma se aplica a carros e a outra a motocicletas.","'Proibido Estacionar' é uma recomendação, enquanto 'Proibido Parar e Estacionar' é uma ordem."],"Em \"Proibido Estacionar\" é permitida uma parada rápida para embarque e desembarque (E com um corte diagonal), mas o condutor não pode deixar o veículo estacionado",""],["2-1-28",2,1,0,3,"Qual é a principal função das placas de advertência, como a que indica 'Curva Acentuada'?","Alertar sobre perigos e situações especiais à frente na via.",["Educar o motorista sobre comportamento seguro.","Ordenar a parada imediata do veículo.","Informar a distância até a próxima cidade."],"As placas de advertência servem para avisar como antecedência sobre condições que exigem atenção, como curvas à frente ou lombadas",""],["2-1-29",2,1,2,8,"O que a sinalização cicloviária, com faixas vermelhas e símbolos de bicicleta, indica?","Indicar um espaço prioritário ou exclusivo para a circulação de ciclistas, que deve ser respeitado pelos motoristas.",["Indicar áreas onde o trânsito de bicicletas é proibido devido ao alto fluxo de carros.","Alertar os ciclistas de que eles estão entrando em uma via compartilhada sem preferência definida.","Que os ciclistas devem ceder a preferência aos veículos motorizados nessas áreas."],"A sinalização cicloviária, como faixas vermelhas e símbolos de bicicleta, indica áreas exclusivas para ciclistas e orienta sua circulação, garantindo segurança do ciclista e separação do tráfego de veículos motorizados. MBST Vol. IV",""],["2-1-30",2,1,0,1,"Qual é a principal razão para que a placa 'PARE' tenha um formato octogonal único?","Para ser facilmente reconhecida, mesmo que vista de costas ou parcialmente coberta.",["Para diferenciar as paradas obrigatórias em áreas rurais e urbanas.","Para indicar que a parada é uma sugestão e não uma ordem.","Para economizar material na sua fabricação."],"O formato octogonal da placa \"PARE\" é único para que seja facilmente reconhecida à distância, garantindo que o condutor identifique imediatamente a obrigação de parar.",""],["2-1-31",2,1,0,0,"Qual é o principal objetivo da sinalização de trânsito no Brasil?","Tornar o trânsito mais seguro, organizado e previsível para todos os usuários da via.",["Aumentar a arrecadação de multas para os municípios e estados.","Decorar as ruas e estradas com placas e pinturas coloridas.","Testar a habilidade e atenção dos motoristas em situações complexas."],"A sinalização existe para organizar o trânsito e garantir a segurança, funcionando como uma linguagem universal",""],["2-1-32",2,1,0,36,"Qual tipo de calçado é considerado inadequado e perigoso para a condução de um veículo?","Chinelos e calçados que não ficam firmes nos pés.",["Botas de cano longo.","Sapatos fechados.","Tênis com solado grosso."],"Este tipo de calçado pode escapar dos pés, enroscar nos pedais e comprometer seriamente a segurança da condução.",""],["2-1-33",2,1,1,5,"Quando a sinalização horizontal apresenta uma linha branca seccionada (tracejada), o que isso significa?","Separa fluxos no mesmo sentido e a ultrapassagem é permitida, se houver segurança.",["É uma área onde é proibido parar e estacionar.","Separa fluxos de sentidos opostos e a ultrapassagem é proibida.","Indica a aproximação de uma faixa de pedestres."],"A linha branca tracejada separa faixas de mesmo sentido e indica que o condutor pode trocar de faixa ou ultrapassar, desde que seja seguro, respeitando os limites de velocidade e atenção ao trânsito ao redor.",""],["2-1-34",2,1,0,6,"Quando um motorista encontra a palavra 'PARE' escrita no chão, qual é a sua relação com a placa vertical de 'PARE'?","Ela reforça a mensagem da placa de 'PARE', indicando a mesma ordem de parada obrigatória.",["A palavra no chão indica que a parada é opcional, enquanto a placa a torna obrigatória.","A marcação no chão substitui a placa, tendo maior prioridade na hierarquia.","É uma marcação para pedestres, indicando onde eles devem parar antes de atravessar."],"A palavra \"PARE\" pintada no chão reforça a placa vertical de “PARE”, indicando o ponto exato onde o veículo deve parar completamente.",""],["2-1-35",2,1,1,7,"Se um semáforo em uma passagem de trem começar a piscar em vermelho, o que isso significa?","Que um trem está se aproximando e a travessia deve ser interrompida imediatamente.",["Que a passagem está livre e os carros podem cruzar a ferrovia.","Que o semáforo está com defeito e o motorista deve passar com cuidado.","Que apenas veículos pesados, como caminhões, devem parar."],"Se o semáforo em uma passagem de trem começar a piscar em vermelho, significa que os veículos devem parar e aguardar a passagem do trem, pois a travessia não está segura.",""],["2-1-36",2,1,0,10,"Se você estiver em um cruzamento onde o semáforo está verde, mas um agente de trânsito sinaliza para você parar, qual instrução você deve seguir?","A do agente de trânsito, pois suas ordens prevalecem sobre todas as outras sinalizações.",["A da placa de 'PARE', se houver uma no cruzamento.","Nenhuma, deve-se usar a regra geral de preferência da direita.","A do semáforo, pois é um equipamento eletrônico e mais preciso."],"Você deve obedecer ao agente, pois ele tem a maior autoridade no trânsito: vem antes do semáforo, das placas e das marcas pintadas no chão.",""],["2-1-37",2,1,1,1,"Um motorista avista uma placa amarela em formato de losango. Qual tipo de informação essa placa está transmitindo?","Um aviso sobre uma condição potencialmente perigosa à frente, como 'Saliência ou lombada'.",["A identificação de uma rodovia ou a indicação de serviços auxiliares, como um restaurante.","Uma ordem que, se desobedecida, resulta em infração, como um limite de velocidade.","Um indicativo de ponto turístico, como parque natural ou museu."],"As placas amarelas em formato de losango são advertências e alertas sobre perigos adiante na estrada.",""],["2-1-38",2,1,0,10,"Um semáforo está verde, mas um agente de trânsito sinaliza para você parar. Qual instrução deve ser seguida?","Parar imediatamente, pois o agente tem prioridade.",["Seguir o semáforo.","Acelerar para atravessar antes do agente.","Ignorar e continuar."],"As instruções do agente de trânsito têm prioridade sobre semáforos, placas e outras sinalizações, garantindo segurança e controle do fluxo.",""],["2-1-39",2,1,0,2,"Você encontra uma placa circular branca com borda vermelha e o número 60. O que significa?","Velocidade máxima permitida: 60 km/h.",["Velocidade mínima de 60 km/h.","Distância de 60 metros até a próxima curva.","Faixa exclusiva para veículos que trafegam a 60 km/h."],"Placas circulares com borda vermelha indicam regulamentações obrigatórias","R-19"],["2-1-40",2,1,0,2,"Você está dirigindo e vê uma placa de regulamentação com o símbolo de um 'E' cortado por uma faixa vermelha. O que essa placa permite?","Permite uma parada rápida para embarque e desembarque, mas proíbe estacionar o veículo no local.",["Não permite nenhuma forma de imobilização do veículo, nem mesmo por um instante.","Permite estacionar, mas proíbe a parada rápida para embarque e desembarque.","Indica que o estacionamento é exclusivo para um determinado tipo de veículo."],"Uma placa de regulamentação com o símbolo de um “E” cortado por uma faixa vermelha indica “Proibido Estacionar”, permitindo apenas paradas rápidas para embarque e desembarque, mas não permite estacionar o veículo.","R-6a"],["2-1-41",2,1,0,3,"Você vê uma placa amarela com o desenho de pessoa atravessando. O que ela significa?","Faixa de pedestres, respeite a prioridade.",["Indica que não há pedestres na área.","Permite que veículos passem sem reduzir velocidade.","Apenas alerta sobre ciclovia."],"Placas de advertência alertam sobre locais onde há maior atenção necessária","A-32b"],["2-2-1",2,2,0,20,"A atitude de seguir um veículo de emergência (ambulância, bombeiros) para aproveitar o caminho livre é considerada:","Uma infração de trânsito.",["Uma estratégia permitida em caso de congestionamento.","Permitida, desde que se mantenha uma distância segura.","Uma atitude de bom senso para liberar a via mais rápido."],"Essa conduta é irregular e perigosa. Infração do artigo 190 do CTB",""],["2-2-2",2,2,2,22,"Ameaçar pedestres que atravessam a via ou outros veículos é uma infração de que tipo?","Gravíssima",["Grave","Média","Leve"],"Art. 170 do CTB",""],["2-2-3",2,2,1,15,"Avançar o sinal vermelho é uma infração gravíssima. Quantos pontos são adicionados à CNH do condutor por essa atitude?","7 pontos.",["3 pontos.","5 pontos.","4 pontos."],"As infrações gravíssimas, que representam o maior risco, recebem a pontuação máxima. Art. 259, inciso I do CTB",""],["2-2-4",2,2,0,13,"Dirigir com a CNH vencida há mais de 30 dias é considerado qual tipo de infração?","Gravíssima",["Média","Grave","Leve"],"Dirigir sem estar devidamente habilitado (o que inclui CNH vencida) representa um risco imediato e elevado. Art. 162, inciso V do CTB",""],["2-2-5",2,2,1,22,"Dirigir com o som do carro excessivamente alto, perturbando o sossego público, é uma infração de qual gravidade?","Grave.",["Não é uma infração de trânsito, mas sim uma contravenção penal.","Média.","Leve."],"Além de ser uma falta de respeito, o som alto é considerado uma infração de alto risco social, com multa e possibilidade de retenção do veículo. Art. 228 do CTB",""],["2-2-6",2,2,1,24,"Dirigir com uma lâmpada do farol queimada é considerado uma infração de qual natureza?","Média, pois representa risco à segurança por falta de visibilidade.",["Leve, pois a outra lâmpada ainda funciona.","Não é uma infração, mas o motorista deve consertar assim que possível.","Grave, pois é um equipamento obrigatório."],"Uma lâmpada queimada é um exemplo de infração média, que pode colocar a vida do condutor em risco. Art. 230, inciso XXII do CTB",""],["2-2-7",2,2,0,31,"Durante o período da Permissão Para Dirigir , qual combinação de infrações resultará na perda do direito de obter a CNH definitiva?","Ser reincidente em uma infração de natureza média.",["Cometer uma única infração de natureza média.","Cometer duas infrações de natureza leve em um ano.","Não cometer infração."],"O condutor em período de permissão não pode ser reincidente em infrações médias, além de não poder cometer infrações graves ou gravíssimas.",""],["2-2-8",2,2,0,31,"Durante o período de validade da Permissão Para Dirigir, qual tipo de infração o condutor NÃO pode cometer para obter a CNH definitiva?","Cometer infração grave ou gravíssima.",["Ser autuado por excesso de velocidade de até 20% acima do limite.","Cometer qualquer infração de natureza leve.","Receber duas multa leves."],"Art. 148, §§ 3º e 4º do CTB",""],["2-2-9",2,2,1,21,"Estacionar em uma vaga reservada para idosos ou pessoas com deficiência sem possuir a devida credencial é uma infração:","Gravíssima, por ser uma falta de respeito e desrespeito à lei de acessibilidade.",["Leve, se for 'apenas 5 minutinhos'.","Grave, pois dificulta a mobilidade de outras pessoas.","Média, pois apenas atrapalha o acesso."],"O uso indevido dessas vagas é uma das infrações mais severas por seu impacto social e desrespeito a um direito.",""],["2-2-10",2,2,1,21,"É permitido estacionar o veículo no sentido contrário ao fluxo da via, ainda que esteja corretamente alinhado à calçada?","Não, é uma infração de trânsito média, pois pode confundir outros condutores.",["Não, mas é considerado apenas uma infração leve.","Sim, se não houver placa proibindo.","Sim, desde que seja durante a noite, quando o trânsito é menor."],"Essa prática é uma infração pois surpreende outros motoristas e vai contra o fluxo da via.",""],["2-2-11",2,2,1,21,"Estacionar sobre uma calçada ou ciclovia é uma infração de qual gravidade?","Grave",["Leve","Média","Gravíssima"],"Desrespeitar o espaço exclusivo de pedestres e ciclistas, colocando-os em risco, é classificado como uma infração de alto perigo.",""],["2-2-13",2,2,2,27,"Fugir do local de um sinistro para evitar a responsabilidade é considerado o que pela lei de trânsito?","Um crime de trânsito, com pena de detenção ou multa.",["Uma infração grave, com multa e pontos na CNH.","Uma infração média, se ninguém ficou ferido.","Uma atitude moralmente errada, mas sem punição legal específica."],"O Código de Trânsito Brasileiro tipifica a fuga do local do sinistro como crime, pois demonstra a intenção de não arcar com as responsabilidades.",""],["2-2-14",2,2,0,19,"Não usar o cinto de segurança, seja no banco da frente ou de trás, é classificado como qual tipo de infração?","Grave",["Leve","Média","Gravíssima"],"O CTB classifica essa infração como grave.",""],["2-2-15",2,2,2,12,"Qual o limite de pontos em 12 meses para o condutor que não tem nenhuma infração gravíssima?","40 (quarenta) pontos.",["20 (vinte) pontos.","30 (trinta) pontos.","19 (dezenove) pontos."],"Conforme o Art. 261, Inciso I, alínea 'c' do CTB, a penalidade de suspensão do direito de dirigir será imposta quando o infrator atingir 40 (quarenta) pontos no período de 12 meses, caso não conste nenhuma infração gravíssima na pontuação.",""],["2-2-16",2,2,0,28,"O que pode acontecer se você não pagar uma multa de trânsito dentro do prazo?","O veículo pode ficar com restrições no licenciamento, impedindo sua circulação e transferência.",["O valor da multa é descontado diretamente do seu salário.","Você perde pontos na CNH, mas não precisa pagar a multa.","A multa é perdoada automaticamente após um ano."],"Conforme dispõe o Art. 131, § 2º do CTB, multas não pagas impedem a regularização do veículo e acumulam juros.",""],["2-2-18",2,2,1,21,"Por que é proibido estacionar a menos de 5 metros de uma esquina?","Porque atrapalha a visão dos motoristas, dificulta manobras, além de ser uma infração de trânsito.",["Porque a prefeitura costuma instalar lixeiras nesse local.","Porque é um espaço reservado para carga e descarga.","Porque essa área é de uso exclusivo dos pedestres."],"Estacionar na esquina prejudica a visibilidade no cruzamento, aumentando o risco de sinistros. Art. 181, inciso I",""],["2-2-19",2,2,0,27,"Qual atitude pode transformar uma infração de trânsito em um crime de trânsito?","Dirigir sob efeito de álcool acima do limite previsto em lei.",["Não pagar a multa de trânsito dentro do prazo de vencimento.","Estacionar em local proibido por mais de duas horas.","Receber mais de três multas gravíssimas no mesmo ano."],"Quando o comportamento do condutor é tão perigoso que ultrapassa a esfera administrativa, como dirigir embriagado, ela se torna um crime.",""],["2-2-20",2,2,0,27,"Qual das atitudes a seguir pode ser considerada um crime de trânsito?","Participar de 'racha' ou exibição perigosa em via pública.",["Transitar pela faixa exclusiva de ônibus.","Estacionar em fila dupla para um desembarque rápido.","Fugir do pagamento do pedágio."],"Competições ilegais e manobras arriscadas geram um risco tão alto que são tipificadas como crime, com pena de detenção.",""],["2-2-21",2,2,2,16,"Qual das seguintes ações é classificada como uma infração de gravidade média?","Transitar em velocidade até 20% superior à máxima permitida.",["Avançar o sinal vermelho do semáforo.","Não usar o cinto de segurança.","Estacionar o veículo afastado um pouco da guia."],"O excesso de velocidade nesta faixa representa um risco moderado, de acordo com a classificação do sistema de trânsito.",""],["2-2-22",2,2,1,69,"Qual das seguintes ações representa uma infração de trânsito grave e um risco ambiental relacionado à poluição sonora e do ar?","Circular com o carro fazendo barulho pelo escapamento e soltando fumaça preta e excessiva.",["Dirigir com as palhetas do limpador de para-brisa gastas.","Utilizar o farol alto em vias iluminadas, ofuscando outros motoristas.","Não realizar o rodízio de pneus a cada 10 mil km."],"A fumaça preta indica problemas no motor, alta emissão de poluentes e constitui uma infração de trânsito grave.",""],["2-2-24",2,2,0,18,"Qual é a classificação da infração por deixar de usar a seta para indicar uma mudança de faixa?","Grave",["Média","Leve","Gravíssima"],"A seta é um sistema de comunicação essencial, e não usá-la coloca outros em alto risco ao criar uma situação imprevisível.",""],["2-2-25",2,2,0,20,"Qual é a classificação da infração por não dar passagem a um veículo de emergência com sirene e luzes ligadas?","Gravíssima.",["Leve, se o motorista não percebeu a tempo.","Média, pois é uma questão de gentileza.","Grave, pois atrapalha o trânsito."],"Deve ser dada prioridade aos veículos de emergência.",""],["2-2-26",2,2,0,22,"Qual é a gravidade da infração de transitar pelo acostamento?","Gravíssima, com multa multiplicada por 3.",["Grave, com multa e 5 pontos.","Leve, pois não interfere na faixa de rolamento.","Média, se for por um trecho curto."],"Utilizar o acostamento para obter vantagem no trânsito gera um alto risco de sinistros e é punido com severidade.",""],["2-2-27",2,2,0,22,"Qual é a gravidade da infração por desobedecer às ordens de um agente de trânsito?","Grave.",["Gravíssima.","Média, se a desobediência não causar um sinistro.","Leve, pois o agente pode apenas dar uma advertência verbal."],"A autoridade do agente é fundamental para a segurança, e desrespeitá-la é uma infração de alto risco.",""],["2-2-28",2,2,2,12,"Qual o limite de pontos na CNH, em um período de 12 meses, para um condutor que não cometeu nenhuma infração gravíssima?","40 pontos.",["50 pontos.","20 pontos.","30 pontos."],"Conforme o art. 261, Inciso I, alínea 'c' do CTB, a penalidade de suspensão do direito de dirigir será imposta quando o infrator atingir 40 (quarenta) pontos no período de 12 meses, caso não conste nenhuma infração gravíssima na pontuação.",""],["2-2-29",2,2,2,11,"Quando um agente de trânsito retém o veículo no local da fiscalização, qual tipo de consequência está sendo aplicada?","Medida Administrativa",["Crime de Trânsito","Pontuação na Carteira","Penalidade"],"Esta é a ação imediata realizada pelo agente no momento da fiscalização para impedir que o perigo continue.",""],["2-2-30",2,2,0,23,"Quando uma infração de trânsito, como dirigir alcoolizado, se torna também um crime de trânsito?","Quando o comportamento é tão grave que ultrapassa a esfera administrativa, como atingir um certo limite no bafômetro.",["Sempre que o motorista é parado em uma blitz.","Infrações de trânsito e crimes de trânsito são a mesma coisa.","Apenas se o motorista causar um sinistro com vítimas"],"O crime ocorre quando a conduta é tão perigosa que a lei prevê processo criminal, como ao exceder 0,3 mg/L no etilômetro (bafômetro).",""],["2-2-31",2,2,0,12,"Quantos pontos são somados na CNH por uma infração de natureza Leve?","3 pontos",["7 pontos","4 pontos","5 pontos"],"Infrações leves, que geram menor risco imediato, resultam nesta pontuação.",""],["2-2-32",2,2,0,37,"Transportar uma criança sem o dispositivo de retenção adequado (bebê-conforto, cadeirinha, etc.) é uma infração de qual natureza?","Gravíssima",["Leve","Grave","Média"],"A vulnerabilidade de uma criança em um sinistro torna essa infração uma das mais perigosas, sendo punida com a máxima severidade.",""],["2-2-33",2,2,1,69,"Um motorista joga uma lata de refrigerante pela janela do carro. Além de ser uma falta de educação, como essa atitude é classificada pela legislação?","Como uma infração de trânsito média e um ato que prejudica o meio ambiente.",["Como uma atitude inadequada, mas que não gera nenhuma penalidade.","Como uma infração leve, pois não coloca a vida de ninguém em risco.","Como uma infração grave, com a mesma penalidade de furar um sinal vermelho."],"Jogar lixo pela janela é classificado como infração média, além de ser um crime ambiental que contribui para a poluição das cidades e entupimento de bueiros. Art. 172 do CTB",""],["2-2-34",2,2,0,16,"Um motorista que ultrapassa o limite de velocidade em mais de 50% comete uma infração gravíssima que resulta em:","Multa multiplicada por 3 e suspensão do direito de dirigir.",["Multa multiplicada por 5 e cassação da CNH.","Apenas multa com valor normal e 7 pontos na CNH.","Apenas a suspensão do direito de dirigir."],"Esta combinação de penalidades é aplicada para esse nível de excesso de velocidade, refletindo o alto risco da conduta.",""],["2-3-1",2,3,1,45,"Qual a finalidade de se manter uma distância mínima de 2 metros em relação ao veículo que segue à frente?","Espaço suficiente para frear com segurança em caso de imprevisto.",["Uma melhor aerodinâmica e economia de combustível.","Visibilidade dos semáforos e placas de trânsito.","Que o motorista da frente não se sinta pressionado."],"Este tempo/distância permite que o motorista perceba o perigo, reaja e acione os freios sem colidir com o veículo à frente.",""],["2-3-2",2,3,0,43,"Além de enxergar bem ao dirigir, ser visto pelos outros depende de:","Faróis e lanternas limpos e funcionando.",["Faróis apagados para não “incomodar”.","Películas escuras no para-brisa.","Seta desligada para surpresa."],"É muito perigoso dirigir sem esses equipamentos ligados, acione seus fárois e lanternas para segurança de todos.",""],["2-3-3",2,3,0,34,"Ao dirigir em uma estrada de terra, qual comportamento é essencial para manter a segurança e o controle do veículo?","Aumentar a distância do veículo da frente e reduzir a velocidade.",["Dirigir com as mãos relaxadas no volante para sentir melhor o terreno.","Manter a mesma velocidade de uma rodovia asfaltada para evitar que o carro 'flutue'.","Frear bruscamente antes das curvas para garantir a máxima aderência."],"A poeira levantada pelo veículo da frente prejudica a visibilidade e a menor aderência do piso exige mais espaço para frenagem, tornando essas duas ações cruciais.",""],["2-3-4",2,3,1,34,"Ao dirigir em uma rodovia durante o dia, qual procedimento relacionado à iluminação do veículo é recomendado?","Manter o farol baixo sempre aceso.",["Ligar o farol alto para ser visto de longe.","Usar apenas as luzes de neblina.","Não é necessário usar os faróis durante o dia."],"Esta prática aumenta a visibilidade do seu veículo para os outros condutores, mesmo sob a luz do sol.",""],["2-3-5",2,3,0,38,"Ao realizar uma conversão à direita, como o motorista deve posicionar o veículo antes de iniciar a manobra?","O mais próximo possível do bordo direito da via.",["O mais próximo possível do bordo esquerdo da via.","No meio da faixa, para ter mais espaço de manobra.","O mais próximo possível do eixo central da via."],"Esta posição impede que outros veículos passem pela direita e indica claramente a intenção de virar.",""],["2-3-6",2,3,1,38,"Ao realizar uma conversão à esquerda em uma via de mão dupla, qual o posicionamento correto a ser adotado antes de iniciar a conversão?","Aproximar-se do eixo central da via, sem invadir a contramão.",["Aproximar-se do bordo direito da pista.","Invadir a pista contrária para ter mais espaço na curva.","Manter-se no centro da faixa de rolamento."],"Este posicionamento sinaliza corretamente a intenção de virar à esquerda e organiza o fluxo de quem segue em frente.",""],["2-3-7",2,3,1,40,"Ao sair de uma rodovia, quando o condutor deve começar a reduzir a velocidade?","Somente após ter entrado completamente na faixa de desaceleração.",["Assim que avistar a placa indicando a saída.","Ainda na pista principal, antes de entrar na faixa de desaceleração.","Apenas no final da faixa de desaceleração, freando bruscamente."],"A faixa de desaceleração existe justamente para que a redução de velocidade seja feita fora do fluxo principal, com segurança.",""],["2-3-8",2,3,0,39,"Ao se deparar com uma rotatória, quem tem a preferência de passagem?","O veículo que já está circulando dentro dela.",["O veículo que está entrando na rotatória.","O veículo que vem pela direita, mesmo que vá entrar na rotatória.","O veículo maior ou mais rápido."],"Para manter a fluidez e a segurança, a prioridade é sempre de quem já está realizando a manobra circular.",""],["2-3-9",2,3,0,56,"Após uma pequena colisão em uma avenida movimentada que resultou apenas em para-choques amassados, sem feridos, o que os condutores devem fazer prioritariamente?","Retirar os veículos para um local seguro, como o acostamento, para liberar o fluxo de trânsito e evitar novos sinistros.",["Iniciar a troca de informações e acionar o seguro antes de mover os carros do local.","Deixar os carros na posição da batida e aguardar a chegada da polícia para fazer o registro.","Ligar imediatamente para o SAMU (192), mesmo que ninguém aparente estar machucado."],"A legislação determina que, em casos de sinistro apenas com danos materiais, os veículos devem ser removidos para garantir a segurança e a fluidez da via.",""],["2-3-10",2,3,2,9,"As defensas metálicas instaladas nas margens de pontes e curvas perigosas são um exemplo de quê?","Dispositivo auxiliar",["Sinalização temporária","Sinalização Horizontal","Sinalização vertical"],"As defensas metálicas são um exemplo de dispositivos auxiliares, elementos físicos que compõem a sinalização projetado para proteger veículos e reduzir a gravidade de colisões em pontes e curvas perigosas.",""],["2-3-11",2,3,0,37,"Até que a criança atinja 1,45 m de altura, em qual local do veículo ela deve ser transportada?","No banco traseiro, utilizando o dispositivo de retenção adequado.",["No banco traseiro, no colo de um adulto.","No banco dianteiro, se estiver usando assento de elevação.","Em qualquer assento, desde que use o cinto de segurança do veículo"],"A legislação determina que o transporte seja feito no banco traseiro com o equipamento de segurança correto para a idade, peso e altura.",""],["2-3-12",2,3,1,25,"É permitido levar passageiros na caçamba de uma caminhonete?","Não, pois oferece alto risco de queda e lesões graves, além de ser uma infração gravíssima.",["Sim, se todos os passageiros estiverem sentados e segurando firmemente.","Apenas em áreas rurais, onde não há fiscalização.","Sim, desde que seja em baixa velocidade e em trajetos curtos."],"Art. 230, inciso II do CTB",""],["2-3-13",2,3,1,39,"Em um cruzamento não sinalizado entre duas vias de mesmo porte, qual veículo tem a preferência?","O veículo que estiver à direita do condutor.",["O veículo que for maior.","O veículo que buzinar.","Os dois têm preferência."],"Esta é a 'regra da direita', fundamental para a organização do trânsito em cruzamentos sem sinalização específica. Art. 215, inciso I, alínea b",""],["2-3-14",2,3,0,39,"Em uma situação onde não há nenhuma sinalização, qual regra geral de preferência deve ser aplicada?","A preferência é do veículo que se aproxima pela direita do condutor.",["A preferência é do veículo que está trafegando em maior velocidade.","A preferência é do veículo que está na via da esquerda.","A preferência é do veículo maior."],"Em um cruzamento não sinalizado, a regra geral é dar preferência a quem vem da direita.",""],["2-3-15",2,3,1,44,"Qual é a principal finalidade do uso da buzina, segundo os princípios da direção defensiva e comunicação no trânsito?","Alertar outros usuários da via sobre um perigo iminente ou sua presença para evitar um sinistro.",["Cumprimentar pedestres ou outros motoristas conhecidos.","Apressar o motorista da frente quando o semáforo abre.","Expressar irritação com uma manobra incorreta de outro condutor."],"O Código de Trânsito prevê o uso da buzina em toques breves para fazer as advertências necessárias a fim de evitar sinistros.",""],["2-3-16",2,3,0,50,"O que o condutor deve fazer ao perceber um pedestre atravessando fora da faixa?","Reduzir a velocidade e manter a atenção redobrada.",["Ignorar e seguir, pois o pedestre está errado.","Buzinar para advertir.","Frear bruscamente."],"Mesmo fora da faixa, a vida tem prioridade. O condutor deve reduzir e manter a atenção, pois o pedestre é o mais vulnerável no trânsito.",""],["2-3-17",2,3,0,43,"O que significa ver e ser visto na direção defensiva?","Tornar-se visível e estar atento aos demais usuários da via.",["Manter o carro limpo e bonito.","Dirigir apenas de dia.","Usar o farol alto o tempo todo."],"“Ver e ser visto” é um princípio da direção defensiva que busca garantir que o condutor perceba os outros e seja percebido, prevenindo sinistros.",""],["2-3-18",2,3,1,42,"O que significa dizer que, no trânsito, o motorista precisa estar sempre atento?","Que tudo o que o motorista faz ou deixa de fazer gera um resultado, seguro ou perigoso.",["Que as regras de trânsito são subjetivas e cada um interpreta de um jeito.","Que dirigir é uma atividade automática que não exige muitas decisões.","Que todas as decisões são punidas com multa."],"Cada ação, como uma freada brusca ou uma pequena distração, tem uma consequência direta na segurança.",""],["2-3-19",2,3,0,41,"O que significa ser um bom motorista?","Seguir as regras de trânsito.",["Dirigir rapidamente para não atrapalhar o trânsito.","Conhecer atalhos para chegar mais rápido ao destino.","Ter um carro novo todo ano."],"Seguir as regras é o compromisso fundamental que o condutor assume para proteger vidas.",""],["2-3-20",2,3,0,20,"O que um motorista deve fazer imediatamente ao ouvir a sirene e ver as luzes de uma ambulância se aproximando?","Reduzir a velocidade e deslocar-se para a faixa da direita para liberar a passagem.",["Parar bruscamente no meio da pista onde está.","Continuar no mesmo ritmo e esperar que a ambulância desvie.","Acelerar e não deixar ela passar."],"O procedimento correto é facilitar a passagem do veículo de emergência de forma segura, movendo-se para a direita.",""],["2-3-21",2,3,0,43,"Por que ver e ser visto é essencial no trânsito?","Porque se você não vê ou não é visto, o risco de sinistro aumenta.",["Porque melhora apenas o conforto do motorista.","Porque serve só para rodovias.","Porque evita gastar com manutenção."],"Uma atitude simples que evita sinistros de trânsito, ligar o sistema de iluminação do veículos (faróis e lanternas)",""],["2-3-22",2,3,1,55,"Por que a palavra 'acidente' foi substituída por 'sinistro' no trânsito?","Para indicar que a grande maioria desses eventos é evitável e não fruto do acaso.",["Para padronizar a linguagem com as companhias de seguro.","Porque 'acidente' só se aplica a rodovias.","Porque a palavra 'acidente' se aplica apenas a eventos sem vítimas fatais."],"A mudança de terminologia reforça a ideia de que esses eventos são consequência de escolhas e comportamentos, e não fatalidades inevitáveis.",""],["2-3-24",2,3,0,48,"Por que é importante não realizar o ziguezague entre as faixas de trânsito?","Porque desorienta outros motoristas e aumenta o risco de colisões.",["Porque aumenta o consumo de combustível.","Porque reduz a velocidade do veículo.","Porque causa desgaste nos pneus."],"Trocar de faixa repetidamente é perigoso e imprevisível. Mantenha-se em uma faixa até que seja realmente necessário mudar.",""],["2-3-25",2,3,0,26,"Por que um condutor não deve parar em fila dupla?","Porque atrapalha o fluxo do trânsito",["Porque pode causar um congestionamento sonoro.","Porque é uma infração que causa a suspensão da CNH.","Porque gasta mais combustível do que estacionar corretamente."],"Esta atitude obstrui uma faixa de rolamento e força pedestres a desviarem para a rua, aumentando o risco de sinistro.",""],["2-3-26",2,3,2,47,"Por que não se deve usar farol alto em situações de neblina?","Porque a luz forte reflete nas partículas de água e piora a visibilidade.",["Porque gasta mais bateria do que o farol baixo.","Porque o farol alto pode superaquecer e queimar.","Porque é proibido por lei usar farol alto em rodovias."],"A luz do farol alto é refletida de volta para os olhos do motorista, formando uma 'parede de luz' que ofusca em vez de iluminar.",""],["2-3-27",2,3,1,43,"Por que o condutor deve ajustar o banco e os retrovisores antes de dirigir?","Para garantir boa visibilidade e controle do veículo.",["Para conforto apenas.","Para seguir uma exigência burocrática.","Para o carro gastar menos combustível."],"Ajustar o banco e os retrovisores aumenta a segurança, permitindo melhor campo de visão e reação a imprevistos.",""],["2-3-28",2,3,0,18,"Por que o motorista deve sempre usar a seta antes de mudar de faixa ou virar?","Para avisar os outros motoristas e tornar o trânsito previsível.",["Para cumprir uma formalidade da lei.","Para deixar o carro mais moderno.","Porque melhora o desempenho do veículo."],"A seta é a principal forma de comunicação no trânsito. Usá-la com antecedência avisa os demais condutores sobre suas intenções e evita sinistros.",""],["2-3-29",2,3,2,34,"Qual a importância de manter os faróis baixos acesos durante o dia, especialmente em rodovias?","Para aumentar a visibilidade do seu veículo para os outros motoristas, tornando-o mais perceptível.",["Para melhorar a iluminação da pista e a visibilidade de placas de sinalização durante o dia.","Para economizar a bateria, pois o farol baixo consome menos energia que o farol de rodagem diurna (DRL).","Para evitar multas, pois é uma exigência legal em todas as vias urbanas e rurais durante o dia."],"Lembre-se do princípio de 'ver e ser visto', que explica que essa simples atitude aumenta muito a visibilidade do carro para os demais usuários da via, prevenindo sinistros.",""],["2-3-30",2,3,2,34,"Qual a principal diferença entre uma rodovia e uma estrada?","Rodovias são vias rurais pavimentadas e estradas são vias rurais não pavimentadas.",["Rodovias ligam cidades e estradas ligam bairros.","Rodovias possuem pedágio e estradas não.","Rodovias são para carros e estradas para caminhões."],"A pavimentação (asfalto ou concreto) é o que caracteriza uma rodovia, enquanto estradas são vias não pavimentadas. Glossário do CTB",""],["2-3-31",2,3,0,41,"Qual comportamento demonstra direção defensiva?","Ajustar a velocidade conforme o clima e as condições da via.",["Tentar ultrapassar sempre que possível.","Ignorar motociclistas que passam pelo corredor.","Usar o celular apenas em semáforos vermelhos."],"A velocidade segura depende das condições do ambiente. Reduzir em caso de chuva, neblina ou tráfego intenso é um sinal de prudência e consciência.",""],["2-3-32",2,3,0,37,"Qual dispositivo de retenção infantil é indicado para uma criança de 2 anos com 13 kg?","Cadeirinha, virada para frente.",["Assento de elevação.","Apenas o cinto de segurança do banco traseiro.","Bebê conforto, virado para trás."],"Para a faixa de 1 a 4 anos (ou de 9 a 18 kg), a cadeirinha instalada virada para frente é o equipamento correto.",""],["2-3-33",2,3,2,51,"Qual é a distância lateral mínima que um motorista deve manter ao ultrapassar um ciclista?","1,5 metro.",["2,0 metros.","0,5 metro.","1,0 metro."],"Esta é a distância necessária para evitar provocar desequilíbrio e garantir a segurança, sendo o desrespeito uma infração média. Art. 201 do CTB",""],["2-3-34",2,3,2,40,"Qual é a função da faixa de aceleração ao entrar em uma via de trânsito rápido?","Aumentar a velocidade para se igualar ao fluxo da via principal.",["Aguardar parado até que haja uma brecha no trânsito.","Servir como acostamento temporário para emergências.","Reduzir a velocidade antes de entrar na pista principal."],"O propósito desta faixa é permitir que o veículo ganhe velocidade de forma segura antes de ingressar no fluxo de tráfego intenso.",""],["2-3-35",2,3,0,50,"O que significa o princípio “o maior cuida do menor” no trânsito?","O condutor de um veículo motorizado tem a responsabilidade de zelar pela segurança de ciclistas e pedestres.",["Veículos maiores, como caminhões, sempre têm a preferência.","Apenas veículos de emergência, como ambulâncias, precisam seguir esta regra.","Pedestres e ciclistas devem sempre ceder a passagem para os carros."],"O princípio \"o maior cuida do menor\" significa que veículos maiores ou mais rápidos devem ter atenção redobrada e proteger os mais vulneráveis, como pedestres, ciclistas e motociclistas.",""],["2-3-36",2,3,1,43,"Qual é a principal razão para manter os faróis baixos acesos durante o dia em rodovias, conforme a prática de 'ver e ser visto'?","Para que outros motoristas, mesmo a longas distâncias, percebam a presença do seu veículo mais facilmente.",["Para evitar o desgaste do sistema de iluminação noturna do veículo.","Para iluminar a pista e enxergar buracos com mais facilidade sob o sol.","Porque o farol alto pode ser usado durante o dia e o baixo é uma alternativa."],"A luz acesa torna o veículo muito mais visível para os outros, tanto para quem vem em sentido contrário quanto para quem olha pelo retrovisor, prevenindo sinistros.",""],["2-3-37",2,3,2,36,"Qual é a principal razão pela qual crianças não devem ser transportadas no banco dianteiro?","Porque o airbag dianteiro pode ser perigoso para elas.",["Porque elas podem distrair o motorista.","Porque elas podem se distrair com a paisagem mais facilmente.","Porque a lei permite apenas maiores de 18 anos no banco da frente."],"A força de expansão do airbag é projetada para um adulto e pode causar lesões graves ou fatais em uma criança.",""],["2-3-38",2,3,1,15,"Qual é a principal razão pela qual manusear o celular ao volante é tão perigoso?","Porque o desvio de atenção, mesmo por poucos segundos, faz o carro percorrer uma longa distância sem o motorista estar prestando atenção.",["Porque a multa é muito cara.","Porque pode danificar o aparelho celular em caso de freada brusca.","Porque é uma das infrações grave."],"A principal razão é que o ato de manusear o celular causa uma distração visual e cognitiva que, devido à velocidade, faz o veículo percorrer longas distâncias sem a atenção do motorista, impedindo a reação a eventos críticos e aumentando drasticamente o risco de acidentes.",""],["2-3-39",2,3,1,30,"Qual é a principal restrição de peso para um veículo ser conduzido com a Categoria B da CNH?","O peso bruto total não pode passar de 3.500 kg.",["O veículo não pode ter mais de 1.500 kg.","O peso do veículo não pode ultrapassar o do motorista.","Não há restrição de peso, apenas de lugares."],"De acordo com o art. 143, inciso III do CTB, a principal restrição de peso para a Categoria B é que o Peso Bruto Total (PBT) não exceda a 3.500 kg, pois veículos de carga acima desse peso exigem a Categoria C.",""],["2-3-40",2,3,0,34,"Qual é a recomendação para o uso do acostamento em uma rodovia?","Usá-lo apenas em casos de emergência, como pane mecânica.",["Parar para atender ao celular ou descansar.","Utilizá-lo para fazer ultrapassagens mais rápidas.","Trafegar por ele quando o trânsito na pista principal estiver lento."],"O acostamento é uma área de segurança destinada exclusivamente a paradas emergenciais, devidamente sinalizadas.",""],["2-3-41",2,3,0,17,"Qual é a regra fundamental ao se aproximar de uma faixa de pedestres?","Reduzir a velocidade e parar, pois a preferência é sempre do pedestre na faixa.",["Acelerar para passar antes que o pedestre comece a atravessar.","Manter a velocidade se o pedestre ainda não colocou o pé na faixa.","Buzinar para alertar o pedestre da sua aproximação."],"A lei é clara: se houver pedestre atravessando ou com intenção de atravessar, o condutor deve parar.",""],["2-3-42",2,3,2,33,"Qual é a velocidade máxima permitida em uma via local, como a rua de um bairro residencial?","30 km/h",["40 km/h","60 km/h","80 km/h"],"O art. 61, § 1º, I, \"d\" do CTB estabelece que a velocidade máxima, na ausência de sinalização, é de 30 km/h nas Vias Locais",""],["2-3-45",2,3,0,34,"Se você perceber que passou da saída que precisava pegar, qual é a atitude mais segura a ser tomada?","Seguir em frente com segurança e procurar o próximo retorno.",["Parar no acostamento e esperar uma oportunidade para cruzar as faixas.","Fazer uma manobra brusca de última hora para tentar entrar na saída.","Dar ré na avenida para voltar até a saída."],"Esta é a forma de evitar riscos que permite realizar a manobra com tranquilidade.",""],["2-3-46",2,3,1,41,"Dirigir com segurança é, principalmente, um conjunto de:","Hábitos e escolhas conscientes.",["Capacidade de dirigir em alta velocidade.","Conhecimento profundo da mecânica do veículo.","Habilidades naturais"],"O texto conclui que a direção segura é resultado de atitudes como respeito, empatia e escolhas deliberadas, que se tornam hábitos.",""],["2-3-47",2,3,0,19,"Sobre o uso do cinto de segurança no banco de trás, o que podemos afirmar?","É obrigatório para todos os passageiros.",["É obrigatório apenas em viagens intermunicipais.","É recomendado, mas não obrigatório.","É obrigatório apenas para crianças."],"Em uma colisão, um passageiro solto no banco de trás pode ser arremessado com força fatal. Art. 65 do CTB",""],["2-3-48",2,3,0,30,"Um condutor com habilitação na categoria B está autorizado a dirigir qual dos seguintes veículos?","Uma picape leve com peso total de 3.000 kg e capacidade para 5 pessoas.",["Uma motocicleta de 250 cilindradas.","Um caminhão pequeno com peso bruto total de 4.000 kg.","Uma van escolar com capacidade para 12 passageiros."],"A Categoria B permite a condução de veículos cujo peso bruto total não exceda 3.500 kg e cuja lotação não exceda 8 lugares, excluído o do motorista. Artigo 143, inciso II",""],["2-4-3",2,4,0,54,"A citação \"No trânsito, o equilíbrio emocional é tão importante quanto o freio do carro\" significa que:","O autocontrole emocional é um item de segurança essencial para prevenir sinistros.",["Dirigir triste ou com raiva pode causar problemas mecânicos no sistema de freios.","É desnecessário ter um controle emocional para saber usar o freio corretamente em uma emergência.","Pessoas muito emotivas não deveriam ser autorizadas a dirigir."],"A citação compara o equilíbrio emocional (que controla os impulsos e permite tomar decisões racionais) ao freio (que controla a velocidade e para o carro), ambos sendo cruciais para a segurança.",""],["2-4-4",2,4,0,57,"Ao ligar para um número de emergência como o SAMU (192), qual das informações a seguir é a mais crucial para agilizar o atendimento?","A localização exata do sinistro e o número de vítimas.",["O seu nome completo e número de telefone para contato.","Quem foi o culpado pela colisão, para o registro da ocorrência.","O modelo e a cor dos veículos envolvidos no sinistro."],"Saber onde ir e quantos recursos (ambulâncias, médicos) enviar é a informação mais crítica para que o socorro chegue rápido e preparado.",""],["2-4-5",2,4,1,58,"Ao presenciar um sinistro, você vê um motociclista caído no chão, consciente, mas reclamando de dor. Qual das seguintes ações é considerada um erro grave que pode piorar muito o estado da vítima?","Tentar remover o capacete do motociclista para ajudá-lo a respirar melhor.",["Sinalizar o local com o triângulo de segurança a uma distância adequada.","Conversar com a vítima para acalmá-la enquanto o socorro não chega.","Ligar para o número 193 (Bombeiros) para solicitar resgate."],"A retirada do capacete só deve ser feita por profissionais, pois um movimento incorreto pode causar lesões gravíssimas na coluna cervical.",""],["2-4-6",2,4,1,58,"Ao prestar assistência a uma vítima de sinistro, o que significa 'não remova, não movimente, não transporte'?","Que qualquer movimento pode agravar lesões ocultas, especialmente na coluna, e só deve ser feito por profissionais ou em caso de perigo iminente.",["Que a vítima deve permanecer exatamente na mesma posição em que foi encontrada até a conclusão da perícia técnica.","Que a vítima não deve ser tocada em nenhuma circunstância, nem mesmo para confortá-la.","Que é ilegal mover uma vítima de sinistro, configurando crime de lesão corporal culposa."],"Esta é a essência da regra: a movimentação inadequada é um risco grave de agravar fraturas e lesões na coluna, sendo a exceção apenas situações extremas como incêndio.",""],["2-4-7",2,4,0,56,"Ao registrar um sinistro sem vítimas, por que é importante que os motoristas tirem fotos dos danos nos veículos e dos documentos um do outro?","Para ter um registro claro que pode ser usado no acionamento no momento de reparação do dano.",["Apenas para ter uma lembrança do que aconteceu e evitar que se repita.","Para enviar para a oficina mecânica e já obter um orçamento dos reparos.","Para postar nas redes sociais e alertar os amigos sobre o ocorrido."],"As fotografias servem como prova documental dos danos e dos dados dos envolvidos, facilitando os procedimentos com a seguradora e, se necessário, com as autoridades.",""],["2-4-8",2,4,2,60,"Ao se deparar com um sinistro envolvendo um veículo que transporta cargas perigosas, identificado pelo painel laranja, qual é o procedimento mais seguro a ser seguido?","Manter uma distância mínima de 50 metros, posicionar-se contra o vento e informar o número do painel aos bombeiros.",["Utilizar o extintor do seu carro para conter qualquer princípio de incêndio e evacuar as vítimas do local.","Sinalizar o local com o triângulo a 30 metros e aguardar dentro do seu veículo a chegada do socorro.","Aproximar-se para identificar o número no painel e prestar os primeiros socorros imediatamente."],"Este procedimento combina as principais recomendações de segurança: manter distância, evitar a inalação de gases tóxicos (posicionando-se a favor do vento, não contra) e fornecer informações cruciais para o socorro especializado.",""],["2-4-9",2,4,1,58,"Ao se deparar com uma vítima de sinistro que não responde e parece não respirar, o que uma pessoa sem treinamento em reanimação deve fazer?","Informar imediatamente ao SAMU (192) e seguir as orientações do atendente por telefone.",["Virar a vítima de lado para que ela possa respirar melhor.","Jogar água no rosto da vítima para tentar acordá-la.","Tentar fazer massagem cardíaca de qualquer jeito, pois é melhor que nada."],"O atendente do SAMU é treinado para dar instruções precisas por telefone, guiando a pessoa no local sobre como proceder de forma segura até a chegada da ambulância.",""],["2-4-10",2,4,2,61,"Dirigir com pneus murchos, além de perigoso, causa um impacto negativo específico. Qual é ele?","Aumenta o consumo de combustível.",["Aumenta a poluição sonora do veículo.","Danifica o sistema de escapamento do carro.","Causa superaquecimento no sistema de freios."],"Pneus com pressão abaixo da ideal aumentam a área de contato com o solo e, consequentemente, o arrasto, forçando o motor a trabalhar mais.",""],["2-4-11",2,4,2,53,"Dirigir com sono é tão perigoso quanto dirigir alcoolizado. Por qual motivo principal?","Porque a sonolência reduz os reflexos, a atenção e a capacidade de reagir.",["Porque tanto o sono quanto o álcool causam visão dupla no motorista.","Porque te deixa alegre e agitado.","Porque dirigir com sono pode causar multas de trânsito"],"A comparação é feita porque o sono, assim como o álcool, afeta gravemente as funções neurológicas essenciais para uma direção segura, como tempo de reação e percepção de perigo.",""],["2-4-12",2,4,1,58,"Durante o atendimento a uma vítima de sinistro que está consciente e com frio, o que é permitido fazer enquanto o socorro não chega?","Cobri-la com um casaco ou cobertor para aquecê-la.",["Movê-la para um local mais confortável, como a sombra.","Dar um copo de água com açúcar para acalmá-la.","Passar um remédio para dor que você tenha no carro."],"Manter a vítima aquecida ajuda a estabilizar sua condição e a mantê-la confortável, sendo uma das poucas intervenções seguras que uma pessoa leiga pode fazer.",""],["2-4-13",2,4,1,53,"Durante uma longa viagem noturna, um motorista percebe que está bocejando com frequência e que, por alguns instantes, teve dificuldade em manter o foco na estrada. Qual a ação correta e imediata a ser tomada?","Procurar um local seguro, como um posto de gasolina ou ponto de parada, para estacionar e descansar por um tempo.",["Acelerar para diminuir o tempo de viagem e, assim, poder descansar ao chegar ao destino.","Beber um café forte ou um energético e continuar a viagem para chegar ao destino mais rápido.","Aumentar o volume do rádio e abrir as janelas, pois isso é suficiente para despertar."],"Dirigir com sono é tão perigoso quanto dirigir alcoolizado",""],["2-4-14",2,4,0,56,"Em um sinistro sem vítimas, onde os veículos obstruem o trânsito, qual é a ação prioritária que os condutores devem tomar após garantirem a própria segurança?","Retirar os veículos da via para um local seguro para não o
