 a via sobre as faixas delimitadas para esse fim terão prioridade de passagem, exceto nos locais com sinalização semafórica, onde deverão ser respeitadas as disposições do CTB. Art. 70 do CTB",""],["1-3-101",1,3,0,48,"Quem deve usar as faixas da direita em vias com várias faixas no mesmo sentido?","Veículos mais lentos e de maior porte.",["Motocicletas sempre.","Quem estiver com pressa.","Só ônibus."],"Forma de respeitar o fluxo e evitar conflitos.",""],["1-3-102",1,3,0,39,"Quem tem a preferência de passagem em uma rotatória?","Quem já está circulando dentro dela.",["Quem está se aproximando da entrada.","O veículo maior.","O mais rápido."],"A prioridade é de quem já circula dentro da rotatória. Art. 29, inciso III, alínea b.",""],["1-3-103",1,3,0,39,"Quem tem prioridade numa rotatória?","Os veículos que já estão circulando na rotatória.",["Quem está chegando mais rápido.","Quem vem da esquerda.","Quem liga o pisca-alerta."],"A prioridade é de quem já circula dentro da rotatória. Art. 29, inciso III, alínea b.",""],["1-3-104",1,3,1,33,"Ao sair de uma via de trânsito rápido para uma via arterial com semáforo e área comercial, o que deve ser feito?","Reduzir, preparar-se para parar em semáforos, observar acessos laterais e travessias, e adequar-se à velocidade da arterial (60 km/h).",["Manter 80 km/h e passar no semáforo com a luz amarela sempre.","Ligar farol alto e buzinar para os outros veículos.","Seguir no acostamento para ir mais rápido."],"Transição exige mudança de comportamento e velocidade.",""],["1-3-105",1,3,0,50,"O semáforo está verde, mas um pedestre atravessa correndo em frente a uma escola. O que o condutor deve fazer?","Parar o veículo e deixar o pedestre concluir a travessia.",["Seguir porque o sinal está verde.","Acelerar para não perder o tempo.","Buzinar para ele correr mais rápido."],"O condutor deve observar as preferências da via.",""],["1-3-106",1,3,0,18,"Se um condutor quiser mudar de direção, ele deve:","Sinalizar com antecedência e reduzir a velocidade.",["Sinalizar só no momento da curva.","Acelerar e virar rápido.","Parar antes da curva."],"Antecipar a intenção evita acidentes.",""],["1-3-107",1,3,1,13,"Você comprou um carro usado e se mudou para outro município. Qual é o procedimento correto a seguir?","Transferir a propriedade em até 30 dias e comunicar imediatamente a mudança de município para expedição do novo Certificado de Registro do Veículo.",["Trocar os pneus e avisar todos os parentes.","Esperar completar um ano para avisar aos órgãos de trânsito.","Não precisa fazer nada se já pagou o IPVA do veículo."],"Combina dois deveres previsto no CTB, transferência de propriedade e mudança de residência.",""],["1-3-108",1,3,1,31,"A Permissão para Dirigir de João venceu após um ano, e ele teve uma infração leve nesse período. O que acontece agora?","Por não ter comitido nenhuma infração de natureza grave ou gravíssima ou seja reincidente em infração média, será emitida a CNH de João.",["Ele perde todo o processo de habilitação e volta ao início automaticamente.","Ele precisa refazer o curso teórico e as aulas práticas obrigatoriamente.","A PPD vale para sempre, mesmo sem receber a CNH."],"Permissão para dirigir é etapa anterior à CNH. Art. 148, § 3º do CTB.",""],["1-3-111",1,3,0,39,"Um motorista entra em uma rotatória sem reduzir a velocidade e causa um sinistro. Qual regra ele descumpriu?","Deve ceder a passagem a quem já está circulando dentro dela.",["A de sinalizar a saída.","A de manter distância lateral.","A de usar o farol baixo."],"A prioridade pertence a quem já estava na rotatória. Art. 29, inciso III, alínea b.",""],["1-3-112",1,3,0,20,"Um veículo de emergência se aproxima com sirene e luzes ligados. O que o condutor deve fazer?","Dar passagem e facilitar a manobra com segurança.",["Continuar com a mesma velocidade e não dar passagem.","Acelerar para ir na frente.","Parar no meio da pista."],"Veículos destinados a socorro de incêndio e salvamento possuem preferência no trânsito. Art. 29, VII, do CTB.",""],["1-3-113",1,3,0,20,"Um veículo de emergência se aproxima por trás com sirene e luzes ligados. Qual é a atitude correta do condutor?","Reduzir a velocidade e dar preferência de passagem.",["Seguir na mesma faixa e velocidade.","Acelerar para abrir caminho.","Buzinar para os outros veículos."],"Veículos destinados a socorro de incêndio e salvamento possuem preferência no trânsito. Art. 29, VII, do CTB.",""],["1-3-114",1,3,1,39,"Veículos sobre trilhos (bonde/VLT) em cruzamento têm:","Preferência de passagem, os condutores devem parar e aguardar.",["Não possuem prioridade, quem chegar primeiro pode passar.","Menor prioridade por serem grandes.","Prioridade só se houver passageiros."],"Veículos que se deslocam por trilho têm preferência no trânsito, conforme art. 29, XII, do CTB.",""],["1-3-115",1,3,2,33,"Via arterial e via coletora. Qual a principal diferença para o condutor?","Na arterial a velocidade é maior (60 km/h) e há grande fluxo, na coletora a velocidade é 40 km/h e ela distribui o trânsito para vias locais.",["As duas são iguais, com as mesmas regras de condução.","A via coletora é mais rápida que a arterial.","Via arterial é a via rural, geralmente de terra."],"Função e velocidade distintas, conforme anexo do CTB.",""],["1-3-116",1,3,2,40,"Você vai fazer retorno em avenida com canteiro central e retorno sinalizado com faixa de desaceleração. Um motorista corta pela direita, fora da faixa, para entrar antes. Qual é a avaliação correta?","Conduta errada e perigosa, o acesso deve ser apenas pela faixa de desaceleração.",["Correta, pois chega mais rápido.","Correta, se der seta.","Correta, se olhar só o retrovisor."],"Deve ser respeitado o desenho das vias para evitar colisões.",""],["1-3-118",1,3,2,11,"Em quais situações o condutor é obrigado a realizar o Curso de Reciclagem, além daquelas decorrentes de uma penalidade de suspensão ou cassação?","Quando ele comete infração cuja penalidade é a suspensão da CNH- quando se envolve em sinistro grave- quando é condenado por crime de trânsito- quando é flagrado colocando o trânsito em risco.",["Só quando fizer prova teórica.","Em multas leves.","Somente a cada 5 anos."],"Conforme estabelece o Art. 268 do CTB, o condutor será submetido a curso de reciclagem e a exame de avaliação não apenas quando suspenso do direito de dirigir, mas também quando se envolver em acidente grave (sinistro) para o qual tenha contribuído, ou quando for condenado judicialmente por delito de trânsito.",""],["1-3-119",1,3,1,49,"Antes de iniciar uma manobra de ultrapassagem, quais são as principais verificações que o condutor deve realizar?","Se ninguém atrás iniciou ultrapassagem, se o da frente não vai ultrapassar outro, e se a faixa oposta está livre a distância segura.",["Só se o carro é potente.","Se há vaga para parar após a manobra.","Se a música está alta."],"A ultrapassagem deve ser feita obedecendo à sinalização regulamentar (locais permitidos). Além disso,mexige que o condutor que queira executar uma manobra deve certificar-se de que pode executá-la sem perigo para os demais usuários da via. A Direção Defensiva exige que se verifique o tráfego à frente (espaço e tempo) e o tráfego atrás (se outro veículo já iniciou a ultrapassagem) antes de sinalizar e iniciar a manobra.",""],["1-3-120",1,3,2,40,"Ao entrar em uma rodovia, vindo de uma via de acesso ou via secundária, quem possui a obrigatoriedade de ceder a passagem, conforme o CTB?","Quem está entrando- deve aguardar a brecha segura.",["Quem já está na rodovia.","Caminhões sempre.","Ninguém- é disputa."],"Conforme estabelece o Art. 29, inciso III, alínea \"a\" do CTB, nos locais não sinalizados, a preferência de passagem é de quem estiver circulando pela rodovia. O condutor que ingressa na rodovia, vindo da via de acesso ou vicinal, deve usar a faixa de aceleração (se houver) e aguardar o momento seguro para se integrar ao fluxo, cedendo a preferência aos veículos que já estão circulando na via principal.",""],["1-3-121",1,3,2,38,"Em uma via de dois sentidos de circulação, ao realizar a conversão à direita, qual deve ser o posicionamento correto do veículo na pista?","Aproximar do bordo direito, sinalizar e reduzir a velocidade.",["Ficar no meio e virar de repente.","Aproximar do eixo da pista.","Entrar sem sinalizar."],"Conforme estabelece o Art. 38, inciso I do CTB, antes de realizar a manobra de conversão à direita, o condutor deverá aproximar-se o máximo possível da margem direita da pista, garantindo que a manobra seja feita com segurança e de forma a não obstruir a circulação dos demais veículos.",""],["1-3-122",1,3,2,38,"Em uma via de dois sentidos de circulação, ao realizar a conversão à esquerda, onde o veículo deve ser posicionado na pista?","Próximo ao eixo da pista, sinalizando e aguardando brecha segura.",["Colado no meio-fio direito.","Em qualquer lugar, se for rápido.","Em cima da faixa de pedestres."],"Antes de virar à esquerda em uma via de sentido duplo, o condutor deverá aproximar-se o máximo possível do eixo central da pista, respeitando a sinalização. Esse posicionamento é crucial para realizar a conversão com segurança e em ângulo correto, sem invadir indevidamente a contramão.",""],["1-3-123",1,3,1,49,"Qual é a conduta obrigatória do motorista ao realizar a manobra de ultrapassagem de um ciclista na via?","Reduzir a velocidade, manter distância lateral segura e retomar a faixa sem apertar o ciclista.",["Passar colado para “ensinar”.","Buzinar atrás até ele sair.","Forçar para ele ir para a calçada."],"Proteção ao vulnerável e respeito ao espaço. Conforme estabelece o Art. 201 do CTB, deixar de guardar a distância lateral de um metro e cinquenta centímetros ao ultrapassar bicicleta é infração média, sujeita a multa. Adicionalmente, o Art. 29, § 2º, reforça que os veículos de maior porte (o motorizado) são responsáveis pela segurança dos menores (a bicicleta), o que exige a redução de velocidade e a máxima cautela na manobra.",""],["1-3-124",1,3,2,33,"Em um bairro residencial, onde há crianças brincando e pessoas circulando de bicicleta, qual é o tipo de via?","Via local",["Via rápida","Via coletora","Rodovia"],"a via local é aquela destinada ao acesso a residências, comércios ou propriedades, onde o fluxo de veículos é baixo e a prioridade é a segurança dos pedestres e ciclistas.",""],["1-3-125",1,3,2,15,"Um motorista para o carro sobre o canteiro central para atender o celular. A conduta do motorista está correta?","Não. Pois é proibido parar sobre o canteiro central",["Sim, porque o canteiro é gramado.","Sim, desde que ele esteja com o pisca-alerta ligado.","Sim, mas somente se for rápido."],"É proibido estacionar no passeio ou sobre faixa destinada a pedestre, sobre ciclovia ou ciclofaixa, bem como nas ilhas, refúgios, ao lado ou sobre canteiros centrais, divisores de pista de rolamento, marcas de canalização, gramados ou jardim público. Art. 181, inciso VIII do CTB",""],["1-3-126",1,3,1,47,"Em uma rodovia sinalizada com velocidade máxima de 100 km/h, começa a chover forte. O que o condutor deve fazer?","Reduzir a velocidade, aumentar distância e manter farol baixo, mesmo que o limite da placa seja maior.",["Manter 100 km/h porque a placa obriga.","Ligar farol alto e acelerar.","Parar no canteiro central."],"O condutor deve manter velocidade compatível com as condições.",""],["1-3-127",1,3,1,34,"Em uma rodovia, o pneu do veículo fura. Onde o condutor deve parar com segurança?","No acostamento, sinalizar e resolver a emergência em segurança.",["No meio da faixa rápida.","Em cima do canteiro central.","Na faixa de pedestre."],"O condutor deve usar acostamentos para emergências.",""],["1-3-128",1,3,1,49,"Em uma via local, um carro utiliza o acostamento para realizar uma ultrapassagem. Essa atitude é:","Errada e perigosa. Acostamento não é faixa de ultrapassagem.",["Correta, porque é mais rápido.","Correta, se der seta.","Correta, se buzinar."],"Acotamento não são utilizados para circulação, apenas para emergências.",""],["1-3-129",1,3,2,33,"Ao sair de uma via coletora e acessar uma via local, o que muda para o condutor?","O limite de velocidade diminui e o motorista deve redobrar a atenção aos pedestres e ciclistas",["O limite de velocidade aumenta, pois há menos pedestres.","O trânsito se torna mais rápido e com menos regras de circulação.","Não há nenhuma mudança nas condições de tráfego."],"Ao passar de uma via coletora (que distribui o tráfego das vias arteriais para as vias locais) para uma via local, o condutor entra em uma área de menor fluxo de veículos e maior presença de pedestres, ciclistas e acessos a residências.",""],["1-3-130",1,3,1,17,"Ao avistar faixas brancas, em formato de “zebra”, à sua frente, o que o condutor deve fazer?","Diminuir a velocidade e parar o veículo para permitir a travessia do pedestre.",["Acelerar para passar antes do pedestre.","Parar sobre a faixa para “marcar lugar”.","Buzinar para apressar os pedestres"],"Preferência do pedestre na faixa.",""],["1-3-131",1,3,2,51,"Quando um ciclista cruza a rua na faixa de pedestres empurrando a bicicleta, o que o condutor deve fazer?","Parar o veículo e permitir que o ciclista conclua a travessia com segurança.",["Buzinar para ele correr.","Acelerar para passar antes.","Passar “colado” para assustar."],"Quando o ciclista desmonta da bicicleta e a empurra, ele passa a ser considerado pedestre, conforme o artigo 68, §1º do Código de Trânsito Brasileiro (CTB).",""],["1-3-132",1,3,1,49,"Durante a ultrapassagem, o que o condutor deve fazer?","Sinalizar, manter distância lateral, e retornar à faixa de origem com segurança, sinalizando de novo.",["Apagar as luzes para não ser visto.","Passar com veículo bem próximo ao outro para ganhar tempo.","Retornar imediatamente sem olhar para os arredores."],"O condutor deve sinalizar as manobras e manter espaço para evitar colisões.",""],["1-3-133",1,3,1,31,"Durante o período de um ano da Permissão para Dirigir, o que o novo condutor pode fazer?","Pode dirigir o veículo da categoria para qual se habilitou, sem instrutor, cumprindo todas as leis de trânsito.",["Pode ensinar outras pessoas a dirigir, mesmo sem autorização do órgão de trânsito.","Pode dirigir sem documentos porque é novo no trânsito.","Pode ignorar as infrações de trânsito, pois foi recém habilitado."],"Permissão para dirigir concede condição de condutor.",""],["1-3-134",1,3,1,26,"É correto parar na contramão para desembarcar passageiro?","Não. Além de ser perigoso, é configurado como infração de trânsito.",["Sim, se for rápido.","É permitido, desde que ligue o pisca-alerta.","É permitido após as 22h."],"Parada e estacionamento devem respeitar o sentido da via.",""],["1-3-135",1,3,1,50,"Em área urbana sem calçada, há pedestres no bordo da pista. O condutor deve:","Reduzir, manter distância lateral e passar com muito cuidado.",["Acelerar para passar rápido.","Buzinar alto até o pedestre sair.","Forçar o pedestre a subir no meio-fio."],"O condutor deve proteger os mais vulneráveis.",""],["1-3-136",1,3,1,50,"Em estrada rural, um grupo caminha no sentido contrário ao tráfego. O que o motorista deve fazer?","Reduzir, manter distância lateral e seguir só quando houver espaço seguro.",["Passar perto para “não sujar do lado esquerdo”.","Buzinar e manter a mesma velocidade.","Passar pelo acostamento em alta velocidade."],"Conforme estabelece o Art. 68, § 3º do CTB, nas vias rurais, quando não houver acostamento ou quando não for possível utilizá-lo, a circulação de pedestres na pista de rolamento deve ser feita com prioridade sobre os veículos, pelos bordos da pista, em fila única e em sentido contrário ao deslocamento dos veículos. Dessa forma, o motorista deve reduzir a velocidade (Art. 220, XIII) e ter máxima cautela, deslocando-se de forma segura para a faixa oposta (se livre) para ceder a passagem e manter a distância de segurança.",""],["1-3-138",1,3,1,39,"João chega a um cruzamento sem sinalização. À direita, há um carro parado aguardando, e à esquerda, um veículo se aproxima. O que João deve fazer?","Aguardar o da direita passar- depois, se seguro, seguir.",["Passar na frente do da direita porque ele está parado.","Forçar a passagem porque o da esquerda está longe.","Ir devagar no meio para ver quem cede."],"Conforme estabelece o Art. 29, inciso III, alínea \"c\" do CTB, em um cruzamento não sinalizado onde nenhuma das regras de preferência (rodovia ou rotatória) se aplique, a preferência de passagem é do veículo que vier pela direita do condutor. Portanto, João deve parar e ceder a preferência ao carro que está à sua direita, independentemente do carro à esquerda.",""],["1-3-139",1,3,2,48,"Cenário: Maria trafega na faixa da esquerda acompanhando o fluxo. Outro veículo se aproxima por trás, sinaliza e pede passagem. De acordo com o CTB, qual é a conduta obrigatória de Maria nesse momento?","Sinaliza e vai para a direita quando houver espaço seguro, sem acelerar.",["Acelera para “segurar a faixa”.","Freia de propósito.","Joga o carro para o acostamento."],"Conforme estabelece o Art. 198 do CTB, deixar de dar passagem pela faixa da esquerda, quando solicitado, é infração média, sujeita a multa. A regra de circulação fundamental, prevista no Art. 29, inciso IV, é que \"quando uma pista de rolamento comportar várias faixas de circulação no mesmo sentido, as da direita são destinadas ao deslocamento dos veículos mais lentos e de maior porte, e as da esquerda, destinadas à ultrapassagem e aos veículos de maior velocidade.\" Assim, Maria tem a obrigação legal de desocupar a faixa da esquerda para o veículo que demonstra maior velocidade.",""],["1-3-140",1,3,1,32,"Maria quer apresentar documento de habilitação digital ao agente. Ela pode?","Sim. O documento de habilitação pode ser apresentado no celular, desde que válido e legível.",["Não. Só papel plastificado é aceito.","Somente foto do documento vale.","Só vale se mandar por mensagem depois."],"Versão digital tem validade legal.",""],["1-3-141",1,3,0,48,"Na pista de rolamento você deve:","Circular respeitando faixas e regras de ultrapassagem.",["Parar para conversar no meio.","Usar para vender produtos.","Brincar com crianças."],"Faixa destinada ao movimento dos veículos.",""],["1-3-147",1,3,1,51,"O motorista precisa invadir parcialmente a outra faixa para manter 1,5 m do ciclista. O que fazer?","Só ultrapassar quando houver espaço e visibilidade, sinalizando- se não houver, aguarde.",["Passar espremendo o ciclista.","Buzinar e seguir colado.","Subir no canteiro."],"Conforme estabelece o Art. 201 do CTB, a obrigatoriedade de manter a distância lateral mínima de 1,50 m ao ultrapassar ciclista deve ser cumprida. Se a faixa de trânsito não permitir essa margem de segurança dentro dos seus limites, o condutor deve utilizar parte da faixa adjacente ou até mesmo mudar integralmente de faixa (Art. 29, IX) após sinalizar e verificar que a manobra é segura e não prejudica o fluxo dos demais veículos (Art. 34 e Art. 35 do CTB).",""],["1-3-149",1,3,1,33,"O que é uma estrada?","Via rural sem pavimentação (terra/cascalho)- usada para áreas rurais- máxima 60 km/h.",["É avenida com semáforo.","Rodovia com pedágio.","Rua de bairro."],"Estrada é classificada como uma via rural não pavimentada. Sua distinção principal em relação à Rodovia (que é a via rural pavimentada) reside justamente na ausência de revestimento asfáltico ou de concreto.",""],["1-3-150",1,3,1,33,"O que é uma rodovia?","Via rural pavimentada (asfalto/concreto) que liga cidades e estados- velocidades costumam ser de 80 a 110 km/h, conforme sinalização.",["Rua de bairro sem calçada.","Via rural de terra.","Calçada larga para pedestres."],"Rodovia é classificada como uma via rural pavimentada. Sua distinção fundamental em relação à Estrada é a presença de pavimentação, o que implica, geralmente, maiores limites de velocidade e uma engenharia que permite maior fluxo e segurança.",""],["1-3-151",1,3,1,50,"Marcos está trafegando por uma área escolar quando vê algumas crianças próximas à calçada. O que Marcos deve fazer?","Reduzir ainda mais a velocidade e ficar pronto para parar caso seja necessário.",["Buzinar para as crianças saírem.","Passar colado para não perder tempo.","Acelerar antes que atravessem."],"Em áreas escolares, há maior circulação de crianças e pedestres, o que exige prudência e velocidade reduzida por parte do condutor.",""],["1-3-153",1,3,2,49,"O que um condutor deve fazer quando outro veículo tenta ultrapassá-lo na rodovia?","Mudar para a faixa da direita, se possível, para facilitar a ultrapassagem.",["Acelerar para evitar a ultrapassagem.","Manter a velocidade constante e não mudar de faixa.","Reduzir a velocidade e não mudar de faixa."],"A conduta correta ao ser ultrapassado é mudar para a faixa da direita, se possível, respeitando a legislação e permitindo que o outro veículo ultrapasse de forma segura. A ultrapassagem deve ser facilitada, não bloqueada.",""],["1-3-154",1,3,1,50,"Pedro vai entrar na garagem atravessando a calçada, mas uma criança se aproxima correndo. Qual é a decisão mais segura a ser adotada por Pedro?","Parar antes da calçada, esperar a passagem da criança e entrar só quando estiver livre.",["Acelerar para entrar logo.","Buzinar e avançar.","Entrar pela contramão."],"Prioridade do pedestre e prevenção.",""],["1-3-155",1,3,2,39,"Perto da saída da rotatória, há faixa de pedestres com pessoas iniciando a travessia. O que fazer?","Sinalizar a saída e dar preferência aos pedestres, saindo só quando a travessia estiver segura.",["Buzinar e sair rápido.","Parar dentro da rotatória.","Cortar pela calçada para evitar parar."],"Prioridade ao pedestre em área crítica.",""],["1-3-156",1,3,1,49,"Cecília dirige seu veículo em uma via e deseja realizar uma ultrapassagem. Como essa ação deve ser realizada?","A ultrapassagem deve ser feita pela esquerda, quando possível, respeitando as condições da via.",["Sempre pela direita.","Qualquer lado, se couber.","Pelo acostamento."],"Regra geral com exceção prevista.",""],["1-3-157",1,3,1,32,"Qual documento o condutor deve portar quando está dirigindo?","O documento de habilitação correspondente (CNH, PPD ou ACC), físico ou digital.",["Apenas a conta de luz.","Somente o Certificado de Registro e Licenciamento de Veículo","Uma foto do carro no celular."],"Porte obrigatório do documento de habilitação. Art. 159 § 1 do CTB",""],["1-3-158",1,3,2,45,"Qual é a distância segura entre veículos?","A que permite parar o veículo com segurança. Varia de acordo com a velocidade, a pista, o clima e o tipo de veículo.",["Sempre um metro.","Sempre três metros","Não importa em baixa velocidade."],"O condutor deverá guardar distância de segurança lateral e frontal entre o seu e os demais veículos, bem como em relação ao bordo da pista, considerando-se, no momento, a velocidade e as condições do local, da circulação, do veículo e as condições climáticas. Art 29, inciso II do CTB",""],["1-3-159",1,3,1,32,"Qual é a função dos exames médico e psicológico?","Verificar as condições físicas e mentais para dirigir com segurança.",["Descobrir a profissão da pessoa.","Medir se a pessoa gosta de carro.","Ver se a pessoa tem carro próprio."],"Durante o processo de habilitação, deve ser verificada a aptidão do condutor.",""],["1-3-160",1,3,1,47,"Qual o comportamento seguro ao se avistar animais na pista?","Reduzir a velocidade, sinalizar, manter distância e só prosseguir quando for seguro para todos.",["Buzinar para o animal e avançar.","Acelerar para assustar.","Jogar farol alto e seguir."],"O condutor deve manter a segurança no trânsito.",""],["1-3-161",1,3,1,32,"Qual o prazo de validade da CNH ou da ACC:","Do prazo do exame de aptidão física e mental que estiver vigente.",["Varia de acordo com o interesse do condutor.","Depende do preço do veículo.","Depende do Estado em que o condutor foi habilitado."],"O exame define a validade da habilitação, conforme art. 159, § 10 do CTB.",""],["1-3-162",1,3,1,49,"Quando é permitido ultrapassar pela direita?","Somente se o veículo da frente sinalizou que vai virar à esquerda, e houver espaço seguro.",["Sempre que houver espaço.","Nunca, em hipótese alguma.","Sempre que for motocicleta."],"Art. 199 do CTB.",""],["1-3-163",1,3,1,50,"O semáforo mudou para luz verde e ainda há pedestres finalizando a travessia. O que deve ser feito?","Aguardar a finalização da travessia e depois partir com calma.",["Acelerar e forçar passagem.","Buzinar até saírem correndo.","Contornar pela calçada."],"O condutor deve observar as preferências da via.",""],["1-3-164",1,3,1,26,"Sobre embarque e desembarque em frente à escola, qual é o comportamento correto?","Usar os locais indicados pela sinalização e nunca parar em fila dupla.",["Parar em qualquer lugar porque é rápido.","Estacionar sobre a faixa porque é mais perto.","Bloquear a garagem do vizinho por no máximo 5 minutos."],"Paradas irregulares aumentam o risco de atropelamento e congestionamento.",""],["1-3-165",1,3,1,50,"Um pedestre atravessa fora da faixa em uma via com pouco fluxo. Qual atitude do condutor?","Reduzir a velocidade e manter o controle do veículo.",["Acelerar para dar um susto no pedestre.","Continuar conduzindo normalmente.","Buzinar sem diminuir a velocidade."],"O condutor deve observar as preferências da via.",""],["1-3-166",1,3,2,38,"Em uma via estreita com ciclovia ao lado e grande movimentação de pedestres, o que o condutor deve fazer ao virar à direita?","Sinalizar com antecedência, reduzir, checar ciclovia e pedestres, e só virar quando a passagem estiver livre e segura.",["Virar rápido para não perder a vez.","Buzinar e entrar sobre a ciclovia.","Virar pela calçada com luz alta."],"O condutor deve observar as preferências da via.",""],["1-3-167",1,3,2,39,"Você chega a um cruzamento sem sinalização. À direita vem um carro em baixa velocidade e, à esquerda, outro se aproxima rapidamente. O que deve fazer?","Dar a preferência ao da direita, mesmo que ele esteja mais devagar.",["Dar preferência a quem é mais rápido.","Forçar a passagem porque você freou.","Parar no meio para ver quem vem."],"Regra da direita não depende da velocidade.",""],["1-3-168",1,3,1,34,"Você perdeu a saída da rodovia. O que fazer?","Seguir até o próximo acesso, sem frear ou cortar pela direita de forma perigosa.",["Parar no acostamento e dar ré.","Cruzar a pista de última hora.","Cortar por cima do canteiro."],"O condutor deve seguir as regras das vias e garantir a segurança de todos.",""],["1-3-169",1,3,2,47,"Com pista escorregadia por óleo, a decisão segura é:","Reduzir a velocidade e evitar manobras bruscas.",["Acelerar para passar rápido.","Frear no último momento.","Virar o volante de uma vez."],"Aderência baixa por conta do óleo exige condução mais lenta e suave.",""],["1-3-170",1,3,2,47,"Durante uma chuva intensa em uma rodovia de pista simples, o motorista aciona o farol alto para enxergar melhor. Essa atitude:","Está incorreta, pois o farol alto ofusca a visão dos outros condutores e aumenta o risco de sinistro.",["Está correta, desde que a pista tenha baixa iluminação.","É aceitável, se não houver veículos no sentido contrário.","É obrigatória, conforme o CTB, para compensar a falta de visibilidade."],"Sob chuva intensa, o correto é o uso do farol baixo. O ofuscamento causa perda de visibilidade e risco de colisão.",""],["1-3-171",1,3,2,49,"Durante uma ultrapassagem em pista simples, o condutor sinaliza e inicia a manobra mesmo sem visibilidade completa do trecho à frente. Essa conduta:","É perigosa, pois viola o dever de assegurar condições de segurança antes de ultrapassar.",["É aceitável se o outro veículo mantiver velocidade constante.","É permitida quando não há sinalização proibitiva.","É uma infração leve, sem risco relevante."],"A ultrapassagem sem visibilidade é uma das causas mais graves de colisões frontais. O CTB exige total certeza da segurança da manobra, sob pena de infração gravíssima.",""],["1-3-173",1,3,2,41,"O que diferencia a direção segura de uma simples reação a perigos?","A capacidade de prever e agir antes do risco.",["A sorte de escapar dos sinistros.","O uso de equipamentos caros.","Frear sem observar os arredores."],"A direção segura é antecipatória, não apenas instintiva.",""],["1-3-174",1,3,2,41,"O que melhor define a integração entre técnica e atitude na condução segura?","Aplicar habilidades com responsabilidade, calma e empatia.",["Acelerar para demonstrar domínio do veículo.","Confiar apenas nos reflexos automáticos.","Seguir o fluxo mesmo em situações de risco."],"A direção segura combina técnica, ética e controle emocional — essência do Sistema Seguro.",""],["1-3-175",1,3,2,36,"Qual posicionamento do encosto de cabeça é adequado para reduzir “golpe de chicote”?","Topo alinhado ao topo da cabeça e próximo à nuca.",["Abaixo da nuca e distante.","No meio das costas.","Sempre retirado."],"Limita hiperextensão cervical na colisão traseira.",""],["1-3-177",1,3,2,66,"Quando a manutenção preventiva é negligenciada, o risco aumenta principalmente por:","Redução da capacidade de resposta do veículo.",["Excesso de confiança do condutor.","Melhora do desempenho mecânico.","Menor consumo de combustível."],"O veículo deve estar em perfeitas condições para responder às ações do condutor.",""],["1-3-178",1,3,2,47,"Um motorista mantém o farol de neblina aceso em dia claro e ensolarado. Além de ser inadequado, esse comportamento:","É infração prevista no CTB, pois o farol de neblina só pode ser usado em condições climáticas adversas.",["É aceitável para aumentar a visibilidade do veículo em áreas urbanas.","É obrigatório para veículos de passeio modernos.","É uma boa prática de direção preventiva."],"O uso indevido do farol de neblina é proibido pelo CTB, pois pode ofuscar outros condutores e causar distrações visuais, contrariando o princípio da direção segura.",""],["1-3-179",1,3,0,44,"A buzina deve ser usada:","Em toques breves para evitar sinistros.",["Para expressar raiva.","De forma prolongada sempre.","Para abrir caminho na cidade."],"Uso é restrito a alertas, em breves toques. Art. 41 do CTB.",""],["1-3-180",1,3,0,41,"A condução segura começa com:","Perceber, interpretar e agir corretamente.",["Dirigir apenas em ruas conhecidas.","Evitar sair à noite.","Manter o carro limpo e vistoso."],"O tripé percepção–interpretação–ação forma a base da direção segura.",""],["1-3-181",1,3,0,36,"Altura correta do apoio de cabeça:","Entre o topo da cabeça e a nuca.",["No meio das costas.","Abaixo da nuca, distante.","Sempre retirado."],"Posicionamento adequado evita entorse cervical.",""],["1-3-182",1,3,0,13,"Antes de colocar o veículo em via pública, é determinado pelo CTB:","Verificar equipamentos obrigatórios e combustível suficiente.",["Acelerar para aquecer.","Desligar luzes.","Ignorar o manual do veículo."],"Exigência legal de segurança básica, conforme art. 27 do CTB.",""],["1-3-184",1,3,0,18,"Ao mudar de faixa, qual é a ação essencial?","Acionar a seta com antecedência.",["Aproximar muito do veículo ao lado.","Olhar só para frente.","Acelerar para ganhar espaço."],"Sinalizar com antecedência comunica a manobra e reduz risco de sinistro.",""],["1-3-185",1,3,0,50,"Ao perceber pedestres agitados próximos à calçada, o condutor atento deve:","Reduzir a velocidade e manter atenção redobrada.",["Aumentar a velocidade para evitar parar.","Ignorar, pois estão na calçada.","Buzinar e seguir adiante."],"Antecipar riscos é parte da função cognitiva e evita sinistros.",""],["1-3-186",1,3,0,35,"Após afivelar o cinto de segurança, o que fazer?","Puxar ligeiro para cima e deixar bem justo ao corpo.",["Deixar folgado para conforto.","Torcer a fita para prender mais.","Deixar o fecho sem travar."],"Folgas aumentam deslocamento e impactos internos.",""],["1-3-187",1,3,0,36,"Qual é o calçado adequado para dirigir ou pilotar?","Que se firme no pé e não escorregue.",["Chinelo solto.","Sandália sem fixação no calcanhar.","Salto alto."],"Calçados instáveis comprometem o uso dos pedais.",""],["1-3-188",1,3,2,47,"O que o condutor deve fazer primeiro quando está dirigindo enquanto chove forte na cidade?","Reduzir a velocidade e manter o farol baixo aceso.",["Ligar o farol alto para “abrir” visão.","Acelerar para sair rápido da chuva.","Frear forte para enxergar melhor."],"Chuva reduz aderência e visibilidade. A conduta segura é diminuir a velocidade e usar farol baixo.",""],["1-3-189",1,3,2,36,"Com airbag dianteiro ativo, é proibido:","Colocar bebê conforto de costas no banco da frente.",["Recuar o banco.","Usar cinto no passageiro.","Fechar os vidros."],"A abertura do airbag pode ferir o bebê.",""],["1-3-191",1,3,2,43,"Como devem ser ajustados os espelhos laterais?","Devem exibir só uma pequena parte da lateral do carro.",["Devem mostrar grande parte da própria porta.","Devem apontar para o chão.","Devem mostrar apenas o céu."],"Referência mínima do próprio veículo sem perder o entorno.",""],["1-3-192",1,3,1,43,"Como deve estar ajustado o espelho interno?","Mostrando todo o vidro traseiro.",["Mostrando metade do teto.","Mostrando apenas o banco traseiro.","Voltado para o passageiro."],"Posicionamento correto amplia visão traseira.",""],["1-3-193",1,3,1,43,"O que pode ajudar pedestres e ciclistas a serem mais visíveis à noite para os motoristas?","Roupas claras, faixas refletivas ou luzes.",["Roupas escuras","Fones de ouvido altos.","Falta de iluminação"],"À noite, para garantir a segurança no trânsito, é fundamental que pedestres e ciclistas usem roupas claras e equipamentos refletivos, como faixas luminosas ou refletores, para serem vistos com maior facilidade pelos motoristas. Essa atitude reduz o risco de acidentes, tornando-os mais visíveis no escuro.",""],["1-3-194",1,3,1,44,"O que caracteriza uma comunicação segura entre os condutores?","Setas antecipadas e buzina com moderação.",["Buzina longa para abrir caminho.","Sinalizar só depois da manobra.","Evitar contato visual."],"A comunicação segura no trânsito envolve o uso correto de sinais de trânsito, dispositivos de iluminação (como setas de direção) e buzinas apenas quando necessário. O objetivo é garantir que todos os motoristas e pedestres possam antecipar as ações uns dos outros, evitando acidentes e promovendo a segurança nas vias. O uso inadequado de sinais, ou ignorar a sinalização, pode causar confusão e aumentar o risco de colisões.",""],["1-3-195",1,3,1,41,"Uma condução segura no trânsito envolve:","Manter distância segura, usar os sinais corretamente e respeitar a velocidade.",["Frear e acelerar forte.","Ignorar os limites de velocidade e a sinalização para ganhar tempo.","Usar marcha lenta prolongada."],"condução segura depende de atitudes como manter distância adequada, usar os sinais de forma correta, como luzes e setas, e respeitar os limites de velocidade. Esses comportamentos garantem que o condutor possa reagir a tempo e prevenir acidentes.",""],["1-3-196",1,3,1,70,"Condução eficiente significa:","Usar menos combustível e poluir menos com pequenas mudanças de hábito.",["Dirigir rápido sempre.","Frear e acelerar forte.","Descartar óleo no ralo."],"A condução eficiente está relacionada à redução do consumo de combustível e à diminuição da poluição, o que pode ser alcançado com hábitos de direção mais suaves, como evitar acelerações e frenagens bruscas, manter uma velocidade constante e realizar manutenções regulares no veículo.",""],["1-3-197",1,3,2,43,"Por que é mais arriscado dirigir com os faróis apagados ao entardecer?","Pois diminui a capacidade dos outros motoristas de verem o veículo.",["Pois melhora o consumo de energia elétrica.","Pois indica economia de lâmpadas.","Pois só causa risco em rodovias."],"Ao dirigir ao entardecer, a visibilidade começa a diminuir, e os faróis são essenciais para garantir que o motorista possa ver e ser visto com clareza. Sem os faróis acesos, o risco de não perceber outros veículos, pedestres ou obstáculos aumenta significativamente, tornando a condução mais perigosa.",""],["1-3-198",1,3,1,42,"Quais são as consequências de dirigir de forma agressiva?","Pode aumentar o risco de acidentes e colocar em perigo outros motoristas e pedestres.",["Pode reduzir consumo de combustível.","Ajuda a limpar o motor.","Ajuda a diminuir emissões de gases poluentes."],"Dirigir de forma agressiva, como acelerar bruscamente, realizar frenagens fortes e mudanças repentinas de direção, aumenta o risco de acidentes e compromete a segurança de todos no trânsito. Essas atitudes colocam em perigo outros motoristas, pedestres e o próprio condutor.",""],["1-3-199",1,3,1,42,"Como a direção agressiva afeta a segurança no trânsito?","Aumenta o risco de acidentes e coloca a segurança de todos em risco.",["Torna o trânsito mais rápido e menos congestionado.","Ajuda a diminuir emissões de gases poluentes.","Proporciona mais controle sobre o veículo em condições adversas."],"A direção agressiva, caracterizada por manobras rápidas e bruscas, aumenta o risco de acidentes e prejudica a segurança de todos no trânsito. Esse comportamento aumenta a probabilidade de colisões, afetando a integridade física de motoristas, passageiros e pedestres.",""],["1-3-200",1,3,1,47,"Como um motorista deve se compartar durante uma chuva forte?","Diminuir a velocidade, ligar farol baixo e limpador.",["Acelerar para escapar da chuva.","Frear de forma brusca.","Usar farol alto."],"Durante chuvas fortes, a visibilidade e a aderência dos pneus à pista podem ser comprometidas. O motorista deve reduzir a velocidade para manter o controle do veículo e aumentar a distância de segurança dos outros veículos, já que a pista fica mais escorregadia e o tempo de frenagem aumenta. O uso de faróis baixos é fundamental para melhorar a visibilidade.",""],["1-3-202",1,3,1,47,"Qual deve ser a atitude básica do condutor em caso de chuva?","Reduzir velocidade e manter o limpador ligado.",["Acelerar para sair logo.","Usar farol alto.","Ligar o pisca-alerta em movimento."],"Chuva reduz visibilidade, condução deve ser compatível.",""],["1-3-203",1,3,1,47,"Qual deve ser a atitude a ser tomada por um condutor quando dirige em condições adversas?","Reduzir velocidade e aumentar a atenção.",["Manter a mesma velocidade.","Desligar os faróis.","Ultrapassar para “sair logo”."],"Em condições adversas de trânsito ou clima, como chuva, neblina ou má visibilidade, o motorista deve diminuir a velocidade e aumentar a atenção. Isso permite reagir com segurança a imprevistos, compensando a redução da aderência dos pneus e a dificuldade de enxergar a via e outros veículos. Essa é a atitude preventiva mais importante para evitar acidentes.",""],["1-3-207",1,3,0,47,"Qual das opções representa uma condição adversa do veículo?","Pneus carecas",["Revisão em dia.","Freios regulados.","Limpadores novos."],"As condições adversas do veículo são aquelas que afetam sua segurança e desempenho, aumentando o risco de acidentes. Freios com defeito, pneus carecas, direção desregulada ou faróis queimados são exemplos claros. Manter a manutenção em dia é essencial para evitar falhas mecânicas e garantir uma condução segura.",""],["1-3-208",1,3,0,46,"Por que é importante frear o veículo de forma gradual?","Pois alerta quem vem atrás e evita sustos.",["Pois faz o carro andar sozinho.","Pois aumenta o desgaste de pneus.","Pois substitui o uso das setas."],"Frear de forma gradual e antecipada é uma prática essencial de direção defensiva, pois mantém o controle do veículo e permite que o motorista que vem atrás perceba a redução de velocidade e reaja a tempo.",""],["1-3-209",1,3,0,35,"Qual a principal função principal do cinto de segurança em um veículo?","Conter o corpo e reduzir lesões graves.",["Evitar multas apenas.","Aumentar conforto do banco.","Substituir o airbag."],"A principal função do cinto de segurança é reter o corpo dos ocupantes em caso de acidente ou frenagem repentina, evitando que sejam arremessados contra o painel, o para-brisa ou para fora do veículo. Seu uso é obrigatório por lei (art. 65 do CTB) e é um dos equipamentos mais eficazes na redução de mortes e ferimentos graves no trânsito. Portanto, o cinto é um dispositivo de segurança vital, tanto para o condutor quanto para os passageiros.",""],["1-3-210",1,3,0,62,"As luzes do veículo têm como uma de suas principais funções:","Garantir a visibilidade do veículo e permitir a comunicação com outros condutores.",["Decorar o carro.","Aumentar potência do motor.","Reduzir o consumo de combustível"],"As luzes do veículo — como faróis, lanternas, luz de freio e setas — têm a função de tornar o veículo visível e indicar suas intenções de manobra aos demais usuários da via. Elas são fundamentais para a segurança e comunicação no trânsito, especialmente à noite ou em condições de baixa visibilidade.",""],["1-3-212",1,3,0,47,"Durante uma chuva intensa, qual deve ser a atitude correta do condutor?","Aumentar distância e evitar frear bruscamente.",["Ligar farol alto e acelerar.","Usar buzina contínua.","Andar no “vácuo” de caminhões."],"m chuvas intensas, a visibilidade e a aderência dos pneus diminuem, aumentando o risco de aquaplanagem e colisões. Por isso, o condutor deve reduzir a velocidade, aumentar a distância do veículo à frente e manter os faróis baixos acesos para ser visto por outros motoristas.",""],["1-3-214",1,3,0,36,"O que é o airbag?","Uma bolsa que infla em milésimos de segundo após impacto.",["Um sensor que freia o carro sozinho.","Um tipo de freio ABS.","Um enfeite do volante."],"Dispositivo de segurança passiva para reduzir lesões. É um equipamento de segurança complementar ao cinto de segurança, projetado para amortecer o impacto em caso de colisões, reduzindo o risco de ferimentos graves.",""],["1-3-215",1,3,0,36,"O apoio de cabeça serve para:","Proteger o pescoço contra o efeito chicote.",["Apoiar para dormir.","Deixar o banco mais bonito.","Aumentar espaço no carro."],"Reduz hiperextensão cervical em colisão traseira.",""],["1-3-216",1,3,0,19,"O cinto de segurança deve ser usado:","Por todos os ocupantes, inclusive atrás.",["Só pelo motorista.","Apenas no banco dianteiro.","Apenas em rodovias."],"Reduz lesões em sinistros. Sendo de uso obrigatório em todo territorio nacional, conforme art. 65 do CTB.",""],["1-3-217",1,3,0,64,"O para-brisa deve estar:","Limpo e sem películas escuras que prejudiquem a visão.",["Com películas escuras para reduzir luz.","Úmido para cortar reflexo.","Sempre entreaberto."],"Transparência melhora a percepção, especialmente à noite.",""],["1-3-219",1,3,0,48,"O posicionamento correto do carro na via é:","Centralizado na faixa, com distância lateral.",["Colado no meio-fio.","Avançando sobre faixas vizinhas.","“Costurando” o trânsito."],"Centralizar melhora controle e previsibilidade.",""],["1-3-220",1,3,1,45,"O que é distância de reação?","Espaço percorrido até o cérebro perceber o perigo e acionar o freio.",["Distância do carro até o pedestre.","Espaço entre duas faixas.","Tamanho do veículo."],"Dura cerca de 1 segundo e varia conforme a atenção do condutor.",""],["1-3-221",1,3,0,46,"O que o motorista deve observar antes da curva?","Condições da pista, tipo de curva e aderência.",["Apenas o velocímetro.","Só o retrovisor interno.","A cor do carro da frente."],"A prevenção começa pela leitura do ambiente viário.",""],["1-3-222",1,3,0,44,"Onde o uso indevido da buzina é proibido?","Áreas urbanas entre 22h e 6h e zonas de silêncio.",["Rodovias sem moradores.","Estacionamentos particulares.","Apenas próximo a escolas."],"Art. 227 do CTB.",""],["1-3-223",1,3,0,20,"Ouvir uma sirene enquanto dirige é um alerta para:","Redobrar a atenção e facilitar a passagem do veículo de emergência.",["Aumentar a velocidade para sair rápido.","Ligar o pisca-alerta e continuar na mesma faixa.","Ignorar o som se estiver na sua pista."],"A audição faz parte da função sensorial e ajuda na prevenção de sinistros.",""],["1-3-224",1,3,0,18,"O que deve ser feito antes de mudar de faixa.","Acionar a seta com antecedência.",["Buzinar longamente.","Apagar os faróis.","Fechar os retrovisores."],"A seta comunica intenção do condutor e evita conflitos.",""],["1-3-225",1,3,0,43,"Para checar pontos cegos ao mudar de faixa, faça:","Olhe espelhos e vire levemente a cabeça.",["Confie só no espelho interno.","Use apenas os ouvidos.","Mude sem sinalizar."],"Há áreas sem visão direta, devendo sempre serem verificadas.",""],["1-3-227",1,3,0,36,"Para o airbag ser eficaz, é essencial:","Usar o cinto de segurança corretamente.",["Desligar todas as luzes.","Andar só devagar.","Tirar o encosto de cabeça."],"Sem cinto, o airbag pode ferir o condutor ou passageiros.",""],["1-3-228",1,3,0,41,"Para prevenir sinistros, a atitude básica do bom condutor é:","Antecipar riscos e decidir com calma.",["Confiar só na experiência.","Acelerar para sair do perigo.","Usar o celular com discrição."],"Previsão e decisão segura são princípios da direção defensiva e preventiva.",""],["1-3-229",1,3,0,43,"Para ser visto à noite como pedestre ou ciclista, o que ajuda?","Usar roupas claras ou faixas refletivas.",["Evitar qualquer iluminação.","Caminhar na pista sem atenção.","Desligar a lanterna da bicicleta."],"Visibilidade salva vidas, materiais refletivos aumentam detecção por motoristas.",""],["1-3-231",1,3,0,43,"Por que ver e ser visto é essencial no trânsito?","Porque se você não vê ou não é visto, o risco de sinistro aumenta.",["Porque melhora apenas o conforto do motorista.","Porque serve só para rodovias.","Porque evita gastar com manutenção."],"Visibilidade mútua evita surpresas e previne sinistros.",""],["1-3-232",1,3,0,41,"Por que a condução segura é também um ato social?","Porque cada decisão afeta a vida dos outros usuários da via.",["Porque dirigir é um direito individual absoluto.","Porque todos devem seguir o mesmo ritmo.","Porque quem dirige mal é mais respeitado."],"O trânsito é um espaço coletivo, a segurança depende da convivência responsável.",""],["1-3-233",1,3,0,46,"Por que a velocidade é um dos fatores mais críticos da segurança viária?","Porque afeta diretamente a gravidade dos sinistros.",["Porque melhora o conforto.","Porque reduz a atenção.","Porque evita derrapagens."],"Mesmo pequenas variações de velocidade alteram totalmente as consequências de um impacto.",""],["1-3-234",1,3,0,43,"Por que ajustar os espelhos antes de sair?","Para ampliar o campo de visão e reduzir pontos cegos.",["Para ver apenas o interior do veículo.","Para não precisar olhar a via.","Para dirigir sem cintos."],"Ajustes corretos aumentam percepção lateral e traseira e evitam surpresas.",""],["1-3-235",1,3,0,52,"Por que evitar pontos cegos de caminhões e ônibus?","Porque o condutor desses veículos pode não enxergar você.",["Porque a multa é maior.","Porque economiza combustível.","Porque facilita ouvir música."],"Posição fora do campo visual reduz risco de colisão.",""],["1-3-237",1,3,1,36,"Por que não deixar objetos soltos no carro?","Podem virar projéteis em sinistros.",["Atrapalham a limpeza.","Aumentam conforto.","Melhoram consumo."],"Objetos arremessados agravam ferimentos.",""],["1-3-238",1,3,0,50,"Por que o condutor deve observar os pedestres antes de ligar o veículo?","Porque pode haver alguém atravessando à frente ou atrás do veículo.",["Porque o motor frio gasta mais combustível.","Porque é exigência apenas para carros novos.","Porque evita multas de estacionamento."],"Observar o entorno é parte da função sensorial e reduz sinistros ao iniciar a condução.",""],["1-3-239",1,3,0,50,"Por que o motociclista é mais vulnerável no trânsito?","Porque não é protegido por carroceria e é pouco visível.",["Tem freios mais fracos.","Anda sempre mais rápido.","Usa pistas exclusivas."],"A exposição direta aumenta o risco e exige atenção constante.",""],["1-3-240",1,3,1,41,"Previsão, na direção defensiva, significa:","Imaginar o que pode acontecer e agir antes do risco.",["Reagir apenas após o perigo.","Confiar no olhar dos outros.","Andar sempre mais rápido."],"Prevenção pode evitar sinistros no trânsito.",""],["1-3-241",1,3,0,41,"Qual atitude demonstra a união entre direção defensiva e preventiva?","Manter distância segura e prever erros dos outros.",["Acelerar para evitar colisão.","Frear de forma repentina.","Ignorar riscos quando está certo."],"A união entre prevenção e defesa cria o comportamento seguro ideal.",""],["1-3-242",1,3,0,47,"Qual atitude evita derrapagens em curvas?","Reduzir a velocidade antes da curva.",["Frear bruscamente dentro da curva.","Acelerar forte na saída.","Girar o volante rapidamente."],"Redução antecipada mantém a aderência dos pneus.",""],["1-3-243",1,3,0,66,"Qual atitude reduz falhas do veículo?","Checar pneus, freios, luzes, óleo e arrefecimento antes de sair com o veículo.",["Apenas encher combustível.","Conferir som e tapetes.","Ignorar sinais no painel."],"A verificação prévia é dever legal e salva vidas.",""],["1-3-246",1,3,0,13,"Qual é a principal atitude do condutor ao cuidar do veículo antes de sair?","Verificar as condições de funcionamento dos equipamentos de segurança.",["Ligar o som e ajustar o banco.","Apenas abastecer o carro.","Testar a buzina e sair."],"Manutenção preventiva é parte da direção defensiva.",""],["1-3-248",1,3,0,44,"Qual é o uso correto da buzina no trânsito?","Toques breves para advertir sobre risco.",["Pressionar longo para abrir caminho.","Usar à noite para avisar presença.","Pressionar forte, mesmo em área de silência, para cumprimentar outras pessoas."],"A buzina é instrumento de alerta, não de reprimenda. Há restrições de horário e local.",""],["1-3-249",1,3,0,41,"Qual é o objetivo da condução segura?","Evitar sinistros e preservar vidas.",["Chegar mais rápido ao destino.","Mostrar habilidade no volante.","Usar o freio o mínimo possível."],"A condução segura tem como foco a prevenção de sinistros e a proteção de todos os usuários da via.",""],["1-3-250",1,3,0,47,"Qual exemplo é condição adversa de luz?","Ofuscamento ao sair de túnel.",["Pista seca e clara.","Dia nublado sem chuva.","Via duplicada e limpa."],"Mudança brusca de luminosidade reduz visão.",""],["1-3-251",1,3,0,42,"Qual fator do condutor aumenta o risco no trânsito?","Sono e uso de celular ao volante.",["Pausas regulares.","Hidratação e calma.","Planejamento de rota."],"Distração e fadiga atrasam reação.",""],["1-3-253",1,3,0,62,"Qual luz é obrigatória à noite?","Farol baixo.",["Farol alto sempre.","Apenas DRL.","Lanternas traseiras apagadas."],"Ilumina sem ofuscar.",""],["1-3-254",1,3,0,41,"Qual ação representa a condução segura?","Todo motorista deve manter atenção e vigilância sempre.",["Basta experiência para evitar riscos.","O carro protege de qualquer erro.","A CNH garante preparo total."],"Atenção contínua reduz erros humanos.",""],["1-3-256",1,3,0,46,"Quando o veículo entra rápido demais em uma curva, o que tende a acontecer?","Seguir reto, por causa da inércia.",["Ele faz a curva com mais facilidade.","Ele freia automaticamente.","Nada. A curva independe da velocidade."],"A inércia mantém o movimento em linha reta e o controle depende do motorista.",""],["1-3-257",1,3,0,50,"Quando um condutor visualiza uma bola rolando para a via, ele deve:","Reduzir e preparar-se para possível travessia de criança.",["Manter velocidade constante.","Desviar rapidamente da bola.","Acionar a buzina para alertar."],"Antecipar o perigo é ação cognitiva fundamental da direção segura.",""],["1-3-258",1,3,0,41,"Quando você assume o volante, o que realmente significa dirigir com segurança?","Proteger a própria vida e a de todos ao redor.",["Andar rápido, mas com atenção.","Dominar o carro em alta velocidade.","Seguir apenas o fluxo dos outros veículos."],"Dirigir com segurança é um ato de responsabilidade e respeito à vida. O foco é preservar vidas, não apenas controlar o veículo.",""],["1-3-259",1,3,0,19,"Quem deve usar cinto no veículo?","Todos os ocupantes, inclusive no banco traseiro.",["Só o motorista.","Apenas motorista e passageiro da frente.","O motorista, mas somente em rodovias."],"Obrigatório para todos os assentos, conforme art. 65 do CTB.",""],["1-3-260",1,3,0,41,"Ser um bom condutor é principalmente:","Dominar suas emoções antes de dominar a máquina.",["Aprender a acelerar com rapidez.","Saber fazer manobras difíceis.","Conhecer atalhos e rotas curtas."],"A condução segura exige controle emocional, atenção e equilíbrio, não apenas técnica.",""],["1-3-261",1,3,0,63,"Um motorista sente o volante vibrar fortemente ao frear. O que essa percepção indica?","Possível irregularidade na pista ou falha no sistema de freios.",["Normalidade do piso e dos pneus.","Que deve acelerar para estabilizar.","Que o veículo precisa de alinhamento apenas."],"A vibração é um sinal sensorial que deve ser interpretado como alerta para risco.",""],["1-3-263",1,3,0,36,"Uma função do airbag é:","Evitar que o ocupante bata no volante, painel ou para-brisa.",["Aumentar a potência do motor.","Economizar combustível.","Substituir os freios."],"Diminui impactos em partes duras do veículo.",""],["1-3-264",1,3,1,45,"A distância de frenagem depende principalmente de:","Velocidade, condições da via, pneus, freios e forma de frear.",["Idade do motorista.","Tipo de combustível.","Cor do veículo."],"Fatores físicos determinam a capacidade de parada.",""],["1-3-265",1,3,1,18,"A seta deve ser acionada:","Em toda mudança de faixa, conversão, entrada/saída e ultrapassagem.",["Só quando houver trânsito.","Apenas após a manobra.","Quando quiser educar outro condutor."],"Comunicação clara entre condutores evita conflitos.",""],["1-3-266",1,3,1,43,"Além de ver, ser visto depende de:","Faróis e lanternas limpos e funcionando.",["Faróis apagados para não incomodar.","Películas escuras no para-brisa.","Seta desligada para surpresa."],"Comunicação visual clara evita interpretações erradas.",""],["1-3-267",1,3,1,47,"Animais no veículo devem:","Ficar presos em dispositivo ou caixa apropriada.",["Circular soltos no painel.","Ir no colo do motorista.","Ficar com a cabeça para fora."],"Os animais devem ficar presos para evitar distrações e projeções perigosas.",""],["1-3-269",1,3,1,47,"Aquaplanagem pode ocorrer quando:","Chove forte e a velocidade é alta.",["Pista está seca.","Pneus novos e velocidade baixa.","Há vento lateral."],"Aquaplanagem ocorre quando um filme de água separa pneu do asfalto.",""],["1-3-270",1,3,1,47,"Área alagada na via:","Não arrisque atravessar, busque rota segura.",["Passe rápido para cortar a água.","Siga bem aproximado outro veículo.","Acelere com farol alto."],"Enchentes escondem buracos e arrastam veículos.",""],["1-3-271",1,3,1,43,"Banco do motorista deve permitir:","Alcance total dos pedais e boa visão.",["Pernas esticadas e encosto deitado.","Mãos soltas sem apoio.","Visão só do painel."],"Ergonomia correta melhora o controle do condutor.",""],["1-3-272",1,3,1,47,"Como reduzir ofuscamento ao dirigir contra o sol?","Usar para-sol e óculos escuros, com velocidade menor.",["Ligar farol alto.","Fechar os olhos por instantes.","Acelerar para passar rápido."],"Deve ser utilizado o controle de luz e prudência.",""],["1-3-273",1,3,1,47,"Condução noturna segura em rodovia pede:","Velocidade reduzida e farol baixo ao cruzar veículos.",["Farol alto constante.","Ignorar pedestres e animais.","Aproximar muito do veículo à frente."],"Visibilidade menor exige prudência dos condutores.",""],["1-3-274",1,3,1,47,"De dia, em rodovia com chuva e neblina, a sequência correta é:","Reduzir velocidade, aumentar distância e usar farol baixo.",["Manter velocidade e ligar farol alto.","Ligar apenas a luz alta e aumentar a velocidade.","Frear bruscamente e parar na faixa."],"Baixa visibilidade exige adaptação de velocidade, espaço e iluminação adequada.",""],["1-3-275",1,3,1,50,"Em área escolar, a conduta segura inclui:","Reduzir velocidade e atenção total à sinalização e às crianças.",["Manter velocidade da via.","Usar farol alto para alertar.","Buzinar para apressar travessias."],"O condutor deve observar as preferências da via e manter a segurança de todos.",""],["1-3-276",1,3,1,44,"Luz amarela (setas/alertas) indica:","Comunicação de intenção ou situação de emergência.",["Farol alto ligado.","Freio acionado.","Ré engatada."],"Cor de advertência e de indicação.",""],["1-3-277",1,3,1,62,"Luzes do veículo (faróis/lanternas/setas) são essenciais para:","Ver, ser visto e se comunicar.",["Enfeitar o carro.","Economizar bateria.","Evitar lavar o para-brisa."],"A iluminação ajuda a reduzir riscos e sinistros.",""],["1-3-279",1,3,1,47,"Na neblina/fumaça, a conduta segura é:","Manter baixa velocidade e aumentar distância.",["Usar farol alto.","Parar na faixa de rolamento.","Piscar farol para tirar a neblina."],"A visibilidade fica muito reduzida nessas condições, por isso os movimentos devem ser suaves e o uso do farol baixo é o mais indicado.",""],["1-3-280",1,3,2,43,"No entardecer, um carro trafega com para-brisa sujo e faróis apagados. A conduta segura é:","Limpar o para-brisa e acender o farol baixo.",["Manter como está para poupar o sistema de iluminação.","Ligar farol alto na cidade.","Usar apenas luz de posição."],"Visibilidade é essencial para diminuição de riscos no trânsito.",""],["1-3-281",1,3,2,45,"O que ocorre quando o motorista reage tardiamente ao perigo?","Aumenta a distância total de parada.",["Diminui o risco.","Melhora a frenagem.","Reduz a distância de reação."],"Reação lenta amplia o espaço total percorrido até parar.",""],["1-3-282",1,3,1,42,"O que separa o condutor cuidadoso do distraído?","Atenção contínua e sem celular.",["Pressa constante.","Farol alto a qualquer hora.","Mudar de faixa sem seta."],"Atenção é chave para evitar sinistros.",""],["1-3-283",1,3,1,43,"Para reduzir pontos cegos ao dirigir, a conduta adequada é:","Ajustar retrovisores e checar com leve giro de cabeça antes da troca de faixa.",["Olhar só o espelho interno.","Confiar no alerta sonoro do carro.","Usar farol alto para “afastar” veículos."],"Ajuste + verificação direta ampliam percepção lateral e evitam colisões por mudança de faixa.",""],["1-3-284",1,3,1,19,"Pessoas sem cinto no banco traseiro podem:","Ser projetadas para a frente e ferir os da frente.",["Proteger quem está à frente.","Melhorar a frenagem.","Evitar danos no painel."],"Massa do corpo vira “projétil” interno.",""],["1-3-285",1,3,1,35,"Por que duas pessoas no mesmo cinto é perigoso?","O cinto não distribui forças corretamente e pode ferir ambos.",["Fica mais confortável.","O airbag não inflará.","Evita multa."],"Cada ocupante precisa de ancoragem própria.",""],["1-3-286",1,3,1,36,"Por que não se deve dormir apoiado no encosto de cabeça?","Ele é item de proteção, não de conforto, posição errada reduz eficácia.",["Porque quebra fácil.","Porque atrapalha o som do carro.","Porque aumenta consumo."],"Distância da nuca reduz proteção no impacto traseiro.",""],["1-3-287",1,3,1,36,"Por que não usar almofadas, capas ou toalhas no banco?","Facilitam o deslizamento do corpo e anulam o cinto.",["Só sujam o estofado.","Esfriam o assento.","Atrapalham o ar-condicionado."],"Aumenta risco do efeito submarino.",""],["1-3-288",1,3,1,46,"Por que reduzir a velocidade “antes da curva” é mais seguro?","Porque o carro mantém estabilidade e não perde aderência.",["Porque economiza combustível.","Porque evita farol alto.","Porque melhora o conforto."],"Curva exige tração equilibrada, o que só ocorre com menor velocidade.",""],["1-3-289",1,3,2,41,"Quais cinco princípios sustentam a direção defensiva?","Conhecimento, atenção, previsão, decisão, habilidade.",["Pressa, potência, sorte, risco, ousadia.","Velocidade, coragem, ruído, farol alto, disputa.","Experiência, carisma, música, rotina, atalho."],"Conjunto orienta o comportamento seguro.",""],["1-3-290",1,3,2,47,"Quais fatores reduzem a aderência do veículo?","Água, areia, óleo ou buracos na pista.",["Pista seca e limpa.","Pneu calibrado corretamente.","Direção suave."],"Superfícies instáveis aumentam o risco de derrapagem.",""],["1-3-291",1,3,1,41,"Qual a diferença entre direção defensiva e preventiva?","Defensiva protege, preventiva antecipa o risco.",["Defensiva evita multas, preventiva é opcional.","Defensiva é usada em rodovias, preventiva em cidades.","Não há diferença entre elas."],"A direção defensiva reage com segurança, a preventiva evita o perigo antes.",""],["1-3-292",1,3,1,35,"Qual afirmação sobre viagens curtas é correta?","O cinto deve ser usado em todas as viagens.",["Em trajetos curtos, o cinto é dispensável.","Só usar o cinto após 10 km.","Utilizar o cinto apenas à noite."],"Muitos sinistros ocorrem perto de casa.",""],["1-3-293",1,3,1,36,"Qual calçado não é adequado para pilotar?","Chinela e sandália sem calcanhar",["Bota fechada com sola firme.","Tênis que envolve o pé.","Bota com sola antiderrapante."],"Podem escapar dos pedais e prender.",""],["1-3-294",1,3,0,13,"Qual checklist rápido antes de iniciar a viagem está correto?","Espelhos, cintos, faróis, celular fora de uso e velocidade compatível.",["Celular à mão, farol alto ligado e banco deitado.","Som alto, janela aberta e marcha alta.","Sem cinto, olhar o celular no semáforo."],"Preparação simples reduz falhas humanas, melhora reação e comunicação visual.",""],["1-3-295",1,3,1,36,"Qual combinação potencializa a eficácia do airbag frontal?","Cinto correto + mãos bem posicionadas + apoio de cabeça ajustado.",["Apenas airbag e banco deitado.","Só DRL ligado.","Apenas pneu novo."],"Sistemas passivos funcionam em conjunto com postura adequada.",""],["1-3-296",1,3,1,41,"Qual combinação resume a direção segura em curvas?","Reduzir antes, volante suave e controle contínuo.",["Frear forte dentro da curva.","Girar rápido e compensar depois.","Acelerar no meio da curva."],"Antecipar e manter suavidade preservam aderência.",""],["1-3-297",1,3,1,19,"Qual conduta legal sobre o cinto?","Usar é obrigatório, não usar é infração grave.",["Uso é opcional na cidade.","Só o motorista deve usar.","É obrigatório apenas em rodovia."],"Obrigação geral e penalidade prevista.",""],["1-3-298",1,3,1,49,"Qual decisão é mais segura ao iniciar ultrapassagem em pista simples?","Só iniciar com visibilidade ampla, local permitido e espaço para retornar para a via de origem.",["Iniciar no final de curva.","Forçar retorno sem espaço.","Ir pela direita por “agilidade”."],"Condições rigorosas evitam conflitos frontais.",""],["1-3-299",1,3,1,35,"Qual é a forma correta de verificar o ajuste do cinto?","Sem torções, fecho íntegro e fita bem esticada.",["Torcido para “travar mais”.","Fecho semiaberto.","Folgado para conforto."],"Torções e folgas aumentam deslocamento do corpo.",""],["1-3-300",1,3,1,50,"Qual exemplo mostra avaliação de riscos correta ao aproximar-se de escola?","Reduzir velocidade, prever travessias e manter distância do veículo à frente.",["Manter velocidade e buzinar para apressar pedestres.","Desviar rápido por outra faixa sem olhar.","Acelerar para “passar antes” de pedestres."],"Ambientes com crianças têm risco elevado, prever, reduzir e manter distância é essencial.",""],["1-3-301",1,3,2,45,"Qual relação direta existe entre velocidade e frenagem?","Pequeno aumento na velocidade exige muito mais distância para parar.",["A distância de frenagem sempre é igual.","Aumentar a velocidade não impacta no tempo de parada.","Só o freio influencia."],"Crescimento exponencial da energia cinética.",""],["1-3-302",1,3,1,47,"Qual resposta é a mais segura ao perceber óleo na pista?","Reduzir a velocidade e manter a atenção na condução do veículo.",["Frear forte.","Passar acelerando brusco.","Olhar para a mancha e travar."],"Aderência limitada exige suavidade e preparo prévio.",""],["1-3-303",1,3,1,36,"Sem cinto, o airbag pode:","Causar ferimentos ao atingir a pessoa em alta velocidade.",["Proteger ainda melhor.","Economizar combustível.","Não abrir."],"Infla até ~300 km/h, o cinto deve conter o corpo.",""],["1-3-304",1,3,1,44,"Sobre a buzina, qual leitura está correta segundo o CTB?","Uso em toques breves como advertência, prolongado e fora de horário/local é infração leve.",["Uso livre em qualquer horário urbano.","Obrigatória para mudar de faixa.","Permitida por tempo ilimitado em hospitais."],"Art. 227 tipifica o uso adequado e as proibições.",""],["1-3-305",1,3,1,37,"Sobre crianças no carro, a conduta segura é:","Usar sempre dispositivo de retenção adequado.",["Colocar no colo com cinto do adulto.","Sentar solta no banco traseiro.","Ficar à frente sem cadeirinha."],"Proteção infantil é requisito de segurança.",""],["1-3-306",1,3,1,49,"Ultrapassagem segura exige:","Fazer pela esquerda, em local permitido, com espaço e visibilidade.",["Pela direita, sempre.","Em curva sem visão.","Com farol alto ligado atrás do outro veículo."],"Condições e local apropriado são indispensáveis para uma ultrapassagem segura.",""],["1-3-307",1,3,1,47,"Um condutor percebe chuva forte iniciando. Qual a primeira atitude segura?","Reduzir a velocidade e acionar o limpador de para-brisa.",["Aumentar a velocidade para fugir da chuva.","Acender farol alto.","Frear bruscamente e parar na pista."],"A percepção sensorial exige resposta motora adequada e preventiva.",""],["1-3-310",1,3,1,47,"Uso correto do farol de neblina:","Só em neblina, cerração, chuva forte, fumaça ou poeira.",["Em dias claros, para estética.","Sempre com farol alto.","No lugar do farol baixo à noite."],"O feixe baixo melhora visão próxima do solo em clima adverso.",""],["1-3-311",1,3,0,43,"Ao abrir a porta do carro parado na rua, a atitude segura é:","Conferir espelhos e olhar por cima do ombro para não atingir outros usuários da via.",["Abrir rápido e descer logo.","Abrir no fluxo para parar o trânsito.","Pedir para outro veículo desviar."],"Os condutores devem estar atentos aos arredores e à segurança da via.",""],["1-3-312",1,3,0,50,"Ao cruzar com cadeirante em rampa de acesso, o que não fazer?","Parar sobre a guia rebaixada ou bloquear a rampa.",["Aguardar e manter distância segura.","Oferecer passagem livre e sinalizar.","Evitar estacionar em vaga PCD sem credencial."],"Bloquear rampa tira autonomia e segurança.",""],["1-3-313",1,3,0,51,"Ao ultrapassar um ciclista na via urbana, o que é correto?","Reduzir a velocidade e manter 1,5 m de distância lateral.",["Passar coladinho para não atrapalhar.","Buzinar e apertar o ciclista no meio-fio.","Fechar a passagem para ele descer."],"O condutor deve respeitar os demais usuários da via e manter a segurança de todos.",""],["1-3-314",1,3,0,62,"Carlos dirige à noite com o farol queimado. Isso representa:","Um risco, pois diminui a visibilidade e aumenta o risco de sinistro.",["Economia de energia para o carro.","Cuidado, se o condutor andar devagar.","Consciência, só estando errado se a via for sem iluminação."],"A iluminação do veículo aumenta a visibilidade e reduz o risco de sinistros.",""],["1-3-315",1,3,0,42,"Carlos dirige com o braço para fora da janela do carro. Qual o erro?","Conduzir com parte do corpo para fora do veículo.",["Ficar devagar demais na pista.","Não ligar o farol.","Ultrapassar pela direita."],"Conduzir veículo com braço para fora configura infração de trânsito, conforme art. 252, inciso I, do CTB.",""],["1-3-316",1,3,0,15,"Carlos dirige seu carro e usa o celular para mandar mensagem. Ele perde a atenção e bate no carro da frente. Esse fato é:","Um sinistro de trânsito, que poderia ter sido evitado se ele não usasse o celular.",["Um acidente inevitável, que acontece com qualquer pessoa.","Um problema de sorte, sem culpa de ninguém.","Um defeito do carro."],"O uso do celular ao volante é comportamento de risco e causa evitável de sinistro.",""],["1-3-317",1,3,0,47,"Chove forte. O que é correto fazer?","Reduzir a velocidade e aumentar a distância dos demais veículos.",["Ligar farol alto e acelerar.","Frear forte em cima da curva.","Seguir colado no carro da frente."],"Adaptação às condições adversas evita sinistro.",""],["1-3-318",1,3,0,50,"Como o motorista pode prevenir atropelamentos de crianças?","Reduzindo a velocidade em áreas residenciais e perto de escolas.",["Tocando buzina para avisar.","Estacionando em fila dupla.","Deixando o motor ligado e observando."],"Crianças são imprevisíveis",""],["1-3-319",1,3,0,55,"Depois de um sinistro leve, os motoristas trocam informações de seguro e liberam a pista. O que essa atitude mostra?","Responsabilidade e respeito ao trânsito.",["Medo da polícia.","Desinteresse pelo veículo.","Falta de cuidado."],"Conduta correta que demostra responsibilidade e preocupação com o fluxo da via.",""],["1-3-320",1,3,0,46,"Dirigir “um pouco acima” da velocidade pode causar o quê?","Sinistros mais graves, com lesões mais sérias.",["Menos consumo de combustível.","Viagens sempre mais seguras.","Melhoria da visibilidade."],"Energia do impacto cresce rápido com a velocidade.",""],["1-3-321",1,3,0,47,"Em pista com óleo, o carro começa a deslizar. Qual ação correta?","Tirar o pé do acelerador, segurar firme e evitar frear/bruscar manobras.",["Pisar fundo no freio.","Vira todo o volante de uma vez.","Acelerar para “estabilizar”."],"Aderência baixa exige suavidade.",""],["1-3-322",1,3,0,50,"Em uma rua com escolas e idosos, qual a atitude correta?","Reduzir e ficar atento a travessias inesperadas.",["Manter a velocidade máxima.","Passar rápido para não “atrapalhar”.","Buzinar para avisar."],"É importante ter atenção as vias que transitam crianças e idosos.",""],["1-3-323",1,3,0,47,"Está garoando e a pista ficou escorregadia. O que o motorista deve fazer?","Reduzir a velocidade e aumentar a distância do carro da frente.",["Acelerar para sair logo da chuva.","Seguir colado para não “perder espaço”.","Frear só em cima da curva."],"Condição adversa exige adaptação da velocidade.",""],["1-3-324",1,3,0,42,"João dirige com o rádio alto e conversa animado com os amigos. Por causa do barulho, não ouve a buzina de outro carro. O que pode acontecer?","Um sinistro, pois o som alto atrapalha a atenção e a audição.",["Nada, se ele estiver com o cinto.","O rádio ajuda a relaxar e dirigir melhor.","Só é perigoso se for à noite."],"O condutor deve manter o foco na direção.",""],["1-3-325",1,3,0,48,"José dirige devagar na faixa da esquerda e causa fila atrás. Isso é perigoso porque:","Pode irritar outros motoristas e provocar manobras arriscadas.",["É sinal de que ele é prudente.","Ajuda a diminuir o trânsito.","Aumenta a segurança."],"O condutor deve conduzir o veículo na velocidade permitida na via.",""],["1-3-326",1,3,0,42,"Marcos dirige ouvindo música no fone de ouvido. Isso é perigoso porque:","Ele não escuta buzinas ou sirenes.",["O som melhora sua concentração.","Só causa problema em estrada.","Atrapalha apenas os passageiros."],"O condutor deve manter o foco ao trânsito.",""],["1-3-327",1,3,0,50,"Maria está aprendendo a dirigir. Ao ver um pedestre atravessar fora da faixa, ela decide frear para evitar o atropelamento. A ação dela foi correta?","Agiu corretamente, evitando um sinistro.",["Errou, porque o pedestre estava errado.","Deveria ter acelerado para não parar o trânsito.","Tinha o direito de seguir sem frear."],"O condutor deve estar atento aos arredores e observar as preferências da via.",""],["1-3-328",1,3,0,50,"Num cruzamento semaforizado, você percebe pedestres já iniciando a travessia no fim do sinal verde. Qual a conduta segura?","Aguardar a liberação total da faixa antes de partir.",["Acelerar no amarelo para sair.","Buzinar forte para abrir caminho.","Desviar pela faixa de ônibus."],"O condutor deve observar as preferências da via e deixar os pedestres terminarem a travessia.",""],["1-3-329",1,3,0,42,"O condutor do veículo à frente está aprendendo a dirigir e hesita para sair. Qual atitude?","Aguardar com calma e manter distância.",["Acelerar e passar bem perto.","Buzinar sem parar.","Xingá-lo pela janela."],"Educação e tolerância criam um ambiente seguro no trânsito.",""],["1-3-330",1,3,1,51,"O motorista abre a porta do carro sem olhar e derruba um ciclista.","Foi falta de atenção e de respeito com usuário vulnerável.",["O ciclista devia desviar.","Foi culpa do ciclista por andar muito perto.","É normal, acontece sempre."],"O condutor deve estar sempre atento aos arredores.",""],["1-3-331",1,3,2,42,"O que diz a ideia da Visão Zero?","Nenhuma morte no trânsito é aceitável.",["Alguns acidentes são inevitáveis.","O pedestre é sempre culpado.","Só punir resolve."],"Toda vida perdida é inaceitável.",""],["1-3-332",1,3,1,46,"O que é velocidade segura?","A velocidade ajustada às condições do momento (chuva, fluxo e visibilidade).",["A velocidade máxima da placa, sempre.","A velocidade dos carros mais rápidos.","A maior velocidade que o carro alcança."],"Pode ser igual ou menor que a máxima regulamentar, dependendo das condições da via.",""],["1-3-333",1,3,1,46,"O que mais define a gravidade de uma batida?","A velocidade do veículo no impacto.",["A cor do carro.","A marca do pneu.","O número de portas."],"A energia do impacto aumenta com a velocidade.",""],["1-3-334",1,3,0,50,"O que o condutor deve fazer se uma pessoa com deficiência precisar embarcar ou desembarcar?","Esperar com paciência, sem pressionar ou buzinar.",["Acelerar para sair logo.","Ficar reclamando.","Passar bem próximo."],"O condutor deve presar pela boa convivência entre todos os usuários da via.",""],["1-3-335",1,3,0,42,"O que significa dizer que o trânsito é um espaço coletivo?","Que todos compartilham as vias e têm deveres e direitos próprios.",["Que só os motoristas decidem as regras.","Que é cada um por si.","Que quem paga imposto manda."],"O trânsito é convivência social entre os usuários da via.",""],["1-3-336",1,3,0,29,"O que significa empatia no trânsito?","Colocar-se no lugar do outro e agir com respeito.",["Reclamar quando alguém erra.","Ser sempre o primeiro a passar.","Ignorar o pedestre."],"A empatia entender o ponto de vista de outra pessoa, entendendo seus sentimentos, pensamentos e perspectivas",""],["1-3-337",1,3,0,37,"Por que as crianças precisam de cadeirinhas diferentes conforme a idade?","Porque o corpo cresce e precisa de proteção adequada para cada fase.",["Porque é exigência do mercado.","Porque os fabricantes pedem.","Não precisa, pois todas são iguais."],"Cada idade exige um tipo de sistema de retenção do corpo.",""],["1-3-338",1,3,0,50,"Por que dirigir com empatia protege os vulneráveis?","Porque reduz conflitos e aumenta a segurança de todos.",["Porque evita multas leves.","Porque dá direito à preferência.","Porque deixa o trânsito mais rápido."],"Entender o outro ajuda a evitar sinistros.",""],["1-3-339",1,3,0,51,"Por que o ciclista é um usuário vulnerável?","Porque está exposto e se desequilibra com facilidade.",["Porque anda devagar.","Porque não conhece o CTB.","Porque atrapalha o trânsito."],"Qualquer desequilíbrio pode causar ferimentos graves.",""],["1-3-340",1,3,0,43,"Por que o motorista deve ver e ser visto ao se aproximar de travessias?","Para antecipar movimentos e evitar atropelamentos.",["Para mostrar “quem manda”.","Para economizar tempo.","Para disputar espaço com pedestres."],"Comunicação e previsibilidade salvam vidas.",""],["1-3-341",1,3,0,50,"Por que o motorista deve cuidar dos mais frágeis?","Porque essa é a base da convivência segura e humana no trânsito.",["Porque é obrigação apenas moral.","Porque ganha desconto na multa.","Porque evita atrasos."],"A prioridade é proteger a vida, não o veículo.",""],["1-3-342",1,3,0,26,"Por que o motorista não pode parar sobre calçadas?","Porque atrapalha o caminho dos usuários da calçada.",["Porque suja o pneu.","Porque só é proibido em rodovias.","Porque é falta de educação apenas."],"A calçada é própria para a circulação de determinadas pessoas.",""],["1-3-343",1,3,0,50,"Por que o motorista deve reduzir perto de escolas e praças?","Porque há pedestres e crianças atravessando.",["Porque a rua é estreita.","Porque é área sem fiscalização.","Porque pode estacionar melhor."],"Crianças e pedestres são os mais frágeis no trânsito.",""],["1-3-344",1,3,0,50,"Por que os pedestres são considerados vulneráveis?","Porque andam expostos, sem proteção.",["Porque andam sempre distraídos.","Porque gostam de correr risco.","Porque ocupam a rua indevidamente."],"O pedestre não tem carroceria para proteger o corpo.",""],["1-3-345",1,3,0,50,"Por que pedestres, ciclistas e motociclistas são “vulneráveis”?","Porque estão mais expostos e sofrem mais em caso de impacto.",["Porque “atrapalham” os carros.","Porque desrespeitam mais a lei.","Porque não usam a via."],"Exposição física = maior gravidade em sinistros.",""],["1-3-346",1,3,0,50,"Por que reduzir a velocidade em áreas cheias de gente?","Para evitar sinistros com mortes e ferimentos graves.",["Para economizar combustível.","Para “andar junto” com os outros.","Para não ser multado."],"Velocidade segura protege o corpo humano, que tem limites.",""],["1-3-347",1,3,0,50,"Por que reduzir a velocidade perto de escolas e hospitais?","Porque há pedestres e pessoas vulneráveis.",["Porque o radar pode multar.","Porque gasta menos combustível.","Porque o trânsito é lento."],"Reduzir velocidade salva vidas.",""],["1-3-348",1,3,0,42,"Qual conduta traduz educação no trânsito no dia a dia?","Respeitar as normas e agir com empatia e tolerância.",["Apenas decorar multas e valores.","Buscar vantagem em todo momento.","Ter conhecimento de onde ficam os semáforos com fiscalização de velocidade."],"O condutor deve respeitar as regras e os demais usuários da via para garantir a segurança de todos e qualidade de vida.",""],["1-3-349",1,3,0,42,"Qual deve ser a prioridade número um no trânsito?","A vida das pessoas.",["O tempo de viagem.","O valor do combustível.","O tamanho da via."],"A prioridade para todos envolvidos com o trânsito é a proteção da vida.",""],["1-3-350",1,3,0,50,"Qual é a atitude correta ao ver uma pessoa com muletas atravessando a rua?","Parar e permitir a travessia com calma.",["Acelerar para passar antes.","Buzinar para apressar.","Passar ao lado, bem perto."],"Pessoas com mobilidade reduzida precisam de tempo e espaço, devendo ser respeitado pelos condutores.",""],["1-3-351",1,3,0,42,"Qual é a meta principal do Pnatrans?","Reduzir pela metade as mortes no trânsito até 2030.",["Fazer novas estradas.","Aumentar o número de radares.","Criar mais multas."],"O Pnatrans, criado pela Lei nº 13.614, de 2018, tem como objetivo reduzir a quantidade de mortes no trânsito.",""],["1-3-352",1,3,0,53,"Um caminhoneiro dirige há muitas horas sem parar. Qual é o maior risco?","O cansaço causar sono e provocar um sinistro de trânsito.",["O caminhão gastar mais combustível.","A viagem demorar mais.","O pneu esquentar demais."],"Os condutores devem garantir que possuem condições de conduzir o veículo de forma plena e segura.",""],["1-3-353",1,3,0,51,"Um ciclista está à frente do veículo. O que o motorista deve fazer ao ultrapassar?","Manter 1,5 metro de distância lateral.",["Buzinar forte para avisar.","Passar colado para não atrapalhar o trânsito.","Acelerar rápido e seguir."],"A distância lateral de 1,5 m evita sinistros.",""],["1-3-354",1,3,0,50,"Um motorista vê uma criança soltar a bola e correr para a rua. O que ele deve fazer?","Reduzir a velocidade e preparar-se para parar o veículo.",["Buzinar e seguir em frente.","Continuar em alta velocidade para não atrapalhar.","Aumentar o som para chamar atenção."],"O condutor deve estar atento aos arredores e pronto para intercorrências.",""],["1-3-355",1,3,0,50,"Um motorista vê uma pessoa com deficiência atravessando. O que deve fazer?","Parar totalmente e esperar.",["Buzinar e acelerar.","Passar devagar ao lado.","Fazer sinal com o farol."],"O condutor deve observar as preferências da via.",""],["1-3-356",1,3,0,50,"Um pedestre começa a atravessar a faixa e o sinal abre para os carros. O que o motorista deve fazer?","Esperar o pedestre terminar de atravessar.",["Acelerar devagar para ele sair logo.","Buzinar para apressar o pedestre.","Passar bem perto dele."],"O pedestre que já está na faixa tem prioridade na via.",""],["1-3-357",1,3,0,50,"Um pedestre usa o celular enquanto atravessa a via. O que pode acontecer?","Ele pode se distrair e sofrer um sinistro.",["Nada, pois está na faixa.","O motorista é o único responsável.","Isso é sempre permitido."],"A distração aument
