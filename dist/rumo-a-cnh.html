erença entre placas azuis e verdes dentro da categoria de indicação?","Azuis informam serviços; verdes orientam trajetos",["Verdes alertam perigo; azuis impõem regras","Azuis indicam proibições; verdes são temporárias","Nenhuma"],"Cada cor possui finalidade própria.",""],["1-1-360",1,1,1,4,"Uma placa azul com símbolo de cruz vermelha indica:","Pronto Socorro",["Igreja","Radares","Curva perigosa"],"Serviços médicos são indicados em azul.","SAU-10"],["1-1-361",1,1,1,4,"Em uma rodovia, Carla vê placa marrom com um símbolo de livro aberto e seta. O que isso comunica?","Direção para biblioteca",["Área de risco","Redução obrigatória","Proibição de tráfego"],"Placas verdes podem orientar destinos de serviços.","THC-11"],["1-1-362",1,1,1,4,"Uma placa branca com texto curto como “USE O CINTO” indica:","Mensagem educativa",["Proibição","Risco imediato","Sentido obrigatório"],"Placas brancas reforçam comportamentos seguros.",""],["1-1-363",1,1,1,4,"Paula vê placa azul com símbolo de cadeira de rodas e uma seta. O que isso indica?","Direção de ponto acessível",["Proibição de parar","Risco de queda","Faixa exclusiva"],"Acessibilidade é indicada por símbolo universal.","DEF-01"],["1-1-364",1,1,2,4,"Uma placa verde exibindo três cidades com distâncias diferentes organiza:","A sequência de destinos ao longo da rota",["Ordens de parada obrigatória","Áreas escolares","Riscos múltiplos"],"Placas verdes funcionam como guias de navegação.",""],["1-1-365",1,1,2,4,"Uma placa de indicação pode combinar palavras e símbolos. Qual a vantagem disso?","Comunicação rápida e universal",["Tornar a via mais bonita","Preencher espaço","Diminuir velocidade"],"Símbolos aceleram o entendimento.",""],["1-1-366",1,1,2,4,"Em rodovia turística, placas marrons podem aparecer com frequência. Por quê?","Indicam atrativos próximos ou zonas de interesse",["Sinalizam perigo","Impõem regras","Indicam acessibilidade"],"Marrons guiam experiências de viagem.",""],["1-1-367",1,1,2,4,"Uma placa azul com vários símbolos alinhados (hospital, restaurante, posto) indica:","Conjunto de serviços disponíveis na área",["Proibição de carga","Proximidade de obras","Local de pedágio"],"Agrupamentos de serviços auxiliam planejamento.",""],["1-1-368",1,1,1,4,"“Ricardo está perdido e vê placa verde listando três cidades desconhecidas”. Qual melhor interpretação?","Ela mostra os caminhos possíveis, cabendo escolher o desejado",["Não deve seguir","É área de risco","Indica parada obrigatória"],"Placas verdes orientam rotas mesmo sem familiaridade.",""],["1-1-369",1,1,2,4,"“Durante trilha turística, Helena dirige e vê sequência de placas marrons com símbolos naturais”. O que isso representa?","Complexo turístico com vários atrativos",["Via bloqueada","Curva perigosa","Restrição de tráfego"],"Placas marrons organizam oferta turística regional.",""],["1-1-370",1,1,2,2,"Quando duas vias se cruzam e ambas possuem placa “PARE”, o condutor deve","Parar e ceder a passagem a quem chegou primeiro ao cruzamento.",["Avançar rapidamente.","Aguardar buzina do outro condutor.","Manter prioridade automática."],"Nessa situação, aplica-se a regra de cortesia e prudência: cede passagem quem chega depois.",""],["1-1-371",1,1,0,40,"Como deve ser usada a faixa de aceleração?","Acelerando gradualmente até atingir a velocidade da via principal.",["Parando para observar o trânsito.","Entrando direto na pista principal.","Reduzindo totalmente a velocidade."],"Serve para ajustar a velocidade antes de se unir ao fluxo.",""],["1-2-1",1,2,2,11,"Cassação da CNH ocorre, por exemplo, quando:","o condutor dirige com o direito de dirigir suspenso ou reincide em determinadas infrações previstas no Código de Trânsito Brasileiro.",["o condutor esquece de renovar a CNH dentro do prazo.","o condutor comete uma infração leve durante o período de suspensão.","o condutor acumula 20 pontos na CNH em um período de 12 meses."],"Conforme o art. 263, incisos I e II, do Código de Trânsito Brasileiro, a cassação da CNH ocorre quando o condutor dirige com o direito de dirigir suspenso ou reincide, no período de 12 meses, em determinadas infrações graves previstas na lei.",""],["1-2-2",1,2,2,13,"Qual a classificação de infração por dirigir sem possuir habilitação?","Gravíssima.",["Leve.","Média.","Só advertência."],"Tipificação e medidas.",""],["1-2-3",1,2,2,13,"Caso o comprador de um veículo não realize a transferência obrigatória, caberá ao vendedor (antigo proprietário) do veículo:","Comunicar a venda ao Detran, senão continua responsável por infrações e tributos até a transferência.",["Guardar o CRV e não falar nada.","Pagar o IPVA do novo dono.","Cancelar a placa."],"Comunicação evita responsabilidade posterior. Art. 134 do CTB",""],["1-2-4",1,2,2,25,"É permitido transportar uma criança no colo, mesmo em trajeto curto?","Não, isso configura uma infração de trânsito",["Não, porque ela se distrai facilmente.","Não, porque pode sujar o banco.","Não, porque o cinto fica frouxo."],"Art. 168 do CTB",""],["1-2-5",1,2,2,11,"Quando cabe advertência por escrito?","Infrações leves ou médias, punidas com multa e sem outra infração nos últimos 12 meses.",["Só gravíssima.","Em qualquer infração.","Apenas com sinistro."],"Conforme dispõe o art. 267 do CTB, a penalidade de advertência por escrito deve ser imposta para infração de natureza leve ou média, passível de multa, caso o condutor não tenha cometido nenhuma outra infração nos últimos 12 (doze) meses.",""],["1-2-6",1,2,0,31,"Maria possui permissão para dirigir e cometeu uma infração de natureza grave. O que ocorre com o processo de obtenção da Carteira Nacional de Habilitação (CNH)?","Perde o direito de se obter a CNH e precisará reiniciar o processo para obtenção da CNH novamente.",["Nada muda, ela conseguirá obter a CNH ao término de um ano.","Basta pagar uma taxa extra e segue.","Só precisa escrever uma carta ao Detran."],"De acordo com o artigo 148, § 3º, do Código de Trânsito Brasileiro, o condutor que possui Permissão para Dirigir perde o direito de obter a Carteira Nacional de Habilitação (CNH) definitiva caso cometa infração grave, gravíssima ou seja reincidente em infração média durante o período permissionário.",""],["1-2-7",1,2,2,21,"É correto parar ou estacionar na esquina a menos de 5 metros do cruzamento?","Não. Isso esconde o carro e aumenta o risco de batida.",["Sim, se for rapidinho.","Sim, se ligar o pisca-alerta.","Sim, se deixar alguém dentro."],"Conforme estabelece o art. 181, inciso I do CTB, estacionar o veículo nas esquinas e a menos de 5 (cinco) metros do bordo do alinhamento da via transversal é considerado infração média, sujeita a multa e remoção do veículo. A restrição de 5 metros visa garantir a segurança e a visibilidade dos motoristas nas manobras de conversão e entrada no cruzamento.",""],["1-2-8",1,2,0,11,"O que é infração de trânsito?","Inobservância a qualquer preceito do CTB.",["Qualquer ato que desagrada outro condutor.","Só bater o carro em sinistro.","Um aviso sem efeito legal."],"Infração é violação expressa em lei, tratada no sistema de fiscalização.",""],["1-2-9",1,2,2,26,"O que significa a parada de um veículo de acordo com o Código de Trânsito Brasileiro?","Imobilizar o veículo por pouco tempo só para embarcar ou desembarcar, em local permitido.",["Largar o carro por horas na calçada.","Deixar o carro com motor ligado em qualquer lugar.","Parar no meio do cruzamento para telefonar."],"Parada: imobilização do veículo com a finalidade e pelo tempo estritamente necessário para efetuar embarque ou desembarque de passageiros. Glossário do CTB",""],["1-2-10",1,2,1,21,"Parar o carro a menos de cinco metros da esquina é:","Infração de trânsito sujeita a multa.",["Permitido se for rápido.","Permitido à noite.","Aceitável em ruas pouco movimentadas."],"Reduz a visibilidade e aumenta o risco de colisão. Art. 181, inciso I do CTB",""],["1-2-11",1,2,1,21,"Parar o veículo em vaga de idoso sem credencial que comprove essa condição é:","Infração gravíssima.",["Permitido por poucos minutos.","Aceitável se for rápido.","Apenas advertência."],"A multa protege o direito de mobilidade e acessibilidade. Art, 181, inciso XX do CTB",""],["1-2-12",1,2,0,26,"Parar o veículo sobre faixa de pedestre para embarque é:","Proibido e perigoso, obriga pedestres a desviar para a via.",["Permitido se o motor estiver ligado.","Permitido se o passageiro for criança.","Permitido só por um minuto."],"Faixa é exclusiva para travessia segura. Art. 183 do CTB",""],["1-2-14",1,2,0,12,"Por que as infrações gravíssimas podem ter multa multiplicada?","Pelo alto potencial de dano à vida e à coletividade.",["Para arrecadar mais.","Porque são raras.","Para punir só quem é reincidente."],"Refletem a gravidade da infração.",""],["1-2-15",1,2,2,11,"Quais penalidades o CTB prevê?","Advertência por escrito, multa, suspensão, cassação e curso de reciclagem.",["Multa e apreensão do veículo.","Advertência e multa.","Prisão do condutor."],"Penalidades previstas no art. 256 do CTB",""],["1-2-16",1,2,0,51,"Qual é o comportamento mais seguro ao dirigir perto de ciclistas?","Reduzir a velocidade e manter uma distância mínima de 1,5 metro ao ultrapassar.",["Acelerar para ultrapassar rapidamente.","Buzinar para o ciclista sair.","Passar bem perto do ciclista para não prejudicar o fluxo de veículos."],"Essa distância está no art. 201 do CTB.",""],["1-2-17",1,2,2,11,"Quando a responsabilidade por uma infração de trânsito é do proprietário do veículo?","Quando a infração estiver ligada às condições do veículo ou à falta de licenciamento.",["Quando o condutor não respeita a sinalização de trânsito.","Quando o condutor estaciona em vaga comum.","Quando o condutor utiliza farol baixo à noite."],"Infrações ligadas à condição do veículo.",""],["1-2-18",1,2,0,11,"Quem é o responsável pela maioria das infrações durante a condução?","O condutor.",["O fabricante.","O pedestre.","O guincho."],"Regra geral, exceções no art. 257.",""],["1-2-19",1,2,1,11,"A medida administrativa de remoção do veículo (art. 271) ocorre quando:","A infração impede a circulação ou oferece risco, exigindo que o veículo seja recolhido pelo agente.",["Há pneu calibrado.","Carro está limpo.","Motorista é habilitado."],"Aplicável para ações que representam risco ou impedem o fluxo das vias.",""],["1-2-20",1,2,1,11,"A medida administrativa de retenção do veículo (art. 270) significa:","Fica parado até sanar a irregularidade no local, se possível.",["Vai direto ao pátio do órgão de trânsito.","Que será aplicada multa em dobro.","Perda do veículo."],"Retem-se o veículo pelo tempo suficiente para averiguar ou sanar uma situação.",""],["1-2-21",1,2,1,11,"A suspensão do direito de dirigir pode ocorrer por infração específica quando:","A própria infração prevê suspensão (ex.: álcool, corrida, ameaçar pedestres).",["Somar 10 pontos.","Houver apenas advertência.","Qualquer infração leve."],"Nas situações em que a infração, por expressa previsão legal, implicar a aplicação conjunta da penalidade de suspensão do direito de dirigir.",""],["1-2-22",1,2,2,13,"Conduzir veículo não registrado e licenciado é infração:","Gravíssima.",["Leve.","Não é considerada infração.","Grave."],"Exigência do licenciamento.",""],["1-2-23",1,2,1,13,"Dirigir com CNH vencida há mais de 30 dias é:","Infração gravíssima, com multa e retenção do veículo até ser apresentado condutor habilitado.",["Permitido por 1 ano.","Infração leve e o condutor recebe advertência verbal.","Infração leve sem multa."],"O condutor deve estar devidamente habilitado para dirigir veículos. Extrapolar o prazo e conduzir é uma infração, conforme art. 162, inciso V, do CTB.",""],["1-2-24",1,2,1,13,"Dirigir com documento cassado ou com suspensão é:","Infração gravíssima, com multa (três vezes), recolhimento do documento e retenção do veículo.",["Permitido se for perto de casa.","Permitido, desde que ligue o pisca-alerta.","Infração leve."],"Infração prevista no art. 162, inciso II, do CTB.",""],["1-2-25",1,2,2,13,"Dirigir veículo de categoria superior à sua habilitação é:","Infração gravíssima, com multa (duas vezes) e retenção do veículo.",["Permitido aos domingos.","Infração média.","Sem problema se tiver cuidado."],"Infração prevista no art. 162, inciso III, do CTB.",""],["1-2-26",1,2,1,17,"É correto parar ou estacionar sobre faixa de pedestres?","Não. Bloqueia a passagem e configura uma infração de trânsito.",["Sim, se for após as 22h.","Sim, se não houver fiscalização.","Sim, se ligar o pisca-alerta."],"O condutor deve observar as preferências da via e estacionar nos locais apropriados.",""],["1-2-27",1,2,2,21,"De acordo com o CTB, qual é a natureza da infração cometida ao estacionar o veículo bloqueando o acesso a hidrantes, garagens, tampas de poço de visita ou galerias pluviais?","Proibido, porque atrapalha serviços essenciais e causa risco.",["Permitido com pisca-alerta.","Permitido à noite e domingos.","Permitido se o carro ficar ligado."],"Conforme estabelece o Art. 181, inciso X do CTB, estacionar o veículo impedindo a movimentação de outro veículo ou o acesso a saídas de garagens e o Art. 181, inciso VI, que trata de estacionar em desacordo com as condições regulamentadas especificamente nas áreas de hidrantes de incêndio, ambos são classificados como infração média, sujeitos à multa e à medida administrativa de remoção do veículo. Bloquear tais acessos prejudica serviços públicos essenciais e o direito de acesso à propriedade.",""],["1-2-28",1,2,1,11,"De acordo com o CTB, o que são as Medidas Administrativas e qual é a sua finalidade?","Ações imediatas para reestabelecer a segurança que acompanham a autuação.",["Apenas multas.","Punições criminais.","Acordos entre particulares."],"Conforme estabelece o Art. 269 do CTB, as Medidas Administrativas (como retenção do veículo, remoção, ou recolhimento da CNH/CRLV) são ações de caráter complementar à penalidade (multa, suspensão, cassação) e têm como principal finalidade a pronta intervenção para coibir a infração, regularizar a situação e garantir a segurança no local.",""],["1-2-29",1,2,1,13,"Se o comprador do veículo não transferir a propriedade em 30 dias, qual é a infração?","infração média",["Advertência por escrito automática.","Não acontece nada.","leve"],"Deixar de registrar no prazo legal.",""],["1-2-30",1,2,1,21,"Vagas exclusivas para pessoa idosa ou com deficiência:","Devem ser respeitadas, só usando com a credencial válida.",["Podem ser usadas por qualquer um à noite.","Valem só em dias úteis.","Podem ser usadas por qualquer um por no máximo 5 minutos."],"Devem ser respitadas as regras de estacionamento.",""],["1-2-31",1,2,2,31,"Qual a consequência para o motorista com Permissão para dirigir que comete infração de trânsito gravíssima?","Cancelamento da permissão e reinício do processo de habilitação.",["Apenas pagar multa e seguir.","Suspensão de 30 dias.","Advertência por escrito."],"Art. 148, §§ 3º e 4º.",""],["1-2-32",1,2,0,15,"Usar o celular ao volante é:","Um risco porque distrai o condutor e reduz o tempo de reação.",["Uma ferramenta boa, pois aumenta a atenção na direção.","Uma ferramenta que ajuda a manter a calma no trânsito.","Permitido em ruas pouco movimentadas."],"Além de ser infração, a distração por celular é uma das principais causas de sinistros.",""],["1-2-33",1,2,1,19,"“Meu carro tem muitos sistemas, posso dispensar o cinto.” A leitura correta é:","Nenhum sistema substitui o cinto, ele é indispensável.",["Airbag já basta.","ABS faz o papel do cinto.","DRL evita todos os sinistros."],"Sistemas são complementares ao cinto, sendo este indispensável e obrigatório.",""],["1-2-34",1,2,1,35,"Cinto na gravidez:","Deve ser usado, reduz riscos à gestante e ao bebê.",["É proibido.","Só a faixa abdominal.","Apenas no banco dianteiro."],"Sem cinto, há risco de lesões para a gestante e para o bebê.",""],["1-2-35",1,2,0,23,"“Bebi uma taça de vinho, dá para dirigir?” Qual a resposta correta para esta pergunta?","Não. Qualquer quantidade de álcool aumenta o risco de sinistros e é infração.",["Sim, se for perto de casa.","Sim, se não tiver fiscalização.","Não, pois pode ser denunciado."],"A legislação brasileira adota a tolerância zero para álcool na direção.",""],["1-2-36",1,2,0,21,"Antônio estaciona em local proibido, em frente a uma esquina. Isso pode causar:","Dificuldade de visão para outros motoristas e risco de sinistro.",["Nenhum problema, se for rápido.","Apenas uma multa leve.","Maior segurança, por estar perto da esquina."],"O condutor deve estarcionar em locais apropriados para aumentar a segurança das vias.",""],["1-2-37",1,2,0,23,"Beber só uma latinha e dirigir é:","Perigoso, pois reduz reflexos e aumenta o risco de sinistro.",["Permitido se a rua estiver vazia.","Seguro se o motorista for experiente.","Correto se não houver fiscalização."],"O álcool altera a capacidade psicomotora.",""],["1-2-38",1,2,0,23,"Beber cerveja e dirigir só um pouco é:","Risco grave de sinistro, pois o álcool reduz a capacidade do condutor.",["Aceitável se for perto de casa.","Permitido em ruas vazias.","Certo se não houver fiscalização."],"O álcool altera a capacidade psicomotora.",""],["1-2-39",1,2,0,17,"Por que devemos respeitar a faixa de pedestre mesmo quando não há semáforo?","Porque o pedestre tem prioridade de passagem.",["Porque evita multa leve.","Porque o motorista perde tempo.","Porque melhora o trânsito."],"Priorizar o pedestre é garantir segurança no trânsito e respeito.",""],["1-2-40",1,2,0,15,"Por que não se deve usar o celular enquanto dirige?","Porque tira a atenção e aumenta o risco de sinistros.",["Porque pode não ter sinal para mandar mensagens.","Porque atrapalha a buzina.","Porque consome bateria do carro."],"Distração é causa frequente de atropelamentos.",""],["1-2-41",1,2,0,15,"Por que o uso do celular ao volante é perigoso?","Porque tira a atenção dos olhos, da mente e das mãos.",["Porque gasta bateria do celular.","Porque atrasa a entrega de mensagens.","Porque só incomoda os passageiros."],"Distração visual, cognitiva e manual aumenta o risco.",""],["1-2-42",1,2,0,15,"Por que olhar notificações no celular por “5 segundos” é perigoso?","Porque nesse tempo, a 70 km/h, o carro percorre quase um campo de futebol sem controle.",["Porque o celular pode desligar.","Porque só atrapalha em estrada.","Porque gasta internet."],"Distância percorrida sem atenção é enorme.",""],["1-2-43",1,2,0,21,"Por que respeitar a vaga reservada para pessoa com deficiência é importante?","Porque é um direito garantido por lei e mostra respeito ao outro.",["Porque deixa o estacionamento mais bonito.","Porque evita multas leves.","Porque só quem usa cadeira de rodas precisa."],"A acessibilidade é um direito legal e uma atitude de empatia.",""],["1-2-44",1,2,0,15,"Por que responder mensagem pelo celular dirigindo é perigoso?","O condutor fica distraído e retitra as mãos do volante, sendo perigoso para todos usuários da via.",["Só gasta bateria.","Só é ruim à noite.","Só atrapalha quem está atrás."],"A distração aumenta o risco de sinistros.",""],["1-2-45",1,2,0,23,"Qual a ideia da tolerância zero para álcool?","Qualquer quantidade de álcool influencia na coordenação do condutor.",["Que uma taça é liberada.","Que só vale para rodovia.","Que depende do humor do agente."],"O álcool compromete a coordenação do condutor e o tempo de resposta, aumentando a possibilidade de sinistros de trânsito.",""],["1-2-47",1,2,1,29,"Qual é a relação entre normas do CTB e preservação da vida?","As regras organizam a convivência no trânsito e reduzem riscos e conflitos.",["As regras existem só para multar.","As regras atrapalham o trânsito.","As regras servem apenas em rodovia."],"As normas estabelecem diretrizes para um trânsito seguro.",""],["1-2-48",1,2,0,15,"Rosa vai atravessar a rua falando ao celular e quase é atropelada. O que ela fez de errado?","Deixou de prestar atenção no trânsito.",["Atravessou na faixa de pedestres.","Esperou o semáforo abrir.","Usou o celular apenas para ouvir música."],"Todos os usuários da via devem prestar atenção aos arredores.",""],["1-2-49",1,2,0,27,"Trafegar em velocidade incompatível com a segurança perto de escola ou hospital configura o quê?","Configura crime de trânsito, conforme previstono art. 311 do CTB.",["Apenas multa leve.","Infração média.","Só orientação verbal."],"Trafegar em velocidade incompatível nesses locais é crime, conforme art. 311 do CTB.",""],["1-2-52",1,2,0,16,"Um motorista sai de casa atrasado e decide dirigir acima da velocidade permitida para a via. Essa atitude:","Aumenta o risco de sinistro e pode causar mortes.",["Ajuda a economizar tempo com segurança.","É correta se a rua estiver vazia.","Evita multas por atraso."],"As regras de velocidade da via devem ser respeitadas para garantir segurança para todos.",""],["1-2-53",1,2,0,22,"Um motorista ultrapassa um ciclista muito perto e causa um tombo. Isso mostra falta de:","Respeito às regras de trânsito e às vidas das pessoas.",["Atenção com o carro.","Conhecimento da via.","Paciência."],"A distância lateral de 1,5 m evita sinistros.",""],["1-2-54",1,2,0,23,"Paulo bebeu cerveja antes de dirigir e disse que “só umas latinhas não fazem mal”. O que essa atitude representa?","A atitude representa falta de percepção de risco e a desobediência à legislação, pois qualquer quantidade de álcool prejudica a capacidade psicomotora para dirigir.",["Um erro sem importância, se ele dirigir devagar.","Algo permitido se não houver blitz.","Uma tradição comum e sem problema."],"O álcool prejudica a coordenação motora e é causa principal de mortes no trânsito. Conforme estabelece o Art. 165 do CTB, dirigir sob a influência de álcool é infração gravíssima com penalidade de multa (dez vezes o valor) e suspensão do direito de dirigir. O CTB adota o princípio da Tolerância Zero (Lei Seca), no qual qualquer concentração de álcool por litro de sangue ou por litro de ar alveolar sujeita o condutor às penalidades administrativas e criminais. A crença de que \"pouco não faz mal\" demonstra um erro de avaliação e a falta de percepção do risco que o álcool causa na coordenação, atenção e tempo de reação.",""],["1-2-55",1,2,2,19,"Cenário: Pedro dirige com seu filho de 12 anos no banco de trás sem o cinto de segurança em um trajeto curto. Pergunta: De acordo com o CTB e a Direção Defensiva, qual é a penalidade legal e o principal risco de segurança dessa atitude?","A penalidade é infração grave, sujeita a multa e retenção do veículo. O principal risco é a projeção da criança em caso de colisão ou frenagem brusca.",["Nada, pois o cinto só é obrigatório para crianças menores de 10 anos.","O carro é apreendido na hora, e Pedro perde a CNH por um ano.","Apenas o agente aplica uma advertência verbal, pois o trajeto era curto."],"Conforme estabelece o Art. 167 do CTB, deixar de usar o cinto de segurança (obrigatório para todos os ocupantes, conforme Art. 65) é infração grave, sujeita a multa e retenção do veículo até a colocação do cinto. A crença de que \"trajeto curto não tem perigo\" é um erro de percepção de risco, pois a maioria dos acidentes ocorre perto de casa. Sem o cinto, em uma colisão ou frenagem brusca, a criança de 12 anos corre o risco de ser projetada contra o banco dianteiro ou para fora do veículo.",""],["1-2-56",1,2,1,15,"Por que “dar só uma espiadinha” no celular, durante a condução de veículo a 70 km/h, é perigoso?","Porque a 70 km/h, em 5 s o carro anda aproximadamente 97 m sem controle.",["Porque o celular pode esquentar.","Porque só atrapalha o passageiro.","Porque o motor perde força."],"Conforme estabelece o Art. 252, Parágrafo único do CTB, manusear telefone celular enquanto dirige é uma infração gravíssima. O risco é extremo porque a 70 km/h, o veículo percorre aproximadamente 58 metros em apenas 3 segundos de desatenção. Essa distância anula a margem de segurança e o tempo necessário para o condutor reagir (frear ou desviar) a qualquer imprevisto, levando a um risco máximo de colisão.",""],["1-2-57",1,2,1,21,"Por que não se deve estacionar diante de rampas de acesso?","Porque impede o uso por cadeirantes e carrinhos.",["Porque o piso é escorregadio.","Porque é pouco usado.","Porque ninguém reclama."],"Bloquear rampa é falta de respeito e infração.",""],["1-2-58",1,2,1,15,"Por que não se deve usar o celular enquanto dirige?","Porque tira a atenção e aumenta o risco de sinistros.",["Porque é feio.","Porque atrapalha a buzina.","Porque consome bateria do carro."],"Conforme estabelece o Art. 252, Parágrafo único do CTB, manusear telefone celular enquanto dirige é uma infração gravíssima. O risco é extremo porque a 70 km/h, o veículo percorre aproximadamente 58 metros em apenas 3 segundos de desatenção. Essa distância anula a margem de segurança e o tempo necessário para o condutor reagir (frear ou desviar) a qualquer imprevisto, levando a um risco máximo de colisão.",""],["1-2-59",1,2,1,15,"Por que o uso do celular aumenta tanto o risco de sinistro?","Porque desvia visão, pensamento e mãos do volante ao mesmo tempo.",["Porque só atrapalha à noite.","Porque aumenta a potência do motor.","Porque reduz o barulho do carro."],"Conforme estabelece o Art. 252, Parágrafo único do CTB, manusear telefone celular enquanto dirige é uma infração gravíssima. O risco é extremo porque a 70 km/h, o veículo percorre aproximadamente 58 metros em apenas 3 segundos de desatenção. Essa distância anula a margem de segurança e o tempo necessário para o condutor reagir (frear ou desviar) a qualquer imprevisto, levando a um risco máximo de colisão.",""],["1-2-60",1,2,1,23,"Qual condição caracteriza crime de trânsito em razão da condução de veículo sob influência de álcool?","O crime se caracteriza pela capacidade psicomotora alterada devido à influência de álcool, constatada por concentração igual ou superior a 0,3 miligrama de álcool por litro de ar alveolar (bafômetro) ou por sinais que indiquem essa alteração.",["Qualquer valor no aparelho.","Apenas se houver sinistro.","Só com laudo médico."],"Conforme estabelece o Art. 306, § 1º, inciso I do CTB, o crime de embriaguez ao volante é caracterizado pela concentração de álcool igual ou superior a 0,3 miligrama por litro de ar alveolar (0,34 mg/L é o valor a ser considerado após a margem de erro) ou por 0,6 decigrama de álcool por litro de sangue. O Art. 306, § 1º, inciso II, permite a comprovação do crime também por sinais que indiquem a alteração da capacidade psicomotora, como dificuldade de equilíbrio ou fala alterada, independentemente do teste do bafômetro. O crime é punido com detenção, multa e suspensão ou proibição de obter a CNH.",""],["1-2-61",1,2,1,23,"Qual consequência administrativa de dirigir sob influência de álcool?","Multa gravíssima (dez vezes) e suspensão do direito de dirigir por 12 meses.",["Apenas advertência por escrito.","Multa simples, sem suspensão.","Perda do veículo automaticamente."],"Penalidade do art. 165 do CTB.",""],["1-2-62",1,2,1,46,"Qual é a diferença entre “velocidade máxima” e “velocidade segura”?","A máxima é o limite legal, a segura é a adequada às condições do momento.",["As duas são iguais sempre.","A segura é sempre maior.","A máxima é só uma sugestão."],"Conforme dispõe o art. 61 do Código de Trânsito Brasileiro (CTB), a velocidade máxima é aquela estabelecida por meio de sinalização, ou, na ausência desta, pelos limites fixados pelo próprio Código. Já a velocidade segura é um conceito vinculado à Direção Defensiva, que orienta o condutor a ajustar sua velocidade às condições da via, do trânsito, do veículo e do clima, de forma a manter o controle do automóvel e prevenir acidentes.",""],["1-2-63",1,2,1,23,"Recusar o bafômetro gera quais efeitos?","Mesmas penalidades administrativas de dirigir sob a influência de álcool (multa x10 e suspensão por 12 meses).",["Nenhuma penalidade.","Apenas multa leve.","Só vale à noite."],"Conforme estabelece o Art. 165-A do CTB, a recusa do condutor em se submeter a qualquer dos procedimentos previstos (teste do bafômetro, exames clínicos) para a verificação de influência de álcool ou de substância psicoativa é considerada infração gravíssima. A penalidade aplicada é a mesma do Art. 165 (dirigir sob influência de álcool): multa (dez vezes o valor) e suspensão do direito de dirigir por 12 meses, além do recolhimento da CNH e retenção do veículo.",""],["1-2-64",1,2,1,15,"Um pedestre usa o celular enquanto atravessa a via. O que pode acontecer?","Ele pode se distrair e sofrer um sinistro.",["Nada, pois está na faixa.","O motorista é o único responsável.","Isso é sempre permitido."],"Conforme os princípios da Direção Defensiva, a distração causada pelo uso do celular (distração visual e cognitiva) anula a capacidade de previsão e a atenção difusa do pedestre. O Art. 69 do CTB exige que o pedestre tome as precauções de segurança ao atravessar. Ao usar o celular, o pedestre negligencia essa obrigação, falhando em ver e ouvir veículos, o que o expõe diretamente ao risco de ser atropelado, que é a forma mais letal de sinistro de trânsito.",""],["1-2-65",1,2,2,11,"Qual das punições a seguir é um exemplo de Penalidade?","Suspensão do direito de dirigir.",["Retenção do veículo.","Remoção do carro para o pátio.","Recolhimento do documento de habilitação."],"Suspensão e cassação são exemplos de Penalidade.",""],["1-2-66",1,2,2,11,"Qual das ações a seguir é um exemplo de Medida Administrativa?","Retenção do veículo.",["Multa.","Advertência por escrito.","Cassação da CNH."],"Retenção do veículo é uma ação imediata do agente, caracterizando Medida Administrativa.",""],["1-2-67",1,2,0,13,"Qual é o prazo, em dias, que o novo proprietário tem para providenciar o registro da transferência do veículo após a venda?","30 dias.",["10 dias.","60 dias.","90 dias."],"O novo proprietário tem até 30 dias para fazer o registro da transferência.",""],["1-2-68",1,2,0,13,"Qual o prazo, em dias, que o condutor tem para providenciar a renovação da CNH a partir do seu vencimento?","30 (trinta) dias.",["60 dias.","10 dias.","90 dias."],"O prazo para providenciar a renovação é de 30 dias após o vencimento.",""],["1-2-69",1,2,0,13,"Qual item é listado como um equipamento obrigatório para carros que deve ser checado antes de sair?","Estepe calibrado.",["Extintor de incêndio.","Kit de primeiros socorros.","GPS."],"Estepe calibrado, macaco e triângulo são equipamentos obrigatórios para carros.",""],["1-2-71",1,2,0,13,"Qual condição física e mental afeta reflexos, atenção e capacidade de decisão do condutor?","Estar cansado ou emocionalmente abalado.",["Estar com o carro limpo.","Estar com o som alto.","Estar com a janela aberta."],"O estado físico e mental (cansaço, álcool, emoções) afeta a direção.",""],["1-2-72",1,2,0,12,"A Pontuação na Carteira é uma consequência que acompanha uma infração de trânsito. O que ela soma ao condutor?","Pontos na CNH que ficam registrados no prontuário.",["O valor da multa a ser pago.","O número de crimes de trânsito.","O número de Medidas Administrativas."],"A pontuação é o registro dos pontos na CNH.",""],["1-2-73",1,2,0,11,"O que a Penalidade de Multa pode acompanhar, fazendo parte de um processo administrativo?","A pontuação na carteira.",["Um crime de trânsito.","Uma cassação definitiva.","Uma prisão."],"A pontuação é uma consequência diferente que pode ser aplicada junto com a penalidade de multa.",""],["1-2-74",1,2,0,13,"O que é essencial que esteja funcionando no veículo para que ele esteja em condições de segurança?","Faróis, freios, retrovisores, buzina, pneus em bom estado e setas.",["Ar-condicionado, GPS e airbag.","Câmera de ré e sensor de estacionamento.","Sistema de som e rastreador."],"O essencial para dirigir inclui faróis, freios, pneus e retrovisores.",""],["1-2-75",1,2,1,12,"O que acontece quando o limite de pontos na CNH é atingido dentro do período de 12 meses?","O condutor pode responder a processo de suspensão do direito de dirigir.",["O condutor deve pagar apenas uma multa extra.","Os pontos são zerados imediatamente.","O valor da multa é multiplicado."],"Atingir o limite de pontos inicia o processo de suspensão da CNH.",""],["1-2-76",1,2,1,11,"Em que momento ocorre a Medida Administrativa imposta pelo agente de trânsito?","Na hora, no local da infração.",["Depois que a infração é confirmada pelo órgão.","30 dias após a notificação.","12 meses após o registro dos pontos."],"A Medida Administrativa é uma ação imediata do agente de trânsito.",""],["1-2-77",1,2,1,27,"Qual das punições a seguir é listada como exemplo de Crime de Trânsito?","Dirigir embriagado.",["Reter o veículo.","Multa por estacionamento.","Advertência por escrito."],"Dirigir embriagado e causar morte são exemplos de Crime de Trânsito.",""],["1-2-78",1,2,1,13,"Qual a condição obrigatória para que o veículo esteja regularizado para circular, além de estar em boas condições de segurança?","Ter o licenciamento do ano em dia e o IPVA pago.",["Ter o seguro total.","Ter airbag instalado.","Estar com o tanque cheio."],"O veículo precisa estar com licenciamento e IPVA em dia.",""],["1-2-79",1,2,1,11,"O que a Penalidade pode incluir, além da multa e da advertência por escrito?","Suspensão temporária do direito de dirigir ou até cassação definitiva da CNH.",["Remoção do veículo para o pátio.","Recolhimento de documentos.","Retenção do veículo."],"Suspensão e cassação são as penalidades mais graves.",""],["1-2-80",1,2,1,16,"Qual é o principal risco atribuido ao excesso de velocidade?","Reduz o tempo de reação do condutor a um imprevisto.",["Apenas aumenta o consumo de combustível.","Apenas aumenta a distância para parar o veículo.","Apenas aumenta o estresse."],"A redução do tempo de reação é citada como o principal fator de risco da velocidade.",""],["1-2-81",1,2,1,11,"O que a Penalidade de Advertência por Escrito representa?","Uma punição que vem depois da infração ser confirmada.",["Uma ação imediata do agente.","A consequência de um crime.","A pontuação na carteira."],"Advertência por escrito é um exemplo de Penalidade.",""],["1-2-82",1,2,1,12,"Qual é o principal objetivo da classificação das infrações em quatro níveis de gravidade?","Refletir o tamanho do risco que aquele comportamento oferece para a segurança de todos.",["Apenas facilitar o cálculo da multa.","Apenas aumentar a pontuação.","Apenas diferenciar o agente de trânsito."],"A classificação reflete o risco para a segurança.",""],["1-2-83",1,2,1,27,"Quando o comportamento de um condutor ultrapassa a esfera administrativa e vira crime, qual a consequência que se aplica?","Processo criminal, possibilidade de prisão e antecedentes na ficha criminal.",["Apenas multa e pontos na carteira.","Apenas cassação da CNH.","Apenas medida administrativa de retenção."],"O crime de trânsito envolve a esfera criminal, com processo e possibilidade de prisão.",""],["1-2-84",1,2,1,23,"Dirigir sob influência de álcool ou drogas é listado como qual tipo de consequência, além de ser infração gravíssima?","Crime de trânsito previsto no Código de Trânsito Brasileiro.",["Apenas Medida Administrativa.","Apenas Penalidade de Cassação.","Apenas Pontuação de 7 pontos."],"Dirigir sob influência de álcool ou drogas é também um crime de trânsito.",""],["1-2-85",1,2,2,12,"O que a classificação das infrações em quatro níveis de gravidade reflete?","Estudos, estatísticas de sinistros e análise de comportamentos que mais causam mortes e ferimentos.",["Apenas a opinião do agente de trânsito.","Apenas o número de acidentes da semana.","Apenas o humor do condutor."],"A classificação é baseada em dados e riscos reais.",""],["1-2-86",1,2,2,11,"O que o sistema de punições no Brasil visa ativar quando o condutor comete uma ação errada no trânsito?","Um sistema de proteção social que envolve punições administrativas, financeiras e até criminais.",["Apenas a notificação da multa.","Apenas a advertência por escrito.","Apenas o processo de suspensão da CNH."],"O erro ativa um sistema de proteção social abrangente.",""],["1-2-87",1,2,0,13,"Antes de sair para uma viagem, o motorista verifica o estepe, o macaco e o triângulo. Qual o status desses itens para carros?","Equipamento obrigatório para carros.",["Acessório opcional.","Item de luxo.","Equipamento de segurança apenas para motos."],"Estepe, macaco e triângulo são equipamentos obrigatórios para carros.",""],["1-2-89",1,2,0,29,"O instrutor perguntou aos alunos qual era a primeira atitude que definia um condutor verdadeiramente responsável. Qual foi a resposta correta?","Seguir as regras de trânsito.",["Apenas evitar multas.","Decorar todas as leis.","Dirigir em alta velocidade."],"Seguir as regras é a primeira atitude do condutor responsável.",""],["1-2-90",1,2,0,13,"Fatores de Risco: Uma psicóloga do trânsito explicou que o motorista não dirige sozinho, pois seu estado mental afeta as decisões. Qual condição física e mental afeta reflexos, atenção e capacidade de decisão do condutor?","Estar cansado, sob efeito de álcool ou emocionalmente abalado.",["Estar com o carro limpo.","Estar com o som alto.","Estar com a janela aberta."],"O estado físico e mental (cansaço, álcool, emoções) é o principal fator de risco que afeta a direção.",""],["1-2-91",1,2,0,15,"João estava ao volante e usando o celular para checar uma mensagem. Qual é o tipo de infração que ele cometeu?","Usar celular ao volante.",["Transitar 20% acima da velocidade.","Estacionar afastado da guia.","Não usar cinto de segurança."],"Usar celular ao volante é uma das infrações gravíssimas mais perigosas.",""],["1-2-92",1,2,0,12,"Cada vez que o motorista comete uma infração, ele recebe a pontuação correspondente. O que a Pontuação na Carteira representa?","Pontos na CNH que ficam registrados no prontuário.",["O valor da multa a ser pago.","O número de crimes de trânsito.","O número de Medidas Administrativas."],"A pontuação é o registro dos pontos na CNH.",""],["1-2-93",1,2,0,12,"Após o processo administrativo, o condutor recebeu a multa para pagamento. O que a Penalidade de Multa pode acompanhar no processo administrativo?","A pontuação na carteira.",["Um crime de trânsito.","Uma cassação definitiva.","Uma prisão."],"A pontuação é uma consequência diferente que pode ser aplicada junto com a penalidade de multa.",""],["1-2-94",1,2,0,13,"Um mecânico revisou o carro e garantiu que tudo estava funcionando para uma viagem segura. Qual o conjunto de itens que deve estar funcionando para o veículo estar em condições de segurança?","Faróis, freios, retrovisores, buzina, pneus em bom estado e setas.",["Ar-condicionado, GPS e airbag.","Câmera de ré e sensor de estacionamento.","Sistema de som e rastreador."],"Os itens essenciais de segurança incluem faróis, freios, pneus e retrovisores.",""],["1-2-95",1,2,1,12,"Um motorista atingiu 40 pontos no período de 12 meses, sem nenhuma Gravíssima. O que acontece com ele após o limite de pontos ser atingido?","O condutor pode responder a processo de suspensão do direito de dirigir.",["O condutor deve pagar apenas uma multa extra.","Os pontos são zerados imediatamente.","O valor da multa é multiplicado."],"Atingir o limite de pontos inicia o processo de suspensão do direito de dirigir.",""],["1-2-96",1,2,1,11,"Um agente de trânsito parou um motorista com o licenciamento vencido e recolheu o documento. Em que momento ocorre a Medida Administrativa imposta pelo agente?","Na hora, no local da infração.",["Depois que a infração é confirmada pelo órgão.","30 dias após a notificação.","12 meses após o registro dos pontos."],"A Medida Administrativa é uma ação imediata do agente no local.",""],["1-2-97",1,2,1,23,"Um condutor foi pego dirigindo sob efeito de bebida alcoólica. Qual das punições a seguir é listada como exemplo de Crime de Trânsito?","Dirigir embriagado.",["Reter o veículo.","Multa por estacionamento.","Advertência por escrito."],"Dirigir embriagado é classificado como Crime de Trânsito.",""],["1-2-98",1,2,1,13,"Para circular legalmente, um veículo precisa estar com a manutenção em dia. Qual a condição legal obrigatória para que o veículo esteja regularizado, além de estar em boas condições de segurança?","Ter o licenciamento do ano em dia e o IPVA pago.",["Ter o seguro total.","Ter airbag instalado.","Estar com o tanque cheio."],"O veículo precisa estar com licenciamento e IPVA em dia.",""],["1-2-99",1,2,1,11,"Após o processo, a punição foi confirmada. O que a Penalidade pode incluir, além da multa e da advertência por escrito?","Suspensão temporária do direito de dirigir ou até cassação definitiva da CNH.",["Remoção do veículo para o pátio.","Recolhimento de documentos.","Retenção do veículo."],"Suspensão e cassação são as penalidades mais graves no Código de Trânsito.",""],["1-2-100",1,2,1,16,"Risco da Velocidade: Um instrutor explicou que o excesso de velocidade não aumenta apenas a distância de parada. Qual é o principal risco atribuído ao excesso de velocidade?","Reduz o tempo de reação do condutor a um imprevisto.",["Apenas aumenta o consumo de combustível.","Apenas aumenta a distância para parar o veículo.","Apenas aumenta o estresse."],"A redução do tempo de reação é o principal fator de risco da velocidade, segundo o material.",""],["1-2-101",1,2,0,13,"Por que o trânsito começa antes mesmo de ligar o carro?","Porque a checagem prévia evita riscos e imprevistos",["Porque o carro pode não pegar","Porque ajuda a economizar combustível","Porque deixa a viagem mais rápida"],"A checagem prévia garante segurança antes de sair.",""],["1-2-102",1,2,0,13,"O que verificar os pneus diariamente ensina ao condutor?","Que pequenos cuidados evitam grandes problemas",["Que pneus duram menos","Que a revisão é opcional","Que multas nunca acontecem"],"Verificações simples evitam transtornos na viagem.",""],["1-2-103",1,2,0,29,"O que pequenas distrações mostram no trânsito?","Que segundos de descuido podem gerar grandes perigos",["Que todos se distraem e tudo bem","Que o celular ajuda a dirigir","Que só motoristas novos se distraem"],"Dois segundos equivalem a muitos metros sem atenção.",""],["1-2-104",1,2,0,51,"O que torna as bicicletas veículos que merecem atenção especial?","A vulnerabilidade e necessidade de espaço s ,"Porque ocupa espaço","Porque é difícil de medir"],"decisões individuais afetam todos ao redor. Parar embarque/desembarque, cria obstáculos e amplia riscos desnecessários. longe da guia dificulta",""],["1-2-124",1,2,0,15,"Por que manusear o celular ao volante é tão arriscado?","Porque desvia o olhar por segundos e cria grande risco",["Porque reduz bateria","Porque atrapalha notificações","Porque o carro vibra"],"Segundos de desatenção são suficientes para causar um sinistro, pois o trânsito muda rapidamente e exige atenção constante. Tirar os olhos da via interrompe essa atenção e multiplica o risco.",""],["1-2-125",1,2,0,16,"Por que realizar freada brusca pode ser perigoso?","Porque indica desatenção e risco de colisão",["Porque desgasta freios","Porque acorda passageiros","Porque não é comum"],"Atitudes impulsivas ou tardias mostram falta de atenção ao ambiente. Frear bruscamente revela que o condutor não antecipou a situação, aumentando o risco de batidas traseiras e perda de controle.",""],["1-2-126",1,2,0,29,"O que significa ser um motorista consciente?","Colocar a vida das pessoas acima da pressa",["Esperar nunca ser multado","Ser o mais rápido","Usar atalhos"],"Escolhas no trânsito têm impacto direto sobre outras pessoas. O motorista consciente age priorizando vidas, não a velocidade ou conveniência.",""],["1-2-127",1,2,0,28,"Por que é importante aprender com a multa recebida?","Porque ajuda a não repetir o erro",["Porque aumenta a pontuação na CNH","Porque evita dirigir","Porque elimina futuros problemas automaticamente"],"erros no trânsito são oportunidades de reflexão. Entender por que a infração ocorreu permite corrigir o comportamento e evitar riscos futuros.",""],["1-2-128",1,2,0,28,"Por que ler atentamente uma notificação de multa?","Para confirmar se os dados estão corretos",["Para descobrir quem fez a denúncia","Para reduzir o valor automaticamente","Para evitar usar o carro"],"O processo administrativo depende da conferência cuidadosa de informaçõe orque protege quem divide a via",["Porque deixa o trânsito mais rápido","Porque evita multas","Porque dá vantagem ao motorista"],"Empatia é citada como elemento de convivência.",""],["1-2-156",1,2,1,29,"O que significa entender o motivo das regras?","Compreender por que uma norma protege vidas",["Decorar o CTB","Questionar toda regra","Evitar ser fiscalizado"],"O documento reforça que regras existem por segurança.",""],["1-2-157",1,2,1,15,"Por que manusear o celular é uma das infrações mais perigosas?","Porque retira totalmente a atenção do condutor",["Porque gasta bateria","Porque causa transtornos leves","Porque faz o carro tremer"],"O documento explica o risco dos 33 metros sem atenção.",""],["1-2-158",1,2,1,28,"Por que não indicar o real condutor é prejudicial?","Porque compromete a veracidade do processo",["Porque dificulta estacionar","Porque atrasa o pagamento","Porque muda a placa do carro"],"O anexo explica a possibilidade de indicar o motorista.",""],["1-2-159",1,2,1,29,"Por que a pressa aumenta erros?","Porque leva a decisões impulsivas e perigosas",["Porque reduz multas","Porque melhora reflexos","Porque gera mais atenção"],"O texto usa exemplos como o sinal amarelo e o pneu murcho.",""],["1-2-160",1,2,2,27,"O que caracteriza um crime de trânsito?","A imprudência que coloca vidas em risco real",["Multas acima de certo valor","A opinião do agente","O tipo do veículo envolvido"],"O anexo diferencia infrações de crimes pelo risco gerado.",""],["1-2-161",1,2,2,27,"Quando uma infração se torna crime?","Quando a conduta coloca gravemente em risco outras pessoas",["Quando envolve motocicletas","Quando ocorre à noite","Quando causa multa alta"],"O documento traz exemplos e explica essa diferença.",""],["1-2-162",1,2,0,28,"No caminho para o trabalho, Ana ignora a notificação de multa que recebeu e pensa “vejo isso depois”. Isso é perigoso por quê?","Porque existe prazo para cada etapa do processo",["Porque a multa some sozinha","Porque a multa se resolve no banco","Porque não precisa ser lida"],"Nem ler nem agir a tempo faz a pessoa perder direitos.",""],["1-2-163",1,2,0,28,"Leo recebe uma multa e decide pagar logo no início porque leu que isso é vantajoso. Qual é o benefício da ação?","Até 40% de desconto",["Parcelamento automático","Perdão total da multa","Aumento de prazo"],"O texto destaca o benefício do desconto antecipado.",""],["1-2-164",1,2,0,28,"Paulo percebe que não era ele quem dirigia no momento da multa. O que ele pode fazer?","Indicar o real condutor",["Cancelar a multa","Transferir a placa do carro","Ignorar a notificação"],"A indicação do condutor é direito previsto.",""],["1-2-165",1,2,0,28,"Camila está prestes a pedir revisão da multa, mas quase perde o prazo. Por que isso é um problema?","Perder prazo faz perder o direito de defesa",["Perder prazo aumenta pontuação","Perder prazo gera outra multa","Perder prazo cancela o recurso"],"Os prazos são essenciais para garantir defesa.",""],["1-2-166",1,2,0,26,"Laura está conduzindo o carro e decide parar afastada do meio-fio. Por que isso é proibido?","Porque atrapalha o fluxo e gera risco",["Porque deixa o carro torto","Porque desgasta o pneu","Porque economiza tempo"],"Parar afastado da guia prejudica a circulação.",""],["1-2-167",1,2,0,26,"Um motorista decide parar sobre a faixa enquanto o sinal está trocando. Isso é errado porque?","Compromete a segurança do pedestre",["Não deixa o carro bonito","Atrapalha a placa","Aumenta consumo"],"Parar sobre a faixa coloca pedestres em risco.",""],["1-2-168",1,2,1,26,"André vê alguém parado no meio da rua “por um instante”. Paradas rápidas podem ser perigosas porque:","Interrompem fluxo e criam risco",["Deixam o carro vulnerável","Provocam multas mais caras","Pioram a economia do carro"],"As paradas inadequadas prejudicam o trânsito.",""],["1-2-169",1,2,1,21,"Carla tenta justificar que “foi rapidinho” estacionar em local proibido. Atitudes assim são perigosas porque:","Colocam terceiros em risco",["Reduzem conforto do motorista","Atrapalham o trânsito apenas moralmente","Não são vistas por ninguém"],"O perigo está no risco para os outros.",""],["1-2-170",1,2,1,13,"Um motorista resolve não verificar o carro antes de sair. O capítulo mostra que falhas assim podem causar:","Sinistros evitáveis e prejuízos",["Conforto extra","Multas automáticas","Consumo menor de combustível"],"Negligências geram riscos reais.",""],["1-2-171",1,2,2,27,"Um instrutor quer explicar a diferença entre infração e crime segundo o material. Como descrever essa diferença?","Crimes têm maior risco e geram processo criminal",["Infrações são sempre leves","Crimes são apenas multas maiores","Infrações envolvem violência física"],"A distinção é risco e consequência jurídica.",""],["1-3-1",1,3,1,49,"Ao ultrapassar ônibus, qual a conduta segura:","Ultrapassar com espaço e tempo suficientes e só voltar ao ver o ônibus inteiro no retrovisor.",["Voltar logo após utlrapassar a parte dianteira do ônibus.","Voltar antes de terminar a ultrapassagem.","Passar colado para acabar rápido."],"Pontos cegos grandes exigem distância e visibilidade.",""],["1-3-4",1,3,2,51,"Em avenida com ciclofaixa contínua, o carro vai entrar à direita em uma rua. Não há semáforo. Quem tem preferência no conflito?","O ciclista que segue na ciclofaixa, salvo sinal que o obrigue a parar.",["O carro, por ser maior.","Quem buzinar primeiro.","Quem estiver mais rápido."],"Ao mudar de direção, deve-se ceder preferência a ciclistas/pedestres, nos termos do art. 214 do CTB",""],["1-3-6",1,3,2,39,"Em cruzamento sem sinalização, quem tem a preferência?","O veículo que vem pela direita.",["O veículo maior.","O mais rápido.","O que chegar primeiro."],"É a chamada “regra da direita”, prevista no art. 29, inciso III, alínea \"c\" do CTB.",""],["1-3-7",1,3,2,40,"Em retorno na via, o que é obrigatório?","Escolher local sinalizado, sinalizar a manobra, avaliar visibilidade e dar preferência a pedestres e ciclistas.",["Fazer onde der, bem rápido.","Parar no canteiro central e virar.","Usar o acostamento para cortar todo mundo."],"Retorno exige planejamento e respeito ao projeto da via, conforme art. 39 do CTB.",""],["1-3-8",1,3,2,52,"Em via com faixa exclusiva de ônibus à direita e área escolar à frente, sua conversão será à direita adiante. Conduta correta:","Entrar na faixa exclusiva apenas no trecho e horário permitidos para fazer a conversão com segurança.",["Usar toda a faixa exclusiva para ganhar tempo.","Parar na faixa exclusiva para embarque.","Cortar pela calçada para virar."],"Conversões podem permitir cruzamento pontual da faixa exclusiva conforme a sinalização.",""],["1-3-9",1,3,2,49,"Locais onde a ultrapassagem é proibida?","Curvas, aclives sem visibilidade, passagens de nível, pontes/viadutos e faixas de pedestres, salvo sinal que autorize.",["Só em rodovia.","Apenas à noite.","Em dias de chuva somente."],"Pontos críticos com baixa visibilidade e alto risco.",""],["1-3-10",1,3,2,50,"O que determina o CTB sobre proteção aos mais frágeis?","Veículos maiores devem cuidar dos menores, motorizados protegem não motorizados.",["Cada um por si.","Pedestres devem sempre sair da frente.","Carros têm prioridade em qualquer situação."],"Hierarquia de proteção no trânsito, conforme art. 29, 2º.",""],["1-3-11",1,3,2,51,"O que é compartilhamento da via?","Uso conjunto e seguro por pedestres, ciclistas e veículos.",["Quando carros e motos dividem acostamento.","Quando o pedestre anda na pista.","Quando se alterna o sentido da via."],"Todos os usuários devem conviver de forma segura e respeitosa.",""],["1-3-12",1,3,2,32,"Pedro passou no exame teórico, pegou a Licença de aprendizagem e quer treinar num carro próprio com o pai, sem instrutor. O que é correto?","Não pode. Treino em via pública exige instrutor autorizado.",["Pode desde que seja domingo.","Pode se o pai assinar uma autorização.","Pode se o bairro estiver vazio."],"A formação de condutor de veículo automotor será realizada por instrutor autorizado, conforme art. 155 do CTB.",""],["1-3-13",1,3,2,33,"Qual a função da via coletora?","Leva o trânsito das ruas menores para as avenidas e vice-versa, máxima 40 km/h.",["É igual à via rápida.","Só serve para bicicletas.","É usada apenas por caminhões."],"Função de distribuir fluxo.",""],["1-3-14",1,3,2,47,"Qual atitude evita aquaplanagem na chuva forte?","Reduzir velocidade, não frear bruscamente e manter pneus em bom estado.",["Acelerar para “furar” a água.","Frear de uma vez no molhado.","Ligar farol alto e acelerar."],"Menos velocidade e pneus bons aumentam aderência.",""],["1-3-15",1,3,2,13,"Quando houver a transferência de propriedade do veículo, é dever do comprador:","Transferir o veículo em até 30 dias da assinatura do documento de compra e venda (art. 123, §1º).",["Transferir em até 90 dias quando quiser.","Só avisar o banco.","Não precisa transferir."],"Conforme disposto no Art. 123, § 1º do CTB, o dever do comprador, no caso de transferência de propriedade, é adotar as providências necessárias à expedição do novo Certificado de Registro do Veículo em um prazo máximo de 30 (trinta) dias. O descumprimento desse prazo sujeita o infrator à penalidade prevista no Art. 233 (infração média, multa e remoção do veículo).",""],["1-3-16",1,3,2,49,"Ultrapassar em curvas é permitido?","Não, pois há risco de colisão frontal.",["Sim, desde que o motorista saiba dirigir bem.","Sim, se o carro for potente.","Apenas à noite."],"Locais sem visibilidade, como curvas, proíbem ultrapassagem.",""],["1-3-17",1,3,2,47,"Você começou a derrapar numa curva. O que NÃO fazer?","Frear bruscamente ou virar o volante de uma vez.",["Soltar o acelerador suavemente e segurar firme o volante.","Manter calma e corrigir com cuidado.","Evitar movimentos bruscos."],"Ações bruscas agravam a perda de controle.",""],["1-3-18",1,3,0,33,"O que significa o termo via?","É todo o espaço de circulação: pista, calçada, acostamento, canteiro, onde circulam veículos, pessoas e até animais.",["É somente a pista de asfalto.","É só a parte do pedestre.","É só a rua da sua casa."],"VIA - superfície por onde transitam veículos, pessoas e animais, compreendendo a pista, a calçada, o acostamento, ilha e canteiro central.",""],["1-3-19",1,3,0,32,"A CNH é um documento de que tipo?","Documento pessoal e intransferível, em versão física e digital, vale como identidade.",["Documento que pode ser emprestado para amigo usar.","Documento que só vale no bairro da pessoa.","Documento que serve apenas para comprar combustível."],"A CNH tem fé pública e é pessoal.",""],["1-3-20",1,3,1,32,"A CNH precisa ser renovada conforme a idade do condutor. Para pessoa com menos de 50 anos, qual o prazo?","A cada 10 anos.",["A cada 5 anos.","A cada 3 anos.","Não renova nunca mais."],"Conforme dispõe o Art. 147, § 2º, inciso I do CTB, o prazo de validade do exame de aptidão física e mental para a renovação da CNH é de 10 (dez) anos para os condutores com idade inferior a 50 (cinquenta) anos.",""],["1-3-21",1,3,0,39,"A preferência em cruzamentos sem sinalização é de:","Quem vem pela direita.",["Quem vem pela esquerda.","O veículo maior.","O que buzinar primeiro."],"A chamada “regra da direita” evita indecisões e colisões. Art. 29, inciso III, alínea c",""],["1-3-23",1,3,0,34,"O acostamento serve para quê?","Para emergência (pneu furado, pane) e, em vias rurais, também para pedestres e ciclistas quando não há calçada.",["Para andar mais rápido e ultrapassar pela direita.","Para estacionar o dia todo.","Para vender comida."],"Não é faixa de circulação normal, conforme anexo do CTB.",""],["1-3-24",1,3,0,39,"Antes de entrar na rotatória, o condutor deve:","Observar o fluxo interno e só entrar quando houver espaço seguro.",["Forçar a entrada para não ficar esperando.","Parar dentro da rotatória.","Acelerar e buzinar."],"A regra de segurança é esperar o momento certo, sem pressa.",""],["1-3-25",1,3,0,39,"Quais as ações devem ser realizadas por um condutor antes de entrar na rotatória?","Reduzir a velocidade, ligar a seta e olhar o fluxo para entrar com segurança.",["Acelerar para “pegar embalo”.","Desligar as luzes para não chamar atenção.","Parar o carro dentro da faixa de pedestres."],"Aproximação segura evita colisões.",""],["1-3-27",1,3,1,51,"Ao avistar ciclovia ou ciclofaixa, o condutor deve:","Reduzir a velocidade e respeitar a passagem de ciclistas.",["Acelerar para ultrapassar rapidamente a ciclovia ou ciclofaixa.","Ignorar os ciclistas","Buzinar para que os ciclistas saiam da via."],"A ciclovia é espaço exclusivo dos ciclistas. O condutor deve respeitar o espaço dos ciclistas e reduzir a velocidade, garantindo a segurança de todos.",""],["1-3-28",1,3,0,39,"Ao chegar perto de uma rotatória, qual regra principal seguir?","Dar preferência a quem já está dentro da rotatória, entrando só quando houver espaço seguro.",["Buzinar forte e entrar rápido para não perder a vez.","Entrar primeiro e depois ligar a seta.","Parar no meio da entrada para decidir."],"A regra é dar prioridade aos veículos que já estão na rotatória. Isso evita colisões e garante que o tráfego dentro da rotatória flua de forma segura e organizada.",""],["1-3-30",1,3,0,18,"Qual ação um condutor deve fazer ao mudar de faixa?","Sinalizar com a seta (ou gesto) e conferir se é seguro.",["Jogar o carro de uma vez.","Buzinar forte.","Ligar farol alto."],"O condutor deve sinalizar e verificar os retrovisores para garantir que a mudança de faixa seja segura e evitar acidentes.",""],["1-3-31",1,3,1,51,"Ao passar por um ciclista, o condutor deve:","Manter pelo menos 1,5 m de distância lateral e reduzir a velocidade.",["Passar colado para “caber”.","Buzinar forte e seguir sem espaço.","Jogar o veículo para cima para “educar”."],"Distância salva vidas. Art. 201 do CTB",""],["1-3-32",1,3,1,38,"Ao realizar uma conversão à esquerda em via de mão dupla, o condutor deve:","Aproximar-se do centro da via e ceder passagem a pedestres e veículos contrários.",["Ir direto e virar sem sinalizar.","Aumentar a velocidade.","Parar sobre a faixa de pedestres."],"A manobra deve ser feita com antecedência e cautela.",""],["1-3-33",1,3,1,39,"Ao sair da rotatória, o condutor deve:","Manter atenção a pedestres e ciclistas próximos à saída.",["Acelerar para não perder tempo.","Usar o celular para se orientar.","Ignorar os pedestres."],"Pedestres e ciclistas têm prioridade nas faixas junto às saídas.",""],["1-3-34",1,3,0,39,"Ao sair de um estacionamento para a via pública, quem tem a preferência?","Quem já circula na via.",["O veículo que está saindo.","O maior carro.","Quem liga o pisca-alerta."],"Preferência de quem está na via.",""],["1-3-35",1,3,0,39,"Ao se aproximar de uma rotatória, o motorista deve:","Reduzir a velocidade e aguardar a vez de entrar.",["Entrar rapidamente.","Buzinar para avisar.","Passar pelo meio da ilha."],"A regra é dar prioridade aos veículos que já estão na rotatória. Isso evita colisões e garante que o tráfego dentro da rotatória flua de forma segura e organizada.",""],["1-3-36",1,3,0,10,"Ao ver agente de trânsito orientando fluxo na saída da escola, o condutor deve:","Cumprir as ordens do agente, mesmo que a placa diga diferente.",["Obedecer só ao semáforo.","Ignorar o agente e seguir a fila.","Buzinar para passar primeiro."],"A ordem do agente prevalece para segurança.",""],["1-3-38",1,3,0,33,"O passeio é destinado a quem?","Para pedestres. Motorista só passa por ela para entrar em garagem, com cuidado e dando preferência ao pedestre.",["Para motos pararem em fila.","Para carros desviarem do trânsito.","Para fazer retorno rápido."],"O passeio é a parte da calçada ou da pista de rolamento, neste último caso, separada por pintura ou elemento físico separador, livre de interferências, destinada à circulação exclusiva de pedestres e, excepcionalmente, de ciclistas. Glossário do CTB",""],["1-3-39",1,3,0,52,"Os caminhões de coleta de lixo sinalizados trabalhando na via:","Podem parar na via, mesmo que atrapalhem o trânsito, desde que estejam sinalizados e em operação",["Devem sair para você passar.","Podem circular em alta velocidade para terminar a coleta mais rápido.","Devem sempre estacionar na calçada para não atrapalhar os veículos"],"Veículos de serviço essenciais, como caminhões de lixo, podem parar na via durante o trabalho, desde que devidamente sinalizados, garantindo segurança e funcionamento do serviço.",""],["1-3-40",1,3,1,39,"Dentro da rotatória, qual é o comportamento correto?","Manter velocidade moderada, ficar na faixa escolhida e não parar, salvo emergência.",["Mudar de faixa toda hora para sair mais rápido.","Parar para conversar com outro motorista.","Acelerar forte para assustar motociclistas."],"Conforme estabelece o art. 29, inciso III, alínea \"b\" do CTB, quando veículos se aproximam de um local não sinalizado (como uma rotatória sem sinalização de \"Dê a Preferência\"), a preferência de passagem é de quem estiver circulando por ela.",""],["1-3-41",1,3,1,39,"Duas vias sem sinalização se cruzam e nenhuma é rodovia. O que vale?","Regra da direita: ceder ao que vem pela direita.",["Buzinar e passar.","Quem estiver na esquerda tem preferência.","Quem é maior tem prioridade."],"Conforme estabelece o art. 29, inciso III, alínea \"c\" do CTB, quando veículos, transitando por fluxos que se cruzem, se aproximarem de local não sinalizado e nenhuma das vias for rodovia ou rotatória, terá preferência de passagem aquele que vier pela direita do condutor.",""],["1-3-42",1,3,1,49,"Durante uma ultrapassagem, o condutor deve:","Fazer a manobra pela esquerda, respeitando a sinalização e distância segura.",["Passar o veículo pela direita, se houver espaço.","Acelerar perto de curvas.","Ignorar os limites de velocidade."],"Conforme estabelece o art. 29, inciso IX do CTB, a ultrapassagem de outro veículo em movimento deverá ser feita pela esquerda, obedecida a sinalização regulamentar e respeitadas as normas de segurança. Além disso, o art. 30, inciso II, reforça que, ao ultrapassar, o condutor deve retornar à faixa de trânsito de origem, assim que a manobra for concluída com segurança.",""],["1-3-43",1,3,2,33,"É permitido circular sobre a calçada?","Apenas para entrar ou sair de imóvel ou estacionamento.",["Sempre que não houver trânsito.","Para desviar de buracos.","Para fazer retorno."],"Conforme estabelece o Art. 193 do CTB, transitar sobre calçadas ou passeios é infração gravíssima. A exceção ocorre na manobra de acesso a imóveis (garagens), pois o art. 29, inciso V do CTB permite o deslocamento lateral necessário para entrar ou sair, não caracterizando o \"transitar\" (uso longitudinal).",""],["1-3-44",1,3,0,39,"É permitido parar dentro de uma rotatória?","Não, salvo em caso de emergência.",["Sim, se estiver em dúvida sobre a saída.","Sim, se houver espaço.","Sempre que quiser."],"Conforme estabelece o Art. 182, inciso VII do CTB, parar o veículo na área de cruzamento de vias (incluindo rotatórias) é uma infração média, sujeita a multa. A rotatória é uma área de interseção de fluxo de trânsito contínuo, e a parada no local compromete a segurança e a fluidez do tráfego.",""],["1-3-45",1,3,1,50,"Em área com muitos pedestres e ciclistas, qual atitude básica do motorista?","Reduzir a velocidade, manter distância e dar preferência ao mais vulnerável.",["Buzinar para todos saírem.","Passar bem perto para caber.","Acelerar para sair logo."],"Proteção à vida em primeiro lugar.",""],["1-3-46",1,3,1,50,"Em área escolar com crianças saindo do colégio, o motorista deve:","Reduzir a velocidade e estar pronto para parar.",["Buzinar para abrir caminho e passar rápido.","Seguir no fluxo sem mudanças porque a rua é pública.","Parar na faixa de pedestres para embarque de aluno."],"Conforme estabelece o art. 220, inciso XIV do CTB, deixar de reduzir a velocidade do veículo de forma compatível com a segurança do trânsito nas proximidades de escolas ou onde haja intensa movimentação de pedestres é considerado infração gravíssima. Essa exigência se justifica porque a presença de crianças (pedestres vulneráveis e muitas vezes imprevisíveis) requer o máximo de cautela e uma velocidade que permita a parada imediata para evitar acidentes.",""],["1-3-47",1,3,1,50,"Em áreas de grande circulação de pessoas, o motorista deve:","Reduzir a velocidade e manter distância segura.",["Aumentar a velocidade para sair logo.","Ultrapassar com buzina.","Ligar o pisca-alerta."],"Conforme estabelece o art. 220, inciso XIV do CTB, deixar de reduzir a velocidade do veículo de forma compatível com a segurança do trânsito nas proximidades de escolas ou onde haja intensa movimentação de pedestres é considerado infração gravíssima. Essa exigência se justifica porque a presença de crianças (pedestres vulneráveis e muitas vezes imprevisíveis) requer o máximo de cautela e uma velocidade que permita a parada imediata para evitar acidentes.",""],["1-3-49",1,3,2,39,"Em um cruzamento com linha férrea (trilhos) sem cancela, com o Veículo Leve sobre Trilhos (VLT) se aproximando e pedestres aguardando, qual é a decisão correta e obrigatória do motorista?","Parar antes dos trilhos e só cruzar depois da passagem completa do VLT.",["Atravessar rápido antes dele.","Parar sobre os trilhos para “garantir lugar”.","Entrar na contramão para passar primeiro."],"Conforme estabelece o art. 29, inciso XII do CTB, os veículos que se deslocam sobre trilhos (como trens ou VLTs) têm preferência de passagem absoluta sobre todos os demais.",""],["1-3-52",1,3,0,39,"Em uma rotatória, quem tem a preferência?","Quem já está circulando dentro dela.",["Quem está entrando.","O veículo maior.","O mais rápido."],"A prioridade é de quem já está na rotatória.",""],["1-3-54",1,3,0,48,"Em via comum, por qual lado da pista o veículo deve trafegar?","Pelo lado direito da via, salvo sinalização dizendo o contrário.",["Pelo meio da pista, para ver melhor.","Pelo lado esquerdo, pois é mais rápido.","De qualquer jeito, se for devagar."],"Regra geral de circulação pelo lado direito.",""],["1-3-55",1,3,1,48,"Em vias de várias faixas, veículos grandes e lentos devem:","Circular nas faixas da direita.",["Circular à esquerda.","Ficar alternando de faixa.","Seguir pelo acostamento."],"Veículos grandes e lentos devem usar a faixa da direita para não atrapalhar o fluxo dos mais rápidos e garantir segurança no trânsito.",""],["1-3-56",1,3,0,21,"O que significa estacionar um veículo?","Deixar o veículo parado por tempo maior do que o de embarque e desembarque, com ou sem condutor.",["Só encostar por 10 segundos em cima da faixa.","Parar na esquina para ir ao mercado rapidinho.","Ligar o pisca-alerta e poder qualquer coisa."],"Estacionar significa imobilizar o veículo por tempo indeterminado, sem interromper momentaneamente o trânsito, diferente de apenas parar para embarque ou desembarque.",""],["1-3-57",1,3,1,26,"Fila dupla em frente à escola para embarque rápido é:","Irregular e perigosa, atrapalha o trânsito e aumenta risco para pedestres.",["Permitida se o pisca-alerta estiver ligado.","Permitida em horários de pico.","Permitida se o motorista não descer do carro."],"A infração ocorre quando um veículo para ao lado de outro já estacionado na via, prejudicando o trânsito, a segurança e o fluxo de outros veículos, incluindo veículos de emergência. Art. 181, inciso XI",""],["1-3-60",1,3,1,52,"Na saída de alunos, um ônibus escolar parou no ponto. Nesse cenário, o que um condutor deve fazer?","Reduzir a velocidade, manter distância, observar crianças e só avançar com segurança.",["Ultrapassar rápido pela direita.","Colar na traseira para “empurrar” o fluxo.","Buzinar para que as crianças saiam logo."],"Passageiros podem atravessar à frente do ônibus, prudência máxima.",""],["1-3-61",1,3,1,48,"Um condutor dirige em uma rodovia, na faixa da esquerda, durante a noite com a pista molhada. Surge carro atrás querendo ultrapassar. O que ele deve fazer?","Ir para a faixa da direita quando seguro, sem acelerar, e manter distância maiorem caso de chuva.",["Acelerar para “segurar a esquerda”.","Frear de propósito.","Ir para o acostamento e parar."],"O condutor deve manter-se na faixa da esquerda apenas quando necessário, e, ao perceber que há outro veículo atrás querendo ultrapassar, deve se deslocar para a faixa da direita, respeitando as normas de circulação e garantindo a segurança, especialmente em condições adversas, como pista molhada.",""],["1-3-65",1,3,1,52,"O que deve fazer o condutor ao ver um ônibus parado para embarque ou desembarque de passageiros?","Reduzir a velocidade e ficar atento a pedestres.",["Passar rapidamente para não atrasar o trânsito.","Buzinar para alertar os passageiros.","Passar bem próximo do ônibus."],"Quando um ônibus está parado para embarque ou desembarque de passageiros, o condutor deve ter atenção redobrada, reduzindo a velocidade e, se necessário, parando, para garantir a segurança dos pedestres e dos passageiros que estão no processo de embarque ou desembarque.",""],["1-3-66",1,3,1,32,"O que é Licença de Aprendizagem?","Licença que autoriza o candidato a começar as aulas práticas nas ruas, com instrutor.",["Carteira definitiva que substitui a CNH.","Documento para comprar veículo com desconto.","Aplicativo para pagar multa."],"A licença de aprendizagem é um documento que permite ao candidato dirigir sob a supervisão de um instrutor credenciado durante o processo de aprendizagem para obtenção da CNH",""],["1-3-67",1,3,0,45,"O que é manter distância segura?","Deixar espaço suficiente na lateral e frontal entre o seu veículo e os demais, bem como em relação ao bordo da pista.",["Andar muito próximo ao veículo da frente.","Reduzir a distância apenas em congestionamentos.","Ignorar o espaço lateral."],"Conforme estabelece o Art. 29, inciso II do CTB, o condutor deverá guardar distância de segurança lateral e frontal entre o seu e os demais veículos, levando em conta, no momento, a velocidade e as condições do local, da circulação, do veículo e as condições climáticas. A técnica mais comum para garantir essa margem é a regra dos dois segundos, que assegura o tempo necessário para reação e frenagem sob condições normais, o que é fundamental para a Direção Defensiva.",""],["1-3-68",1,3,0,20,"O que fazer ao avistar veículo de emergência com sirene e luz ligada?","Dar passagem imediata e manter distância.",["Acelerar para não atrapalhar.","Parar no meio da pista.","Continuar normalmente."],"É obrigação dar prioridade aos veículos em serviço de urgência. Conforme estabelece o Art. 29, inciso VII do CTB, quando os dispositivos de alarme sonoro e iluminação intermitente estiverem acionados, os condutores dos demais veículos deverão deixar livre a passagem pela faixa da esquerda, deslocando-se para a direita da via e parando se for preciso. Além disso, o Art. 189 estabelece que não ceder passagem a veículos de emergência com prioridade é infração gravíssima.",""],["1-3-69",1,3,0,39,"O que o condutor deve fazer antes de acessar uma garagem pela calçada?","Reduzir a velocidade, sinalizar e garantir que não há pedestres.",["Acelerar para entrar rápido.","Buzinar para avisar.","Parar sobre a calçada."],"Os condutores devem sinalizar antes de conversões, bem como observar as preferências do trânsito.",""],["1-3-70",1,3,0,48,"O que o condutor deve fazer ao dirigir em via com várias faixas no mesmo sentido?","Circular pela faixa da direita se for mais lento e deixar a esquerda para ultrapassagens.",["Circular sempre pela faixa da esquerda.","Alternar de faixa a todo momento para avançar mais rápido.","Seguir pelo meio da via, ignorando as faixas."],"A faixa da direita é destinada aos veículos mais lentos, a da esquerda, às ultrapassagens.",""],["1-3-71",1,3,0,39,"O que o condutor deve fazer ao sair de um imóvel para acessar a via pública?","Ceder passagem aos veículos que estão na via e para os pedestres que já circulam.",["Acelerar para entrar antes.","Ultrapassar pela calçada.","Forçar a entrada."],"Ao acessar uma via, o condutor deve observar as regras de preferência e realizar as devidas sinalizações.",""],["1-3-72",1,3,0,50,"O que o condutor deve fazer ao sair de uma vaga próxima à escola, com muitos pedestres por perto?","Sinalizar antes, sair devagar e garantir que não há pedestres atrás ou na lateral.",["Sair rápido para não travar o fluxo.","Buzinar antes de arrancar.","Ir de ré até o cruzamento."],"A sinalização e a saída lenta reduzem o risco de atropelamento.",""],["1-3-73",1,3,0,10,"O que o condutor deve fazer ao ver um agente de trânsito controlando o fluxo em frente à escola?","Obedecer ao agente, mesmo que o semáforo indique o contrário.",["Ignorar o agente e seguir o semáforo.","Buzinar para pedir passagem.","Fazer retorno e evitar o local."],"A autoridade do agente prevalece temporariamente sobre a sinalização.",""],["1-3-74",1,3,0,41,"O que significa conduta segura no trânsito?","Agir com atenção, cortesia e respeito às normas.",["Fazer manobras rápidas para ganhar tempo.","Seguir apenas o fluxo dos outros.","Dirigir com pressa sempre que possível."],"A segurança depende do comportamento de todos no trânsito.",""],["1-3-75",1,3,0,52,"O ônibus sinalizou que vai sair do ponto, e você está na faixa ao lado. Qual deve ser a sua conduta?","Reduzir, permitir a saída com segurança e retomar o fluxo.",["Acelerar para impedir a saída.","Fechar a frente do ônibus.","Buzinar para ele esperar."],"Prerrogativa operacional favorece a fluidez do sistema.",""],["1-3-78",1,3,0,32,"No Brasil, o que a pessoa precisa possuir para poder dirigir carro ou motocicleta?","Precisa ter documento de habilitação válido: CNH ou Permissão para dirigir.",["Precisa só saber dirigir de ouvido, sem documento.","Precisa da nota fiscal do veículo no porta-luvas.","Precisa de uma autorização escrita do vizinho."],"Habilitação é de porte obrigatório.",""],["1-3-79",1,3,1,48,"Para que serve a faixa da esquerda em uma via de múltiplas faixas de rolamento?","Para ultrapassar e para quem circula mais rápido, respeitando a lei e a sinalização.",["Para estacionar rápido.","Para pedestres andarem.","Para bicicletas apenas."],"Uso correto das faixas.",""],["1-3-80",1,3,1,39,"João está conduzindo um carro em uma rotatória. O que ele deve fazer para sair na avenida desejada?","Ligar a seta com antecedência e deslocar-se para a faixa da saída com cuidado.",["Cortar todas as faixas de uma vez.","Parar dentro da rotatória e pensar.","Sair sem seta, pois todos vão entender."],"Ao se aproximar de uma rotatória e desejar sair nela, o motorista deve sinalizar a sua intenção com a seta. Isso é fundamental para garantir a segurança, permitindo que os outros motoristas e pedestres saibam para qual direção o veículo vai seguir, evitando colisões e promovendo o fluxo ordenado do trânsito.",""],["1-3-82",1,3,0,32,"Uma pessoa com deficiência pode dirigir?","Sim, se forem habilitadas e o veículo tiver as adaptações necessárias.",["Não, elas não podem dirigir veículos.","Não, a legislação não permite.","Sim, mas somente em estradas vazias."],"Acessibilidade garantida.",""],["1-3-83",1,3,2,33,"Por que é importante saber em qual tipo de via você está?","Porque isso define a velocidade máxima, a forma de circular, a atenção a pedestres/ciclistas e as regras de segurança.",["Só para escolher música.","Só para pagar pedágio.","Só para decorar nomes de ruas."],"É fundamental saber em qual tipo de via você está, pois isso define as regras de trânsito que devem ser seguidas, como os limites de velocidade, a necessidade de observar sinais específicos (como os de parada obrigatória ou faixas exclusivas), além de outras regulamentações. Cada tipo de via tem regras próprias para garantir a segurança no trânsito e o fluxo adequado de veículos.",""],["1-3-84",1,3,0,21,"Por que é perigoso estacionar muito próximo à esquina?","Porque dificulta a visão de quem sai da via transversal.",["Porque atrapalha apenas pedestres.","Porque é mais difícil sair da vaga.","Porque gasta mais combustível."],"A falta de visibilidade aumenta o risco de colisões.",""],["1-3-86",1,3,0,33,"Qual a função da via arterial?","Conecta regiões, possui semáforos e cruzamentos, tem velocidade máxima de 60 km/h",["Nenhum cruzamento e acesso proibido.","Aquela utilizada apenas por pedestres.","É a via de terra sem sinalização."],"Função definida no anexo do CTB.",""],["1-3-87",1,3,1,31,"Qual a validade da Permissão Para Dirigir ?","1 ano, depois será expedida a CNH ou ACC, se o condutor preencher os requisitos.",["6 meses, desde que o condutor não tenha cometida uma infração leve.","5 anos para qualquer pessoa.","Só até passar na prova de direção."],"Art. 148, § 2º do CTB.",""],["1-3-88",1,3,0,50,"Qual comportamento é esperado perto de escolas nos horários de entrada e saída dos alunos?","Dirigir devagar, sem ultrapassar, e prestar atenção na travessia dos alunos.",["Buzinar para abrir caminho.","Parar em fila dupla pelo tempo necessário.","Estacionar sobre a faixa de pedestres."],"O condutor deve observar as regras específicas para locais determinados.",""],["1-3-89",1,3,0,50,"Qual deve ser a atitude do condutor ao ver crianças perto de uma faixa de pedestres?","Reduzir imediatamente e preparar-se para parar.",["Seguir normalmente porque elas ainda não estão na faixa.","Buzinar para acelerar a travessia.","Acelerar antes que atravessem."],"O condutor deve estar sempre atento aos arredores e garantir a segurnaça da via.",""],["1-3-90",1,3,0,38,"Qual atitude deve ser tomada pelo condutor que vai virar à direita?","Permanecer próximo à borda direita da pista.",["Ficar no centro da via.","Ficar na faixa da esquerda.","Ficar em qualquer faixa."],"O condutor deve se aproximar do lado direito com antecedência.",""],["1-3-91",1,3,0,49,"Qual é a atitude correta ao ser ultrapassado?","Manter a velocidade ou reduzir, sem acelerar.",["Aumentar a velocidade para impedir a ultrapassagem.","Fechar a passagem.","Mudar de faixa repentinamente."],"A cortesia e o respeito à segurança exigem manter ou reduzir a velocidade.",""],["1-3-93",1,3,2,26,"Qual é a diferença entre parada e estacionamento?","A parada é rápida para embarque ou desembarque, o estacionamento é por tempo maior.",["A parada é quando se apaga o motor.","O estacionamento é feito só em garagens.","Não há diferença."],"A parada é momentânea, o estacionamento é mais demorado. Glossário do CTB",""],["1-3-94",1,3,1,47,"Quando há chuva forte, o condutor deve:","Aumentar a distância do veículo que trafega à sua frente e reduzir a velocidade.",["Manter a velocidade normal.","Ultrapassar rápido para não ficar atrás.","Parar no meio da via."],"A distância e o controle do veículo são fundamentais em condições adversas.",""],["1-3-97",1,3,0,18,"Quando o condutor deve usar a seta?","Sempre que for mudar de faixa, de direção ou entrar/sair de uma via.",["Apenas em avenidas.","Só quando houver pedestres.","Apenas durante o dia."],"A seta é um instrumento essencial de comunicação.",""],["1-3-98",1,3,2,31,"Quando termina a validade da Permissão para Dirigir, o que acontece?","Se tudo estiver correto, é emitida a CNH ou a ACC, conforme o caso",["O condutor deve repetir todo o processo de habilitação.","A permissão perde a validade e o condutor fica impedido de dirigir por um ano.","A Permissão vira documento de identidade do carro."],"Essa regra está prevista no art. 148 do CTB e tem como objetivo avaliar o comportamento do novo condutor, garantindo que apenas quem demonstrou responsabilidade no trânsito receba a CNH definitiva.",""],["1-3-99",1,3,1,52,"Quando um ônibus está parado para embarque ou desembarque, o que o condutor deve fazer ao passar ao lado?","Reduzir a velocidade, ficar atento e parar, se necessário, para proteger pedestres.",["Acelerar para sair logo.","Buzinar para o pedestre correr.","Passar colado ao ônibus."],"Prevenção de atropelamentos.",""],["1-3-100",1,3,0,17,"Quando um pedestre inicia a travessia na faixa de pedestres, o condutor deve:","Parar o veículo e aguardar o pedestre concluir a travessia.",["Acelerar para passar antes.","Buzinar e seguir.","Ignorar se estiver com pressa."],"Os pedestres que estiverem atravessando
