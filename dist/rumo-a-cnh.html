a o risco de atropelamento.",""],["1-3-358",1,3,0,49,"Uma motorista tenta ultrapassar em uma curva sem visibilidade. Essa ação é:","Extremamente perigosa e proibida por lei.",["Aceitável se ela estiver com pressa.","Permitida em pista dupla.","Correta se não vier carro no sentido contrário."],"Além de ser uma conduta perigosa, é vedada pelo CTB, conforme art. 32.",""],["1-3-359",1,3,0,17,"Você chega a uma faixa de pedestres e uma senhora começa a atravessar. O que fazer?","Parar e esperar ela terminar a travessia.",["Buzinar para ela se apressar.","Desviar pela direita.","Passar devagar só um pouquinho."],"O condutor deve respeitar a prioridade do pedestre em travessia.",""],["1-3-360",1,3,0,49,"Você começa uma ultrapassagem a um ciclista e um carro surge em sentido contrário. A atitude correta é:","Desistir da ultrapassagem, reduzir a velocidade e retomar, mantendo a distância segura com 1,5 m do ciclista.",["Completar a ultrapassagem mesmo sendo perigoso.","Buzinar e seguir entre o carro e o ciclista.","Forçar o ciclista a ir para o acostamento."],"Os condutores devem garantir a segurança dos mais vulneráveis.",""],["1-3-361",1,3,0,50,"Você está numa rua estreita e um pedestre atravessa fora da faixa. O que fazer?","Reduzir e parar, garantindo a segurança dele.",["Acelerar para mostrar que ele está errado.","Buzinar e seguir.","Passar bem perto para assustar."],"O condutor deve respeitar as preferências da via.",""],["1-3-362",1,3,0,52,"Você vê um caminhão manobrando numa esquina. O que fazer?","Dar espaço, manter distância e aguardar a manobra.",["Fechar a frente do veículo para passar primeiro.","Buzinar e colar na traseira.","Forçar a ultrapassagem pela direita."],"O bom convívio no trânsito é um dos elementos da direção segura.",""],["1-3-363",1,3,0,50,"Você vê um idoso atravessando devagar a rua. O que deve fazer?","Reduzir a velocidade e esperar com paciência.",["Buzinar para ele andar mais rápido.","Passar antes dele terminar.","Desviar pela calçada."],"O condutor deve respeitar as preferências da via e garantir a segurança de todos.",""],["1-3-364",1,3,0,52,"Você vê um ônibus sinalizando saída da parada. O que fazer?","Facilitar a manobra, mantendo distância e deixando espaço.",["Acelerar para passar antes.","Fechar o ônibus para ele não sair.","Buzinar e colar na traseira."],"O bom convívio no trânsito é um dos elementos da direção segura.",""],["1-3-365",1,3,0,50,"Você vê uma criança perto da rua atrás de uma bola. Qual atitude?","Reduzir a velocidade e ficar pronto para parar.",["Buzinar e seguir.","Acelerar para passar logo.","Ignorar, pois ela está na calçada."],"Prevenção protege os mais vulneráveis.",""],["1-3-366",1,3,1,42,"A meta do Pnatrans até 2030 é:","Reduzir pela metade a quantidade de fatalidades no trânsito.",["Zerar multas.","Aumentar velocidade nas vias.","Priorizar só carros."],"A meta principal do Plano Nacional de Redução de Mortes e Lesões no Trânsito (PNATRANS) para o período de 2021 a 2030 é reduzir, no mínimo, à metade (50%) o índice nacional de mortos e de lesões graves no trânsito por grupo de habitantes, utilizando como referência os dados de 2020.",""],["1-3-367",1,3,2,39,"Um motorista sai de um posto de combustível (área lindeira) sem observar o fluxo da via principal e entra na pista, forçando outro veículo a frear bruscamente. Qual foi o erro de conduta fundamental cometido pelo motorista que saiu do posto?","Entrar na via sem dar a preferência de passagem aos veículos que já estavam circulando na pista.",["Culpa do outro motorista que estava atrás.","Falha do freio do carro.","Azar por coincidência."],"O condutor que for ingressar numa via, procedente de lote lindeiro (como um posto de combustível), deverá dar preferência aos veículos e pedestres que por ela estejam transitando.",""],["1-3-368",1,3,1,47,"Ao ver neblina, o que é correto?","Reduzir e ligar farol baixo.",["Ligar farol alto.","Acelerar para “sair da neblina”.","Ligar pisca-alerta e seguir."],"Reduzir a velocidade, acender o farol baixo (ou de neblina) e aumentar a distância de segurança do veículo à frente. Conforme estabelece o Art. 40, inciso II do CTB, o condutor deve usar luz baixa nas vias com iluminação pública ou em condições de chuva, neblina, cerração.",""],["1-3-369",1,3,1,22,"Durante um engarrafamento, o motorista decide andar pelo acostamento. Qual o risco?","Provocar sinistros e atrapalhar veículos de emergência.",["Evitar atrasos sem causar perigo.","Melhorar o fluxo do trânsito.","Mostrar habilidade ao volante."],"Conforme estabelece o Art. 193 do CTB, transitar com o veículo pelo acostamento é considerado infração gravíssima, sujeita à multa. O risco se deve ao fato de o acostamento ser destinado exclusivamente à parada de veículos em situação de emergência e, em estradas, ao trânsito de pedestres e bicicletas. Ao circular por lá, o motorista coloca em risco a vida de pessoas paradas e impede o uso do local por veículos de socorro, como ambulâncias.",""],["1-3-370",1,3,1,47,"Em avenida com chuva intensa, qual é a velocidade segura?","Aquela que permite controlar e parar o carro com segurança, mesmo abaixo do limite.",["Sempre a da placa.","A mesma dos carros mais rápidos.","A maior possível sem frear."],"Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo",""],["1-3-371",1,3,1,47,"Em avenida molhada, qual combinação é mais segura?","Reduzir a velocidade e manter distância maior.",["Frear no último momento.","Acender farol alto e acelerar.","Seguir colado em veículo maior."],"Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo",""],["1-3-372",1,3,1,45,"Em cruzamento, qual atitude reduz o risco de impacto transversal?","Diminuir a velocidade e observar bem antes de avançar.",["Acelerar para “não atrapalhar”.","Passar “colado” em quem está à frente.","Confiar só no sinal verde."],"Conforme os princípios da Direção Defensiva, a colisão transversal é o tipo mais perigoso em cruzamentos. O risco é drasticamente reduzido ao se adotar a regra de \"ver e ser visto\". O condutor deve reduzir a velocidade para garantir que terá tempo de reação e, principalmente, olhar para ambos os lados antes de atravessar, mesmo que a preferência seja dele, a fim de prever e evitar a imprudência de outros motoristas que possam desrespeitar a sinalização ou a preferência.",""],["1-3-373",1,3,1,39,"Em um cruzamento sem sinal, quem deve passar primeiro?","O veículo que vem pela direita.",["O maior veículo.","O motorista mais apressado.","Quem buzinar primeiro."],"A preferência é do veículo que vier pela direita do condutor, assumindo que nenhuma das vias seja rotatória ou rodovia e não haja veículos sobre trilhos.",""],["1-3-374",1,3,1,47,"Em uma estrada molhada, o motorista pisa forte no freio e o carro derrapa. O que ele fez de errado?","Não reduziu a velocidade e freou bruscamente.",["Usou o farol baixo.","Estava com o cinto de segurança.","Seguiu o limite da via."],"Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo",""],["1-3-375",1,3,1,51,"Em via com corredor estreito, uma moto se aproxima pelo lado do veículo. Condutor do carro deve:","Manter trajetória previsível, reduzir e sinalizar antes de qualquer mudança.",["Jogar o carro para o meio para “fechar”.","Abrir porta sem olhar.","Buzinar e acelerar."],"O motorista deve sinalizar e verificar antes de qualquer mudança de faixa e manter a distância lateral mesmo em condições de trânsito lento, garantindo a segurança do motociclista.",""],["1-3-376",1,3,1,47,"Em via com velocidade máxima de 80 km/h, começou a chover forte. Qual decisão correta?","Reduzir para uma velocidade segura (ex.: 70, 60 ou menos).",["Manter 80 km/h, porque “está na placa”.","Acelerar para sair da chuva.","Ligar farol alto e seguir igual."],"Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo",""],["1-3-377",1,3,0,47,"José vê uma poça d’água grande e decide jogar o carro sobre ela para “brincar”. Isso é:","É infração média e o principal risco é a aquaplanagem.",["Um jeito de testar o carro.","Uma forma de limpar os pneus.","Uma diversão sem risco."],"Conforme estabelece o Art. 171 do CTB, usar o veículo para arremessar água ou detritos sobre pedestres ou outros veículos é considerado infração média, sujeita a multa. Além da penalidade, a Direção Defensiva identifica o risco de aquaplanagem (perda de contato do pneu com o solo devido à camada de água), o que provoca a perda total de controle do veículo, pondo em risco a segurança.",""],["1-3-378",1,3,1,49,"Marcos ultrapassa outro carro em local proibido. Qual o perigo maior nessa atitude?","Colidir de frente com quem vem no sentido contrário.",["Ser multado por excesso de velocidade.","Ser seguido por outros carros.","Gastar mais combustível."],"Conforme estabelece o Art. 203, inciso V do CTB, ultrapassar pela contramão em locais proibidos (como faixas contínuas, curvas ou aclives) é infração gravíssima com penalidade de multa multiplicada por cinco e suspensão do direito de dirigir. O risco é máximo porque, ao invadir a contramão, o motorista não tem tempo ou espaço de reação caso um veículo se aproxime, levando a colisões frontais, que são o tipo de acidente mais letal.",""],["1-3-380",1,3,1,50,"No cruzamento, você tem a preferência, mas vê um pedestre já no meio da faixa. O que fazer?","Ceder a passagem e aguardar a travessia.",["Forçar a passagem para “ensinar a regra”.","Passar pela contramão.","Buzinar sem parar."],"Conforme estabelece o Art. 70 do CTB, os pedestres que estiverem atravessando a via sobre as faixas a eles destinadas terão prioridade de passagem sobre os veículos. Mesmo que o motorista tivesse preferência sobre outros veículos, o Art. 214, inciso IV, define como infração gravíssima deixar de dar preferência a pedestre que já tenha iniciado a travessia. A segurança e a prioridade do pedestre são absolutas.",""],["1-3-381",1,3,0,50,"Num cruzamento semaforizado, você percebe pedestres já iniciando a travessia no fim do sinal verde. Conduta segura:","Aguardar a liberação total da faixa antes de partir.",["Acelerar “no amarelo” para sair.","Buzinar forte para “abrir caminho”.","Desviar pela faixa de ônibus."],"Conforme estabelece o Art. 70 do CTB, os pedestres que estiverem atravessando a via sobre as faixas a eles destinadas têm prioridade de passagem sobre os veículos. Além disso, o Art. 214, inciso IV, define como infração gravíssima deixar de dar preferência a pedestre que já tenha iniciado a travessia. A conduta segura exige a parada total, pois a preferência do pedestre é absoluta, independentemente da cor do semáforo.",""],["1-3-382",1,3,1,51,"O motorista abre a porta do carro sem olhar e derruba um ciclista.","Foi falta de atenção e respeito com usuário vulnerável.",["O ciclista devia desviar.","Foi culpa do ciclista por andar muito perto.","É normal, acontece sempre."],"Conforme estabelece o Art. 49, Parágrafo único do CTB, os passageiros e condutores não deverão abrir a porta, nem deixá-la aberta, sem antes se certificarem de que isso não constitui perigo para eles e para outros usuários da via.",""],["1-3-383",1,3,1,50,"O motorista deve proteger quem no trânsito?","Os mais frágeis: pedestres, ciclistas e motociclistas.",["Somente quem tem carro.","Quem anda rápido.","Ninguém além dele mesmo."],"Os condutores de veículos maiores são responsáveis pela segurança dos menores, os motorizados pelos não motorizados, e, juntos, todos são responsáveis pela segurança dos pedestres. Esta regra impõe a obrigação legal de o condutor do veículo maior (e mais perigoso) ter a máxima cautela e a responsabilidade de zelar pela integridade física dos usuários mais vulneráveis da via.",""],["1-3-384",1,3,1,42,"O que diz a ideia da Visão Zero?","Nenhuma morte no trânsito é aceitável.",["Alguns acidentes são inevitáveis.","O pedestre é sempre culpado.","Só punir resolve."],"A Visão Zero (criada na Suécia e adotada por diversos países) baseia-se na ética de que a vida e a saúde não devem ser sacrificadas pela mobilidade. Sua justificativa legal e filosófica é que, embora os motoristas cometam erros, o sistema viário (engenharia e legislação) deve ser projetado para absorver esses erros sem resultar em morte ou lesão grave. Embora não seja um Artigo do CTB, a ideia da Visão Zero é a filosofia central que orienta as metas de redução de sinistros de trânsito em todo o mundo, incluindo as diretrizes do Sistema Nacional de Trânsito (SNT) brasileiro.",""],["1-3-385",1,3,1,45,"Por que ficar muito próximo ao carro à frente é perigoso?","Porque diminui o tempo e a distância de reação.",["Porque economiza combustível.","Porque ajuda a “puxar fila”.","Porque evita ultrapassagens."],"Conforme estabelece o Art. 29, inciso II do CTB, o condutor deve guardar distância de segurança lateral e frontal, levando em conta a velocidade e as condições da via. A Direção Defensiva adverte que \"ficar colado\" elimina o tempo de reação (o tempo que leva para o motorista perceber o perigo e começar a frear) e o espaço de frenagem, resultando invariavelmente em colisão traseira, a qual é de responsabilidade do condutor de trás. A regra dos dois segundos é a técnica recomendada para garantir essa margem de segurança.",""],["1-3-386",1,3,1,55,"Por que chamar de “sinistro” e não “acidente”?","Porque a maioria dos eventos de trânsito é causada por falha humana ou previsível, e não por \"acaso\" (acidente).",["Porque fica mais “bonito”.","Para confundir o motorista.","Porque não tem culpa de ninguém."],"Conforme a Lei nº 14.599/2023, que alterou o Art. 291 do CTB (e regulamentações subsequentes), a terminologia \"sinistro de trânsito\" foi adotada para substituir \"acidente\". A justificativa é que a palavra \"acidente\" sugere algo imprevisível ou fortuito, desresponsabilizando os envolvidos. No entanto, mais de 90% dos eventos de trânsito são resultado de falhas humanas previsíveis e evitáveis (como desatenção, velocidade excessiva ou embriaguez). O termo \"sinistro\" traz a conotação de evento danoso e não acidental, reforçando a necessidade de responsabilidade compartilhada e a base da filosofia da Visão Zero.",""],["1-3-387",1,3,1,42,"Por que o Brasil criou o PNATRANS?","Para cumprir o compromisso da ONU de reduzir mortes no trânsito.",["Para aumentar o número de radares.","Para multar mais motoristas.","Para priorizar o transporte de carga."],"Conforme estabelecido pela Lei nº 13.614/2018, que adicionou o Art. 326-A ao CTB, o PNATRANS foi criado com o objetivo geral de reduzir, no mínimo, à metade o índice nacional de mortos e de lesões graves no trânsito em um período de 10 anos. O Plano adota a filosofia de Sistema Seguro e Visão Zero, reconhecendo que os erros humanos são inevitáveis, mas as mortes e ferimentos graves não são, sendo um esforço coletivo e planejado para salvar vidas e melhorar a segurança viária em todo o país.",""],["1-3-388",1,3,1,43,"Por que o motorista deve ver e ser visto ao se aproximar de travessias?","Para antecipar movimentos e evitar atropelamentos.",["Para mostrar “quem manda”.","Para economizar tempo.","Para disputar espaço com pedestres."],"Conforme os princípios da Direção Defensiva, a aplicação da regra \"ver e ser visto\" nas travessias é essencial para a previsão de acidentes. O motorista deve ver para garantir a prioridade do pedestre (Art. 70 do CTB) e evitar a infração (Art. 214, IV). Simultaneamente, o motorista precisa ser visto (utilizando luzes e buzina de forma breve, se necessário) para alertar os usuários vulneráveis. Isso compensa as condições adversas de luz, tempo ou obstáculos, garantindo tempo de reação para ambas as partes.",""],["1-3-389",1,3,1,42,"Por que o PNATRANS é importante para o motorista comum?","Porque pretende reduzir pela metade as mortes até 2030.",["Porque libera todos de obedecer as regras.","Porque só fala de obras em rodovias.","Porque só vale para capitais."],"Conforme estabelece o Art. 326-A do CTB, que instituiu o PNATRANS, a meta central é reduzir em 50% o índice de mortos e lesões graves no trânsito em 10 anos. Para o motorista comum, isso significa que as ações do plano , baseadas na filosofia do Sistema Seguro e da Visão Zero, impactam diretamente sua segurança ao promover melhorias na fiscalização, na educação e na infraestrutura das vias, criando um sistema de trânsito mais protetor que minimiza a chance de um erro humano resultar em tragédia.",""],["1-3-390",1,3,1,42,"Por que o respeito às leis de trânsito é um ato de cidadania?","Porque protege vidas e o bem coletivo.",["Porque evita multas apenas.","Porque mostra quem é mais forte.","Porque dá vantagens."],"Conforme estabelece o art. 26 do CTB, os usuários da via devem abster-se de todo ato que possa constituir perigo e devem atuar para a segurança de todos. O respeito às leis (e à sinalização) transcende a obrigação legal; é um ato de cidadania, pois garante a preservação da vida (principal valor do trânsito), o direito à integridade física de terceiros e a fluidez do espaço público. Agir com civilidade e cumprir as regras demonstra a consciência do motorista sobre sua responsabilidade compartilhada na construção de um ambiente social seguro e justo.",""],["1-3-391",1,3,1,50,"Por que pedestres, ciclistas e motociclistas são vulneráveis?","Porque estão mais expostos e sofrem mais em caso de impacto.",["Porque “atrapalham” os carros.","Porque desrespeitam mais a lei.","Porque não usam a via."],"A classificação como \"vulneráveis\" está baseada no baixo nível de proteção que possuem em relação a veículos maiores. O pedestre e o ciclista não têm nenhuma proteção estrutural. O motociclista conta apenas com equipamentos de proteção individual (capacete, roupas), que são insuficientes para absorver a energia de um impacto com um veículo de quatro rodas ou maio",""],["1-3-392",1,3,1,42,"Qual é a relação entre normas do CTB e preservação da vida?","As regras organizam a convivência e reduzem riscos e conflitos.",["As regras existem só para multar.","As regras atrapalham o trânsito.","As regras servem apenas em rodovia."],"O CTB tem como princípio a preservação da vida, conforme o art. 1º, § 5º, ao estabelecer normas que transformam esse direito em ações concretas no trânsito, fixando deveres, limites e responsabilidades para garantir a segurança e evitar sinistros.",""],["1-3-393",1,3,1,47,"Quando há neblina, o motorista deve:","Reduzir a velocidade e ligar o farol baixo.",["Acelerar para sair logo da neblina.","Usar o farol alto.","Ligar o pisca-alerta e seguir rápido."],"Conforme estabelece o Art. 40, inciso II do CTB, o condutor deve usar luz baixa nas vias com iluminação pública ou em condições de chuva, neblina, cerração. O uso da luz alta é proibido por refletir nas partículas de água, piorando a visibilidade. Além disso, o Art. 220, inciso III, define como infração grave deixar de reduzir a velocidade sob neblina ou cerração, e a Direção Defensiva exige o aumento da distância de segurança (Art. 29, II) para compensar o maior tempo de reação necessário nessas condições adversas.",""],["1-3-394",1,3,1,50,"Quem é considerado usuário vulnerável?","Pedestres, ciclistas, motociclistas e pessoas com deficiência.",["Somente motoristas novos.","Passageiros de ônibus.","Agentes de trânsito."],"A classificação como \"vulneráveis\" está baseada no baixo nível de proteção que possuem em relação a veículos maiores. O pedestre e o ciclista não têm nenhuma proteção estrutural. O motociclista conta apenas com equipamentos de proteção individual (capacete, roupas), que são insuficientes para absorver a energia de um impacto com um veículo de quatro rodas ou maior. Por isso, o Art. 29, § 2º do CTB estabelece o princípio da responsabilidade compartilhada, onde os condutores de veículos maiores têm a obrigação legal de zelar pela segurança desses usuários mais frágeis.",""],["1-3-395",1,3,1,39,"Quem tem prioridade de passagem em cruzamento sem sinalização?","O veículo que estiver à direita.",["O veículo maior.","O mais apressado.","Quem estiver de motocicleta."],"Conforme estabelece o Art. 29, inciso III, alínea \"c\" do CTB, quando veículos se aproximam de um local não sinalizado, e nenhuma das regras de prioridade mais alta (rodovia ou rotatória) se aplica, a preferência de passagem é sempre de quem vier pela direita do condutor. Esta é a regra geral para a maioria dos cruzamentos urbanos sem sinalização.",""],["1-3-396",1,3,0,46,"Um amigo pede para você ir mais rápido na estrada. Qual é a atitude correta a ser adotada?","Manter velocidade segura, sem ceder à pressão.",["Acelerar para agradar.","Ultrapassar em curva.","Ignorar a sinalização."],"Conforme estabelece o art. 28 do CTB, o condutor deve, a todo momento, ter domínio de seu veículo, dirigindo com a atenção e os cuidados indispensáveis à segurança do trânsito. A velocidade deve ser compatível com as condições da via e do veículo, não excedendo o limite máximo legal. Ceder à pressão de terceiros, como amigos (o chamado \"fator humano\"), e \"apertar o passo\" compromete a segurança, pois a velocidade excessiva é uma das maiores causas de sinistros de trânsito.",""],["1-3-397",1,3,1,26,"Um carro para na pista para conversar com outro motorista. Essa atitude:","Aumenta o risco de sinistro e atrapalha o trânsito.",["É permitida se o pisca-alerta estiver ligado.","É segura se for por pouco tempo.","Evita enganos de rota."],"Conforme estabelece o art. 182, inciso XI do CTB, parar o veículo na pista de rolamento das estradas, das rodovias ou em vias de trânsito rápido é considerado infração gravíssima (sujeita a multa e remoção do veículo). No entanto, o ato de parar para conversar em vias urbanas de fluxo normal, obstruindo o trânsito (não se tratando de emergência ou embarque/desembarque), é geralmente enquadrado como parada indevida no leito da via, constituindo infração média. O principal risco é a criação de um obstáculo inesperado que pode causar sinistros graves de colisão traseira.",""],["1-3-398",1,3,1,42,"Um condutor fala com o passageiro e se distrai. Quando percebe, o semáforo já ficou vermelho e ele freia bruscamente para conseguir parar. Essa atitude mostra:","Falta de atenção, uma das principais causas de sinistros.",["Habilidade para conversar e dirigir.","Que ele confia na sorte.","Que o sinal demorou demais."],"Conforme os princípios da Direção Defensiva, a principal causa de sinistros é a falha humana, sendo a falta de atenção (distração por conversas) um erro de negligência. O condutor falhou na previsão ao não observar a mudança do semáforo (luz amarela) a tempo. O Art. 28 do CTB exige que o motorista tenha, a todo momento, domínio de seu veículo e dirija com a atenção indispensável, e a necessidade de frear bruscamente é a prova de que essa atenção foi perdida, pondo em risco a segurança do trânsito.",""],["1-3-399",1,3,1,63,"Um condutor pisa forte no freio para brincar com o passageiro. O que ele está fazendo?","Um comportamento de risco que pode causar colisão traseira.",["Uma manobra segura se o carro for novo.","Um gesto de humor no trânsito.","Um exercício de direção."],"Conforme estabelece o art. 175 do CTB, utilizar-se do veículo para demonstrar ou exibir manobra perigosa, arrancada brusca, derrapagem ou frenagem com deslizamento ou arrastamento de pneus é considerada infração gravíssima com penalidade de multa multiplicada por dez e suspensão do direito de dirigir. Pisar forte no freio sem necessidade é uma manobra perigosa que demonstra imprudência, coloca os passageiros em risco e pode causar uma colisão traseira, caracterizando uma Direção Não Defensiva.",""],["1-3-402",1,3,1,47,"Um motorista percebe que a pista está com óleo e continua rápido. O que pode ocorrer?","O carro derrapar e causar um sinistro.",["Nada, se ele for experiente.","Melhor aderência dos pneus.","Viagem mais tranquila."],"O óleo na pista atua como um lubrificante, reduzindo drasticamente o atrito entre os pneus e o pavimento. A alta velocidade, nessas condições, torna impossível manter a aderência e o controle do veículo (Direção Defensiva), aumentando drasticamente o risco de derrapagem em curvas e frenagens, levando a um sinistro grave.",""],["1-3-403",1,3,1,47,"Um motorista tenta atravessar uma poça d’água grande em alta velocidade. O que pode ocorrer?","Perder o controle do veículo e causar sinistro.",["Limpar o carro com a água.","Economizar tempo.","Melhorar o desempenho do motor."],"Conforme estabelece a Direção Defensiva, a alta velocidade ao atravessar uma poça d'água grande cria o fenômeno da aquaplanagem. O risco ocorre porque os pneus não conseguem drenar toda a água, formando uma camada de água entre o pneu e o asfalto. Essa condição anula a aderência e o atrito, resultando na perda total de contato com o pavimento. A conduta de não reduzir a velocidade em condições adversas (água na pista) é uma falha de previsão e negligência, aumentando o risco de sinistros graves.",""],["1-3-404",1,3,1,40,"Um motorista vê uma blitz e tenta fazer retorno para escapar. Essa ação mostra:","Falta de responsabilidade e risco de causar sinistro.",["Inteligência para evitar multa.","Atitude comum e sem perigo.","Direito do motorista."],"A tentativa de retorno brusco para fugir da blitz é um ato de imprudência (Direção Não Defensiva) que, além de ser punível pela manobra, coloca em risco a segurança do trânsito ao forçar outros veículos a frear e ao criar uma situação de desordem na via.",""],["1-3-405",1,3,1,50,"Um motorista vê uma pessoa com deficiência atravessando. O que deve fazer?","Parar totalmente e esperar.",["Reduzir e buzinar.","Passar devagar ao lado.","Fazer sinal com o farol."],"Conforme estabelece o Art. 70 do CTB, os pedestres que estiverem atravessando a via têm prioridade de passagem sobre os veículos. Essa prioridade é reforçada pelo Art. 214, inciso III, que estabelece como infração gravíssima deixar de dar preferência a pedestres portadores de deficiência física, crianças, idosos e gestantes. O motorista deve parar o veículo, garantindo a segurança e o direito de locomoção do pedestre vulnerável.",""],["1-3-406",1,3,1,33,"Você entra numa via, com muitos comércios e travessias. Qual decisão segura?","Ajustar a velocidade ao fluxo e ficar atento a travessias.",["Manter a velocidade da última via.","Acelerar para não prender o tráfego.","Ignorar pedestres fora da faixa."],"O condutor deve estar atento ao tipo de via que circula.",""],["1-3-407",1,3,1,52,"Você vê um caminhão manobrando numa esquina. O que fazer?","Dar espaço, manter distância e aguardar a manobra.",["Fechar a frente para “passar primeiro”.","Buzinar e colar na traseira.","Forçar a ultrapassagem pela direita."],"Veículos longos precisam de espaço para manobras. A Direção Defensiva exige que o motorista preveja a dificuldade da manobra e pare o veículo, evitando o risco de ser atingido pela traseira ou lateral do caminhão no chamado \"falso traçado\" da curva, onde o veículo de grande porte invade a faixa adjacente para completar a manobra.",""],["1-3-408",1,3,1,56,"Cenário: Você avista um carro parado no meio da pista após sofrer uma colisão leve (sinistro sem vítimas). Pergunta: De acordo com o CTB, qual é a conduta obrigatória do motorista envolvido (ou de quem presta socorro) em relação ao veículo imobilizado?","Retirar os veículos para local seguro.",["Deixar parado até a polícia chegar.","Discutir no meio da pista.","Ir embora sem falar nada."],"Conforme estabelece o Art. 178 do CTB (e, principalmente, o Art. 176, inciso VII), o condutor envolvido em sinistro tem o dever de adotar providências para remover o veículo do local, quando possível, a fim de restabelecer a segurança e a fluidez da via.",""],["1-3-410",1,3,2,56,"Depois de uma batida leve, dois motoristas começam a discutir no meio da pista, atrapalhando o trânsito. Qual seria a atitude correta?","Sinalizar o local, tirar os veículos da via e conversar com calma em local seguro.",["Deixar os carros parados até a polícia chegar.","Gritar para mostrar quem tem razão.","Ir embora sem falar nada."],"Após sinistros sem feridos, o CTB determina a liberação da via e a preservação da segurança. O condutor envolvido em sinistro tem o dever de adotar providências para remover o veículo do local, quando possível, a fim de restabelecer a segurança e a fluidez da via.",""],["1-3-411",1,3,2,47,"Durante a chuva, o carro de um motorista começa a deslizar. O que ele deve fazer?","Tirar o pé do acelerador e segurar firme o volante, sem frear bruscamente.",["Pisar forte no freio.","Virar o volante de uma vez.","Acelerar para endireitar o carro."],"Conforme os princípios da Direção Defensiva, quando o veículo perde aderência (desliza), o motorista deve evitar reações bruscas. Pisar no freio ou virar a direção abruptamente agrava a situação. A atitude correta é tirar o pé do acelerador (para reduzir a velocidade e transferir o peso para as rodas dianteiras) e manter o volante firme e apontado para onde se deseja ir.",""],["1-3-412",1,3,2,39,"O que o condutor deve fazer ao se aproximar de uma passagem de nível sem barreira?","Reduzir a velocidade, parar, olhar para os dois lados e só atravessar se for seguro.",["Acelerar para atravessar rapidamente.","Buzinar e seguir direto.","Parar sobre os trilhos e observar."],"A travessia só deve ser feita após se certificar de que não há trem se aproximando.",""],["1-3-413",1,3,2,46,"Qual atitude demonstra direção defensiva em um declive acentuado?","Reduzir a marcha antes da descida, manter controle e não frear continuamente.",["Descer em ponto morto e frear só no final.","Acelerar para ganhar tempo.","Ligar o pisca-alerta durante toda a descida."],"A condução segura depende do controle de velocidade e uso correto do freio-motor.",""],["1-3-414",1,3,2,46,"Qual é a posição correta das mãos no volante durante curvas seguidas?","As duas mãos firmes no volante, ajustando o movimento conforme a curva.",["Uma mão só no volante e outra no celular.","Uma mão no câmbio e outra no volante.","Mãos cruzadas em cima do volante."],"O controle firme com as duas mãos garante estabilidade e precisão.",""],["1-3-415",1,3,2,34,"Se o motorista errar a bifurcação, o que deve fazer?","Seguir até um local seguro para retornar.",["Dar ré imediatamente.","Fazer conversão no meio da pista.","Parar no cruzamento."],"Nunca retorne de forma perigosa e espere um ponto permitido e seguro",""],["1-3-416",1,3,2,42,"Um motorista percebe que outro cometeu um erro no trânsito. Qual deve ser sua reação?","Manter a calma e evitar discutir ou revidar.",["Fechar o outro carro para ensinar uma lição.","Buzinar de forma insistente.","Gritar para mostrar que tem razão."],"Os condutores devem manter o bom convívio no trânsito.",""],["1-3-417",1,3,0,43,"Um motorista troca de faixa sem olhar o retrovisor e causa uma freada brusca atrás. O que ele fez de errado?","Falta de atenção e verificação antes da manobra.",["Errou o momento de acelerar.","Não ligou o farol alto.","Estava devagar demais."],"O condutor deve estar sempre atento aos arredores.",""],["1-3-418",1,3,0,39,"Ao se aproximar da linha férrea, o motorista deve:","Parar o veículo antes dos trilhos, mesmo que o trem ainda esteja longe.",["Parar sobre os trilhos para enxergar melhor.","Passar rapidamente para não atrapalhar.","Esperar o trem parar para atravessar junto."],"O local correto para parar é antes dos trilhos, garantindo total visibilidade.",""],["1-3-420",1,3,0,46,"Em uma estrada com muitas curvas, qual atitude mostra um motorista prudente?","Manter distância do carro da frente e velocidade permitida e segura.",["Ficar colado no carro da frente.","Ligar o pisca-alerta e andar devagar no meio da pista.","Frear toda hora."],"A distância ajuda a evitar colisões se o carro da frente frear.",""],["1-3-421",1,3,0,48,"Em uma pista dupla, o condutor deve:","Circular sempre no lado direito, usando a esquerda apenas para ultrapassagem.",["Circular em qualquer faixa, conforme desejar.","Usar o canteiro central para estacionar.","Andar na contramão para economizar tempo."],"O trânsito em pista dupla segue o mesmo princípio das vias de mão dupla — sempre à direita.",""],["1-3-422",1,3,0,48,"Em vias com pista dividida, o motorista deve:","Permanecer em sua faixa e respeitar a sinalização horizontal.",["Utilizar o canteiro central para retorno.","Inverter o sentido quando desejar.","Trafegar entre os dois sentidos."],"O canteiro central não é área de manobra, o retorno deve ocorrer apenas em locais permitidos.",""],["1-3-423",1,3,0,48,"O que muda para o motorista quando a pista dupla termina?","É preciso redobrar a atenção, pois o tráfego passa a ocorrer em sentidos opostos na mesma pista.",["A pista fica mais larga.","O trânsito passa a ser de sentido único.","O limite de velocidade aumenta."],"O retorno à pista simples aumenta o risco de colisões frontais se o condutor não redobrar a atenção.",""],["1-3-426",1,3,0,52,"O que o motorista nunca deve fazer ao encontrar um trator à frente?","Ultrapassar em local sem visibilidade.",["Reduzir a velocidade.","Aguardar local seguro para a ultrapassagem.","Acionar a seta."],"A ultrapassagem em locais indevidos é uma das principais causas de sinistros fatais.",""],["1-3-427",1,3,0,39,"O que o motorista nunca deve fazer em uma passagem de nível sem barreira?","Parar sobre os trilhos ou tentar atravessar enquanto o trem se aproxima.",["Aguardar com calma o trem passar.","Acionar o freio antes dos trilhos.","Verificar se há sinal sonoro de trem."],"Ficar sobre os trilhos é extremamente perigoso, o trem tem prioridade absoluta.",""],["1-3-428",1,3,0,46,"O que pode acontecer se o motorista fizer as curvas rápidas demais?","O carro pode sair da pista ou tombar.",["O carro fica mais econômico.","O pneu esfria mais rápido.","Nada acontece."],"O excesso de velocidade é a principal causa de acidentes em curvas.",""],["1-3-429",1,3,0,3,"O que pode acontecer se o motorista passar muito rápido sobre uma lombada?","Danos na suspensão, perda de controle ou sinistro, dependendo da velocidade.",["Melhora no desempenho do veículo.","Nenhum risco.","Economia de combustível."],"A travessia brusca pode causar sinistro ou quebra de peças do veículo.",""],["1-3-430",1,3,0,52,"Por que é importante manter distância dos tratores?","Porque eles são lentos e podem fazer manobras inesperadas.",["Porque eles andam rápido.","Porque usam farol alto.","Porque sempre param no acostamento."],"Tratores têm menor estabilidade e precisam de espaço para manobrar com segurança.",""],["1-3-431",1,3,0,47,"Por que é importante reduzir a velocidade em pista irregular?","Para evitar perda de controle e danos ao veículo.",["Para economizar combustível.","Para não sujar o carro.","Porque é proibido dirigir rápido."],"Buracos e desníveis podem causar acidentes e avarias na suspensão e pneus.",""],["1-3-432",1,3,0,47,"Por que é perigoso buzinar quando há animais na pista?","Porque o som pode assustar o animal e fazê-lo correr na direção do veículo.",["Porque o som atrai outros animais.","Porque o buzinaço é proibido em toda a zona rural.","Porque gasta bateria."],"O ruído repentino pode causar reações imprevisíveis e aumentar o risco de sinistro.",""],["1-3-433",1,3,0,46,"Por que é perigoso descer em ponto morto?","Porque o motorista perde o controle e os freios esquentam mais rápido.",["Porque o carro gasta mais combustível.","Porque o motor pode desligar.","Porque o ar-condicionado para de funcionar."],"Descer em ponto morto é perigoso, pois o carro fica sem freio-motor.",""],["1-3-434",1,3,0,39,"Por que é perigoso tentar passar antes do trem?","Porque o trem é muito pesado, demora a frear e pode causar tragédias.",["Porque o trem anda devagar e não há risco.","Porque há câmeras que multam quem faz isso.","Porque o trem sempre para antes da linha."],"Um trem pode levar até 1 km para parar totalmente, nunca tente atravessar antes dele.",""],["1-3-435",1,3,0,46,"Por que não é bom subir uma ladeira em marcha alta?","Porque o motor perde força e o carro pode falhar.",["Porque gasta mais combustível.","Porque o carro fica mais leve.","Porque os freios não funcionam."],"Marcha alta exige mais força do motor, dificultando a subida.",""],["1-3-436",1,3,0,44,"Por que o uso excessivo da buzina é considerado prejudicial à convivência no trânsito?","Porque causa poluição sonora e confundir os demais condutores.",["Porque gasta bateria.","Porque aumenta o consumo de combustível.","Porque danifica os pneus."],"O ruído excessivo é fator de estresse urbano e compromete a harmonia social.",""],["1-3-437",1,3,0,46,"Qual comportamento é mais seguro antes de começar um trecho em declive?","Reduzir a marcha e manter velocidade baixa.",["Colocar o carro em ponto morto.","Frear forte o tempo todo.","Desligar o motor."],"A marcha reduzida ajuda o freio-motor a controlar o carro.",""],["1-3-438",1,3,0,3,"Quando o motorista se aproxima de um local com essa sinalização, deve:","Reduzir a velocidade e parar se a cancela estiver baixada ou descendo.",["Acelerar para cruzar antes que a barreira feche.","Buzinar para o guarda liberar a passagem.","Parar sobre os trilhos."],"A cancela indica a aproximação de trem, o motorista deve esperar até a liberação completa.","A-40"],["1-3-439",1,3,0,3,"Quando o pedestre inicia a travessia, o motorista deve:","Parar o veículo e aguardar a passagem completa.",["Seguir ao lado do pedestre.","Passar rápido antes que ele termine.","Buzinar para apressar a travessia."],"A prioridade é do pedestre que já iniciou a travessia.","A-32a"],["1-3-440",1,3,0,50,"Um motorista entra em uma rua sem saída e percebe que há crianças brincando no final. O que deve fazer?","Reduzir a velocidade e realizar o retorno com muito cuidado.",["Acelerar para sair rápido.","Usar a buzina para afastar as crianças.","Estacionar na calçada."],"O espaço reduzido exige paciência e atenção redobrada a pedestres e crianças.",""],["1-3-441",1,3,1,46,"Ao dirigir em uma estrada com várias curvas acentuadas, o condutor deve:","Manter velocidade segura, sem ultrapassar nas curvas.",["Acelerar nas saídas para compensar o tempo.","Ultrapassar veículos lentos dentro da curva.","Reduzir apenas nas retas."],"A ultrapassagem em curva é proibida e altamente perigosa.",""],["1-3-442",1,3,1,46,"Ao fazer várias curvas seguidas, o que o motorista deve observar com atenção?","O traçado da estrada e os carros que vêm no sentido contrário.",["O celular.","O rádio do carro.","Se vai chover."],"Olhar o caminho ajuda a prever as curvas e dirigir com mais segurança.",""],["1-3-443",1,3,1,46,"Durante uma longa descida, o que pode acontecer se o motorista usar só o freio de pé o tempo todo?","O freio pode esquentar e perder a eficiência.",["O carro vai parar mais rápido.","O motor economiza energia.","Nada acontece."],"O superaquecimento reduz a força de frenagem e causa risco de pane.",""],["1-3-444",1,3,2,46,"Em uma curva acentuada à esquerda, a força centrífuga (gerada ao entrar em curva) atua de que forma?","Empurrando o veículo para fora da curva, em direção ao lado direito da via.",["Empurrando o veículo para o centro da curva.","Ajudando o veículo a fazer a curva.","Mantendo o veículo parado."],"A força centrífuga tende a lançar o veículo para fora da trajetória curva.",""],["1-3-445",1,3,1,46,"Em uma curva leve à esquerda, qual é o ponto mais seguro para iniciar a retomada de velocidade?","Na saída da curva, quando a via estiver visível e livre.",["No meio da curva.","Logo na entrada da curva.","Durante a frenagem."],"Acelerar apenas quando o veículo estiver estabilizado evita derrapagens.",""],["1-3-446",1,3,1,46,"O que o condutor deve fazer se o carro ganhar velocidade demais na descida?","Reduzir a marcha e controlar com o freio-motor.",["Desligar o motor.","Frear bruscamente.","Jogar o carro para o acostamento."],"A força do motor ajuda a segurar o carro, evitando desgaste dos freios.",""],["1-3-447",1,3,1,49,"Por que é perigoso ultrapassar em trechos com curvas em “S”?","Porque não há boa visibilidade da pista contrária.",["Porque o carro pode quebrar o câmbio.","Porque o pneu gasta mais.","Porque o carro fica mais lento."],"As curvas tiram a visão do motorista, aumentando o risco de colisão.",""],["1-3-448",1,3,1,46,"Por que há limite de comprimento em algumas vias?","Porque curvas fechadas, pontes e túneis podem não comportar veículos longos.",["Porque veículos longos causam poluição.","Porque isso reduz o consumo de combustível.","Porque impede o trânsito de motocicletas."],"O raio de curvatura e a geometria da via determinam a necessidade de limitação de comprimento.",""],["1-3-449",1,3,1,46,"Qual é o risco mais comum em curvas acentuadas à esquerda?","Perda de aderência dos pneus e saída da faixa de rolamento.",["Aquaplanagem em linha reta.","Falta de combustível.","Redução da visibilidade noturna."],"Entrar rápido demais pode levar o veículo a invadir a faixa contrária ou sair da pista.",""],["1-3-450",1,3,1,52,"Se houver um caminhão entrando lentamente pela esquerda, o que deve fazer o motorista de carro?","Diminuir a velocidade e esperar o caminhão completar a manobra.",["Tentar ultrapassar rápido.","Buzinar e seguir colado.","Jogar o carro para o acostamento."],"Respeitar o tempo do caminhão é atitude prudente e segura.",""],["1-3-451",1,3,1,32,"Para dirigir ônibus escolar, coletivo ou produto perigoso, o que além da categoria é exigido?","Curso especializado com treinamento prático- ambulância exige curso a cada 5 anos.",["Apenas colete refletivo.","Autorização do chefe por escrito.","Só experiência de 2 anos."],"Cursos específicos.",""],["1-3-452",1,3,0,31,"Qual o prazo de validade da Permissão Para Dirigir (PPD), que é a sua primeira habilitação?","1 (um) ano.",["6 (seis) meses.","2 (dois) anos.","O prazo é de 5 anos, como a CNH definitiva."],"A PPD é a sua \"habilitação provisória\" e é válida por um ano inteiro, funcionando como um período de experiência para o condutor novato.",""],["1-3-453",1,3,0,30,"Na Categoria B, que é a mais procurada, qual é o limite de peso total (PBT) do veículo que você pode dirigir?","3.500 kg (três mil e quinhentos quilos).",["4.500 kg (quatro mil e quinhentos quilos).","1.000 kg (mil quilos).","Não há limite de peso, desde que não seja ônibus ou caminhão."],"O limite de peso para veículos da Categoria B, como carros de passeio e utilitários leves, é de 3.500 kg.",""],["1-3-454",1,3,1,31,"Se você acabou de pegar a sua PPD (Permissão Para Dirigir), qual é a regra mais importante sobre infrações que você deve seguir para conseguir a CNH definitiva?","Não cometer nenhuma infração grave, gravíssima ou ser reincidente em infração média.",["Não cometer nenhuma infração gravíssima.","Não cometer mais de duas infrações leves.","Cometer apenas infrações de natureza leve."],"Durante o período da PPD, é proibido cometer infração grave, gravíssima ou repetir uma infração média. É o seu período de responsabilidade redobrada.",""],["1-3-455",1,3,0,33,"As vias urbanas são divididas em tipos. Qual delas é conhecida como a rua do seu bairro, onde ficam as casas e a velocidade máxima permitida é mais baixa, de 30 km/h?","Vias Locais.",["Vias Coletoras.","Vias Arteriais.","Vias de Trânsito Rápido."],"As Vias Locais são as ruazinhas tranquilas do bairro, as áreas de convivência, e a velocidade máxima permitida é de 30km/h.",""],["1-3-457",1,3,1,34,"Nas Rodovias, qual é uma dica essencial de segurança para que outros motoristas percebam sua presença mais facilmente?","Manter o farol baixo sempre ligado, mesmo durante o dia.",["Usar o farol alto apenas nos túneis.","Usar as luzes de neblina o tempo todo.","Buzinar rapidamente antes de ultrapassar."],"Manter o farol baixo aceso, mesmo de dia, ajuda outros motoristas a verem seu veículo de longe e com mais facilidade, aumentando a segurança.",""],["1-3-458",1,3,0,33,"Se você está dirigindo na cidade, qual é a velocidade máxima permitida em uma Via Arterial, que liga os bairros principais e tem vários semáforos e faixas de pedestres?","60km/h.",["80km/h.","30km/h.","40km/h."],"As Vias Arteriais são importantes avenidas com bastante fluxo, e o limite de velocidade é de 60km/h.",""],["1-3-459",1,3,0,41,"O que a Direção Defensiva ensina você a fazer para proteger sua vida e a dos outros?","Manter a atenção, antecipar imprevistos e prever situações de risco.",["Dirigir sempre no limite máximo de velocidade.","Confiar apenas na preferência que você tem na via.","Fazer revisões somente quando o veículo apresentar algum problema grave."],"A Direção Defensiva se baseia em manter a atenção, antecipar o que pode dar errado e proteger a vida de todos no trânsito.",""],["1-3-460",1,3,1,30,"Um carro popular ou um SUV se encaixa na Categoria B, mas ele deve respeitar um limite máximo de lugares, sem contar o motorista. Quantos lugares são permitidos?","8 lugares, sem contar o motorista.",["9 lugares, contando o motorista.","5 lugares, sem contar o motorista.","10 lugares, contando o motorista."],"O limite da Categoria B é de veículos com até 8 lugares, além do motorista. Veículos maiores, como vans e ônibus, exigem categorias específicas (D).",""],["1-3-461",1,3,2,34,"Ao dirigir em uma Estrada de Terra (não pavimentada), um risco que aumenta muito e exige que você triplique a distância do veículo da frente é:","A poeira levantada, que prejudica a sua visibilidade.",["A possibilidade de encontrar animais selvagens.","O asfalto escorregadio após a chuva.","A falta de postos de gasolina e áreas de descanso."],"Em estrada de terra, a poeira que sobe reduz muito a visibilidade. Por isso, aumentar a distância do carro da frente é crucial para a segurança.",""],["1-3-463",1,3,0,31,"Para conseguir a CNH definitiva, qual infração gravíssima você não pode cometer durante o período de 1 ano da PPD?","Nenhuma infração gravíssima.",["Apenas uma infração gravíssima é permitida.","Apenas infrações gravíssimas relacionadas à velocidade.","Nenhuma, mas pode cometer 2 infrações graves."],"Para ter a CNH definitiva, você não pode cometer nenhuma infração de natureza gravíssima ou grave.",""],["1-3-464",1,3,0,33,"O que as Rodovias Pavimentadas (asfaltadas ou de concreto) oferecem para permitir velocidades maiores?","Boa aderência dos pneus, drenagem adequada e sinalização completa.",["Mais postos de gasolina e áreas de descanso.","Baixa aderência dos pneus, forçando a reduzir a velocidade.","Pista de terra batida para maior atrito."],"Rodovias pavimentadas garantem a segurança em alta velocidade pela boa aderência, drenagem e sinalização.",""],["1-3-465",1,3,0,31,"O que significa a sigla PPD, que você recebe após ser aprovado em todos os exames?","Permissão Para Dirigir.",["Permissão de Prática Defensiva.","Punição Por Distração.","Plano de Prioridade de Direção."],"A PPD é a sua \"habilitação provisória\", válida por 1 ano.",""],["1-3-466",1,3,0,41,"Para quem a Direção Defensiva se dedica a proteger no trânsito?","A sua vida e a vida de todos os outros.",["Apenas o motorista, protegendo-o de multas.","Somente os pedestres e ciclistas.","Apenas a vida do motorista e do veículo."],"A direção segura é um conjunto de hábitos para proteger a sua vida E a dos outros, valorizando o respeito e a empatia.",""],["1-3-467",1,3,0,33,"Qual o limite máximo de velocidade em uma Via Arterial, a avenida que liga os principais bairros da cidade?","60km/h.",["$80~km/h$.","$40~km/h$.","$110~km/h$."],"As Vias Arteriais têm semáforos e faixas de pedestres, e a velocidade regulamentada é de 60km/h.",""],["1-3-469",1,3,0,33,"Qual é o tipo de via que tem como característica ser uma grande avenida expressa que corta a cidade, sem semáforos nem cruzamentos diretos?","Vias de Trânsito Rápido.",["Vias Coletoras.","Vias Locais.","Rodovias."],"As Vias de Trânsito Rápido (limite de 80km/h) são os grandes eixos urbanos com maior fluidez.",""],["1-3-470",1,3,0,50,"Se você está dirigindo em uma via urbana próxima a escolas, hospitais ou faixas de pedestres, qual deve ser sua atitude de segurança?","Reduzir a velocidade e ter atenção redobrada.",["Manter a velocidade máxima da via para evitar retenções.","Usar o farol alto para sinalizar sua presença.","Parar em fila dupla para buscar informações."],"O material orienta a reduzir a velocidade em Áreas Sensíveis, pois a vida de outras pessoas depende da sua cautela.",""],["1-3-471",1,3,0,34,"Quando você deve, de fato, parar o seu veículo no acostamento de uma rodovia?","Apenas em caso de emergência (pneu furado, problema mecânico, mal-estar).",["Sempre que precisar usar o celular ou mandar mensagem.","Sempre que sentir sono ou cansaço.","Para fazer um lanche ou tomar água."],"O acostamento é uma área de emergência e não deve ser usado para paradas improvisadas ou sem necessidade.",""],["1-3-472",1,3,0,26,"Na cidade, quais atitudes de parada são citadas como incorretas e que atrapalham o fluxo do trânsito?","Não parar em fila dupla ou sobre a calçada.",["Parar no sinal vermelho ou dar preferência a pedestres.","Estacionar corretamente em vagas permitidas.","Parar nos postos de gasolina."],"Parar em fila dupla ou sobre a calçada é uma atitude que coloca pedestres em risco e desorganiza o trânsito.",""],["1-3-473",1,3,0,34,"Ao dirigir em rodovias, qual a principal diferença em relação à cidade que aumenta muito a sua responsabilidade?","A velocidade ser bem mais rápida.",["O trânsito ser muito mais lento.","A distância entre os carros ser menor.","A visibilidade ser melhor por não ter prédios."],"A alta velocidade nas rodovias faz com que tudo aconteça mais rápido, exigindo responsabilidade total do condutor.",""],["1-3-474",1,3,0,31,"A primeira habilitação que você recebe (PPD) só é convertida em CNH definitiva depois de 1 ano se você tiver dirigido com:","Cuidado e responsabilidade.",["Alta velocidade para cumprir o prazo.","Apenas em vias locais.","O máximo de reincidências em infração média."],"O período da PPD é a fase de aprendizado e responsabilidade redobrada, sendo um teste para a CNH definitiva.",""],["1-3-475",1,3,0,36,"Quais equipamentos de segurança, além da cadeirinha infantil, é crucial para a proteção de quem está dentro e fora do veículo, segundo o material?","Cinto, airbag, apoio de cabeça e capacete.",["Pneus novos e estepe.","Som automotivo potente.","Rádio comunicador e GPS."],"O uso correto do cinto, airbag, apoio de cabeça e capacete é vital para a proteção no trânsito.",""],["1-3-476",1,3,0,34,"Onde você deve planejar suas paradas para usar o banheiro ou esticar as pernas durante uma longa viagem pela rodovia?","Postos de gasolina e áreas de descanso.",["Acostamentos ou debaixo de viadutos.","Faixas de rolamento ou pontes.","Onde o celular tiver sinal."],"É essencial planejar as paradas em locais seguros e apropriados (postos e áreas de descanso).",""],["1-3-477",1,3,0,30,"Para a Categoria B, qual tipo de veículo se encaixa na descrição de \"uso pessoal ou familiar\", desde que respeite os limites de peso e lugares?","Carros de Passeio (sedans, hatches, SUVs e picapes leves).",["Ônibus articulado e caminhões.","Motocicletas e motonetas.","Veículos de mais de 8 lugares."],"Carros de passeio e utilitários leves (até 3.500~kg e 8 lugares) são o foco da Categoria B.",""],["1-3-478",1,3,1,34,"Na condução em uma Estrada de Terra, a baixa segurança e aderência exigem qual ação do motorista no volante?","Manter as duas mãos firmes no volante para correções constantes na direção.",["Manter apenas uma mão, para ter mais agilidade ao fazer curvas.","Soltar o volante e deixar o carro seguir a direção sozinho.","Segurar o volante com uma mão e usar a outra para segurar objetos."],"Em estradas não pavimentadas, a direção exige firmeza e correções constantes, o que só é possível com as duas mãos no volante.",""],["1-3-479",1,3,1,33,"O que as Vias Coletoras fazem no sistema de trânsito urbano?","Fazem a ligação entre as ruas dos bairros e as grandes avenidas.",["Ligam estados e permitem velocidade de 110km/h.","Servem apenas para trânsito de ônibus e vans.","Cortam a cidade sem semáforos a 80km/h."],"As Vias Coletoras têm a função de distribuir o tráfego, ligando vias menores (Locais) às maiores (Arteriais).",""],["1-3-480",1,3,1,31,"Se você tem a PPD, qual o risco ao cometer uma infração média (como dirigir sem atenção) pela segunda vez em menos de um ano?","Ser reincidente em infração média e perder o direito à CNH definitiva.",["Ter a PPD renovada por mais 1 ano.","Ter que pagar a multa, mas nada mais acontece com a habilitação.","Perder apenas os pontos da infração."],"O material proíbe ser reincidente em infração média, o que significa que duas infrações médias já são suficientes para reprovar na PPD.",""],["1-3-481",1,3,1,34,"Se você está dirigindo na rodovia e tem que fazer uma curva fechada, qual erro você deve evitar durante a manobra?","Frear bruscamente durante a curva.",["Reduzir a velocidade antes de entrar na curva.","Acelerar suavemente na saída da curva.","Usar o farol baixo ligado."],"Frear bruscamente durante a curva pode fazer você perder totalmente o controle do veículo, um erro grave de direção.",""],["1-3-482",1,3,1,33,"Na cidade, o fluxo é intenso e a velocidade é menor. Qual é a sua melhor atitude para que o trânsito flua melhor e os riscos diminuam significativamente?","Saber onde está e como deve se comportar, adaptando-se ao tipo de via.",["Tentar manter a velocidade máxima em todas as vias.","Ignorar a sinalização se ela estiver te atrasando.","Usar a preferência a todo custo."],"Entender o tipo de via e adaptar o comportamento a ela (Direção Defensiva) é a base para diminuir os riscos.",""],["1-3-483",1,3,1,33,"O que diferencia uma Via Local (30km/h) de uma Via Coletora (40km/h) na cidade?","A Via Local é a rua do bairro, e a Coletora faz a ponte entre o bairro e as grandes avenidas.",["A Via Local tem semáforos, e a Coletora não.","A Via Coletora é uma via expressa sem cruzamentos.","A Via Local só permite a passagem de carros, e a Coletora, de caminhões."],"A função da via é o que define o tipo e o limite de velocidade: a Local é de convivência (bairro), e a Coletora, de distribuição.",""],["1-3-484",1,3,1,34,"Se você tem um problema mecânico na rodovia e precisa parar no acostamento, o triângulo de sinalização deve ser colocado:","A pelo menos 30 metros atrás do carro.",["No exato local onde o carro parou.","A 10 metros atrás do carro.","Na frente do carro, voltado para a via."],"A distância de 30 metros é a recomendada para que os outros motoristas tenham tempo hábil de reação e desvio.",""],["1-3-485",1,3,1,30,"Para conseguir tirar sua primeira CNH (Categoria AB), qual é a primeira etapa que você precisa concluir?","Aprovação em todas as partes teóricas e práticas e ser aprovado em todos os exames.",["Ter completado um ano de PPD.","Comprar um veículo novo e emplacado.","Dirigir por 50 horas na cidade."],"A primeira etapa, antes de receber a PPD, é ser aprovado em todas as fases do processo de formação de condutores.",""],["1-3-486",1,3,2,33,"O condutor deve respeitar o tipo de via onde está, pois a atenção e a distância do carro da frente devem ser maiores em vias de maior fluxo e velocidade. Qual o nome dessa base fundamental da direção?","Direção Defensiva.",["Direção Agressiva.","Direção Punitiva.","Direção Terapêutica."],"A Direção Defensiva exige que você olhe para o ambiente ao redor (o tipo de via) e adapte seu comportamento de acordo.",""],["1-3-487",1,3,2,30,"Para obter as categorias mais avançadas (C, D e E), que são necessárias para dirigir caminhões, ônibus e vans, qual é a condição de experiência que você deve ter?","Já ter experiência com a habilitação básica (A ou B) e dominar bem a direção.",["Ter 30 anos ou mais de idade.","Ter uma pontuação perfeita em todos os exames.","Ter feito apenas aulas práticas e não teóricas."],"As categorias mais avançadas só podem ser obtidas após o motorista já ter dominado a direção e ganhado experiência com a habilitação básica.",""],["1-3-488",1,3,0,30,"Qual o limite máximo de lugares que um veículo da Categoria B pode ter, sem contar o motorista?","8 lugares.",["5 lugares.","10 lugares.","12 lugares."],"A Categoria B permite dirigir veículos com, no máximo, 8 lugares, fora o motorista.",""],["1-3-489",1,3,0,31,"Por quanto tempo a Permissão Para Dirigir (PPD) é válida?","1 (um) ano inteiro.",["6 (seis) meses.","2 (dois) anos.","5 (cinco) anos."],"A PPD é a sua habilitação provisória, com validade de um ano.",""],["1-3-490",1,3,0,33,"Qual é o limite de velocidade máxima em uma Via Local, a rua tranquila do seu bairro?","30km/h.",["40km/h.","60km/h.","80km/h."],"As Vias Locais são áreas de convivência e, por isso, têm o limite mais baixo, de 30km/h.",""],["1-3-491",1,3,0,33,"Qual o limite de velocidade em uma Via Arterial, que tem bastante fluxo, semáforos e faixas de pedestres?","60km/h.",["80km/h.","40km/h.","30km/h."],"Nas Vias Arteriais, que são as avenidas importantes que ligam bairros, a velocidade máxima é de 60km/h.",""],["1-3-492",1,3,0,33,"Qual o limite de velocidade em uma Via de Trânsito Rápido, a grande avenida expressa que não tem cruzamentos diretos?","80km/h.",["60km/h.","40km/h.","110km/h."],"As Vias de Trânsito Rápido são os eixos de maior fluidez na cidade, com limite de $80~km/h$.",""],["1-3-493",1,3,0,33,"Em qual tipo de via urbana o limite de velocidade é de 40km/h e sua função é fazer a ligação entre as ruas dos bairros e as grandes avenidas?","Via Coletora.",["Via Arterial.","Via Local.","Via de Trânsito Rápido."],"As Vias Coletoras têm movimento moderado e ligam as vias menores às maiores, com limite de 40km/h.",""],["1-3-494",1,3,0,33,"Qual tipo de via urbana é caracterizada por ser uma grande avenida expressa que não tem semáforos e nem cruzamentos diretos?","Vias de Trânsito Rápido.",["Vias Locais.","Vias Arteriais.","Vias Coletoras."],"As Vias de Trânsito Rápido são os grandes eixos que cortam a cidade com maior fluidez.",""],["1-3-495",1,3,0,33,"Qual o nome da via urbana definida como \"área de convivência\" e onde é comum encontrar crianças brincando?","Vias Locais.",["Vias Arteriais.","Vias Coletoras.","Vias de Trânsito Rápido."],"As Vias Locais são as ruas do bairro, onde ficam as casas e o trânsito é mais lento e de convivência.",""],["1-3-496",1,3,0,32,"O que você recebe após ser aprovado em todas as etapas teóricas e práticas do processo de formação?","A PPD (Permissão Para Dirigir).",["A CNH definitiva.","Uma habilitação válida por 5 anos.","Uma habilitação que permite dirigir caminhões e ônibus."],"A PPD é o primeiro documento de habilitação, válido por um ano.",""],["1-3-497",1,3,0,31,"Qual a regra de infração que se aplica à PPD em relação a uma infração de natureza grave?","Você não pode cometer nenhuma infração grave.",["É permitido cometer até duas infrações graves.","É permitido cometer apenas uma infração grave.","Só a infração gravíssima é proibida no período da PPD."],"Para obter a CNH definitiva, o condutor não pode cometer nenhuma infração grave, gravíssima ou ser reincidente em média.",""],["1-3-498",1,3,1,31,"O que significa ser reincidente em infração média no período da PPD?","Cometer a mesma infração média pela segunda vez e perder o direito à CNH definitiva.",["Cometer duas infrações leves no período de um ano.","Cometer uma infração média e uma grave.","Cometer uma infração gravíssima e uma média."],"O condutor da PPD não pode ser reincidente em infração média, ou seja, cometer a mesma infração média duas vezes.",""],["1-3-499",1,3,0,33,"Qual o nome dado às ruas e avenidas dentro das cidades?","Vias Urbanas.",["Vias Rurais.","Rodovias.","Estradas."],"Vias Urbanas são as ruas e avenidas que você encontra dentro das cidades.",""],["1-3-500",1,3,0,34,"Qual o nome dado às rodovias e estradas que ligam cidades e estados?","Vias Rurais.",["Vias Urbanas.","Vias Locais.","Vias de Trânsito Rápido."],"Vias Rurais são as rodovias e estradas usadas para viagens e para ligar estados.",""],["1-3-501",1,3,0,36,"O que os equipamentos de segurança, como cinto, airbag, apoio de cabeça e capacete, podem fazer por quem está dentro e fora do veículo?","Podem salvar vidas.",["Apenas dar conforto na direção.","Apenas evitar multas.","Aumentar a velocidade."],"O uso correto desses equipamentos é vital para a proteção no trânsito e pode salvar vidas.",""],["1-3-502",1,3,0,39,"Na cidade, ao se aproximar de um cruzamento, qual sua principal atitude de segurança?","Aproxime-se com calma, olhe para todos os lados e dê a preferência.",["Acelere para passar antes dos outros veículos.","Ignore a sinalização se não tiver ninguém vindo.","Use o farol alto para sinalizar sua preferência."],"O material orienta a respeitar a sinalização e dar a vez para quem tem a preferência.",""],["1-3-503",1,3,0,50,"O que você deve fazer ao dirigir em Áreas Sensíveis, como perto de escolas, hospitais e faixas de pedestres?","Reduzir a velocidade e ter atenção redobrada.",["Manter a velocidade máxima permitida na via.","Usar o acostamento para parar.","Ignorar as faixas de pedestres se não houver ninguém em cima delas."],"A vida de outras pessoas depende da sua cautela, por isso a velocidade deve ser reduzida e a atenção, redobrada.",""],["1-3-504",1,3,0,30,"Quais são as duas categorias básicas que você escolhe ao tirar sua primeira CNH?","Categoria A (motos) ou Categoria B (carros).",["Categoria C (caminhões) ou D (ônibus).","Categoria E (veículos articulados) ou Categoria B.","Categoria AB (motos e carros) ou Categoria C (caminhões)."],"A primeira escolha é sempre entre motos (A) ou carros (B), podendo ser as duas (AB).",""],["1-3-506",1,3,0,33,"Qual o nome dado às vias rurais asfaltadas ou de concreto que permitem velocidades maiores por terem boa aderência?","Rodovias Pavimentadas.",["Estradas de Terra.","Vias Locais.","Vias Coletoras."],"Rodovias Pavimentadas são as vias rurais mais seguras e com melhor estrutura para alta velocidade.",""],["1-3-507",1,3,0,34,"O que o condutor deve manter sempre ligado na rodovia, mesmo durante o dia, para ajudar outros motoristas a perceberem sua presença?","O farol baixo.",["O farol alto.","As luzes de neblina.","O pisca-alerta."],"O farol baixo aceso, mesmo de dia, não é \"frescura\", é segurança para ser visto a distância.",""],["1-3-508",1,3,0,34,"Nas curvas da rodovia, qual a principal ação que você deve tomar antes de entrar na curva?","Reduzir a velocidade.",["Frear bruscamente durante a curva.","Acelerar o máximo possível.","Manter a velocidade constante."],"Reduzir a velocidade antes de entrar na curva é o primeiro passo para fazer a manobra em segurança.",""],["1-3-509",1,3,0,33,"Em que tipo de vias urbanas a velocidade máxima é \"bem baixinha\" (30km/h), perto de escolas, hospitais e faixas de pedestres?","Em zonas residenciais e perto de escolas.",["Nas Vias de Trânsito Rápido.","Nas Vias Arteriais.","Nas Vias Coletoras."],"As zonas residenciais e próximas a escolas são as áreas mais sensíveis, com o menor limite de velocidade.",""],["1-3-510",1,3,0,26,"Quais atitudes incorretas de parada o material cita que atrapalham o fluxo do trânsito e colocam pedestres em risco?","Parar em fila dupla ou sobre a calçada.",["Estacionar corretamente em vagas.","Parar no sinal vermelho ou dar preferência a pedestres.","Parar em postos de gasolina."],"O material alerta que parar em fila dupla ou sobre a calçada desorganiza o fluxo e é perigoso para pedestres.",""],["1-3-511",1,3,0,41,"Como é definida a Direção Segura?","Hábitos e escolhas conscientes que valorizam o respeito, a empatia e a vida.",["Leis de trânsito e sinalizações.","Regras de velocidade e multas.","Categorias de habilitação."],"O material define a direção segura como um conjunto de hábitos, não apenas regras.",""],["1-3-513",1,3,0,30,"Se você possui a Categoria B, pode dirigir caminhões, ônibus e vans?","Não, pois esses veículos exigem categorias específicas (C, D e E).",["Sim, desde que o peso total não passe de 3.500kg.","Sim, pois a Categoria B engloba todos os veículos motorizados.","Apenas se o veículo tiver no máximo 8 lugares, sem contar o motorista."],"Caminhões, ônibus e vans exigem categorias mais avançadas, obtidas após a experiência na categoria básica.",""],["1-3-514",1,3,0,33,"Qual é a Dica de Ouro para dirigir na cidade, onde a convivência é próxima e o ritmo é mais lento?","Paciência e atenção são suas melhores ferramentas.",["Velocidade máxima é sua meta.","A preferência é sua, não a perca.","Buzinar o tempo todo é a melhor forma de sinalizar."],"Na cidade, paciência e atenção são essenciais devido à proximidade com outros usuários da via.",""],["1-3-515",1,3,1,30,"Qual o limite máximo de peso total (PBT) que um veículo da Categoria B pode ter?","3.500kg (três mil e quinhentos quilos).",["4.500kg (quatro mil e quinhentos quilos).","1.000kg (mil quilos).","5.000kg (cinco mil quilos)."],"O limite de peso para carros de passeio e utilitários leves na Categoria B é de $3.500~kg$.",""],["1-3-516",1,3,1,31,"Se o condutor com PPD cometer uma infração média (como dirigir sem atenção) e depois repetir a mesma infração média em menos de um ano, qual é a consequência?","Perderá o direito à CNH definitiva por ter sido reincidente em infração média.",["Terá que pagar a multa, mas nada acontece com a PPD.","Terá a PPD renovada por mais 6 meses.","Poderá solicitar a CNH definitiva normalmente após 1 ano."],"A PPD é suspensa se houver reincidência em infração média.",""],["1-3-517",1,3,1,41,"Na prática, o que a Direção Defensiva ensina a fazer para proteger sua vida e a dos outros?","Manter a atenção, antecipar imprevistos e prever situações de risco.",["Dirigir no limite de velocidade, sem se preocupar com os outros.","Confiar apenas na preferência que você tem na via.","Fazer ultrapassagens arriscadas para evitar congestionamento."],"A Direção Defensiva é a arte de antecipar problemas e manter a atenção total.",""],["1-3-518",1,3,1,33,"Qual a função das Vias Coletoras no sistema de trânsito urbano?","Fazer a ligação entre as ruas dos bairros (Locais) e as grandes avenidas (Arteriais).",["Ligar cidades e estados, sem semáforos.","Servir apenas como área de convivência e lazer.","Cortar a cidade em grandes eixos expressos."],"As Coletoras fazem a distribuição do tráfego, ligando os pontos menores aos maiores.",""],["1-3-519",1,3,1,34,"Qual a \"boa regra\" de tempo sugerida para manter a distância de segurança em rodovias?","Manter pelo menos 2 segundos de distância do veículo da frente.",["Manter 1 segundo de distância do veículo da frente.","Manter a distância de 5 metros do veículo da frente.","Manter a distância de 30 metros do veículo da frente."],"O cálculo em tempo, usando um ponto de referência e contando 2 segundos, é a forma mais segura de medir a distância.",""],["1-3-520",1,3,1,34,"O farol baixo ligado na rodovia, mesmo de dia, ajuda outros motoristas a perceberem sua presença com mais facilidade em quais condições?","Em dias nublados, com neblina ou quando o sol está baixo no horizonte.",["Apenas em dias de chuva forte.","Apenas à noite ou em túneis.","Apenas para piscar e sinalizar a intenção de ultrapassar."],"O farol baixo aumenta a visibilidade do seu veículo em todas essas condições de pouca luz.",""],["1-3-521",1,3,1,34,"O que você deve fazer depois de passar pelo ponto mais fechado de uma curva na rodovia?","Acelerar suavemente na saída.",["Frear bruscamente na saída.","Manter o volante virado para o lado da curva.","Deixar o veículo seguir a inércia da curva."],"A regra é: entrar devagar, e acelerar suavemente na saída para retomar a velocidade.",""],["1-3-522",1,3,1,34,"Em viagens longas, onde você deve planejar suas paradas para usar o banheiro, tomar um café ou esticar as pernas?","Postos de gasolina e áreas de descanso que aparecem ao longo da rodovia.",["No acostamento da rodovia, a qualquer momento.","Debaixo de viadutos ou pontes.","Em qualquer lugar que não tenha fiscalização."],"As paradas devem ser feitas em locais seguros e apropriados (postos e áreas de descanso).",""],["1-3-523",1,3,1,50,"Por que a atenção precisa ser redobrada e a velocidade, reduzida, perto de escolas, hospitais e faixas de pedestres?","Porque a vida de outras pessoas depende da sua cautela.",["Porque você será multado se não reduzir a velocidade.","Porque o trânsito flui melhor se você dirigir devagar.","Porque é o único lugar na cidade onde a regra dos 30km/h se aplica."],"As Áreas Sensíveis exigem maior cautela para proteger crianças, idosos e pedestres.",""],["1-3-524",1,3,1,33,"O que as Vias Arteriais (limite de 60km/h) têm que te faz parar com frequência, diferentemente das Vias de Trânsito Rápido?","Vários semáforos e faixas de pedestres.",["Acostamentos para paradas improvisadas.","Muita poeira e cascalho.","Velocidade máxima de 80km/h."],"As Arteriais são avenidas importantes, mas possuem cruzamentos e semáforos que exigem paradas frequentes.",""],["1-3-525",1,3,1,34,"Qual o principal risco de improvisar paradas em locais perigosos, como no acostamento sem necessidade?","Coloca em risco outros motoristas que podem se distrair ou precisar desviar.",["Seu carro será rebocado imediatamente.","Você será obrigado a pagar um pedágio.","Seu pneu pode furar se você parar no acostamento."],"A parada indevida no acostamento é um perigo não só para você, mas também para os outros motoristas.",""],["1-3-526",1,3,1,30,"Qual é a condição de experiência necessária para que o condutor possa obter as categorias mais avançadas (Caminhões, Ônibus e Vans)?","Já ter experiência e dominar bem a direção com a habilitação básica (A ou B).",["Ter mais de 30 anos de idade.","Ter uma pontuação perfeita em todos os exames.","Ter tirado a primeira habilitação (PPD) há mais de 5 anos."],"O processo para categorias C, D e E exige que você já seja um condutor experiente nas categorias básicas.",""],["1-3-527",1,3,0,33,"Qual o tipo de via rural que é descrita como não pavimentada, sendo de terra batida ou cascalho, e que exige mais cuidado?","Estradas de Terra.",["Rodovias Pavimentadas.","Vias Arteriais.","Vias de Trânsito Rápido."],"Estradas de Terra são as vias rurais não pavimentadas, ligando fazendas e comunidades rurais.",""],["1-3-528",1,3,0,66,"O que o material afirma ser a atitude que faz toda a diferença no trânsito, ao lado de revisar os equipamentos?","Manter a calma no trânsito.",["Usar o farol alto em todas as vias.","Dirigir o mais rápido possível.","Ignorar a preferência de outros motoristas."],"O cuidado com o veículo (revisão) e o comportamento (manter a calma) andam juntos para a direção segura.",""],["1-3-529",1,3,0,47,"Qual o procedimento correto que o condutor deve adotar ao dirigir sob neblina pesada?","Ligar o farol baixo e os faróis de neblina (se tiver), e nunca usar o farol alto.",["Usar apenas o farol alto, pois ele consegue \"cortar\" melhor a neblina densa.","Desligar todos os faróis para que as luzes não reflitam na neblina e ofusquem o motorista.","Ligar apenas o pisca-alerta e manter a velocidade normal."],"O material instrui que na neblina, deve-se \"Ligar o farol baixo e os faróis de neblina, se tiver. Nunca use farol alto na neblina!\"",""],["1-3-530",1,3,1,53,"Você está em uma viagem longa e começa a sentir os olhos pesados e bocejar muito. Qual o tempo mínimo de descanso recomendado antes de voltar a dirigir?","Parar e descansar no mínimo 20 minutos, além de tomar um café ou lavar o rosto.",["Continuar dirigindo e abrir a janela para que o ar frio o mantenha acordado.","Parar apenas por 5 minutos, o suficiente para uma pequena caminhada.","Parar e tentar ser \"herói\", ignorando os sinais de fadiga. 4"],"O material afirma que, ao sentir fadiga, deve-se \"Descanse 20 minutos, tome um café, lave o rosto.\"",""],["1-3-531",1,3,0,37,"Qual a regra geral de uso que se aplica a todos os dispositivos para crianças (bebê conforto, cadeirinha, assento de elevação)?","Devem ser utilizados sempre no banco traseiro de acordo com a idade e o peso da criança.",["Devem ser utilizados no banco dianteiro, desde que o airbag esteja desligado.","Podem ser utilizados no banco traseiro ou dianteiro, dependendo da conveniência do motorista.","A obrigatoriedade só se aplica a viagens em rodovias, não em perímetros urbanos."],"O texto afirma que os dispositivos devem ser usados \"sempre no banco traseiro de acordo com a idade da criança.\"",""],["1-3-532",1,3,1,36,"Para que o apoio de cabeça seja eficaz em evitar lesões no pescoço, qual deve ser seu posicionamento correto?","Deve ficar na altura do centro da cabeça.",["Deve ficar na altura do pescoço, para suportar a coluna cervical.","Deve ser removido em viagens longas para evitar tensão na nuca.","Deve ficar o mais baixo possível para que a cabeça fique livre para mover-se."],"O apoio deve ficar \"na altura do centro da cabeça, para evitar lesões no pescoço.\"",""],["1-3-533",1,3,0,36,"Qual o tipo de calçado desaconselhado para a condução do veículo?","Chinelos e calçados que não ficam firmes nos pés.",["Botas de cano alto para proteção dos tornozelos.","Tênis esportivo com cadarços apertados.","Sapatos de salto alto, desde que sejam justos no pé."],"O material alerta que \"Chinelos e calçados que não ficam firmes nos pés podem comprometer o uso dos pedais\".",""],["1-3-534",1,3,1,37,"Qual a faixa de idade e peso que exige o uso do dispositivo de retenção Bebê Conforto?","Recém-nascidos e bebês com até 1 ano de idade ou até 13 kg.",["Crianças de 1 a 4 anos ou com peso entre 9 e 18 kg.","Crianças de 4 a 10 anos ou até 1,45 m de altura.","Crianças com mais de 7 anos e meio e mais de 1,45 m."],"O Bebê Conforto é \"Essencial para recém-nascidos e bebês até 1 ano de idade ou 13 kg.\"",""],["1-3-535",1,3,2,37,"O Bebê Conforto deve ser instalado virado para trás. Qual é a justificativa crucial para essa posição?","Protege melhor a cabeça e a coluna vertebral do bebê em caso de colisão.",["Permite que o bebê tenha uma visão completa do trânsito no banco traseiro.","Facilita a instalação no sistema ISOFIX ou cinto de segurança do veículo.","Garante que o bebê receba o ar frio do ar-condicionado frontal."],"A posição de costas \"protege melhor a cabeça e o pescoço do bebê.\"",""],["1-3-536",1,3,1,37,"Qual a faixa de idade e peso recomendada para o uso da Cadeirinha no banco traseiro?","Crianças de 1 a 4 anos ou com peso entre 9 e 18 kg.",["Crianças com até 1 ano ou com peso até 13 kg.","Crianças de 4 a 10 anos ou com peso entre 15 e 36 kg.","Crianças com mais de 10 anos e mais de 1,45 m de altura."],"A Cadeirinha é indicada para \"crianças de 1 a 4 anos ou com peso entre 9 e 18 kg.\"",""],["1-3-537",1,3,1,37,"O uso do Assento de Elevação é obrigatório até qual idade ou altura da criança?","Para crianças de 4 a 10 anos ou até 1,45 m de altura.",["Apenas até os 7 anos e meio, independentemente da altura.","Apenas até a criança atingir 36 kg, independentemente da altura.","O assento de elevação só é obrigatório para crianças com peso acima de 25 kg."],"O Assento de Elevação é para crianças \"de 4 a 10 anos ou até 1,45 m de altura.\"",""],["1-3-538",1,3,2,37,"Transportar crianças sem os dispositivos de retenção adequados ou de forma incorreta constitui qual tipo de infração de trânsito, segundo a legislação?","Infração gravíssima, com 7 pontos na CNH, multa e retenção do veículo.",["Infração média, com 4 pontos na CNH e multa, mas sem retenção do veículo.","Infração grave, com 5 pontos na CNH, multa e apenas advertência por escrito.","Infração leve, com 3 pontos na CNH e retenção do veículo."],"O material lista as consequências legais: \"infração gravíssima, com 7 pontos na CNH, multa e retenção do veículo.\"",""],["1-3-539",1,3,2,35,"O que a inércia faz com o corpo dos ocupantes de um veículo em caso de colisão?","Faz com que seu corpo continue se movendo na velocidade original do veículo.",["Faz com que seu corpo se fixe imediatamente ao assento, amortecendo o impacto.","Faz com que a força do impacto seja distribuída apenas no ombro.","Faz com que o airbag infle mais lentamente, protegendo o ocupante."],"O texto explica: \"Em uma colisão, a inércia faz com que seu corpo continue se movendo na velocidade original do veículo.\"",""],["1-3-540",1,3,0,35,"Quais são as três partes mais resistentes do corpo pelas quais o cinto de três pontos foi projetado para distribuir a força do impacto?","Ombros, tórax e pélvis.",["Pescoço, barriga e joelhos.","Braços, pernas e cabeça.","Mãos, pés e cotovelos."],"O cinto foi projetado para distribuir a força nas partes mais resistentes do corpo: \"ombros, tórax e pélvis.\"",""],["1-3-541",1,3,1,35,"Qual o procedimento crucial sobre a Faixa Subabdominal do cinto de segurança, especialmente para mulheres grávidas?","Deve repousar sobre os ossos do quadril (pélvis), e nunca sobre o abdômen.",["Deve ser afrouxada para que não pressione o abdômen durante o impacto.","Deve ser passada sobre o centro da barriga para proteger a região.","Deve ser totalmente ignorada, usando apenas a faixa diagonal."],"A faixa subabdominal deve ser posicionada sobre os ossos do quadril, \"sempre por baixo do abdômen, inclusive no caso de mulheres grávidas.\"",""],["1-3-542",1,3,0,35,"Por que o motorista deve evitar usar o cinto de segurança com roupas volumosas?","Roupas volumosas podem comprometer sua eficácia, pois o cinto deve estar justo ao corpo.",["Roupas volumosas são desconfortáveis e limitam a mobilidade do motorista.","O cinto de segurança não consegue travar se houver excesso de roupa.","A faixa diagonal irá deslizar sobre as roupas e não proteger o ombro."],"O cinto deve estar \"justo ao corpo, sem folgas. Roupas volumosas podem comprometer sua eficácia.\"",""],["1-3-543",1,3,2,35,"Qual a regra de segurança sobre a Faixa Diagonal do cinto em relação ao braço do ocupante?","Deve passar sobre o ombro e atravessar o centro do tórax, nunca por baixo do braço.",["Pode ser passada por baixo do braço para evitar atrito no pescoço.","Deve ser colocada abaixo da axila para manter o braço em posição de defesa.","Deve passar na altura do pescoço, desde que não esteja justa demais."],"A faixa diagonal deve passar pelo ombro e tórax, \"nunca por baixo do braço\".",""],["1-3-544",1,3,1,36,"Qual a principal função do Airbag no veículo?","Reduzir significativamente os danos em caso de impacto, complementando a ação do cinto.",["Substituir o cinto de segurança, sendo eficaz mesmo se o cinto não estiver afivelado.","Evitar o sinistro, pois ele aciona uma frenagem automática de emergência.","Ser o único responsável por manter o ocupante na posição correta durante a colisão."],"O Airbag \"não evita o sinistro, mas reduz significativamente os danos em caso de impacto, complementando a ação do cinto.\"",""],["1-3-545",1,3,2,36,"O que ocorre e qual o risco quando o airbag é acionado e o ocupante está sem o cinto de segurança?","Ocupante pode colidir com o airbag ainda em expansão, aumentando o risco de lesões graves ou fatais. 45",["O airbag amortece o corpo, mas o ocupante é lançado para fora do carro.","O sistema de airbag não é acionado, pois não detecta a presença de passageiro.","O airbag infla normalmente e o ocupante é mantido na posição correta."],"Sem o cinto, o corpo é lançado para frente e \"o ocupante pode colidir co
