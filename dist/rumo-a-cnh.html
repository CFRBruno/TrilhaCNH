ade e redobrar a atenção.",["Ultrapassar o trator rapidamente.","Acelerar para sair da área rural.","Ligar o farol alto."],"Máquinas agrícolas se movem devagar, exigindo paciência e cuidado dos demais condutores.","A-31"],["1-1-150",1,1,0,3,"Qual deve ser a primeira atitude ao ver essa placa?","Reduzir a velocidade e observar os dois lados.",["Acelerar para passar antes dos outros carros.","Buzinar e seguir em frente.","Parar o veículo no meio da pista."],"Reduzir e observar garante tempo para evitar colisões.","A-6"],["1-1-151",1,1,0,2,"Qual deve ser o comportamento do condutor ao ver essa placa antes de entrar na rotatória?","Seguir no sentido indicado e ceder passagem a quem já estiver circulando.",["Parar completamente antes de entrar.","Entrar pela contramão se a via estiver livre.","Ultrapassar os veículos mais lentos."],"O CTB exige respeito à preferência dos veículos que já estão na rotatória.","R-33"],["1-1-153",1,1,0,3,"Qual é a conduta segura ao se aproximar da placa acima?","Reduzir levemente a velocidade e manter o veículo na faixa de rolamento.",["Acelerar antes da curva.","Frear bruscamente dentro da curva.","Transitar no acostamento."],"A antecipação da redução evita perda de aderência e mantém o controle direcional.","A-2b"],["1-1-154",1,1,0,3,"Qual é a função principal da placa acima?","Advertir sobre o início de divisão física da pista.",["Indicar redução de pista.","Avisar sobre pedágio.","Anunciar obra na pista."],"A sinalização prepara o condutor para a nova configuração da via.","A-42c"],["1-1-155",1,1,0,2,"Qual é a função principal da placa acima?","Regular a velocidade máxima de segurança para o local.",["Avisar sobre pedágios.","Indicar radar escondido.","Identificar a pista da direita."],"A placa R-19 busca compatibilizar segurança e fluidez do trânsito.","R-19"],["1-1-156",1,1,0,2,"Qual é a principal função da placa acima?","Organizar o tráfego e reduzir conflitos entre veículos leves e pesados.",["Alertar sobre lombadas.","Indicar ponto de parada de ônibus.","Proibir ultrapassagem."],"Mantendo veículos pesados à direita, evita lentidão nas faixas de ultrapassagem.","R-27"],["1-1-157",1,1,0,3,"Qual é o principal risco ao ignorar a placa acima?","Colisão frontal com veículos em sentido contrário.",["Estouro de pneu.","Pane elétrica.","Gasto excessivo de combustível."],"A falta de atenção ao fim da pista dupla pode resultar em ultrapassagem perigosa e choque frontal.","A-42b"],["1-1-158",1,1,0,2,"Qual é o principal risco ao ignorar essa placa?","Colisão frontal com veículos que trafegam no sentido contrário.",["Atraso no trajeto.","Perda de tempo em filas.","Multa por excesso de velocidade."],"A desatenção pode levar a acidentes graves por invasão da contramão.","R-28"],["1-1-159",1,1,0,3,"Qual é o risco principal em curvas seguidas como indicado na placa acima?","O motorista perder o controle do carro se estiver muito rápido.",["O carro desligar o motor.","O consumo de combustível aumentar.","O farol apagar."],"A força centrífuga aumenta nas curvas e pode empurrar o carro para fora da pista.","A-5a"],["1-1-160",1,1,0,2,"Qual manobra é proibida na presença dessa placa?","Virar à esquerda.",["Seguir em frente.","Virar à direita.","Parar na via."],"A placa proíbe conversão à esquerda e retorno.","R-25d"],["1-1-161",1,1,0,2,"Qual manobra é proibida onde há a placa acima?","Virar à direita.",["Seguir em frente.","Virar à esquerda.","Parar o veículo."],"Essa sinalização impede a conversão à direita no ponto indicado.","R-25c"],["1-1-162",1,1,0,2,"Qual o objetivo principal da placa acima?","Organizar o fluxo e evitar conflitos de tráfego.",["Avisar sobre obras na pista.","Permitir o estacionamento.","Indicar pedágio."],"Essa sinalização reduz riscos de colisões frontais e garante circulação ordenada.","R-24a"],["1-1-163",1,1,0,2,"Qual o principal objetivo da placa acima?","Garantir prioridade ao transporte coletivo de passageiros.",["Facilitar o trânsito de caminhões.","Aumentar o fluxo de automóveis.","Indicar ponto turístico."],"A prioridade ao transporte coletivo melhora a mobilidade urbana e reduz o congestionamento.","R-32"],["1-1-164",1,1,0,2,"Qual o principal objetivo da placa acima?","Garantir segurança e organização entre pedestres e ciclistas.",["Indicar um ponto de parada de ônibus.","Avisar sobre obras na pista.","Alertar para curva acentuada."],"A separação física e visual reduz riscos de atropelamento e colisão lateral.","R-35"],["1-1-165",1,1,0,3,"Qual o principal objetivo desta placa?","Evitar que o motorista entre por engano e tenha dificuldade de sair.",["Indicar rua preferencial.","Mostrar via de alta velocidade.","Avisar sobre lombadas."],"A sinalização evita confusão, congestionamentos e manobras indevidas.","A-45"],["1-1-166",1,1,0,2,"Quando o condutor encontra a placa acima, ele:","Deve seguir em frente, sem realizar conversões.",["Pode virar à direita.","Deve parar imediatamente.","Pode fazer retorno."],"A placa indica a única direção permitida naquele ponto da via.","R-26"],["1-1-167",1,1,0,2,"Quando o condutor encontra essa placa, ele deve:","Sinalizar e virar à direita no ponto indicado.",["Parar antes da esquina.","Virar à esquerda.","Seguir em frente."],"A seta define a direção obrigatória a ser seguida pelo veículo.","R-25b"],["1-1-168",1,1,0,3,"Quando o motorista vê essa placa, o que deve fazer?","Reduzir a velocidade e se preparar para parar.",["Acelerar para passar antes dos outros.","Frear bruscamente no local da placa.","Parar sobre a faixa de pedestres."],"A sinalização de advertência serve para antecipar a parada obrigatória.","A-15"],["1-1-169",1,1,0,2,"Rafaela dirige e vê a placa acima antes de uma praça com pedestres. Por que essa placa foi colocada ali?","Para proteger pedestres e evitar riscos em áreas de convivência.",["Porque há radar fixo.","Porque o piso é de paralelepípedo.","Porque é área de estacionamento rotativo."],"Essa placa é comum em áreas de lazer, praças e calçadões, garantindo segurança aos pedestres.","R-10"],["1-1-170",1,1,0,2,"Rita estaciona seu carro em uma vaga sinalizada com a placa acima e uma placa auxiliar “1 hora – rotativo”. O que ela deve fazer?","Permanecer no local por, no máximo, 1 hora.",["Estacionar o dia todo, se houver vaga.","Deixar o carro à noite sem controle de tempo.","Usar a vaga apenas se for moradora da rua."],"A placa “E” indica estacionamento permitido, mas a placa auxiliar define as condições, como o tempo máximo de permanência.","R-6b"],["1-1-171",1,1,0,2,"Rogério conduz um caminhão com peso total de 12 toneladas e vê a placa acima. O que deve fazer?","Não prosseguir e procurar rota alternativa.",["Seguir com cuidado.","Reduzir a velocidade e passar assim mesmo.","Encostar e descarregar parte da carga."],"A placa R-14 indica o limite máximo de peso bruto total permitido no trecho. Veículos acima desse limite não podem transitar.","R-14"],["1-1-172",1,1,0,2,"Rogério dirige em uma avenida movimentada e vê a placa acima. Ele deseja voltar no sentido contrário. O que deve fazer?","Seguir em frente até encontrar sinalização que permita o retorno.",["Parar no canteiro central e aguardar oportunidade.","Retornar com cuidado, se não houver trânsito.","Dar ré até o cruzamento anterior."],"Mesmo que pareça seguro, o retorno é proibido. O motorista deve buscar o próximo ponto permitido.","R-5a"],["1-1-173",1,1,0,2,"Rogério dirige em uma rodovia e vê a placa acima. O que deve fazer?","Manter-se atrás do veículo à frente até o fim do trecho sinalizado.",["Ultrapassar devagar, se houver espaço.","Acelerar para ultrapassar rapidamente.","Usar o acostamento para ganhar tempo."],"A placa acima proíbe toda ultrapassagem até o ponto em que a sinalização indicar o fim da restrição.","R-7"],["1-1-174",1,1,0,2,"Rogério passa por um hospital e vê a placa acima. O que ele deve fazer?","Evitar qualquer uso de buzina, para não causar ruído desnecessário.",["Buzinar brevemente para alertar pedestres.","Aumentar o volume do som.","Acelerar para sair rápido da área."],"O uso de buzina é proibido em áreas sensíveis, como hospitais e escolas.","R-20"],["1-1-175",1,1,0,1,"A forma octogonal da placa “PARE” tem como objetivo:","Ser reconhecida facilmente.",["Indicar um tipo de serviço.","Mostrar que é uma placa temporária.","Reduzir o custo de fabricação."],"O formato octogonal é exclusivo da R-1 para garantir alta identificação visual em qualquer ângulo.",""],["1-1-176",1,1,1,3,"Ao entrar em uma curva indicada pela placa acima, com excesso de velocidade, o veículo tende a:","Seguir reto.",["Fazer a curva com mais facilidade.","Reduzir automaticamente a tração.","Girar sobre o próprio eixo."],"A força centrífuga empurra o veículo para fora da curva, especialmente à direita.","A-2b"],["1-1-177",1,1,1,2,"Beatriz estaciona rapidamente com o pisca-alerta ligado em local com a placa acima. Essa ação é permitida?","Não, pois o pisca-alerta não autoriza desrespeitar a proibição.",["Sim, se o tempo for inferior a 5 minutos.","Sim, desde que permaneça dentro do carro.","Sim, se não houver fiscalização."],"A sinalização deve ser obedecida independentemente do tempo ou da presença de agentes.","R-6a"],["1-1-178",1,1,1,2,"Bruno deseja deixar um passageiro em local com a placa acima. O que ele deve fazer?","Seguir até um ponto onde a parada seja permitida.",["Parar rapidamente e liberar o passageiro.","Estacionar com o pisca-alerta ligado.","Reduzir e parar sobre a calçada."],"Essa placa não permite qualquer parada, devendo o condutor procurar local autorizado.","R-6c"],["1-1-179",1,1,1,2,"Carlos dirige à noite e vê a placa acima antes de uma curva acentuada. Por que essa proibição existe?","Porque a visibilidade é reduzida e não há campo de visão suficiente para a manobra.",["Porque há radar fixo mais adiante.","Porque é área urbana.","Porque a pista é larga."],"A placa evita manobras perigosas em locais onde a visibilidade é comprometida.","R-7"],["1-1-180",1,1,1,2,"Carlos dirige um automóvel e encontra a placa acima com a inscrição “Exceto veículos de emergência”. O que significa?","Somente ambulâncias, viaturas policiais e bombeiros podem circular naquele local.",["Todos os carros podem entrar.","Caminhões também estão liberados.","É apenas sinalização educativa."],"As exceções descritas em placas complementares indicam permissão restrita a veículos em serviço público essencial.","R-10"],["1-1-181",1,1,1,2,"César vê a placa acima junto de outra com o texto “Exceto veículos de emergência”. O que isso significa?","Somente ambulâncias, bombeiros e viaturas em serviço podem fazer o retorno.",["Todos os veículos podem retornar.","A placa está desativada.","A proibição é temporária."],"A placa complementar cria exceção específica autorizada pelo órgão de trânsito.","R-5b"],["1-1-182",1,1,1,2,"Como a placa acima contribui para a segurança viária?","Mantendo previsibilidade e separação de fluxos entre veículos leves e pesados.",["Diminuindo a fiscalização eletrônica.","Reduzindo a necessidade de sinalização vertical.","Incentivando ultrapassagens em curva."],"Ordena o tráfego e reduz zonas de conflito em pistas de múltiplas faixas.","R-27"],["1-1-183",1,1,1,2,"Eduardo estaciona seu carro sobre uma calçada com a placa acima próxima. O que diz a lei?","É infração grave estacionar sobre passeio, mesmo sem placa específica.",["É permitido se não atrapalhar pedestres.","Só é proibido se houver sinalização vertical.","É infração leve."],"O CTB proíbe estacionar sobre calçadas, e a placa reforça a regra geral de segurança e acessibilidade.","R-6a"],["1-1-184",1,1,1,3,"Em pista molhada, qual é a conduta segura ao encontrar essa sinalização?","Reduzir mais a velocidade e evitar movimentos bruscos no volante.",["Manter a velocidade e frear com força no meio da curva.","Ligar o pisca-alerta e parar.","Utilizar apenas o freio de mão."],"A aderência diminui e a curva torna-se mais perigosa em piso molhado.","A-1a"],["1-1-185",1,1,1,2,"Em qual local urbano é mais comum a presença dessa placa?","Em corredores exclusivos, avenidas com faixas de ônibus e terminais urbanos.",["Em áreas escolares.","Em zonas rurais.","Em rodovias federais."],"É usada para garantir eficiência ao transporte coletivo urbano.","R-32"],["1-1-186",1,1,1,2,"Em qual situação a velocidade deve ser reduzida mesmo abaixo da indicada na placa?","Sob chuva, neblina, buracos ou presença de pedestres.",["Quando o veículo está novo.","Apenas à noite.","Quando não há radares."],"A velocidade deve sempre ser compatível com as condições da via e da visibilidade.","R-19"],["1-1-187",1,1,1,3,"Em qual situação é mais comum encontrar essa placa?","Antes de cruzamentos com pouca visibilidade.",["No início de pontes largas.","Em trechos de ultrapassagem.","Perto de postos de combustível."],"A advertência aumenta a segurança em locais de risco de colisão.","A-15"],["1-1-188",1,1,1,2,"Em uma rua sinalizada com “Sentido Proibido”, o motorista deve:","Respeitar a proibição e buscar o sentido permitido.",["Seguir em frente apenas para estacionar.","Usar o acostamento para continuar.","Fazer conversão proibida."],"O respeito à placa mantém o fluxo seguro e evita colisões frontais com quem vem no sentido correto.",""],["1-1-189",1,1,1,2,"Juliana vê a placa acima acompanhada de outra placa logo abaixo com a inscrição “Exceto ônibus”. O que isso significa?","Apenas os ônibus podem realizar a conversão.",["Todos os veículos estão liberados.","A proibição é temporária.","Que apenas ônibus estão proibidos de fazer a conversão."],"A placa complementar delimita a exceção para transporte coletivo, válida conforme regulamentação local.","R-4b"],["1-1-190",1,1,1,2,"Juliana vê a placa acima acompanhada de uma faixa contínua dupla no pavimento. O que essa combinação indica?","Que a proibição de ultrapassar é inrtanto pela sinalização vertical quanto pela horizontal.",["Que pode ultrapassar se houver espaço.","Que vale apenas para caminhões.","Que a faixa é apenas decorativa."],"A sinalização horizontal complementa a vertical, reforçando a proibição total de ultrapassagem.","R-7"],["1-1-191",1,1,1,2,"Marcos conduz um caminhão e encontra a placa acima acompanhada da inscrição “Das 7h às 20h”. O que isso significa?","A proibição vale apenas dentro do horário indicado.",["É proibido trafegar 24 horas.","A placa é apenas educativa.","Que ele pode travegar livremente."],"As placas auxiliares definem horários específicos de restrição de circulação.","R-9"],["1-1-192",1,1,1,2,"Marina dirige em um aclive e encontra a placa acima. Qual é o principal risco de desobedecê-la?","Colidir frontalmente com veículo vindo no sentido contrário.",["Ser multada apenas.","Gastar mais combustível.","Perder o controle da direção."],"Nos aclives, o campo de visão é reduzido e a ultrapassagem pode causar colisões frontais.","R-7"],["1-1-193",1,1,1,2,"Marina está em local com a placa acima acompanhada de uma placa auxiliar “Das 7h às 19h”. Às 21h, ela estaciona. Está correta?","Sim, pois a restrição vale apenas no horário indicado.",["Não, a proibição é para 24 horas.","Apenas se for moradora da rua.","Somente se deixar o pisca-alerta ligado."],"Placas complementares definem restrições por faixa horária, fora do horário, o estacionamento é permitido.","R-6a"],["1-1-194",1,1,1,40,"O condutor que deseja fazer o retorno em local sinalizado com “Proibido virar à esquerda” deve:","Seguir até um ponto onde o retorno seja permitido.",["Fazer o retorno imediatamente, com cuidado.","Parar e pedir orientação a pedestres.","Realizar a manobra de marcha a ré."],"A proibição de virar à esquerda inclui o ato de retornar. O motorista deve prosseguir até o próximo ponto liberado.",""],["1-1-195",1,1,0,2,"O fundo vermelho e as letras brancas da placa “PARE” significam:","Proibição e ordem obrigatória de parada total.",["Alerta de obras na via.","Indicação de preferência.","Orientação de trajeto alternativo."],"A cor vermelha nas placas de regulamentação indica proibição ou obrigação, reforçando a ordem de parada.",""],["1-1-196",1,1,1,2,"O que a placa acima e a placa de sentido de circulação pela esquerda têm em comum?","Ambas determinam o movimento obrigatório dos veículos.",["Ambas indicam perigo de curva.","Ambas liberam estacionamento.","Ambas têm formato retangular."],"Ambas são de regulamentação e orientam o sentido de fluxo.","R-25b"],["1-1-197",1,1,1,2,"O que acontece se o condutor circular na rotatória no sentido contrário ao indicado pela placa acima?","Comete infração grave e põe em risco os demais usuários.",["Apenas recebe advertência verbal.","É permitido em horários de pouco movimento.","Nenhuma consequência."],"Circular no sentido contrário da via é infração grave, conforme art. 186, inciso I, do CTB.","R-33"],["1-1-198",1,1,1,2,"O que o pedestre deve fazer ao ver essa placa acima?","Caminhar pelo lado esquerdo da via compartilhada.",["Andar livremente pela faixa de ciclista.","Atravessar no meio da pista.","Caminhar em qualquer sentido."],"A divisão da circulação facilita a previsibilidade de movimentos.","R-35"],["1-1-199",1,1,1,3,"O que representa o comportamento seguro ao ver esta placa?","Atenção redobrada, velocidade reduzida e empatia com quem atravessa.",["Pressa e buzina.","Disputa de espaço com o pedestre.","Uso do farol alto."],"A direção defensiva valoriza a vida e evita atropelamentos.","A-32a"],["1-1-200",1,1,1,3,"Onde existe essa placa, se o condutor quiser seguir em frente, o que deve lembrar?","Que a via termina e ele deve obrigatoriamente virar.",["Que pode continuar reto se for de madrugada.","Que o cruzamento é preferencial para ele.","Que o trecho é de ultrapassagem livre."],"A interseção em “T” indica o fim da pista — seguir reto é perigoso e proibido.","A-8"],["1-1-201",1,1,1,2,"Por que a placa acima é essencial para a segurança viária?","Porque alerta o condutor sobre o risco de veículos em sentido contrário.",["Porque indica área de pedágio.","Porque proíbe paradas de ônibus.","Porque mostra o limite de peso da via."],"Essa informação evita colisões frontais e ultrapassagens perigosas.","R-28"],["1-1-202",1,1,1,2,"Por que a placa acima é fundamental em rodovias de pista simples com ilhas de refúgio?","Porque impede que veículos invadam a faixa contrária durante o contorno.",["Porque indica estacionamento.","Porque aumenta o limite de velocidade.","Porque substitui o guard rail."],"A obediência à direção de passagem previne colisões frontais.","R-24b"],["1-1-203",1,1,1,2,"Por que as placas semelhantes a esta acima podem ter diferentes valores em um mesmo trajeto?","Porque o limite é ajustado conforme o tipo de via, tráfego e entorno.",["Porque são colocadas aleatoriamente.","Porque indicam o limite mínimo.","Porque servem apenas de orientação."],"As condições locais determinam o limite adequado de velocidade.","R-19"],["1-1-204",1,1,1,2,"Por que as ultrapassagens são mais perigosas em vias com a placa acima?","Porque há risco de colisão com veículos que vêm no sentido oposto.",["Porque há menos curvas.","Porque o trânsito é mais lento.","Porque há pedestres em excesso."],"Em mão dupla, o cálculo errado de tempo e distância causa sinistros fatais.","R-28"],["1-1-205",1,1,1,3,"Por que é importante manter atenção redobrada no tipo de cruzamento indicado por essa placa?","Porque veículos podem vir em alta velocidade pela via transversal.",["Porque a placa é difícil de ver.","Porque o asfalto é sempre molhado.","Porque o cruzamento é automático."],"Muitos sinistros ocorrem por falta de observação lateral.","A-8"],["1-1-206",1,1,1,2,"Por que é importante o uso da placa acima?","Para orientar a convivência segura entre pedestres e ciclistas.",["Para restringir o uso de bicicletas.","Para proibir o trânsito de pedestres.","Para aumentar a velocidade dos ciclistas."],"Ela visa reduzir conflitos e promover segurança no trânsito não motorizado.","R-44"],["1-1-207",1,1,1,2,"Por que é importante respeitar a placa acima em túneis e passagens subterrâneas?","Porque o desrespeito pode causar colisão da carga contra o teto, colocando em risco todos os usuários.",["Porque o ar é mais úmido nesses locais.","Porque há pedágio próximo.","Porque é área de fiscalização."],"O excesso de altura pode causar sinistros e danos estruturais, exigindo interdição da via.","R-15"],["1-1-208",1,1,1,2,"Por que é importante respeitar o sentido de circulação indicado pela placa acima em áreas urbanas?","Porque evita conflitos entre fluxos opostos e atropelamentos.",["Porque ajuda a encontrar vagas de estacionamento.","Porque melhora o som do motor.","Porque reduz o gasto de combustível."],"O respeito ao sentido correto garante a previsibilidade do comportamento dos condutores.","R-24a"],["1-1-209",1,1,1,3,"Por que essa placa é importante em locais com curvas ou subidas?","Porque o motorista pode não ver o semáforo a tempo.",["Porque indica radar.","Porque mostra o limite de velocidade.","Porque indica o fim da pista."],"A sinalização antecipada evita freadas bruscas em locais de pouca visibilidade.","A-14"],["1-1-210",1,1,1,3,"Por que não se deve ultrapassar em trechos com essa placa?","Porque veículos podem entrar repentinamente pela esquerda.",["Porque o carro pode perder a direção.","Porque o piso sempre é irregular.","Porque é um local de pedágio."],"A ultrapassagem aumenta o risco de colisão com quem entra na pista.","A-7a"],["1-1-211",1,1,1,3,"Por que o condutor deve manter distância de segurança em uma curva à direita, conforme indicado pela placa acima?","Porque a visibilidade é reduzida e a trajetória pode se estreitar.",["Porque o veículo da frente acelera automaticamente.","Porque o limite de velocidade aumenta.","Porque o consumo de combustível diminui."],"A visibilidade limitada e a geometria da curva exigem mais espaço de reação.","A-2b"],["1-1-212",1,1,1,2,"Por que respeitar a placa acima é importante em rodovias com túneis e viadutos?","Porque o desrespeito pode causar colisão lateral e danificar as estruturas.",["Porque evita multas de excesso de velocidade.","Porque reduz o ruído urbano.","Porque facilita o estacionamento."],"Veículos muito largos podem atingir paredes, muretas e colunas de sustentação.","R-16"],["1-1-214",1,1,1,2,"Qual comportamento seguro o condutor deve adotar após avistar essa placa?","Manter-se na faixa da direita e redobrar a atenção aos veículos do sentido oposto.",["Aumentar a velocidade para sair rápido da área.","Ultrapassar logo após a placa.","Transitar pelo acostamento."],"O tráfego bidirecional exige maior cautela e redução de velocidade.","R-28"],["1-1-215",1,1,1,3,"Qual é a principal diferença entre a placa de lombada e a de pista irregular?","A de lombada indica uma elevação isolada, a de pista irregular indica vários desníveis.",["A de lombada é vermelha.","A de pista irregular obriga a parar.","As duas têm o mesmo significado."],"A lombada é um obstáculo único, a pista irregular representa desníveis contínuos.","A-18"],["1-1-216",1,1,1,2,"Qual é o comportamento correto ao encontrar essa placa?","Reduzir a velocidade e escolher entre seguir em frente ou virar à esquerda, sinalizando a manobra.",["Seguir em frente sem atenção.","Virar à direita rapidamente.","Parar o veículo antes da placa."],"A decisão deve ser tomada com segurança e comunicação prévia.","R-25c"],["1-1-217",1,1,1,2,"Qual é o comportamento correto ao se deparar com a placa acima?","Manter-se à direita e respeitar a via.",["Invadir a contramão para cortar caminho.","Aumentar a velocidade em curva.","Seguir à esquerda."],"Invadir a contramão é infração gravíssima e coloca vidas em risco.","R-23"],["1-1-218",1,1,1,3,"Qual o erro mais comum cometido por condutores em curvas acentuadas como a indicada pela placa acima?","Entrar na curva em velocidade superior à recomendada.",["Ligar o farol alto.","Desligar o motor para economizar combustível.","Acionar o limpador de para-brisa."],"O excesso de velocidade é a principal causa de saídas de pista em curvas.","A-1b"],["1-1-219",1,1,1,2,"Qual o objetivo principal da placa acima?","Proteger ciclistas e garantir a convivência segura entre modais.",["Facilitar o tráfego de automóveis.","Reservar estacionamento de motos.","Evitar o uso de bicicletas."],"Promove segurança e incentivo ao transporte não motorizado.","R-34"],["1-1-221",1,1,1,2,"Qual o risco de veículos leves usarem uma via sinalizada com a placa acima?","Aumento da probabilidade de colisões com caminhões.",["Redução de riscos.","Melhoria da fluidez geral.","Nenhum risco significativo."],"A diferença de tamanho e peso aumenta o risco de acidentes graves.","R-39"],["1-1-222",1,1,1,2,"Quando há duas placas de velocidade diferentes, uma para automóveis e outra para caminhões, o motorista deve:","Obedecer ao limite correspondente ao seu tipo de veículo.",["Escolher o limite maior.","Manter o dobro da menor.","Ignorar ambas."],"O limite varia conforme a categoria do veículo, a via e as condições locais.","R-19"],["1-1-223",1,1,1,3,"Quando passar por uma placa como essa e em seguida encontrar um semáforo que estiver intermitente (piscando em amarelo), o que o condutor deve fazer?","Reduzir a velocidade e prosseguir com atenção.",["Acelerar para aproveitar o sinal.","Parar obrigatoriamente.","Ignorar o sinal."],"O amarelo intermitente alerta para atenção redobrada no cruzamento.","A-14"],["1-1-224",1,1,1,2,"Que atitude deve ter o motorista de carro ao ver essa placa?","Não entrar ou circular na faixa exclusiva de ônibus.",["Utilizar a faixa para ultrapassar.","Acelerar para sair rapidamente.","Parar sobre a faixa."],"O respeito à exclusividade evita multas e melhora o transporte coletivo.","R-32"],["1-1-225",1,1,1,2,"Renata vê a placa acima próxima à entrada de um túnel. Por que a manobra é proibida nesse local?","Porque o espaço é reduzido e a visibilidade lateral é limitada.",["Porque o túnel é iluminado.","Porque há radar de velocidade.","Porque o piso é de concreto."],"Nos túneis, as mudanças de faixa aumentam o risco de colisões devido à pouca visibilidade e à proximidade entre veículos.","R-8b"],["1-1-226",1,1,1,2,"Ricardo dirige à noite e percebe a placa acima próxima a uma saída de túnel. Qual é o motivo da proibição?","Garantir a fluidez e evitar cruzamentos de trajetórias na saída.",["Indicar local de fiscalização eletrônica.","Indicar fim de pista dupla.","Liberar ultrapassagens."],"Mudanças bruscas de faixa em saídas de túnel causam colisões laterais e congestionamentos.","R-8a"],["1-1-227",1,1,1,2,"Ricardo trafega à noite e vê a placa acima em um trecho de pista simples. O que deve fazer?","Continuar no sentido da via e só retornar onde for permitido.",["Fazer o retorno com farol alto.","Aguardar no meio da pista para virar.","Encostar no acostamento e manobrar."],"Mesmo com pouca movimentação, a sinalização deve ser respeitada para evitar colisões frontais.","R-5a"],["1-1-228",1,1,1,2,"Se o condutor avança por engano em uma rua com a placa “Sentido proibido”, o que deve fazer imediatamente?","Parar em local seguro e retornar ao sentido permitido.",["Continuar até o fim da via.","Dar marcha a ré no meio da pista.","Ignorar e seguir normalmente."],"A manobra deve ser feita com segurança, evitando risco a outros usuários e sempre retornando ao trajeto correto.",""],["1-1-229",1,1,1,2,"Tiago encontra a placa acima acompanhada da inscrição “Exceto táxi”. O que isso significa?","Somente táxis podem estacionar naquele local.",["A proibição vale para todos, inclusive táxis.","Apenas táxis estão proibidos.","O estacionamento é livre à noite."],"A placa complementar cria exceção regulamentada pelo órgão de trânsito, válida apenas aos veículos indicados.","R-6a"],["1-1-230",1,1,0,13,"O que o condutor deve fazer antes mesmo de ligar o carro?","Verificar itens básicos como pneus, freios e o cinto de segurança.",["Conferir se o rádio está funcionando.","Testar o som e o ar-condicionado.","Ajustar o banco apenas depois de sair da garagem."],"A checagem prévia do veículo evita problemas e sinistros. É o primeiro passo de um condutor responsável.",""],["1-1-231",1,1,1,10,"Quando o semáforo está verde, mas um agente de trânsito manda parar, o que o motorista deve fazer?","Obedecer ao agente de trânsito.",["Seguir porque o sinal está aberto.","Aguardar o agente sair da via.","Buzinar para avisar que o sinal está verde."],"Existe uma hierarquia na sinalização. A ordem do agente prevalece sobre o semáforo ou a placa.",""],["1-1-232",1,1,0,17,"Em uma faixa de pedestres, quem tem prioridade?","O pedestre que atravessa ou demonstra intenção de atravessar.",["O veículo maior.","Quem estiver com mais pressa.","O ciclista, sempre."],"A prioridade é sempre do pedestre. O motorista deve reduzir e, se necessário, parar completamente.",""],["1-1-233",1,1,1,8,"Qual é a função da sinalização cicloviária?","Garantir espaço seguro para os ciclistas.",["Restringir a circulação de bicicletas.","Servir apenas de decoração urbana.","Indicar locais de estacionamento."],"A sinalização cicloviária delimita ciclovias e ciclofaixas, promovendo respeito e segurança aos ciclistas.",""],["1-1-234",1,1,1,9,"Por que a cor laranja é usada nas sinalizações temporárias?","Porque é uma cor visível e chama atenção para algo diferente na via.",["Porque combina com o ambiente urbano.","Porque representa tranquilidade.","Porque é a cor padrão das placas educativas."],"A cor laranja se destaca de todas as outras e alerta que há mudanças temporárias na via.",""],["1-1-235",1,1,0,7,"Quando o motorista encontra um semáforo piscando em amarelo, o que deve fazer?","Reduzir a velocidade e seguir com atenção.",["Parar completamente até o sinal mudar.","Acelerar para passar logo.","Esperar outro motorista indicar o que fazer."],"O amarelo piscante indica atenção redobrada — o condutor deve reduzir e prosseguir com cuidado.",""],["1-1-236",1,1,1,5,"Por que a sinalização horizontal (pinturas no chão) é tão importante?","Porque orienta o fluxo e define o espaço de cada usuário da via.",["Porque serve apenas como enfeite.","Porque substitui as placas verticais.","Porque mostra apenas os limites de velocidade."],"As linhas, setas e faixas pintadas no solo organizam o trânsito e indicam condutas seguras.",""],["1-1-237",1,1,1,2,"O que acontece quando um motorista ignora uma placa de regulamentação?","Comete uma infração e coloca vidas em risco.",["Nada, se não houver fiscalização.","Apenas recebe uma advertência verbal.","Fica livre para escolher o que fazer."],"As placas de regulamentação são ordens obrigatórias; desrespeitá-las é infração e ameaça à segurança.",""],["1-1-238",1,1,2,5,"Por que conhecer o “código das cores” da sinalização horizontal é essencial?","Porque cada cor transmite uma mensagem específica sobre o uso da via.",["Porque ajuda apenas em vias urbanas.","Porque deixa o asfalto mais bonito.","Porque substitui as placas de regulamentação."],"As cores e tipos de linha indicam onde é permitido ultrapassar, parar ou dividir faixas, e garantem ordem no trânsito.",""],["1-1-239",1,1,2,10,"Quando há mensagens conflitantes entre placas, faixas e semáforo, o que o condutor deve fazer?","Seguir a hierarquia da sinalização.",["Escolher o que achar mais conveniente.","Priorizar sempre o semáforo.","Seguir o veículo à frente."],"O Código de Trânsito Brasileiro estabelece uma hierarquia clara — em caso de conflito, deve-se obedecer primeiro ao agente, depois ao semáforo, e por último às placas e marcas no solo.",""],["1-1-240",1,1,0,2,"O que caracteriza as placas de regulamentação?","Elas impõem regras que devem ser obedecidas.",["São sinais apenas informativos.","Servem só para enfeitar as vias.","São usadas apenas em rodovias."],"Porque impõem regras obrigatórias e desrespeitá-las é infração.",""],["1-1-241",1,1,0,1,"Qual formato é comumente associado às placas de advertência?","Losango (diamante), geralmente amarelas.",["Retangular horizontal, geralmente azul.","Circular, com borda vermelha.","Quadrada e marrom."],"O losango amarelo alerta sobre perigos ou mudanças à frente.",""],["1-1-242",1,1,1,4,"As placas verdes são mais usadas para:","Indicar direções, cidades e distâncias em rodovias.",["Indicar serviços como postos e hotéis.","Educar sobre segurança.","Sinalizar pontos turísticos."],"Placas verdes atuam como 'GPS' nas estradas, mostrando rotas e distâncias.",""],["1-1-243",1,1,0,4,"Qual a missão das placas brancas?","Conscientizar e educar sobre comportamentos seguros.",["Dar ordens obrigatórias aos motoristas.","Indicar serviços e postos de atendimento.","Apontar atrações turísticas."],"As placas brancas têm função educativa, reforçando comportamentos seguros.",""],["1-1-244",1,1,0,0,"Por que a sinalização deve ser compreendida rapidamente pelo motorista?","Porque mensagens precisam ser entendidas em frações de segundo",["Porque os motoristas não têm tempo de ler.","Porque são feitas só para especialistas.","Para permitir que o carro dirija sozinho."],"A sinalização usa símbolos e cores para comunicação instantânea durante a direção.",""],["1-1-245",1,1,1,9,"O que significa a sinalização temporária em cor laranja?","Indica obras, desvios ou eventos temporários na via.",["Que a via é exclusiva para transporte público.","Que é uma área escolar.","Que há um ponto turístico adiante."],"A cor laranja destaca mudanças temporárias e pede atenção extra.",""],["1-1-246",1,1,0,6,"O que uma faixa de pedestres representa no pavimento?","Local de prioridade para travessia de pedestres.",["Área de carga e descarga.","Faixa exclusiva para bicicletas.","Local de estacionamento."],"A faixa é o espaço sagrado do pedestre, que tem prioridade ao atravessar.",""],["1-1-247",1,1,0,17,"Por que não se deve parar sobre a faixa de pedestres?","Porque dificulta a travessia e é considerado infração.",["Porque aumenta o espaço de estacionamento.","Porque protege pedestres.","Porque melhora o fluxo de veículos."],"Parar sobre a faixa atrapalha pedestres e é infração prevista no material.",""],["1-1-248",1,1,0,9,"Qual o papel dos dispositivos auxiliares (ex.: cones, barreiras)?","Ajudar a aumentar a segurança e organizar o trânsito fisicamente.",["Servir apenas como decoração noturna.","Substituir completamente as placas verticais.","Indicar apenas rotas turísticas."],"São elementos físicos que complementam placas e faixas para segurança.",""],["1-1-249",1,1,0,8,"O que significa 'sinalização cicloviária'?","Sinalização que indica espaços reservados (ciclovias/ciclofaixas) para ciclistas.",["Sinalização que proíbe bicicletas da cidade.","Indicação de pontos de ônibus.","Local de lavagem de bicicletas."],"Delimita infraestruturas específicas para deslocamento seguro de ciclistas.",""],["1-1-250",1,1,1,5,"Qual é a vantagem de 'ler o chão' (sinalização horizontal)?","Ela está sempre no campo de visão do motorista e orienta condutas.",["É apenas estética urbana.","Substitui sinais luminosos em cruzamentos.","Serve só para pavement design."],"As marcas no solo guiam movimentos, ultrapassagens e paradas.",""],["1-1-251",1,1,1,4,"O que sinaliza uma placa azul?","Serviços e identificação, como postos ou informações.",["Direções e cidades em rodovias.","Atrações turísticas.","Mensagens educativas."],"Placas azuis indicam serviços e identificação úteis ao viajante.",""],["1-1-252",1,1,0,10,"Por que a hierarquia entre sinais é importante?","Para definir qual sinal seguir quando há conflito entre mensagens.",["Para dar prioridade às placas sobre agentes.","Para tornar a sinalização mais complexa.","Para permitir que cada município escolha suas regras."],"A hierarquia evita conflitos (ex.: policial vs semáforo) e define prioridade clara.",""],["1-1-253",1,1,0,40,"Qual a recomendação ao usar a faixa de aceleração para entrar numa rodovia?","Acelerar na faixa para atingir a velocidade do tráfego antes de inserir-se.",["Parar e aguardar que os carros passem.","Entrar devagar e reduzir na pista principal.","Acelerar e cortar os outros veículos."],"Faixa de aceleração serve para adaptar velocidade e entrar com segurança.",""],["1-1-254",1,1,0,41,"Qual é a atitude central da direção defensiva ?","Antecipar riscos e preparar-se para a inesperado.",["Dirigir sempre no limite máximo de velocidade.","Confiar que os outros não erram.","Evitar usar o cinto em trajetos curtos."],"Direção defensiva é prever erros alheios e manter distância e atenção.",""],["1-1-255",1,1,1,46,"Por que a velocidade máxima da via nem sempre é a mais segura?","Porque condições como chuva exigem reduzir abaixo do limite.",["Porque os limites são sempre exagerados.","Porque locais urbanos não têm limites.","Porque o semáforo determina a velocidade."],"Velocidade segura depende de visibilidade, clima e fluxo, não só da placa.",""],["1-1-256",1,1,1,4,"O que uma placa marrom indica?","Atrativos turísticos como parques e museus.",["Proibições de estacionamento.","Direções rodoviárias.","Áreas de risco."],"Placas marrons são dedicadas ao turismo e pontos de interesse.",""],["1-1-257",1,1,0,40,"Por que não se deve retornar em curvas, pontes ou túneis?","Porque reduz visibilidade e aumenta risco de sinistros.",["Porque é permitido só de noite.","Porque é complicado para motoristas experientes.","Porque reduz o número de multas."],"Retornos nesses locais comprometem segurança por falta de visibilidade.",""],["1-1-258",1,1,0,51,"O que é recomendado ao ultrapassar um ciclista?","Manter 1,5 m de distância lateral para evitar desequilíbrio.",["Aproxime-se por trás e ultrapasse sem espaço.","Use a faixa de pedestre para ultrapassar.","Buzine constantemente para acelerar o ciclista."],"Distância lateral segura reduz risco de tombos e é citada no material.",""],["1-1-259",1,1,0,21,"Qual é a consequência prática de estacionar indevidamente em local proibido?","Remoção do veículo e despesas com pátio.",["Só uma advertência verbal.","Nada, se for pouco tempo.","Apenas perda de pontos sem multa."],"Estacionamento indevido pode gerar remoção e custos significativos.",""],["1-1-260",1,1,0,37,"Por que o uso correto de cintos e cadeirinhas é enfatizado?","Porque esses dispositivos protegem ocupantes em caso de sinistro.",["Porque melhoram a economia de combustível.","Porque aumentam a velocidade do veículo.","Porque substituem a necessidade de atenção do motorista."],"Equipamentos de segurança só funcionam se usados corretamente, salvando vidas.",""],["1-1-261",1,1,0,36,"Quais os calçados são recomendados para dirigir?","Usar sapatos adequados; chinelos podem comprometer controle dos pedais.",["Dirigir sempre descalço é melhor.","Usar qualquer calçado é indiferente.","Usar sapatos de salto alto é recomendado."],"Calçados firmes garantem bom controle dos pedais e segurança.",""],["1-1-262",1,1,1,31,"O que é a PPD?","Permissão para Dirigir: habilitação provisória válida por 1 ano.",["Documento do veículo.","Curso extra opcional.","Uma multa aplicada a novos condutores."],"PPD é a primeira habilitação temporária com regras especiais.",""],["1-1-263",1,1,0,31,"Durante a Permissão para Dirigir, qual comportamento é proibido ao condutor?","Cometer infrações graves, gravíssimas ou reincidência em médias.",["Dirigir somente à noite.","Usar o veículo para trabalho.","Trocar de categoria sem prova."],"A PPD exige conduta responsável; infrações sérias levam à suspensão.",""],["1-1-264",1,1,0,33,"O que diferencia vias urbanas de rodovias?","Urbanas têm mais pedestres e cruzamentos; rodovias ligam cidades e permitem maiores velocidades.",["Rodovias são sempre sem sinalização.","Urbanas não têm limites de velocidade.","Rodovias são apenas para caminhões."],"Cada tipo de via exige comportamento adaptado e atenção específica.",""],["1-1-265",1,1,0,5,"Por que as faixas pintadas no pavimento são tão vantajosas?","Porque estão sempre no campo de visão do condutor enquanto dirige.",["Porque são apenas decorativas.","Porque substituem agentes de trânsito.","Porque indicam pontos turísticos."],"Marcas no solo guiam movimentos sem exigir olhar para placas laterais.",""],["1-1-266",1,1,0,2,"Qual é a indicação de uma placa 'PARE'?","É uma ordem absoluta: parar completamente e só seguir quando seguro.",["É apenas uma sugestão.","É uma informação sobre velocidade.","É uma placa de indicação turística."],"'PARE' é regulamentação que exige parada total para segurança.",""],["1-1-267",1,1,0,45,"Qual a recomendação sobre manter distância do veículo à frente?","Manter distância adequada para poder reagir a imprevistos.",["Colar no carro da frente para 'fechar' trânsito.","Ultrapassar pela direita sempre.","Usar o celular para se distrair."],"Distância é pilar da direção defensiva, permitindo tempo de reação.",""],["1-1-268",1,1,1,38,"O que se entende por 'conversão à esquerda' ?","Manobra que cruza o fluxo oposto e exige atenção extra.",["Uma ultrapassagem pela direita.","Estacionar na esquerda da via.","Ignorar sinais de prioridade."],"Conversão à esquerda envolve atravessar o fluxo contrário e requer paciência.",""],["1-1-269",1,1,1,51,"Quando a faixa é destinada a ciclistas (ciclofaixa), o que é recomendado aos motoristas?","Respeitar a faixa e dar espaço ao ciclista.",["Ultrapassar rapidamente os ciclistas.","Parar sobre a ciclofaixa para desembarque.","Usar a ciclofaixa para estacionamento."],"Ciclofaixas delimitam espaço específico; motoristas devem respeitar e manter distância.",""],["1-1-270",1,1,1,10,"Em caso de mensagens conflitantes (agente, semáforo, placa), qual é a sequência de prioridade mencionada?","Agente de trânsito > semáforo > placas e marcas no solo.",["Placa > semáforo > agente.","Semáforo > placa > agente.","Marca no solo > placa > semáforo."],"A hierarquia definida pelo CTB prioriza o agente em situações de conflito.",""],["1-1-271",1,1,1,12,"Por que as infrações podem variar de leves a gravíssimas?","Porque o risco e a gravidade do comportamento variam e as penas acompanham isso.",["Porque os fiscais decidem aleatoriamente.","Porque depende do tipo de veículo.","Porque muda a cada cidade sem regra."],"O material explica que diferenças de risco resultam em penalidades distintas.",""],["1-1-272",1,1,1,46,"Qual a recomendação sobre 'velocidade inteligente'?","Adaptar a velocidade conforme via, clima e tráfego, não só o limite.",["Sempre dirigir no limite máximo permitido.","Andar sempre mais devagar que os demais.","Sempre usar piloto automático."],"Velocidade inteligente prioriza controle e segurança sobre a velocidade legal máxima.",""],["1-1-273",1,1,1,50,"Em vias urbanas próximas a escolas, qual comportamento é esperado do condutor?","Reduzir a velocidade e aumentar atenção por crianças e pedestres.",["Aumentar velocidade para liberar a via.","Ultrapassar outros veículos.","Estacionar sobre a calçada."],"Áreas escolares demandam redução de velocidade e cuidado redobrado.",""],["1-1-274",1,1,1,33,"O que define uma rodovia pavimentada?","Via rural asfaltada ou de concreto que permite velocidades maiores com sinalização completa.",["Uma via sem sinalização.","Uma via apenas para pedestres.","Uma rua urbana com muitos cruzamentos."],"Rodovias pavimentadas têm características de segurança e permitem velocidades maiores.",""],["1-1-275",1,1,1,4,"Por que a educação no trânsito (placas brancas) aparece em trechos perigosos?","Porque reforçam comportamentos que reduzem risco nesses pontos.",["Porque não há lugar melhor para colocar placas.","Porque substituem radares.","Porque apenas aumentam a visibilidade do local."],"Placas educativas são colocadas onde reforçar a atenção tem efeito direto na segurança.",""],["1-1-276",1,1,1,40,"Qual a função prática de uma faixa de aceleração em uma entrada de rodovia?","Permitir que o veículo aumente velocidade e combine com o tráfego antes de inserir-se.",["Forçar o motorista a frear.","Servir como estacionamento temporário.","Reduzir o número de faixas na rodovia."],"Faixa de aceleração ajuda a integrar com segurança o fluxo de veículos.",""],["1-1-277",1,1,1,40,"Por que é errado 'entrar devagar' na pista principal vindo da faixa de aceleração?","Porque causa risco de colisão por diferença de velocidade com o tráfego.",["Porque é legal em todos os casos.","Porque acelera o tráfego atrás.","Porque facilita a conversão."],"Entrar devagar cria descontinuidade no fluxo e pode provocar colisões traseiras.",""],["1-1-278",1,1,1,38,"Como o condutorde agir quanto às manobras de conversão?","Usar calma, sinalizar e garantir visibilidade antes de executar a manobra.",["Fazer rápidas manobras para poupar tempo.","Nunca sinalizar para confundir outros.","Ultrapassar pela direita ao converter."],"Conversões seguras exigem calma, sinalização e atenção à visibilidade.",""],["1-1-279",1,1,1,39,"O que se espera do condutor ao se aproximar de um cruzamento sem sinalização?","Conhecer e aplicar as regras de preferência para evitar impasses.",["Aguardar sempre que outro veículo se mova.","Passar sem reduzir a velocidade.","Sempre ceder a quem gritar mais alto."],"Regras de preferência evitam conflitos e mantêm fluidez no cruzamento.",""],["1-1-280",1,1,1,34,"Qual a diferença entre 'rodovia' e 'estrada de terra' no comportamento do condutor?","Porque estradas de terra exigem redução de velocidade e mais cuidado devido à menor aderência.",["Porque estradas de terra permitem velocidades maiores.","Porque a lei não se aplica nelas.","Porque são sempre seguras."],"Estradas de terra têm menos segurança e requerem condução mais lenta e cautelosa.",""],["1-1-281",1,1,2,0,"Por que a sinalização deve ser uniforme em todo o país?","Para que uma mesma placa signifique a mesma ação em qualquer cidade, aumentando a previsibilidade.",["Para permitir variações locais frequentes.","Para confundir visitantes.","Para favorecer o design regional."],"Uniformidade garante que motoristas compreendam sinais independentemente do local.",""],["1-1-282",1,1,2,10,"Como a sinalização horizontal complementa a vertical quando há conflito entre elas?","A hierarquia define prioridade; marcas no solo orientam movimentos e, se houver conflito, segue-se a ordem legal.",["A sinalização horizontal sempre prevalece.","A sinalização vertical sempre prevalece.","Conflitos não ocorrem entre sinalizações."],"Em conflitos, é preciso considerar a hierarquia: agente, semáforo, placas, marcas no solo.",""],["1-1-283",1,1,2,41,"Considerando direção defensiva, qual é a relação entre atenção, distância e antecipação?","Atenção constante e manter distância permitem antecipar ações de outros e evitar sinistros.",["Atenção é menos importante que velocidade.","Distância não influencia na antecipação.","Antecipação substitui atenção."],"A combinação dos três cria o 'escudo' da direção defensiva, reduzindo riscos.",""],["1-1-284",1,1,0,5,"Ao ver uma linha contínua amarela simples no centro da via, o que o condutor deve entender?","É proibido ultrapassar naquele trecho.",["A via é preferencial.","Pode ultrapassar com cuidado.","É uma faixa exclusiva de ônibus."],"Linha amarela contínua indica proibição de ultrapassagem por motivos de segurança e visibilidade.",""],["1-1-285",1,1,0,5,"Quando há duas linhas amarelas contínuas lado a lado, o que isso significa?","A ultrapassagem é proibida para os dois sentidos.",["Somente um lado pode ultrapassar.","É uma pista de aceleração.","É uma marcação de estacionamento."],"Linhas duplas contínuas proíbem ultrapassagem para ambos os sentidos da via.",""],["1-1-286",1,1,0,5,"Ao encontrar uma linha seccionada (tracejada) no centro da pista, o motorista pode:","Ultrapassar com segurança, se as condições permitirem.",["Parar sobre a linha.","Transitar entre as faixas livremente.","Fazer retorno em qualquer ponto."],"A linha seccionada permite ultrapassagem quando há segurança e boa visibilidade.",""],["1-1-287",1,1,0,6,"O que o motorista deve fazer ao ver faixas zebradas pintadas no chão?","Evitar parar ou estacionar sobre elas.",["Atravessar nelas para ganhar tempo.","Usar como área de espera.","Parar para desembarque."],"As zebras são áreas de segurança e não devem ser ocupadas por veículos.",""],["1-1-288",1,1,0,5,"Qual o comportamento correto ao ver uma faixa contínua branca separando faixas no mesmo sentido?","Manter-se na faixa, sem mudar de pista.",["Trocar de faixa rapidamente.","Ultrapassar o veículo à frente.","Estacionar no acostamento."],"Linha branca contínua indica proibição de mudança de faixa no mesmo sentido.",""],["1-1-289",1,1,0,5,"Em uma via com faixas tracejadas brancas, o que o condutor pode fazer?","Mudar de faixa, desde que com segurança.",["Parar sobre as linhas.","Fazer retorno.","Transitar sobre o canteiro."],"As linhas brancas seccionadas permitem mudança de faixa em segurança.",""],["1-1-290",1,1,0,6,"O que indica uma faixa de retenção antes de um semáforo?","Ponto onde o veículo deve parar quando o sinal estiver vermelho.",["Local para pedestres atravessarem.","Faixa exclusiva para motos.","Local de aceleração."],"A faixa de retenção indica o limite de parada nos cruzamentos.",""],["1-1-291",1,1,0,6,"Quando há uma faixa de pedestres após a faixa de retenção, o que o condutor deve fazer?","Parar antes da faixa de pedestres.",["Parar sobre a faixa.","Avançar lentamente sobre ela.","Acelerar para passar antes do pedestre."],"A parada deve ser antes da faixa, preservando o espaço do pedestre.",""],["1-1-292",1,1,0,6,"O que significam as setas pintadas no pavimento?","Indicam o sentido ou obrigatoriedade de direção.",["Enfeitam o pavimento.","Mostram que a via é de pedágio.","Avisam sobre obras próximas."],"As setas são orientações de direção obrigatória ou recomendada.",""],["1-1-293",1,1,0,6,"O que indica a marcação de canalização (faixas em “V” ou diagonais)?","Área proibida para tráfego de veículos.",["Local seguro para estacionar.","Faixa de ultrapassagem.","Trecho de conversão."],"Canalizações organizam fluxos e devem ser respeitadas como áreas não transitáveis.",""],["1-1-294",1,1,0,6,"Por que o condutor deve evitar circular sobre as marcas de canalização?","Porque são áreas de separação de fluxos e não de circulação.",["Porque podem danificar os pneus.","Porque reduzem o atrito.","Porque indicam locais de estacionamento."],"Essas marcas delimitam espaços sem circulação — ignorá-las é infração.",""],["1-1-295",1,1,0,5,"O que a linha de bordo amarela pode indicar?","Proibição de parada e estacionamento.",["Local de ultrapassagem permitida.","Zona escolar.","Faixa de ônibus."],"Linha amarela no bordo da via sinaliza proibição de parada.",""],["1-1-296",1,1,0,5,"O que o condutor pode fazer ao perceber uma faixa contínua amarela se transformando em tracejada?","A partir dali, a ultrapassagem passa a ser permitida.",["A ultrapassagem continua proibida.","É área escolar.","Deve estacionar o veículo."],"A linha tracejada sinaliza início de trecho onde a ultrapassagem é possível.",""],["1-1-297",1,1,0,5,"Em uma curva, por que costuma haver linha contínua?","Porque a visibilidade é reduzida e éproibido ultrapassar.",["Porque é uma área de estacionamento.","Porque facilita ultrapassar rápido.","Porque não há necessidade de sinalização."],"Linha contínua reforça o perigo de ultrapassar em locais sem visibilidade.",""],["1-1-298",1,1,1,3,"Ao ver placa com pictograma em forma de Y, o que isso significa?","Divisão de pistas — escolha o sentido antes do ponto.",["Retorno obrigatório.","Local de ultrapassagem.","Área de estacionamento."],"O formato em Y alerta sobre divisão de fluxo, e o motorista deve escolher o sentido correto.","A-9"],["1-1-299",1,1,0,6,"O que o condutor deve fazer ao se aproximar de uma área zebrada entre faixas?","Evitar circular ou parar sobre a área zebrada.",["Aproveitar para ultrapassar.","Usar para conversão rápida.","Estacionar brevemente."],"A zebrada é área de separação de fluxos e não deve ser ocupada.",""],["1-1-300",1,1,1,5,"Por que as linhas horizontais ajudam a fluidez do trânsito?","Porque orientam condutores e reduzem dúvidas sobre posicionamento e manobras.",["Porque substituem os semáforos.","Porque permitem estacionar onde quiser.","Porque reduzem o limite de velocidade."],"A sinalização horizontal mantém o fluxo ordenado e previsível.",""],["1-1-301",1,1,1,6,"Ao transitar em pista com setas de conversão à esquerda e em frente, o que o motorista pode fazer?","Escolher entre seguir em frente ou virar à esquerda.",["Fazer retorno no local.","Estacionar para esperar.","Virar à direita."],"As setas informam as direções permitidas, e o condutor deve se posicionar conforme a intenção.",""],["1-1-302",1,1,1,6,"Se uma faixa exclusiva de ônibus é delimitada por linha contínua, o que isso indica?","É proibido transitar ou cruzar a faixa.",["Pode cruzar rapidamente.","Pode estacionar brevemente.","Pode usar para conversão."],"Linha contínua indica proibição total de cruzar a faixa exclusiva.",""],["1-1-303",1,1,1,6,"O que o condutor deve fazer ao ver setas de convergência (duas setas unindo-se)?","Reduzir e preparar-se para junção de faixas.",["Acelerar para passar primeiro.","Parar no meio da pista.","Mudar de sentido."],"Setas de convergência alertam para redução e atenção à fusão de tráfego.",""],["1-1-304",1,1,1,6,"Se o motorista encontra faixas de pedestres em série, o que isso indica?","Zona com travessia frequente, exigindo atenção constante.",["Local de estacionamento.","Área de carga e descarga.","Cruzamento preferencial."],"A repetição de faixas sinaliza alto fluxo de pedestres — atenção redobrada.",""],["1-1-305",1,1,1,6,"Em vias com setas de retorno pintadas no solo, o que deve fazer o motorista?","Fazer o retorno apenas naquele ponto indicado.",["Fazer o retorno onde preferir.","Ignorar a seta.","Fazer ultrapassagem."],"As setas delimitam o ponto autorizado para retorno, garantindo segurança.",""],["1-1-306",1,1,1,5,"Qual o comportamento correto ao aproximar-se de linhas duplas, sendo uma contínua e outra tracejada?","Apenas o lado da linha tracejada pode ultrapassar.",["A ultrapassagem é proibida para ambos.","Os dois lados podem ultrapassar.","É faixa de pedestres."],"O lado tracejado indica onde é permitido ultrapassar — o contínuo, não.",""],["1-1-307",1,1,1,6,"O que a linha de canalização entre faixas de conversão representa?","Espaço que separa fluxos diferentes e não pode ser ocupado.",["Local de ultrapassagem.","Trecho de estacionamento.","Área de pedágio."],"Canalização organiza o fluxo e proíbe circulação sobre ela.",""],["1-1-308",1,1,1,5,"Por que a linha de bordo é importante em vias estreitas?","Ajuda o condutor a manter o veículo corretamente posicionado na pista.",["Serve apenas para ciclistas.","Indica local de pedágio.","Substitui a iluminação pública."],"Linha de bordo auxilia o posicionamento seguro, principalmente à noite.",""],["1-1-309",1,1,1,6,"O que o condutor deve evitar fazer em uma interseção com marcas de cruzamento pintadas em X?","Parar sobre a área demarcada.",["Aguardar para avançar.","Entrar mesmo com o cruzamento cheio.","Avançar o sinal vermelho."],"Essas marcas indicam área de não bloqueio — o veículo não deve parar sobre o X.",""],["1-1-310",1,1,2,5,"Por que a sinalização horizontal é considerada um complemento vital da vertical?","Porque reforça mensagens diretamente no campo de visão do condutor.",["Porque substitui todas as placas.","Porque é opcional em rodovias.","Porque só serve de enfeite."],"As duas trabalham em conjunto — a vertical informa, a horizontal reforça visualmente.",""],["1-1-311",1,1,2,6,"Como o condutor deve agir em uma via onde há marcações de canalização danificadas ou apagadas?","Redobrar a atenção e seguir o fluxo, sem invadir áreas incertas.",["Ignorar completamente a sinalização.","Usar o acostamento.","Seguir os outros veículos cegamente."],"Mesmo com sinalização apagada, o motorista deve agir com cautela e prever limites de circulação.",""],["1-1-312",1,1,2,5,"Por que as linhas seccionadas são mais usadas em retas do que em curvas?","Porque nas retas há visibilidade suficiente para ultrapassagem segura.",["Porque nas curvas é mais bonito.","Porque são mais fáceis de pintar.","Porque reduzem custos."],"Nas curvas, a visibilidade reduzida exige linha contínua — nas retas, a tracejada é segura.",""],["1-1-313",1,1,0,4,"As placas de indicação servem principalmente para:","Informar direções, destinos e serviços disponíveis.",["Proibir manobras perigosas.","Alertar sobre riscos na pista.","Indicar infrações de trânsito."],"Placas de indicação têm função informativa e orientadora.",""],["1-1-314",1,1,2,4,"Qual é a cor predominante das placas de indicação de destinos e direções em rodovias?","Verde.",["Vermelha.","Amarela.","Azul."],"Placas verdes orientam sobre cidades, distâncias e direções.",""],["1-1-315",1,1,0,4,"Em área urbana, uma placa azul com o símbolo de uma cruz vermelha indica:","A presença de um serviço de saúde nas proximidades.",["Que é proibido estacionar.","Que há escola por perto.","Um ponto turístico."],"Placas azuis identificam serviços públicos, como hospitais.","SAU-10"],["1-1-316",1,1,0,4,"Uma placa marrom com o símbolo de uma cachoeira indica:","Um atrativo turístico ou ponto de interesse.",["Um risco de inundação.","A presença de obras na via.","Um serviço de emergência."],"Placas marrons têm função turística.","TNA-05"],["1-1-317",1,1,0,4,"O que o motorista entende ao ver uma placa azul com o símbolo de um telefone?","Há telefone público disponível.",["É obrigatório ligar para o Detran.","A via tem pedágio.","Há um posto de gasolina."],"Placas azuis informam serviços úteis.","SAU-06"],["1-1-318",1,1,0,4,"As placas brancas de indicação são usadas para:","Informar nomes de ruas ou bairros.",["Proibir estacionamento.","Alertar sobre curvas.","Informar velocidades máximas."],"Placas de fundo branco identificam locais e vias.",""],["1-1-319",1,1,0,4,"O que o motorista deve fazer ao ver uma placa verde indicando “Saída 500 m”?","Reduzir gradualmente e preparar-se para sair da rodovia.",["Parar no acostamento.","Acelerar para não perder a saída.","Ignorar se o destino for próximo."],"Essa placa antecipa a aproximação de uma saída.",""],["1-1-320",1,1,0,4,"Uma placa azul com o símbolo de uma colher e garfo indica:","Restaurante ou lanchonete próxima.",["Proibição de parar.","Área de carga e descarga.","Serviço mecânico."],"Símbolo de alimentação di
