m o airbag ainda em expansão\", o que aumenta o risco de lesões.",""],["1-3-546",1,3,0,36,"Por que as crianças devem viajar sempre no banco traseiro, mesmo que o veículo possua Airbag?","O airbag dianteiro pode ser extremamente perigoso devido à força de sua abertura.",["O banco traseiro é sempre mais confortável e silencioso para as crianças.","O airbag dianteiro pode acionar mesmo sem colisão, devido ao peso da criança.","É proibido instalar cadeirinha no banco dianteiro em qualquer circunstância."],"O material alerta: \"O airbag dianteiro pode ser extremamente perigoso para elas devido à força de sua abertura.\"",""],["1-3-547",1,3,0,36,"Qual o procedimento de segurança em relação a objetos na área do painel ou próximo ao Airbag?","Nunca colocar objetos, pois podem impedir a abertura ou se transformar em projéteis perigosos.",["Colocar apenas pequenos objetos leves, como celulares ou moedas.","Colocar o máximo de objetos, pois eles ajudam a amortecer o impacto.","Colocar apenas objetos macios, como pelúcias ou travesseiros."],"O material instrui: \"Nunca coloque objetos sobre o painel ou próximo às áreas de acionamento do airbag. Isso pode impedir sua abertura ou transformar os objetos em projéteis perigosos.\"",""],["1-3-548",1,3,1,36,"Qual a ação imediata que o condutor deve tomar se a luz indicadora do Airbag no painel permanecer acesa após ligar o veículo?","Observar se a luz apaga, pois se ela permanecer acesa, pode indicar uma falha no sistema.",["Continuar dirigindo, pois a luz só indica que o sistema está desativado temporariamente.","Desligar o carro imediatamente, pois o airbag pode acionar a qualquer momento.","Colocar objetos leves sobre o painel para verificar se a luz se apaga."],"A luz deve apagar após alguns segundos. Se \"permanecer acesa, pode indicar uma falha no sistema.\"",""],["1-3-563",1,3,0,43,"O que o motorista deve ajustar obrigatoriamente antes de iniciar a condução do veículo?","Retrovisores e bancos",["Volume do rádio e temperatura do ar","Roteiro do GPS e luz interna","Pneus e nível do óleo"],"Ajustar posição de dirigir e visão é básico para reagir adequadamente no trânsito.",""],["1-3-564",1,3,0,42,"Por que é fundamental evitar distrações como o celular ao dirigir?","Tira a atenção da via, colocando vidas em risco",["Apenas gera multas de trânsito","Diminui a vida útil da bateria","Aumenta o consumo de combustível"],"Distrações comprometem a atenção, sendo a principal causa de acidentes.",""],["1-3-565",1,3,0,18,"A sinalização de manobras com a seta é opcional ou obrigatória?","É obrigatória e deve ser usada com pelo menos três segundos de antecedência",["É opcional se não houver outros carros por perto","É recomendada apenas em rodovias","Deve ser usada apenas ao mudar de faixa"],"A seta é a forma de comunicar aos outros motoristas o que você fará, sendo vital para a previsibilidade.",""],["1-3-566",1,3,1,53,"Qual o efeito do cansaço, sono e uso de certos medicamentos nos reflexos do motorista?","Reduzem os reflexos, sendo recomendado não dirigir",["Aumentam a concentração","Não causam impacto significativo","Apenas dão sono, mas não afetam a direção"],"Redução dos reflexos compromete a capacidade de reação a imprevistos.",""],["1-3-567",1,3,1,43,"Em qual situação o uso do farol baixo é obrigatório em rodovias, conforme as informações fornecidas?","Sempre (mesmo de dia)",["Apenas à noite ou em túneis","Apenas em condições de pouca luz","É opcional, mas recomendado"],"O texto estabelece que o farol baixo mesmo de dia é obrigatório em rodovias e recomendado na cidade.",""],["1-3-568",1,3,1,42,"O que é a \"gentileza no trânsito\"?","Ceder passagem, sinalizar, manter distância e evitar disputas",["Dirigir sempre muito devagar","Deixar o veículo na garagem em horários de pico","Ignorar os erros dos outros motoristas"],"A gentileza é definida como inteligência coletiva, baseada em atitudes proativas de cortesia e segurança.",""],["1-3-569",1,3,1,43,"O que se deve fazer quando se está em uma posição onde não é possível ser visto pelos retrovisores de outros veículos?","Mudar a posição para sair do ponto cego",["Buzinar para alertar o outro motorista","Acelerar para ultrapassar rapidamente","Esperar que o outro motorista o veja"],"Ficar visível é a forma de evitar o ponto cego e reduzir o risco de colisão.",""],["1-3-570",1,3,2,43,"Por que é crucial ter uma boa visão ao redor ao dirigir, decorrente do ajuste correto dos bancos e retrovisores?","Faz toda a diferença na hora de reagir a imprevistos",["Ajuda a manter o motor ligado","Melhora a estética do veículo","Diminui o estresse emocional"],"A visibilidade e a posição de comando são essenciais para que o tempo de reação seja o menor possível.",""],["1-3-571",1,3,2,43,"O farol baixo aceso durante o dia é mais importante em condições de pouca luz. Por que ele é recomendado na cidade, mesmo com boa iluminação?","Carros com farol aceso são vistos mais cedo pelos outros motoristas",["É uma forma de economizar o farol alto","Evita o superaquecimento do motor","Melhora a iluminação dos painéis internos"],"O objetivo principal é a visibilidade (ser visto), o que aumenta a segurança preventiva.",""],["1-3-572",1,3,2,42,"Qual dos seguintes comportamentos não está listado como uma forma de praticar gentileza no trânsito?","Acelerar ao invés de ceder a passagem",["Sinalizar manobras aos outros","Manter a distância de segurança","Evitar disputas por espaço"],"Acelerar para impedir a passagem é o oposto de ceder e evitar disputas, não sendo uma atitude de gentileza.",""],["1-3-573",1,3,2,39,"Dois fluxos chegam a um cruzamento sem sinalização: um vem de via arterial e outro de via local. Quem tem preferência?","Quem vem pela direita, mesmo que a via da esquerda seja maior.",["A via maior (arterial) sempre.","Quem vier mais rápido.","Quem vier com farol alto."],"Tamanho da via não muda a regra da direita. Art. 29, inciso III, alínea c",""],["1-3-574",1,3,2,33,"Qual é a velocidade máxima normalmente permitida em uma zona calma?","30 km/h.",["40 km/h.","50 km/h.","60 km/h."],"Reduzir a velocidade é a forma mais eficaz de salvar vidas em áreas urbanas.",""],["1-3-575",1,3,0,49,"É permitido ultrapassar pela direita quando:","O veículo à frente sinaliza que vai virar à esquerda.",["A pista estiver livre.","O outro veículo for lento.","A pressa for grande."],"Essa é a única exceção prevista no CTB.",""],["1-4-1",1,4,2,55,"Sobre limites do corpo humano em sinistros, o que é verdadeiro?","Mais velocidade = mais energia = lesões mais graves, por isso controlar a velocidade salva vidas.",["O corpo suporta qualquer impacto leve.","A gravidade independe da velocidade.","Só o tipo do carro define a gravidade."],"O corpo tem limites, velocidade segura é essencial.",""],["1-4-2",1,4,0,14,"A bicicleta é classificada como:","Veículo de tração humana, porque anda com a força da pessoa que pedala.",["Veículo automotor, porque tem motor grande.","Veículo de tração animal, porque usa cavalo.","Veículo especial, porque só anda na ciclovia."],"Exemplo de veículo de tração humana.",""],["1-4-3",1,4,0,31,"Após ser aprovado em todas as etapas do processo de formação, o candidato obtém:","Recebe a Permissão Para Dirigir (PPD) com validade de 1 ano.",["Recebe multa educativa.","Recebe CRLV do carro do instrutor.","Recebe cartão de desconto no combustível."],"A Permissão para Dirigir (PPD) é o documento obtido após a aprovação em todas as etapas do CFC e tem validade de 12 meses, permitindo ao condutor dirigir provisoriamente antes de obter a Carteira Nacional de Habilitação (CNH). Art. 148 § 2º do CTB",""],["1-4-4",1,4,2,32,"Em uma fiscalização, Maria apresenta ao agente apenas uma foto da CNH salva na galeria do celular, e não pelo aplicativo oficial Carteira Digital de Trânsito (CDT). De acordo com o CTB e a regulamentação do CONTRAN, o que o agente de trânsito deve considerar sobre o porte do documento neste caso?","Não vale. A CNH ou PPD só tem validade no formato original: físico ou digital oficial, cópia ou foto não substitui.",["Vale se a foto estiver bonita.","Vale se mandar por mensagem depois.","Vale porque é o mesmo número."],"Conforme estabelecido no Art. 159, § 5º do CTB, a Carteira Nacional de Habilitação (CNH) deve ser apresentada em original. Uma foto do documento na galeria do celular é considerada uma cópia inválida e não possui fé pública, pois não permite a comprovação da sua autenticidade. Dessa forma, o agente deve considerar que a condutora não está portando o documento obrigatório, o que configura infração sujeita à multa e retenção (Art. 232 do CTB).",""],["1-4-5",1,4,0,32,"Decisão final: Maria recebeu a CNH. Qual cuidado deve tomar?","Renovar dentro do prazo do exame de aptidão física e mental, portar o documento quando dirigir.",["Guardar a CNH e dirigir sem portar.","Emprestar a CNH para amiga aprender.","Dirigir sem respeitar as leis por ser habilitada."],"Validade depende da aptidão vigente e do porte.",""],["1-4-6",1,4,0,31,"Durante o período de validade da Permissão Para Dirigir, o que o novo condutor não pode fazer?","Não pode cometer infração grave ou gravíssima nem ser reincidente em média.",["Pode dirigir sem documento.","Pode correr em racha.","Pode recusar regras porque “ainda é provisória”."],"Conforme estabelece o art. 147, § 3º do CTB, a Carteira Nacional de Habilitação (CNH) definitiva só será conferida ao portador da Permissão Para Dirigir se, ao término de um ano, ele não tiver cometido nenhuma infração de natureza gravíssima ou grave, ou não for reincidente em infração média.",""],["1-4-8",1,4,0,32,"Maria reprovou na prova de direção três vezes. O que ela faz para continuar o processo de formação?","Agenda nova prova, mantém documentos válidos.",["Sai dirigindo sozinha para treinar melhor.","Usa a Permissão para Dirigir da irmã emprestada para fazer a prova.","Sobe na calçada para evitar fiscalização."],"Após reprovar, o candidato pode reagendar a prova prática para uma nova tentativa, seguindo os procedimentos do Detran, até alcançar aprovação.",""],["1-4-9",1,4,1,50,"O que caracteriza o respeito ao princípio da vulnerabilidade?","Dar prioridade a pedestres e ciclistas em situações de conflito.",["Priorizar veículos maiores.","Ignorar a travessia de pedestres.","Disputar espaço nas vias."],"O princípio da vulnerabilidade reconhece que certos usuários da via, como pedestres e ciclistas, têm maior risco de se envolver em acidentes devido à falta de proteção física. Assim, motoristas devem dar prioridade e agir com mais cautela ao interagir com esses grupos no trânsito.",""],["1-4-10",1,4,0,29,"O que demonstra boa conduta no trânsito?","Respeitar a sinalização e agir com empatia e cortesia.",["Disputar espaço com outros motoristas.","Ignorar regras quando a via está vazia.","Usar buzina excessivamente."],"Boa conduta no trânsito envolve seguir as normas de trânsito, respeitar os sinais e as leis, além de ser educado e atencioso com pedestres, ciclistas e outros motoristas, promovendo um ambiente mais seguro e organizado nas vias.",""],["1-4-11",1,4,0,32,"O candidato pode deixar de realizar os exames médico e psicológico alegando que se sente bem?","Não pode. Os exames são obrigatórios para verificar condições de segurança para dirigir.",["Pode sim, se assinar um papel simples.","Pode se o instrutor concordar.","Pode se fizer só a prova prática."],"A aptidão é exigência legal.",""],["1-4-12",1,4,1,32,"Quais são os três requisitos que o candidato deve prencher para iniciar o processo de habilitação?","Ser penalmente imputável, saber ler e escrever, ter documento de identificação.",["Ter carro novo, ter emprego fixo e morar na capital.","Ter ensino superior, moradia própria e passaporte.","Já saber dirigir, ter CPF e não ter condenações penais."],"Requisitos para iniciar o processo previstos no art. 140 do CTB.",""],["1-4-13",1,4,1,32,"Qual é o prazo de renovação da CNH para pessoas com idade entre 50 a 69 anos?","A cada 5 anos.",["A cada 10 anos.","A cada 3 anos.","Só quando quiser."],"Art. 147, § 2º do CTB.",""],["1-4-14",1,4,1,32,"Qual é o prazo de renovação da CNH para quem tem 70 anos ou mais?","A cada 3 anos.",["A cada 5 anos.","A cada 10 anos.","Não pode renovar mais."],"Art. 147, § 2º do CTB.",""],["1-4-15",1,4,2,56,"Após uma pequena batida sem feridos, dois motoristas passam a discutir sobre a pista. O que deve ser feito?","Sinalizar, tirar os veículos da via e conversar em local seguro.",["Deixar tudo parado até a perícia.","Ligar farol alto e gritar.","Ir embora sem trocar dados."],"Os condutores devem garantir a segurança e fluidez do trânsito.",""],["1-4-16",1,4,2,54,"Em qual situação o controle emocional influencia positivamente a função motora?","Ao frear com calma em uma emergência.",["Ao ignorar o risco e continuar acelerando.","Ao acelerar sem avaliar o ambiente.","Ao dirigir distraído."],"Emoção equilibrada permite coordenação motora adequada e decisões seguras.",""],["1-4-17",1,4,2,54,"Por que dominar a si mesmo é mais importante do que dominar o veículo?","Porque o controle emocional evita decisões perigosas e protege vidas.",["Porque as leis permitem dirigir sem prática.","Porque os veículos modernos têm freios automáticos.","Porque a técnica vem depois da velocidade."],"Autocontrole é base da direção defensiva e do Sistema Seguro.",""],["1-4-18",1,4,2,67,"Qual combinação cumpre recall e protege o ambiente?","Consultar CDT/Senatran, agendar reparo gratuito e manter manutenção que reduz emissões.",["Ignorar recall e rodar com fumaça azul.","Aguardar quebrar para reparar.","Usar aditivo para esconder fumaça."],"Correção rápida evita falhas e poluentes.",""],["1-4-19",1,4,2,41,"Qual combinação mostra a aplicação simultânea dos cinco elementos da direção segura?","Condutor atento, veículo revisado, via observada, tempo avaliado e respeito aos outros.",["Condutor apressado, veículo potente, via livre, sol forte, sem atenção.","Condutor distraído, carro novo, pista seca, pressa.","Dirigir rápido apenas com faróis acesos."],"A segurança depende da interação constante entre todos os fatores.",""],["1-4-20",1,4,2,54,"Quando o condutor sente medo ao dirigir, qual atitude demonstra autoconhecimento?","Reconhecer o sentimento e treinar gradualmente.",["Forçar-se a dirigir em alta velocidade.","Evitar treinar por completo.","Fingir segurança diante dos outros."],"Autoregulação emocional fortalece a aprendizagem segura e confiante.",""],["1-4-22",1,4,0,68,"Um alinhamento comprometido das rodas pode causar:","Carro puxando, desgaste irregular dos pneus e instabilidade.",["Consumo menor.","Volante sempre reto.","Pneu mais frio."],"Os desalinhamento das rodas pode causar sérios danos ao veículo e comprometer a segurança viária.",""],["1-4-23",1,4,0,67,"Atender ao recall protege:","Você, passageiros e demais usuários da via.",["Só o motor.","Apenas o dono do carro.","O bolso do proprietário ou do condutor."],"Atender aos recalls promove a segurança coletiva no trânsito.",""],["1-4-24",1,4,0,41,"Avaliar riscos ao dirigir significa:","Ter a visão de eventuais erros antes que esses aconteçam.",["Confiar que os outros sempre agirão certo.","Pensar apenas em chegar rápido.","Evitar olhar para os lados."],"Avaliar riscos é antecipar perigos e adotar postura preventiva.",""],["1-4-25",1,4,2,41,"Avaliar riscos é uma atitude que envolve:","Todas as quatro funções da condução segura.",["Apenas a função motora.","Somente a visão e a audição.","Nenhum fator emocional."],"Sensorial, cognitiva, motora e emocional atuam juntas na avaliação de riscos.",""],["1-4-26",1,4,0,68,"Baterias automotivas devem ser:","Enviadas para reciclagem específica em locais autorizados.",["Jogadas no lixo comum.","Enterradas no quintal.","Lavadas e reutilizadas sempre."],"As baterias são altamente tóxicas, razão pela qual devem ser descartadas em locais apropriados.",""],["1-4-29",1,4,0,69,"Como contribuir com o meio ambiente ao dirigir?","Adotar condução suave e ter a manutenção do veículo em dia.",["Deixar o motor em marcha lenta.","Acelerar forte nas saídas.","Ignorar pneus murchos."],"Diminuir consumo de combustível e emissões de gases.",""],["1-4-30",1,4,2,67,"Como o proprietário de um veículo pode verificar se há um recall pendente para o seu carro?","CDT (aplicativo), site da Senatran ou site da montadora.",["Apenas perguntando a amigos.","Só na loja onde comprou.","Não é possível consultar."],"A forma mais eficiente e confiável de verificar se há recall pendente no seu carro é consultando o site do fabricante do veículo ou acessando o portal do Denatran, onde é possível buscar essa informação utilizando o número do chassi do veículo. Esse procedimento ajuda a garantir que o veículo esteja em conformidade com as normas de segurança e que eventuais problemas sejam resolvidos de forma adequada.",""],["1-4-31",1,4,2,70,"Quais são os cuidados essenciais com a bateria de um veículo elétrico?","Carregamento adequado e descarte correto.",["Utilizar qualquer carregador disponível, independentemente do modelo.","Usar cabos improvisados.","Ignorar autonomia."],"O carregamento adequado garante que a bateria do veículo elétrico tenha maior durabilidade e eficiência. Já o descarte correto é crucial para evitar a contaminação ambiental, já que as baterias contêm materiais prejudiciais que precisam ser reciclados adequadamente.",""],["1-4-32",1,4,2,68,"Quais são os cuidados necessários com o sistema de arrefecimento do veículo?","Verificar regularmente o nível do líquido de arrefecimento e realizar a troca conforme o recomendado pelo fabricante.",["Abrir radiador quente para “resfriar”.","Usar só água da torneira sempre.","Ignorar mangueiras ressecadas."],"O sistema de arrefecimento é essencial para evitar o aquecimento excessivo do motor. Verificar regularmente o nível do líquido de arrefecimento e fazer a troca do fluido de acordo com as instruções do fabricante garante o bom funcionamento do sistema e previne danos ao motor. O uso de líquidos inadequados ou ignorar vazamentos pode levar a aquecimento e falhas no motor.",""],["1-4-33",1,4,1,70,"Dentre as opções apresentadas, qual é uma recomendação de segurança ao dirigir um veículo elétrico na cidade?","Redobrar atenção a pedestres e ciclistas, pois o veículo é silencioso.",["Usar buzina longa para avisar sempre.","Andar só com farol alto.","Ignorar a sinalização."],"Ser visto/“percebido” é essencial.",""],["1-4-34",1,4,2,63,"O que pode acontecer quando o veículo está com as pastilhas de freio gastas ou com o fluido de freio em más condições?","Aumentam distância de parada e risco de colisão.",["Melhoram conforto.","Não alteram nada.","Só fazem barulho."],"Pastilhas gastas ou fluido de freio velho ou contaminado reduzem a eficiência do sistema de frenagem, aumentando o tempo e a distância necessários para parar o veículo.",""],["1-4-35",1,4,2,67,"O que pode acontecer se o proprietário ignorar um recall do veículo?","Pode ocorrer alguma falha mecânica ou elétrica que comprometa a segurança dos ocupantes e de outros usuários da via.",["Economia de tempo sem consequências.","Perda de garantia apenas.","Mais conforto."],"O recall é uma convocação feita pelo fabricante para corrigir defeitos de segurança identificados após a venda do veículo. Ignorar o recall pode causar falhas graves em sistemas essenciais, como freios, airbags, direção ou combustível, resultando em acidentes e riscos à vida.",""],["1-4-36",1,4,0,69,"Quais itens de manutenção do veículo exigem descarte especial para evitar danos ao meio ambiente?","Óleo lubrificante usado, filtros e baterias.",["Tapete e capa de banco.","Odorizador.","Sacola plástica."],"Itens como óleo lubrificante, filtros, baterias e pneus contêm substâncias químicas e metais pesados que podem poluir o solo e a água se descartados incorretamente.",""],["1-4-37",1,4,1,62,"O que pode ocorrer quando o veículo circula com farol, seta ou lanterna queimados?","Prejudica ver e ser visto, devem ser reparados.",["É detalhe estético.","Melhora economia.","Só importa de dia."],"As luzes do veículo — como faróis, lanternas e setas — são fundamentais para a visibilidade e sinalização no trânsito. Quando estão queimadas, outros condutores não conseguem identificar as intenções do motorista, como mudança de direção ou frenagem, o que aumenta o risco de colisões. Além disso, circular com lâmpadas queimadas é infração média segundo o art. 230, inciso XXII, do CTB, sujeita a multa e retenção do veículo até a regularização.",""],["1-4-38",1,4,1,36,"O que significa quando a luz do airbag permanece acesa no painel do veículo?","Falha no sistema. O condutor deve procurar manutenção.",["Economia de bateria.","Airbag desligado por segurança.","Revisão desnecessária."],"Quando a luz do airbag permanece acesa no painel, isso indica uma falha no sistema de segurança. Nesse caso, o airbag pode não funcionar corretamente em uma colisão, comprometendo a proteção dos ocupantes.",""],["1-4-39",1,4,2,67,"O não atendimento ao recall pode gerar:","Bloqueio do próximo licenciamento e outras consequências legais.",["Bônus no seguro.","Isenção de IPVA.","Nenhuma anotação oficial."],"Recall é registrado oficialmente, cumprir é responsabilidade. Art. 131, §5º do CTB.",""],["1-4-41",1,4,0,41,"O que caracteriza um condutor responsável?","A preocupação constante com a sua segurança e dos demais.",["A habilidade para correr quando a via está livre.","A capacidade de reagir rapidamente em emergências.","A disposição em disputar espaço no trânsito."],"Responsabilidade e empatia são pilares da direção segura.",""],["1-4-42",1,4,0,67,"O que é recall de veículo?","Chamado da montadora para corrigir defeito que pode afetar segurança, funcionamento ou ambiente.",["Promoção para trocar o carro.","Revisão paga de rotina.","Convite para test-drive."],"Chamamento de consumidores para correção de elementos nos veículos.",""],["1-4-43",1,4,0,47,"O que o condutor deve fazer ao encontrar uma via com buracos e má iluminação?","Reduzir a velocidade e aumentar a distância do veículo da frente.",["Acelerar para sair rápido.","Usar farol alto e seguir.","Buzinar para alertar."],"A adaptação à via é atitude essencial de direção defensiva.",""],["1-4-44",1,4,0,67,"O reparo do recall custa quanto ao proprietário?","Nada, é gratuito para o proprietário.",["Metade do valor da peça.","Apenas a mão de obra.","Taxa de oficina."],"A responsabilidade pelo serviço é da montadora.",""],["1-4-45",1,4,0,69,"O trânsito é uma das principais fontes de:","Poluição do ar nas cidades.",["Água potável.","Sombra urbana.","Silêncio."],"Os veículos são emissores de agentes poluentes.",""],["1-4-46",1,4,1,61,"Pneus bem calibrados e com sulcos:","Melhoram estabilidade e reduzem consumo.",["Só deixam o carro mais alto.","Aumentam distância de frenagem.","Não influenciam na chuva."],"Contato correto com o solo garante aderência.",""],["1-4-47",1,4,0,69,"Poluição sonora no trânsito pode causar:","Estresse, insônia, irritabilidade e problemas cardíacos.",["Melhora da audição.","Menor atenção ao volante.","Apenas incômodo leve."],"Ruído excessivo agride a saúde.",""],["1-4-48",1,4,0,69,"Por que o descarte correto de óleo usado é importante?","Evita poluição do solo e da água por substâncias tóxicas.",["Aumenta o brilho da calçada.","Some sozinho com o tempo.","Pode ser despejado no ralo."],"Responsabilidade ambiental do condutor.",""],["1-4-49",1,4,1,67,"Por que o recall deve ser levado a sério?","O defeito pode se manifestar de surpresa e causar sinistro.",["Porque deixa o carro mais bonito.","Porque aumenta potência.","Porque vale só para carros novos."],"Falhas atingem freios, airbags, direção etc.",""],["1-4-50",1,4,0,61,"Por que pneus calibrados ajudam o ambiente?","Diminuem consumo e emissões ao reduzir resistência ao rolamento.",["Só deixam o carro “alto”.","Não têm relação com poluição.","Gastam mais combustível."],"Eficiência energética melhora com pressão correta.",""],["1-4-51",1,4,0,69,"Por que pneus velhos precisam de descarte correto?","Acumulam água e demoram anos para se decompor.",["São leves e voam.","Não ocupam espaço.","Servem como adubo."],"Evita proliferação de insetos e poluição do meio ambiente.",""],["1-4-52",1,4,0,63,"Quais indícios pedem revisão de freios?","Ruídos/trepidações ao frear e pedal baixo.",["Volante inclinando para um dos lados.","Luzes queimando com facilidade.","Ar-condicionado fraco."],"Sintomas típicos de desgaste ou empeno.",""],["1-4-53",1,4,0,69,"Quais resíduos nunca devem ir para o lixo comum ou ralo?","Óleo usado, fluido de freio e líquido de arrefecimento.",["Água da chuva do para-brisa.","Poeira do tapete.","Papéis do lavador."],"Óleo usado, fluido de freio e líquido de arrefecimento são tóxicos e contaminam solo e água.",""],["1-4-54",1,4,0,69,"Qual alteração gera poluição sonora?","Escapamento alterado.",["Pneus calibrados.","Filtros trocados.","Luzes originais."],"Ruído em excesso agride a saúde pública.",""],["1-4-55",1,4,0,69,"Qual atitude reduz poluição do ar no uso diário?","Planejar rotas, evitar picos e, quando possível, usar transporte coletivo.",["Acelerar para chegar antes.","Ligar o carro parado por longos períodos.","Rodar com manutenção atrasada."],"A condução consciente e a menor quantidade de trânsito diminuem as emissões de gases na atmosfera.",""],["1-4-56",1,4,0,70,"Qual atitude reduz poluição e custo?","Calibrar pneus, planejar rotas e evitar marcha lenta.",["Acelerar forte para chegar antes.","Usar marcha em alto giro sem necessidade.","Ignorar revisões do veículo."],"Condução eficiente e consciente reduz as emissões de gases na atmosfera.",""],["1-4-57",1,4,0,61,"Qual passo certo para calibrar pneus?","Pneus frios, pressão do manual/etiqueta, não esquecer o estepe.",["Após viagem longa e quente.","Pressão “a olho”.","Encher além do recomendado."],"Medida correta garante aderência e economia.",""],["1-4-58",1,4,0,54,"Quando um condutor percebe irritação no trânsito, o que deve fazer?","Respirar, manter calma e não tomar decisões impulsivas.",["Buzinar para extravasar a raiva.","Acelerar para sair logo do congestionamento.","Discutir com outros condutores."],"A função emocional regula o comportamento e previne atitudes perigosas.",""],["1-4-59",1,4,0,67,"O recall é:","Ato de prevenção para ajustes e/ou reparos no veículo.",["Opcional e sem importância.","Serviço particular sigiloso.","Exclusivo para veículos de luxo."],"O chamamento de consumidores é medida de segurança para reparos preventivos em veículos.",""],["1-4-60",1,4,0,69,"Resíduos que exigem descarte correto:","Óleo usado, fluido de freio, líquido de arrefecimento, baterias, pneus, filtros e lâmpadas.",["Apenas água do radiador.","Pano de limpeza.","Papel do posto."],"O descarte correto evita contaminação de solo e água.",""],["1-4-61",1,4,0,67,"Sistemas que podem motivar recall:","Freios, direção, airbags, combustível e parte elétrica.",["Tapetes e calotas apenas.","Pintura externa.","Apenas pneus."],"Esses itens afetam diretamente a segurança.",""],["1-4-62",1,4,0,61,"Um carro com pneus gastos representa risco porque:","Perde aderência e aumenta chance de derrapagem.",["Gasta menos combustível.","Reduz o desgaste do motor.","Garante frenagem mais rápida."],"Pneus em mau estado comprometem estabilidade e frenagem.",""],["1-4-63",1,4,0,70,"Vantagem dos veículos elétricos:","Não emitem gases poluentes durante o uso e geram menos ruído.",["Aumentam fumaça.","Têm motor mais complexo.","Sempre dispensam cuidados."],"Os veículos elétricos representam um benefício urbano e ambiental.",""],["1-4-64",1,4,2,41,"Qual elemento da direção segura depende diretamente da condição física e mental do condutor?","O próprio condutor.",["O veículo.","A via.","As condições ambientais."],"O corpo e a mente equilibrados são a base da direção segura.",""],["1-4-65",1,4,1,54,"Um condutor nervoso e ansioso tende a:","Perder concentração e cometer erros simples.",["Dirigir com mais segurança.","Aumentar o controle do veículo.","Reduzir o risco de sinistros."],"Emoções descontroladas afetam percepção e tempo de reação.",""],["1-4-66",1,4,1,53,"Um motorista cansado corre mais risco porque:","Tem reflexos lentos e julgamento prejudicado.",["Dirige com mais calma.","Vê melhor à noite.","Reage de forma mais segura."],"Fadiga aumenta o tempo de reação e reduz atenção.",""],["1-4-67",1,4,0,29,"Por que a empatia é importante no trânsito?","Porque ajuda a respeitar quem tem mais dificuldade.",["Porque faz o trânsito andar mais rápido.","Porque evita multas.","Porque garante preferência ao motorista."],"Entender o outro ajuda a evitar sinistros.",""],["1-4-68",1,4,1,61,"Pedro percebe que o pneu do carro está murcho, mas continua dirigindo. Qual o risco?","Perder o controle do carro e causar sinistro.",["Gastar mais combustível apenas.","Danificar o som do veículo.","Ser multado por falta de cinto."],"O principal risco de segurança é que o pneu murcho diminui drasticamente a estabilidade e a área de contato com o solo, gerando calor excessivo na lateral, o que pode levar à ruptura do pneu (estouro), causando a perda total de controle do veículo.",""],["1-4-69",1,4,1,42,"Quais são exemplos de fator humano de risco?","Distração, álcool, excesso de velocidade.",["Buracos e pista molhada.","Pneu careca e farol queimado.","Falta de sinalização vertical."],"A maioria dos sinistros de trânsito é causada por falhas humanas, que são o principal foco da Direção Defensiva. O motorista deve ser atento e previsível para compensar essas falhas, sendo o conhecimento e a habilidade (evitando a imperícia) fundamentais para a segurança.",""],["1-4-70",1,4,1,53,"Um motorista está cansado e bocejando, mas quer terminar a viagem. O que ele deveria fazer?","Parar em local seguro e descansar.",["Beber café e seguir.","Abrir o vidro e continuar.","Aumentar o som do rádio."],"Conforme os princípios da Direção Defensiva, o cansaço (fadiga) é uma condição adversa do condutor que diminui drasticamente a atenção, a capacidade de julgamento e o tempo de reação, equiparando-se à direção sob efeito de álcool.",""],["1-4-71",1,4,2,53,"Durante a noite, Ana dirige cansada depois do trabalho. Ela percebe que está piscando os olhos com sono. O que deve fazer?","Parar em local seguro e descansar antes de seguir viagem.",["Ligar o rádio e continuar dirigindo.","Abrir o vidro para “espantar o sono”.","Acelerar para chegar logo em casa."],"O sono reduz o tempo de reação e causa sinistros graves. Conforme os princípios da Direção Defensiva, o cansaço (fadiga) é uma condição adversa do condutor extremamente perigosa, que anula a capacidade de atenção, o tempo de reação e a percepção de risco. O Art. 28 do CTB exige que o motorista tenha a todo momento domínio de seu veículo, o que é impossível em estado de fadiga. Continuar a viagem nessas condições é um ato de negligência que aumenta dramaticamente o risco de sinistros graves, sendo a parada imediata para descanso a única solução segura e legalmente responsável.",""],["1-4-72",1,4,0,55,"O que deve ser feito primeiro ao chegar a um local de um sinistro?","Verificar se o local é seguro antes de se aproximar.",["Tentar remover as vítimas imediatamente.","Acionar o socorro apenas após avaliar as lesões.","Aplicar os primeiros socorros sem observar o ambiente."],"A segurança do socorrista vem em primeiro lugar. Se o local for perigoso, ele pode se tornar mais uma vítima.",""],["1-4-73",1,4,2,59,"O que deve ser evitado ao socorrer uma vítima com fratura exposta?","Tentar alinhar o osso quebrado.",["Cobrir o ferimento com pano limpo.","Evitar movimentos bruscos.","Chamar o socorro."],"Nunca se deve tentar recolocar o osso no lugar, pois isso pode agravar lesões e causar hemorragias internas.",""],["1-4-74",1,4,1,58,"O que se deve fazer com uma vítima de trânsito que está usando capacete?","Não remover o capacete",["Retirar o capacete para facilitar o atendimento.","Retirar o capacete imediatamente para verificar ferimentos.","Levantar a cabeça da vítima."],"A retirada incorreta do capacete pode agravar lesões cervicais.",""],["1-4-75",1,4,1,59,"Uma vítima apresenta hemorragia nasal. Qual deve ser o procedimento correto?","Inclinar levemente a cabeça para frente e comprimir o nariz.",["Deitar e levantar o queixo.","Inclinar a cabeça para trás.","Tampar uma narina e inspirar profundamente."],"Inclinar para frente evita que o sangue vá para as vias respiratórias e a compressão ajuda a estancar o sangramento.",""],["1-4-76",1,4,1,59,"Uma vítima com suspeita de fratura de coluna deve ser:","Mantida imóvel até a chegada do socorro.",["Sentada para facilitar a respiração.","Colocada de lado.","Movimentada para avaliar os danos."],"Movimentos indevidos podem causar lesões irreversíveis.",""],["1-4-77",1,4,1,58,"Ao atender uma vítima de atropelamento inconsciente, o que não deve ser feito?","Movimentar a vítima sem necessidade.",["Checar a respiração.","Acionar o socorro.","Verificar pulso."],"Movimentar a vítima pode agravar fraturas e lesões internas. A prioridade é avaliar e chamar o resgate.",""],["1-4-78",1,4,0,58,"O que é um atendimento de primeiros socorros?","Cuidados imediatos prestados antes da chegada de ajuda especializada.",["Tratamento médico realizado em hospital.","Atendimento feito apenas por profissionais de saúde.","Aplicação de medicamentos específicos."],"Primeiros socorros são medidas simples e urgentes prestadas por qualquer pessoa até o socorro especializado chegar.",""],["1-4-79",1,4,1,58,"Quando uma vítima está consciente e se queixando de dor no peito, o que deve ser feito?","Acalmá-la e acionar imediatamente o socorro especializado",["Pedir para ela caminhar","Dar água fria à vítima","Mandar a pessoa deitar e esperar passar."],"A dor no peito pode ser sinal de infarto. É preciso manter a calma da vítima e chamar o socorro imediatamente. Deitar, oferecer líquidos ou pedir para andar pode agravar o problema.",""],["1-4-80",1,4,0,55,"Em caso de atropelamento, o que o condutor deve fazer?","Parar o veículo em local seguro e prestar socorro chamando ajuda.",["Afastar-se do local.","Retirar a vítima da pista imediatamente.","Aguardar sem comunicar o acidente."],"O Código de Trânsito Brasileiro obriga o condutor a parar e acionar o socorro. O abandono de vítima é crime.",""],["1-4-81",1,4,0,58,"O que deve ser feito se houver vítima inconsciente após um sinistro?","Verificar se respira e chamar o socorro.",["Jogar água no rosto da vítima","Dar álcool para a vítima cheirar.","Tentar levantá-la."],"Deve-se checar respiração e chamar socorro especializado. Movimentar a vítima pode agravar ferimentos.",""],["1-4-82",1,4,1,51,"O que o motorista deve fazer ao ver um ciclista caído na via?","Parar em local seguro e acionar o socorro.",["Desviar e seguir viagem.","Tocar a buzina para alertar.","Esperar que outros ajudem."],"Todo condutor deve parar e prestar auxílio. O socorro rápido pode salvar vidas.",""],["1-4-83",1,4,1,59,"O que não se deve fazer ao atender uma vítima com queimadura causada por sinistro de trânsito?","Passar pasta de dente ou pomada caseira.",["Lavar com água corrente.","Cobrir com pano limpo.","Estourar as bolhas que se formarem."],"Produtos caseiros agravam a queimadura e dificultam o tratamento. As bolhas não devem ser estouradas, pois protegem a pele. O correto é resfriar com água corrente e proteger o local com pano limpo.",""],["1-4-84",1,4,0,55,"Qual o termo que substituiu oficialmente \"acidente\" no Brasil, pois a grande maioria desses eventos pode ser evitada?","Sinistro.",["Fatalidade.","Colisão.","Ocorrência."],"O termo \"sinistro\" é usado para reforçar que o evento é uma consequência de escolhas e comportamentos, e não uma fatalidade do destino.",""],["1-4-85",1,4,0,55,"Em um sinistro, qual a primeira coisa que o condutor deve fazer para garantir a segurança de todos?","Garantir a própria segurança e sinalizar imediatamente o local.",["Tentar movimentar a vítima.","Formalizar o registro do ocorrido.","Ligar para a seguradora."],"O primeiro passo é parar em local seguro e acionar o pisca-alerta para sinalizar o problema.",""],["1-4-86",1,4,0,55,"O que o condutor deve acionar imediatamente após parar o veículo em local seguro no sinistro para alertar outros motoristas?","O pisca-alerta do veículo.",["O farol alto.","O sistema de som.","O limpador de para-brisa."],"O pisca-alerta é a sinalização mais imediata de que há um problema na via.",""],["1-4-87",1,4,0,58,"O que você deve fazer ao falar com uma vítima consciente em um sinistro, para prestar assistência?","Conversar com ela para mantê-la calma e consciente, e cobri-la se estiver com frio.",["Dar água e medicamentos.","Tentar mover a vítima para um local mais seguro.","Fazer procedimentos médicos."],"Seu papel é dar apoio e conforto, nunca procedimentos médicos ou movimentação.",""],["1-4-88",1,4,0,53,"Qual a principal atitude de um condutor consciente em relação ao seu estado físico e emocional ao dirigir?","Reconhecer os sinais de cansaço ou alteração emocional e parar para descansar/se preparar.",["Ignorar os sinais e seguir viagem.","Acelerar para chegar mais rápido.","Usar o telefone celular."],"Um condutor consciente sabe que a responsabilidade começa com o seu autocontrole.",""],["1-4-89",1,4,0,53,"O que o motorista deve fazer em caso de sono ou cansaço, como medida de segurança?","Encontrar um local seguro, parar e descansar.",["Abrir a janela e aumentar o volume do rádio.","Beber café e continuar dirigindo.","Tentar fazer um cochilo rápido no volante."],"Um pequeno descanso pode salvar a sua vida e a de outros.",""],["1-4-90",1,4,0,53,"Qual é um dos sinais de alerta de que o sono está tomando o volante?","Bocejos frequentes.",["Pálpebras abertas.","Pensamentos concentrados.","Direção firme."],"Bocejos, pálpebras pesadas e pensamentos dispersos são sinais de alerta.",""],["1-4-91",1,4,0,56,"O que é fundamental manter, acima de tudo, em um sinistro sem vítimas?","Manter a calma, respirar fundo e evitar reagir de forma impulsiva.",["Gritar com o outro motorista.","Fugir do local imediatamente.","Acelerar a troca de informações sem calma."],"Um momento de pausa pode evitar decisões erradas e piores consequências.",""],["1-4-92",1,4,0,53,"O que a sonolência reduz no motorista, tornando a direção perigosa?","Seus reflexos, sua atenção e sua capacidade de reagir a imprevistos.",["A necessidade de frear.","A sua velocidade.","O consumo de combustível."],"O efeito da sonolência é comparado ao de dirigir alcoolizado.",""],["1-4-93",1,4,1,56,"Em um sinistro sem vítimas que esteja bloqueando o trânsito, qual a atitude correta a ser tomada após a troca de informações?","Retirar os veículos da via e levá-los para um local mais seguro, como o acostamento.",["Deixar os veículos onde estão até a chegada da polícia.","Ignorar o bloqueio e sinalizar a 5 metros.","Acelerar a fuga do local."],"Mover os veículos ajuda a evitar novos sinistros e a liberar o fluxo.",""],["1-4-94",1,4,1,54,"Qual atitude do motorista é citada como perigosa, pois ele perde o controle não do carro, mas de si mesmo?","Dirigir com emoções alteradas como raiva, ansiedade ou tristeza.",["Dirigir respeitando o limite de velocidade.","Dirigir seguindo o protocolo de sinistro.","Dirigir em estado mental equilibrado."],"O motorista emocionalmente alterado perde a noção de risco e reage por impulso.",""],["1-4-95",1,4,1,55,"O que você deve fazer antes de acionar o socorro especializado em um sinistro, como parte da \"Avaliação da Situação\"?","Observar se há vazamentos de combustível, fumaça, fios elétricos soltos ou risco de incêndio/explosão.",["Tentar apagar um vazamento de combustível.","Fazer procedimentos médicos na vítima.","Fugir do local."],"Essas informações são cruciais para a sua segurança e para alertar o socorro.",""],["1-4-96",1,4,1,55,"Em um sinistro com vítimas, qual é a obrigação legal do condutor, segundo o Código de Trânsito Brasileiro e o Código Penal?","Permanecer no local e cooperar com as autoridades, pois fugir é crime de omissão de socorro.",["Fugir imediatamente para não ser acusado.","Fazer procedimentos médicos na vítima.","Mover a vítima para o acostamento."],"A omissão de socorro é uma infração grave e pode ser considerada crime.",""],["1-4-97",1,4,1,58,"Qual a regra de ouro sobre a assistência à vítima, a fim de não agravar os ferimentos?","\"Não remova, não movimente, não transporte.\"",["\"Movimente apenas em caso de dor.\"","\"Movimente sempre para o acostamento.\"","\"Remova a vítima o mais rápido possível.\""],"Mexer na vítima pode agravar muito os ferimentos, principalmente fraturas.",""],["1-4-98",1,4,1,55,"Em um sinistro com vítimas, qual a principal ação que o condutor deve tomar para garantir a segurança de todos ao redor, além de chamar o socorro?","Desligar o motor dos veículos envolvidos, se possível.",["Retirar os pneus dos carros.","Retirar os documentos das vítimas.","Ligar para a seguradora."],"Desligar o motor evita riscos como o de incêndio ou explosão.",""],["1-4-99",1,4,1,58,"Ao ligar para o socorro em um sinistro com vítimas, o que é fundamental informar com clareza para agilizar o atendimento?","Localização exata, número de vítimas e a situação delas (se estão presas, inconscientes, sangrando etc.).",["Seu nome e CPF completo.","Apenas o tipo de veículo envolvido.","A cor da roupa das vítimas."],"A precisão das informações é vital para que o socorro chegue preparado.",""],["1-4-100",1,4,1,58,"No contexto de primeiros socorros em um sinistro, qual é o papel do condutor leigo que presta assistência?","Dar apoio emocional, informar a vítima sobre a chegada do socorro e nunca tentar fazer procedimentos médicos.",["Tentar fazer um procedimento médico.","Apenas observar a vítima sem falar nada.","Mover a vítima para o carro."],"O melhor é proteger o local, sinalizar e aguardar os profissionais.",""],["1-4-101",1,4,2,53,"O que um cochilo de apenas 3 ou 4 segundos a 80km/h faz você percorrer?","Quase 100 metros sem controle nenhum do veículo, o equivalente a dirigir de olhos fechados por um quarteirão inteiro.",["Apenas 10 metros com o controle total do carro.","Cerca de 30 metros, mas com o carro se autocontrolando.","Menos de 5 metros, sem risco."],"A alta velocidade em combinação com o sono resulta em uma perda de controle por uma distância perigosamente longa.",""],["1-4-102",1,4,2,58,"Qual a única exceção à regra de ouro \"não remova, não movimente, não transporte\" em um sinistro com vítimas?","Somente fazer a movimentação em caso de risco iminente, como incêndio ou explosão.",["Quando a vítima pedir para ser movida.","Quando o motorista estiver com pressa.","Quando a vítima estiver deitada sobre o asfalto."],"O risco à vida é a única razão que justifica movimentar uma vítima de sinistro.",""],["1-4-103",1,4,2,55,"Em vias rápidas ou com pouca visibilidade (neblina), o que fazer em relação à distância mínima de 30 metros para sinalização com o triângulo?","Aumentar a distância de sinalização, pois 30 metros é apenas o mínimo.",["Reduzir a distância de sinalização para que o triângulo fique perto do carro.","Manter a distância de exatamente 30 metros.","Usar o pisca-alerta e não o triângulo."],"Em vias rápidas, é necessário dar mais tempo de reação aos outros motoristas, o que se faz aumentando a distância.",""],["1-4-104",1,4,2,53,"Por que dirigir com sono é tão perigoso quanto dirigir alcoolizado?","Porque a sonolência reduz os reflexos, a atenção e a capacidade de reação, sendo comparável ao efeito do álcool.",["Apenas porque o sono causa bocejos.","Porque a sonolência só afeta a velocidade.","Apenas por causa da regra de $80~km/h$."],"O efeito da sonolência no desempenho cognitivo e reacional é equiparado ao do álcool, sendo um \"perigo invisível\".",""],["1-4-105",1,4,1,53,"Qual a consequência de não descansar ao sentir sono?","O motorista pode ter micro-sonos (cochilos de 3 a 4 segundos) sem perceber, dirigindo com os olhos fechados.",["Apenas um aumento do bocejo.","Apenas um aumento da concentração.","Apenas a redução da velocidade."],"O micro-sono é o risco invisível do motorista cansado.",""],["1-4-106",1,4,1,58,"O que você deve fazer em um sinistro, ao ligar para o socorro e perceber que a vítima está inconsciente?","Informar ao socorro que a vítima está inconsciente e, se possível, desligar o motor.",["Tentar fazer a reanimação cardiopulmonar sozinho.","Movimentar a vítima para o acostamento.","Tentar dar água para a vítima."],"Informar o estado da vítima e garantir a segurança do local são as prioridades.",""],["1-4-107",1,4,1,58,"O que o motorista deve evitar ao máximo em um sinistro, devido ao risco de agravar os ferimentos da vítima?","Remover, movimentar ou transportar a vítima.",["Ligar para o 192 ou 193.","Sinalizar o local do sinistro.","Desligar o motor."],"A movimentação pode ser fatal em casos de fratura ou lesão na coluna.",""],["1-4-108",1,4,1,55,"O que você deve fazer antes de acionar o socorro especializado, como parte da \"Avaliação da Situação\"?","Observar se há vazamentos de combustível, fumaça, fios elétricos soltos ou risco de incêndio/explosão.",["Tentar apagar um vazamento de combustível.","Fazer procedimentos médicos na vítima.","Fugir do local."],"Essas informações garantem a sua segurança e são vitais para o socorro.",""],["1-4-109",1,4,0,57,"João estava dirigindo na cidade quando viu uma colisão grave, com um motociclista caído no chão. Havia sangue e parecia que a vítima precisava de atendimento médico urgente. Qual número de emergência João deve ligar imediatamente para acionar o socorro médico especializado (SAMU)?","192",["193","190","191"],"O SAMU é o Serviço de Atendimento Móvel de Urgência, especializado em emergências médicas, e seu número de contato é o 192.",""],["1-4-110",1,4,0,60,"Maria estava na rodovia e viu um carro pegando fogo no acostamento. Ela precisava de ajuda especializada para controlar o incêndio. Para quem Maria deve ligar para pedir ajuda em casos de incêndio, resgates ou riscos com cabos elétricos?","193 (Corpo de Bombeiros).",["192 (SAMU).","190 (Polícia Militar).","191 (PRF)."],"O Corpo de Bombeiros é o responsável por resgate e combate a incêndios, e o número de contato é 193.",""],["1-4-111",1,4,0,56,"Pedro deu uma pequena batida no carro da frente. Ninguém se feriu, mas os carros estavam parados no meio da faixa, bloqueando todo o trânsito. Após trocar as informações (placa, CNH, telefone) com o outro motorista, qual a atitude correta que Pedro deve tomar?","Retirar os veículos da via e levá-los para o acostamento ou local seguro, para liberar o trânsito.",["Deixar os veículos onde estão e aguardar a chegada da polícia.","Fazer o registro da ocorrência no meio da pista.","Ignorar a batida e fugir do local."],"Em sinistros sem vítimas, é obrigatório mover os veículos para evitar novos acidentes e liberar o fluxo da via.",""],["1-4-112",1,4,0,55,"Ana estava no trânsito quando furou o pneu e teve que parar rapidamente no acostamento. Qual o passo essencial para sinalizar a emergência no local e proteger a si e aos outros motoristas, logo após ligar o pisca-alerta?","Posicionar o triângulo de sinalização a pelo menos 30 metros de distância do veículo.",["Posicionar o triângulo a 5 metros do carro, no acostamento.","Ligar o farol alto.","Deixar a porta aberta para que outros motoristas vejam o problema."],"Sinalizar o local do sinistro é o segundo passo, sendo o triângulo posicionado a um mínimo de 30 metros de distância.",""],["1-4-113",1,4,0,58,"Em um sinistro, Paula parou para ajudar uma vítima que estava consciente, mas com sede. Qual item Paula não deve dar à vítima sob hipótese alguma, mesmo que ela peça?","Água, comida ou medicamentos.",["Apoio e conforto.","Cobertor se estiver com frio.","Informação sobre a chegada do socorro."],"Jamais se deve dar algo para a vítima ingerir, pois isso pode ser fatal se ela precisar de cirurgia ou estiver em estado de choque.",""],["1-4-114",1,4,0,53,"Rafael está dirigindo há muito tempo em uma viagem e começa a sentir as pálpebras pesadas e a bocejar a cada minuto. O que esses sinais do corpo de Rafael estão indicando?","A sonolência, que reduz seus reflexos e sua capacidade de reagir a imprevistos.",["Aumento da atenção e foco.","Necessidade de beber café e seguir viagem.","Apenas um resfriado leve."],"Bocejos e pálpebras pesadas são sinais claros de que o corpo precisa de descanso e que a sonolência está prejudicando o desempenho.",""],["1-4-115",1,4,0,58,"Um pedestre foi atropelado e estava deitado no chão, sentindo muito frio. Qual atitude correta e segura deve ser tomada para ajudar a vítima a manter a temperatura corporal e evitar o estado de choque?","Cobri-la com um cobertor, agasalho ou manta térmica, se disponível.",["Dar uma bebida quente.","Apenas ignorar, pois é mais seguro.","Movimentá-la para um local quente."],"O material orienta a cobrir a vítima para evitar a perda de temperatura e o agravamento do estado de choque.",""],["1-4-116",1,4,0,58,"Um motociclista estava caído e inconsciente. Qual a atitude que o condutor leigo não deve tomar sob hipótese alguma?","Tentar remover o capacete ou qualquer peça de roupa que esteja grudada.",["Ligar para o socorro.","Cobrir a vítima se estiver com frio.","Conversar com a vítima para acalmá-la."],"A remoção de capacete e roupas grudadas pode agravar fraturas ou causar lesões na coluna.",""],["1-4-117",1,4,0,53,"O instrutor de trânsito estava alertando sobre os sinais de sonolência, como bocejar. O que a sonolência reduz no motorista, tornando a direção perigosa?","Seus reflexos, sua atenção e sua capacidade de reagir a imprevistos.",["A necessidade de frear.","A sua velocidade.","O consumo de combustível."],"A sonolência afeta as funções cognitivas de forma semelhante ao álcool.",""],["1-4-118",1,4,1,55,"Patrícia parou em um sinistro e viu que havia fumaça saindo do capô de um dos carros. Antes de ligar para o socorro, qual informação Patrícia deve observar para sua própria segurança e para alertar os profissionais (parte da \"Avaliação da Situação\")?","Observar se há vazamentos de combustível, fumaça, fios elétricos soltos ou risco de incêndio/explosão.",["Tentar apagar o fogo sozinha.","Fazer procedimentos médicos na vítima.","Fugir do local."],"A Avaliação da Situação exige a observação de riscos iminentes (incêndio, explosão) para garantir a segurança do local.",""],["1-4-119",1,4,1,56,"André e Bia bateram de leve e ninguém se feriu. Eles já pararam no acostamento e precisam formalizar o sinistro. Além da placa e modelo do carro, quais informações pessoais de Bia e André são cruciais para a formalização do sinistro?","Nome completo, CPF, CNH e telefone.",["A cor da roupa e a altura.","Apenas a placa do carro e o modelo.","A cor do cabelo e a marca do celular."],"A troca de nome, CPF, CNH e telefone é essencial para que o sinistro possa ser registrado e resolvido.",""],["1-4-120",1,4,1,58,"Um motociclista foi derrubado e parecia ter fraturado a perna. Um condutor queria movê-lo para a calçada, mas outro lembrou-se da \"regra de ouro\" do socorro. Qual é a regra de ouro do primeiro socorro que impede o condutor leigo de agravar os ferimentos da vítima?","\"Não remova, não movimente, não transporte.\"",["\"Movimente apenas em caso de dor.\"","\"Movimente sempre para o acostamento.\"","\"Remova a vítima o mais rápido possível.\""],"Movimentar a vítima pode agravar fraturas e causar lesões irreversíveis na coluna.",""],["1-4-121",1,4,1,53,"João estava muito cansado e, sem perceber, teve um \"micro-sono\" de apenas 3 ou 4 segundos. O material afirma que essa sonolência tem um efeito comparável a dirigir alcoolizado. O que a sonolência reduz no motorista, tornando a direção perigosa?","Reduz os reflexos, a atenção e a capacidade de reação do motorista, de forma similar ao álcool.",["Aumenta a velocidade e a adrenalina.","Melhora a capacidade de reação em situações de emergência.","Não tem efeito comparável ao álcool."],"O efeito da sonolência no desempenho é equiparado ao do álcool, pois a perda de atenção e reflexos é grave.",""],["1-4-122",1,4,1,58,"Lucas é um condutor comum e está prestando socorro em um sinistro, ligando para o SAMU. Ele pensou em fazer um curativo em um corte, mas lembrou de seu papel. Qual é o papel de Lucas como condutor leigo que presta assistência?","Dar apoio emocional, informar a vítima sobre a chegada do socorro e nunca tentar fazer procedimentos médicos que não saiba.",["Tentar fazer a reanimação cardiopulmonar.","Apenas observar a vítima sem falar nada.","Mover a vítima para o carro."],"O papel do condutor é proteger, sinalizar e apoiar, sem intervenção médica.",""],["1-4-123",1,4,1,55,"Em um sinistro grave com vítimas, o motor dos carros envolvidos continuava ligado. Qual a ação de segurança que deve ser tomada para evitar riscos como o de incêndio ou explosão?","Desligar o motor dos veículos envolvidos, se possível.",["Retirar os pneus dos carros.","Retirar os documentos das vítimas.","Ligar para a seguradora."],"Desligar o motor é uma medida de segurança preventiva no local do sinistro, evitando riscos como o de incêndio.",""],["1-4-124",1,4,1,57,"Emergência/Localização: Ao ligar para o Corpo de Bombeiros (193), o atendente precisava saber como mandar a equipe de resgate. Qual a informação mais crucial que o condutor deve fornecer para os serviços de emergência (190, 192, 193) para garantir um socorro rápido e eficaz?","A localização exata do sinistro e o número e situação das vítimas.",["Seu nome e CPF completo.","Apenas o tipo de veículo envolvido.","A cor da roupa das vítimas."],"A precisão da localização e o estado das vítimas são vitais para o tempo de resposta do socorro.",""],["1-4-125",1,4,2,58,"Em um sinistro com uma vítima gravemente ferida, o carro estava começando a pegar fogo. Qual a única exceção à regra de ouro \"não remova, não movimente, não transporte\" que justifica mover a vítima?","Somente fazer a movimentação em caso de risco iminente, como incêndio, explosão ou atropelamento.",["Quando a vítima pedir para ser movida.","Quando o motorista estiver com pressa.","Quando a vítima estiver deitada sobre o asfalto."],"O risco iminente de morte (como o fogo) é a única razão que justifica o risco de agravar os ferimentos.",""],["1-4-126",1,4,2,53,"Se João, dirigindo a 80km/h, tiver um micro-sono de apenas 4 segundos, qual o risco real dessa situação?","O veículo percorre quase 100 metros sem controle nenhum, o equivalente a dirigir de olhos fechados por um quarteirão inteiro.",["O veículo percorre apenas 10 metros, sem risco.","O veículo se autocontrola e não sai da faixa.","O veículo apenas reduz a velocidade."],"A combinação de sono e alta velocidade resulta em uma perda de controle por uma distância perigosamente longa.",""],["1-4-127",1,4,0,54,"Após uma discussão intensa em casa, Paulo pegou o carro para ir trabalhar. Ele sentiu a raiva e a frustração o dominarem ao volante, tornando-o impulsivo. Qual é a principal responsabilidade do condutor consciente ao sentir essa alteração emocional?","Reconhecer o estado emocional alterado (raiva/frustração) e parar para se acalmar e se preparar para dirigir.",["Acelerar o veículo para esquecer o problema.","Ignorar a emoção, pois ela não afeta a direção.","Tentar ligar para a pessoa com quem discutiu para resolver o problema enquanto dirige."],"A responsabilidade do condutor começa com o autocontrole: reconhecer o problema e evitar dirigir sob forte estresse emocional.",""],["1-4-128",1,4,0,55,"O instrutor de Maria explicou que o termo \"acidente\" não deve mais ser usado, pois sugere que o evento é uma fatalidade. Qual termo oficial o instrutor usou para se referir a um evento de trânsito evitável que resulta em dano ou prejuízo?","Sinistro.",["Colisão.","Ocorrência.","Desastre."],"O termo sinistro é usado para reforçar que o evento é uma consequência de escolhas e comportamentos, e não um mero acaso.",""],["1-4-129",1,4,0,56,"Você está dirigindo em uma via urbana e testemunha um sinistro sem vítimas. A primeira coisa que você faz é parar o seu veículo em um local seguro. Qual dispositivo do seu veículo você deve acionar imediatamente para alertar os outros condutores sobre o perigo?","O pisca-alerta do veículo.",["O farol alto.","O limpador de para-brisa.","O sistema de som."],"O pisca-alerta é a sinalização mais rápida e essencial para alertar outros motoristas sobre a parada emergencial.",""],["1-4-130",1,4,0,58,"Um motorista sofreu um sinistro e estava consciente, mas com muito medo e sentindo frio. Qual a atitude correta que você deve tomar para dar apoio emocional e manter a vítima estável até a chegada do socorro?","Conversar com a vítima para mantê-la calma e consciente, e cobri-la se estiver com frio.",["Dar água e medicamentos.","Tentar mover a vítima para um local mais seguro.","Fazer procedimentos médicos."],"Seu papel é dar apoio e conforto, nunca tentar fazer intervenções médicas ou dar algo para ingerir.",""],["1-4-131",1,4,0,53,"Você está dirigindo na estrada e percebe que está bocejando a cada minuto e lutando para manter os olhos abertos. Qual atitude de segurança o material indica que você deve tomar imediatamente ao reconhecer esses sinais de alerta?","Encontrar um local seguro, parar e descansar.",["Abrir a janela e aumentar o volume do rádio.","Beber café e continuar dirigindo.","Fazer um cochilo rápido no volante."],"O único remédio seguro para a sonolência é o descanso em um local seguro.",""],["1-4-132",1,4,1,58,"Uma vítima de sinistro está caída na grama, longe do perigo imediato, e parece ter fraturado o braço. Um motorista quer movê-la para o seu carro para levá-la ao hospital. Qual a regra de ouro do material que ele deve seguir, e qual a única exceção?","\"Não remova, não movimente, não transporte.\" A única exceção é em caso de risco iminente (incêndio, explosão).",["\"Movimente apenas em caso de dor.\"","\"Movimente sempre para o acostamento.\"","\"Remova a vítima o mais rápido possível.\""],"A única justificativa para a movimentação é o risco de morte da vítima no local, como um incêndio.",""],["1-4-133",1,4,1,53,"O instrutor comparou o perigo de dirigir com sono ao de dirigir alcoolizado. Qual o efeito direto da sonolência no desempenho do motorista que a torna tão perigosa quanto o álcool?","A sonolência reduz os reflexos, a atenção e a capacidade de reação de forma semelhante ao efeito do álcool.",["A sonolência afeta apenas a velocidade.","A sonolência aumenta a concentração.","A sonolência não tem efeito comparável ao álcool."],"A redução das funções cognitivas e da capacidade de reação é o que torna o sono um \"perigo invisível\" e equiparável ao álcool.",""],["1-4-134",1,4,1,61,"Os pneus são o único ponto de contato entre o veículo e o chão. Qual a periodicidade ideal de calibrageml?","Pelo menos uma vez por semana, sempre com os pneus frios.",["A cada 15 dias, logo após o carro ter rodado um pouco para aquecer.","Apenas uma vez por mês, não importando a temperatura.","Somente antes de viagens longas, se o pneu estiver visivelmente murcho."],"A calibragem semanal com pneus frios é a recomendação.",""],["1-4-135",1,4,1,61,"Pneus murchos causam diversos problemas. Quais são as duas consequências diretas de pneus com calibragem inadequada?","Aumentam o consumo de combustível e desgastam mais rápido.",["Aumentam a vida útil do pneu e melhoram a estabilidade.","Diminuem o consumo de combustível e melhoram a frenagem.","Prejudicam apenas o sistema de suspensão, sem afetar o consumo."],"Pneus murchos aumentam o consumo e desgastam mais rápido.",""],["1-4-136",1,4,1,61,"Qual é o procedimento correto para manter o equilíbrio do desgaste e aumentar a vida útil dos pneus?","Fazer o rodízio a cada 10 mil km.",["Trocar todos os pneus por novos a cada 5 mil km.","Aumentar a calibragem em 25% para compensar o desgaste.","Rodar apenas na cidade, pois o rodízio é inútil em rodovias."],"O rodízio a cada 10 mil km equilibra o desgaste.",""],["1-4-137",1,4,0,61,"Qual o perigo principal dos pneus com desgaste ou \"carecas\", especialmente em pistas molhadas?","Pneus gastos não conseguem expulsar água da pista e podem causar aquaplanagem.",["Pneus gastos podem causar vibração excessiva no volante.","Pneus gastos fazem o carro puxar para o lado esquerdo.","Pneus gastos apenas aumentam o ruído de rodagem."],"Pneus gastos são um risco sério de aquaplanagem.",""],["1-4-138",1,4,0,62,"Além de enxergar no escuro, qual é o outro papel fundamental das luzes do veículo para a segurança no trânsito?","Servir para que os outros veículos vejam o seu carro.",["Apenas alertar sobre a falha de outros sistemas do veículo.","Apenas consumir menos energia elétrica do carro.","Ajudar a carregar a bateria do veículo."],"As luzes têm a função de \"ver e ser visto\".",""],["1-4-139",1,4,0,62,"Qual o procedimento de segurança simples, que leva apenas alguns segundos, que o condutor deve realizar antes de sair de casa?","Testar sempre os faróis, as setas e a luz de freio.",["Verificar o nível de óleo com o motor quente.","Fazer o rodízio dos pneus a cada saída.","Calibrar o estepe semanalmente, mesmo se estiver OK."],"Testar as luzes evita sinistros e é rápido.",""],["1-4-140",1,4,0,62,"Em relação ao uso do farol, qual a simples atitude que aumenta muito a visibilidade do seu carro para outros motoristas, principalmente em rodovias?","Manter o farol baixo aceso mesmo durante o dia.",["Manter o farol alto aceso durante o dia.","Usar apenas a luz de posição em rodovias.","Desligar todos os faróis para economizar bateria."],"O farol baixo de dia aumenta a visibilidade.",""],["1-4-141",1,4,0,62,"Qual é o principal risco causado pelo uso incorreto do farol alto?","O farol alto ofusca quem vem na direção contrária e pode causar sinistros graves.",["O farol alto consome mais combustível do que o farol baixo.","O farol alto descarrega rapidamente a bateria do veículo.","O farol alto danifica a suspensão do carro."],"O ofuscamento é o principal perigo do farol alto.",""],["1-4-142",1,4,1,63,"O sistema de freios é classificado como o componente de segurança mais importante do veículo. Qual a frequência recomendada para uma revisão completa (pastilhas, discos, fluido e sistema hidráulico)?","A cada 5 mil ou 10 mil km.",["A cada 20 mil km, apenas se houver ruído.","Uma vez por ano, independentemente da quilometragem.","Apenas quando o pedal estiver muito baixo."],"A revisão completa tem periodicidade definida.",""],["1-4-143",1,4,1,63,"Qual dos sinais a seguir é um aviso de problema no sistema de freios que não pode ser ignorado?","O pedal do freio estiver muito baixo ou muito alto.",["O volante estiver leve e sem vibrações.","O carro estiver com o tanque de combustível cheio.","O som do carro estiver funcionando perfeitamente."],"Os sinais de falha nos freios devem ser observados.",""],["1-4-144",1,4,1,63,"Qual a verificação mensal que o condutor deve fazer no sistema de freios, e o que a baixa no nível desse componente pode indicar?","Observar o nível do fluido de freio; se estiver baixo, pode indicar vazamento.",["Observar o nível da água do radiador; se estiver baixo, pode indicar aquecimento.","Observar o nível do óleo do motor; se estiver baixo, pode indicar entupimento.","Observar o nível do combustível; se estiver baixo, pode indicar sujeira."],"Checar o fluido de freio mensalmente é crucial.",""],["1-4-145",1,4,0,64,"O que as palhetas gastas dos limpadores de para-brisa podem causar, prejudicando a visibilidade, especialmente à noite?","Riscam o vidro e deixam marcas no momento da limpeza.",["Diminuem o consumo de combustível.","Melhoram a estabilidade do veículo.","Aumentam a vida útil do reservatório de água."],"Palhetas gastas riscam o vidro e prejudicam a visão.",""],["1-4-146",1,4,0,64,"Qual é a recomendação de troca para as palhetas dos limpadores de para-brisa?","Pelo menos uma vez por ano, ou sempre que estiverem ressecadas, rachadas ou deixando marcas no vidro. 25",["A cada 5 anos, pois o material é de alta durabilidade.","Apenas quando o motor parar de funcionar.","Somente quando o carro for vendido."],"A troca anual ou por sinais de desgaste é a regra.",""],["1-4-147",1,4,0,64,"Qual é o líquido recomendado para ser misturado à água limpa do reservatório do limpador de para-brisa para ajudar a remover sujeiras e insetos?","Detergente neutro.",["Água sanitária concentrada.","Óleo de motor usado.","Produtos químicos fortes."],"O detergente neutro ajuda na limpeza sem danificar a borracha.",""],["1-4-148",1,4,0,64,"Em quais condições climáticas o sistema de desembaçamento do veículo é classificado como essencial?","Em dias frios e chuvosos.",["Apenas em dias de forte calor.","Apenas em vias sem iluminação.","Somente para desembaçar os vidros laterais."],"O desembaçador garante a visão em condições de umidade e frio.",""],["1-4-149",1,4,0,65,"O óleo é chamado de \"sangue do motor\". Qual a principal função do óleo?","Lubrifica as peças móveis, reduz o atrito e ajuda a controlar a temperatura.",["Apenas alimenta o motor com energia para funcionar.","Apenas limpa o escapamento do veículo.","Apenas aumenta a pressão dos pneus."],"O óleo tem funções vitais no motor.",""],["1-4-150",1,4,0,65,"Qual a periodicidade e condição correta para verificar o nível do óleo do motor, usando a vareta medidora?","Pelo menos uma vez por mês, com o carro frio e em terreno plano.",["Semanalmente, com o carro quente após um longo percurso.","A cada seis meses, com o carro ligado.","Apenas quando acender a luz do painel."],"A verificação deve ser feita mensalmente, com o motor frio e plano.",""],["1-4-151",1,4,0,65,"Por que o motorista deve evitar andar na reserva de combustível?","Andar na reserva pode sugar sujeira do tanque e entupir o sistema.",["Andar na reserva estraga o reservatório do limpador de para-brisa.","Andar na reserva faz o sistema de freios falhar.","Andar na reserva causa ruídos estranhos na suspensão."],"A reserva de combustível é arriscada para o motor.",""],["1-4-152",1,4,0,65,"O que deve ser trocado junto com o óleo do motor para que o óleo novo tenha seus benefícios completos?","O filtro de óleo.",["O óleo de transmissão.","O pneu estepe.","O fluido de freio."],"O filtro de óleo sujo anula o óleo novo.",""],["1-4-153",1,4,0,66,"Qual o principal objetivo da revisão preventiva do veículo?","Identificar pequenos problemas antes que se tornem grandes e caros.",["Apenas deixar o carro mais bonito para a revenda.","Apenas gastar dinheiro desnecessariamente.","Apenas cumprir uma exigência legal do CTB."],"O objetivo é a prevenção de problemas e custos maiores.",""],["1-4-154",1,4,0,66,"Qual documento do veículo traz um cronograma de revisões, com as quilometragens recomendadas e que deve ser seguido à risca?","O manual do proprietário.",["O documento de licenciamento do veículo.","O Certificado de Registro e Licenciamento do Veículo (CRLV).","A CNH do condutor."],"O manual do proprietário é a fonte oficial do cronograma.",""],["1-4-155",1,4,0,66,"Qual a atitude que ajuda a manter o histórico do veículo, valoriza-o na revenda e facilita o acompanhamento da manutenção?","Guardar todos os comprovantes e documentos de manutenção organizados.",["Descartar os comprovantes após o pagamento.","Não anotar a quilometragem na revisão.","Fazer a revisão em locais diferentes a cada vez."],"O histórico organizado valoriza o veículo.",""],["1-4-156",1,4,0,68,"Qual a periodicidade de duração média da bateria do veículo e o que deve ser checado regularmente?","A bateria dura de 2 a 4 anos e deve-se verificar os terminais.",["A bateria dura 1 ano e deve-se checar o nível de água.","A bateria dura 5 anos e deve-se checar o nível de óleo.","A bateria dura 6 meses e deve-se limpar o escapamento."],"A durabilidade e a checagem dos terminais são importantes.",""],["1-4-157",1,4,0,68,"O que o motorista deve fazer imediatamente ao notar que o escapamento do veículo está furado?","Consertar, pois faz barulho excessivo e pode intoxicar os ocupantes com gases.",["Cobrir o furo com fita isolante.","Desligar o sistema de ar-condicionado.","Ignorar, pois o problema é apenas estético."],"O risco de intoxicação exige conserto imediato.",""],["1-4-158",1,4,0,68,"Qual é o procedimento de segurança obrigatório ao verificar o nível de água do radiador?","Verificar o nível com o motor frio e nunca abrir com o motor quente.",["Abrir o reservatório com o motor quente para checar a pressão.","Usar o dedo para verificar se a água está quente.","Verificar apenas o nível, sem se preocupar com a temperatura."],"Nunca abrir o radiador quente evita queimaduras graves.",""],["1-4-159",1,4,2,68,"Qual o sinal de problema na suspensão que o condutor pode observar ao dirigir, além de ruídos estranhos e desalinhamento?","Desgaste irregular dos pneus.",["O retrovisor externo estar quebrado.","O nível de combustível estar baixo.","A luz de freio estar queimada."],"O desgaste irregular dos pneus indica problemas na suspensão.",""],["1-4-160",1,4,1,62,"Qual a regra de uso do farol alto à noite?","Usar apenas em vias sem iluminação e sem tráfego contrário.",["Usar em todas as vias, para enxergar o máximo possível.","Nunca usar o farol alto, pois sempre ofusca.","Usar o farol alto apenas ao frear."],"O uso do farol alto é restrito para evitar ofuscamento.",""],["1-4-161",1,4,1,68,"O que os filtros de ar, óleo e combustível entupidos causam no veículo, exigindo que sejam trocados conforme o manual?","Prejudicam o desempenho e aumentam o consumo.",["Melhoram o sistema de freios.","Diminuem o ruído do escapamento.","Aumentam a vida útil do pneu."],"Filtros entupidos afetam diretamente o motor.",""],["1-4-162",1,4,1,66,"Qual a relação entre a manutenção preventiva e o meio ambiente?","Cuidar do veículo (manutenção) é cuidar da sua segurança, da de quem está com você e também do meio ambiente.",["A manutenção só serve para aumentar a potência do motor.","Não há relação, pois o veículo não afeta o meio ambiente.","A manutenção é feita apenas para evitar multas."],"A manutenção tem um impacto social e ambiental.",""],["1-4-163",1,4,1,62,"Você está dirigindo em uma rodovia à noite, em um trecho com pouca iluminação. De repente, você avista um veículo vindo na direção contrária. Qual é o procedimento correto que você deve adotar para seguir as regras de segurança e evitar um sinistro?","Mudar imediatamente do farol alto para o farol baixo assim que o outro veículo se aproximar.",["Manter o farol alto aceso até o veículo passar, para garantir o máximo de visibilidade da pista.","Desligar completamente os faróis para não ofuscar o outro motorista.","Ligar as luzes de neblina em conjunto com o farol alto."],"O material alerta que o farol alto ofusca quem vem na direção contrária e pode causar sinistros graves. Portanto, ele deve ser trocado para o baixo ao avistar outro veículo.",""],["1-4-164",1,4,0,61,"Você está se preparando para uma viagem de fim de semana e encontra seu estepe na mala. Você o inspeciona e ele está visivelmente murcho. Qual é a negligência imediata que você comete ao não ter cuidado com o pneu reserva?","Corre o risco de ter um pneu reserva murcho quando mais precisar dele em uma emergência.",["Você gastará mais combustível durante a viagem.","O estepe murcho causará ruídos estranhos na suspensão.","O pneu reserva murcho aumenta a vida útil dos pneus que estão rodando."],"O material orienta que se \"Confira regularmente\" o estepe, pois ele precisa estar pronto para ser usado em emergências.",""],["1-4-165",1,4,1,68,"Ao dirigir pela cidade, você começa a sentir um forte cheiro de gás de escape dentro do carro e ouve um barulho metálico na parte traseira. Qual é o risco iminente associado a um escapamento furado?","O escapamento furado pode intoxicar os ocupantes com gases dentro do veículo.",["O carro será reprovado na inspeção de freios.","O ruído excessivo pode danificar a suspensão do carro.","O problema fará com que o fluido de freio vaze."],"O material avisa que um \"escapamento furado faz barulho excessivo e pode intoxicar os ocupantes com gases.\"",""],["1-4-166",1,4,0,64,"É um dia frio e chuvoso e o vidro do seu carro começa a embaçar rapidamente, comprometendo totalmente sua visão. Qual sistema do veículo é essencial para garantir que você possa enxergar a via nessas condições climáticas?","O sistema de desembaçamento, que deve ser testado, pois é essencial em dias frios e chuvosos.",["O sistema de suspensão.","A correta calibragem do estepe.","O sistema de iluminação de emergência."],"O material lista o desembaçamento como um sistema essencial para garantir a visibilidade em dias frios e chuvosos.",""],["1-4-167",1,4,1,65,"Você precisa verificar o nível de óleo do motor antes de sair para o trabalho. Com pressa, você faz a checagem logo após estacionar o carro, ainda quente e com o motor ligado. Qual é o erro de procedimento que você cometeu?","A verificação deve ser feita com o carro frio e em terreno plano para garantir que o óleo assente.",["O óleo precisa estar quente para que sua viscosidade seja medida corretamente.","O motor deve estar ligado para que o óleo circule.","O nível de óleo não pode ser verificado em dias úteis, apenas nos finais de semana."],"O procedimento correto no material é verificar o nível de óleo com o \"motor frio e em terreno plano\".",""],["1-4-168",1,4,1,65,"Ao checar o nível de óleo com a vareta, você percebe que ele está significativamente abaixo da marca \"Mínimo\". Qual é a primeira atitude a ser tomada, conforme o manual, para evitar um prejuízo enorme ao motor?","Completar o nível com o tipo de óleo recomendado no manual e, se o consumo for frequente, procurar um mecânico.",["Adicionar qualquer tipo de óleo disponível, desde que o nível suba acima da marca mínima.","Ignorar o nível, pois o carro foi revisado há seis meses.","Adicionar apenas água no reservatório do óleo."],"O texto indica que o óleo deve ser completado com o tipo recomendado e que o baixo nível constante exige a procura por um mecânico.",""],["1-4-169",1,4,1,65,"Você fez a troca de óleo do seu carro na semana passada, mas decidiu não trocar o filtro de óleo para economizar tempo e dinheiro. Qual a consequência direta dessa escolha?","Um filtro sujo anula os benefícios do óleo novo, comprometendo a lubrificação e a limpeza do motor.",["O carro puxará para um lado ao frear.","O fluido de freio será contaminado pelo óleo velho.","O farol alto deixará de funcionar corretamente."],"O material indica que o filtro de óleo deve ser \"trocado sempre junto com o óleo\", pois um filtro sujo anula os benefícios do óleo novo.",""],["1-4-170",1,4,1,65,"Preocupado com a economia, você decide abastecer em um posto desconhecido que oferece um preço muito abaixo da média do mercado. Qual o risco nessa situação?","O risco de abastecer com combustível adulterado, que pode causar danos sérios ao motor.",["O carro automaticamente puxará para o lado ao acelerar.","Os pneus serão descalibrados automaticamente após o abastecimento.","A bateria do veículo durará mais de 4 anos."],"O material alerta que \"combustível adulterado pode causar danos sérios ao motor\" e exige atenção ao abastecimento.",""],["1-4-171",1,4,1,68,"Você abre o capô do carro e percebe que os terminais da bateria estão cobertos por uma substância esverdeada ou branca (zinabre). Qual a solução de manutenção simples que deve ser aplicada imediatamente?","Limpar os terminais com uma escova para garantir o bom funcionamento da bateria.",["Adicionar mais fluido de freio nos terminais.","Passar a mão nos terminais para remover o zinabre.","Abrir o radiador com o motor quente para dissipar o zinabre."],"O material orienta a \"Verificar os terminais regularmente. Se estiverem sujos ou com zinabre, limpe com uma escova.\"",""],["1-4-172",1,4,2,63,"Ao frear em um sinal, você nota que o carro \"puxa\" bruscamente para a direita e ouve um ruído metálico. Qual é o sinal de alerta de segurança que você não pode ignorar?","É um aviso sério de que há um problema no sistema de freios, exigindo a procura imediata de um mecânico.",["O sinal indica que os pneus estão apenas descalibrados.","O problema é causado pela sujeira no reservatório de água do limpador.","O sinal é causado por um vazamento de óleo do motor."],"O material lista o carro \"puxar para um dos lados\" e \"ruídos estranhos\" como sinais de que algo não está certo com o sistema de freios.",""],["1-4-173",1,4,1,62,"Você está dirigindo em uma rodovia e percebe que sua luz de freio traseira não está acendendo. Ao que está associado a falha da luz de freio?","Ao aumento muito grande do risco de colisão traseira, pois o motorista de trás não será avisado da sua desaceleração.",["Ao vazamento de fluido do sistema de arrefecimento.","Ao aumento do consumo de combustível.","Ao desgaste irregular dos pneus dianteiros."],"A falha na luz de freio é um perigo porque ela é essencial para \"avisar quem vem atrás\" e aumenta o risco de colisão traseira.",""],["1-4-174",1,4,0,64,"Para limpar o para-brisa, você usa um produto de limpeza de uso doméstico muito forte, não recomendado para carros. Qual é o risco dessa atitude para o sistema de limpeza?","Danificar a borracha das palhetas dos limpadores de para-brisa.",["Descalibrar os pneus automaticamente.","Aumentar o nível do óleo do motor.","Obstruir o sistema de arrefecimento."],"O material recomenda usar detergente neutro no reservatório, indicando que produtos químicos fortes podem danificar o sistema, como a borracha das palhetas.",""],["1-4-175",1,4,1,68,"Você tem observado ruídos estranhos ao passar em lombadas e percebeu que um de seus pneus está com desgaste irregular. Qual dos sistemas complementares pode estar com problemas e necessita de verificação?","O sistema de suspensão, que tem como sinais ruídos estranhos, desalinhamento ou desgaste irregular dos pneus.",["O sistema de iluminação de placa.","O sistema de desembaçamento do vidro traseiro.","O sistema de luzes de ré."],"O material recomenda ficar atento a \"ruídos estranhos, desalinhamento ou desgaste irregular dos pneus\", pois esses são sinais de problemas na suspensão.",""],["1-4-176",1,4,1,66,"Você manteve o histórico de manutenção do seu carro organizado, guardando os comprovantes e anotando as quilometragens. Qual é o benefício direto dessa organização na hora de trocar ou vender o veículo?","Ajuda a manter o histórico do veículo e valoriza o carro na revenda.",["Isso só é útil para o mecânico, sem valor para o proprietário.","Os comprovantes devem ser descartados após um ano de uso.","A organização só é útil para carros com menos de 2 anos de uso."],"O material instrui a \"Guardar comprovantes\" pois isso \"valoriza o veículo e facilita o acompanhamento\".",""],["1-4-177",1,4,0,68,"Você nota que o nível de água do radiador está um pouco baixo e decide completá-lo. Qual é o procedimento de segurança ao fazer essa checagem?","Verificar o nível com o motor frio e nunca abrir o radiador com o motor quente, sob risco de queimaduras graves.",["Abrir a tampa com o motor quente para que o vapor force a saída da água.","Usar água mineral para garantir a pureza do líquido de arrefecimento.","Completar o nível de água apenas uma vez por ano."],"O material instrui a \"Verifique o nível de água do radiador com o motor frio. Nunca abra com o motor quente, pois pode causar queimaduras graves.\"",""],["1-4-178",1,4,1,63,"Em vez de esperar um problema surgir, você agenda a troca de pastilhas e a checagem do fluido de freio a cada 10 mil km. Qual a vantagem financeira que essa atitude proativa garante?","A manutenção preventiva sempre sai mais barato do que o conserto de um problema de última hora.",["A manutenção preventiva aumenta o custo mensal do veículo.","O conserto de última hora não é tão caro quanto a revisão agendada.","O seguro do carro cobre apenas problemas causados por falta de manutenção."],"O material cita a \"Sabedoria automotiva\": \"Manutenção preventiva sempre sai mais barato\" do que consertar com pressa.",""],["1-4-179",1,4,1,64,"Você está em uma viagem longa e, de repente, uma nuvem de poeira e sujeira cobre seu para-brisa. Qual a solução ideal para limpar o vidro e não estragar as palhetas?","Usar o reservató
