bstruir o tráfego e evitar novos sinistros.",["Ligar para o SAMU (192) como precaução, mesmo que ninguém aparente estar ferido.","Aguardar a chegada da autoridade policial para registrar a ocorrência antes de mover os veículos.","Fotografar os danos e a posição dos veículos na via antes de qualquer movimentação para garantir o registro."],"Se não houver feridos e os veículos estiverem bloqueando o trânsito, eles devem ser removidos para liberar a via e aumentar a segurança. Art. 178 do CTB",""],["2-4-15",2,4,1,54,"Joana teve uma discussão estressante no trabalho e, ao entrar no carro para voltar para casa, sente muita raiva. No trânsito, outro motorista a fecha. Qual é a atitude mais segura e responsável que Joana pode tomar nessa situação?","Respirar fundo algumas vezes, reconhecer que está com raiva e focar em dirigir com calma para chegar em segurança.",["Anotar a placa do outro carro para registrar uma queixa formal contra o motorista depois.","Ligar para um colega para desabafar sobre a discussão e sobre o motorista que a fechou.","Acelerar para alcançar o outro veículo e buzinar para expressar sua indignação."],"O gerenciamento das emoções, como reconhecer o sentimento e agir com calma, é fundamental para manter a segurança e evitar decisões impulsivas no trânsito.",""],["2-4-16",2,4,2,61,"O que significa dizer que os pneus são responsáveis pela 'aquaplanagem'?","Que pneus gastos perdem a capacidade de expulsar a água da pista, fazendo o veículo flutuar sobre ela e perder o controle.",["Que pneus de baixa qualidade podem absorver água e aumentar o peso do veículo na chuva.","Que a calibragem não é importante.","Que os pneus podem ser velhos que funcionarão."],"Os sulcos dos pneus são projetados para drenar a água. Quando estão gastos ('carecas'), essa drenagem falha, e uma camada de água se forma entre o pneu e o asfalto.",""],["2-4-18",2,4,1,61,"Para garantir a segurança e a durabilidade do veículo, a manutenção preventiva é essencial. Com que frequência e em que condição os pneus devem ser calibrados?","Semanalmente, com os pneus frios, seguindo a pressão indicada no manual do veículo.",["Apenas quando parecerem visivelmente murchos, usando qualquer pressão.","Uma vez por mês, enchendo-os um pouco acima do recomendado para durar mais.","A cada seis meses, com os pneus quentes para a pressão se ajustar melhor."],"Esta é a recomendação correta para garantir a pressão ideal, o que melhora a segurança, a durabilidade dos pneus e a economia de combustível.",""],["2-4-19",2,4,0,69,"Para proteger o meio ambiente, qual das atitudes abaixo deve ser EVITADA por um condutor consciente?","Circular com o carro soltando fumaça preta e com o escapamento furado.",["Calibrar os pneus do carro toda semana.","Fazer a manutenção preventiva do veículo regularmente.","Planejar a rota antes de sair para evitar engarrafamentos."],"Fumaça preta indica queima incorreta de combustível, liberando altos níveis de poluição, e um escapamento furado causa poluição sonora excessiva.",""],["2-4-20",2,4,2,36,"Para que o airbag funcione de forma eficaz e segura, o uso de qual outro item é crucial?","Cinto de segurança.",["Calçados adequados.","Freios ABS.","limpador de parabrisas."],"O cinto mantém o corpo do ocupante na posição correta, evitando que ele seja lançado contra o airbag em expansão.",""],["2-4-21",2,4,1,58,"Por que é errado fotografar ou filmar vítimas em um local de sinistro para divulgar na internet?","Porque desrespeita a dignidade das pessoas envolvidas e atrapalha o trabalho do socorro.",["Porque a câmera do celular pode atrapalhar os equipamentos da equipe de resgate.","Porque as imagens podem ser consideradas falsas e gerar pânico.","Porque apenas jornalistas profissionais têm autorização para registrar essas cenas."],"A legislação protege a imagem e a dignidade da pessoa. Além disso, a ação de filmar desvia o foco de quem poderia estar ajudando e interfere no trabalho dos profissionais.",""],["2-4-22",2,4,1,66,"Por que o manual do proprietário é considerado a ferramenta mais importante para a manutenção preventiva do veículo?","Porque traz um cronograma de revisões desenvolvido pelos engenheiros que projetaram o carro, detalhando o que e quando verificar.",["Porque ensina o proprietário a ser mecânico.","Porque sem ele o veículo não anda.","Porque contém os contatos de todas as oficinas mecânicas credenciadas pela montadora."],"O manual contém o cronograma exato de revisões, criado por quem conhece o veículo em profundidade, e seguir essas recomendações é fundamental.",""],["2-4-23",2,4,0,70,"Qual das alternativas de mobilidade é apresentada como ideal para trajetos pequenos, combinando benefícios para a saúde, custo zero e impacto ambiental nulo?","Caminhada.",["Caronas Solidárias.","utilziar a motocicleta","utilizar o ciclomotor"],"A caminhada para trajetos pequenos é uma das melhores formas de deslocamento, trazendo os benefícios à saúde e o custo e poluição zero.",""],["2-4-24",2,4,1,70,"Qual dos seguintes meios de transporte é considerado o mais sustentável para a preservação do meio ambiente?","Bicicleta.",["Transporte Público.","Carro elétrico.","Motocicleta."],"A bicicleta é o meio de transporte mais sustentável para a preservação do meio ambiente, pois não utiliza combustíveis fósseis, não emite poluentes e contribui para a redução do tráfego e da poluição sonora.",""],["2-4-25",2,4,1,70,"Qual das seguintes ações é um exemplo de condução ecológica que ajuda a reduzir o consumo de combustível e a poluição do ar?","Acelerar de forma suave e progressiva, antecipando as paradas para evitar freadas bruscas.",["Manter o ar-condicionado sempre ligado na potência máxima para o motor funcionar melhor.","Retirar o catalisador do escapamento para dar mais potência ao veículo.","Acelerar e frear bruscamente para tornar o fluxo do trânsito mais dinâmico."],"Dirigir de maneira suave mantém o motor em uma faixa de rotação mais eficiente, economizando combustível e diminuindo a emissão de poluentes.",""],["2-4-26",2,4,2,70,"Qual das seguintes práticas de 'Condução Ecológica' tem o maior impacto na economia de combustível?","Manter os pneus sempre bem calibrados.",["Acelerar forte.","Deixar o porta-malas cheio de coisa desnecessária.","Deixar de desligar o motor em paradas longas."],"A calibragem correta dos pneus pode gerar uma economia de até 8% no consumo de combustível, um valor percentual direto mencionado.",""],["2-4-27",2,4,0,57,"Qual dos números de emergência listados é o mais indicado para ligar em caso de um sinistro em uma rodovia federal?","191 - Polícia Rodoviária Federal (PRF)",["190 - Polícia Militar","192 - SAMU","193 - Bombeiros"],"A PRF é a autoridade responsável pela fiscalização e atendimento de ocorrências em rodovias federais.",""],["2-4-28",2,4,1,70,"Qual é a principal vantagem ambiental do etanol como combustível no Brasil?","É um combustível renovável que contribui para a redução da emissão de gases de efeito estufa na frota de veículos.",["Não deve ser considerado como opção.","É feito de petróleo.","Pode ser utilizado em veículos feito para gasolina."],"É um combustível renovável (de cana-de-açúcar, etc.) e um dos principais responsáveis pela redução das emissões de gases poluentes no país.",""],["2-4-29",2,4,2,58,"Qual é o principal motivo para NÃO oferecer água, comida ou medicamentos a uma vítima de sinistro de trânsito?","Porque pode causar complicações médicas graves, como durante uma cirurgia.",["Porque a vítima pode não estar com sede ou fome no momento.","Para evitar engasgos, já que a vítima pode estar deitada.","Porque é responsabilidade exclusiva da família oferecer alimentos à vítima."],"A ingestão de qualquer substância pode interferir na anestesia ou em outros procedimentos médicos de emergência que a vítima possa precisar.",""],["2-4-30",2,4,2,42,"Qual é o princípio fundamental da filosofia 'Visão Zero', que influencia as estratégias modernas de segurança no trânsito?","A responsabilidade pela prevenção de mortes e lesões graves é compartilhada por todo o sistema viário, não apenas pelo condutor.",["A meta é eliminar completamente os erros humanos na condução por meio de tecnologia autônoma.","A prioridade máxima é a fluidez do tráfego, pois congestionamentos geram comportamentos de risco.","O objetivo é zerar o número de multas de trânsito através de uma educação mais rigorosa dos condutores."],"Visão Zero parte da premissa de que o erro humano é inevitável e, portanto, o sistema (vias, veículos, leis) deve ser projetado para que esses erros não tenham consequências fatais.",""],["2-4-31",2,4,1,36,"Se a luz indicadora do airbag no painel do carro permanecer acesa após ligar o veículo, o que isso pode indicar?","Uma possível falha no sistema do airbag.",["Que o sistema está ativado e pronto para uso.","Que o veículo está em modo de segurança para estacionamento.","Que o óleo está baixo."],"A permanência da luz acesa é um sinal de alerta de que o sistema pode não funcionar corretamente em caso de colisão.",""],["2-4-32",2,4,0,53,"Se um motorista sai do carro para se alongar durante uma viagem longa, qual benefício direto essa ação traz para a segurança?","Ajuda a combater o cansaço e a sonolência.",["Diminui o tempo total da viagem.","Permite verificar a calibragem dos pneus.","Melhora o consumo de combustível do veículo."],"Ao sair do carro, caminhar e respirar ar fresco são medidas eficazes para recuperar o estado de alerta durante pausas.",""],["2-4-33",2,4,1,60,"Um carro bate em um poste, e cabos elétricos caem sobre ele. O que o motorista, que não se feriu, deve fazer enquanto está dentro do veículo?","Permanecer dentro do veículo sem tocar nas partes metálicas e ligar para os bombeiros (193).",["Tentar empurrar os cabos para longe do carro com um objeto não condutor.","Sair imediatamente do carro, tomando cuidado para não tocar nos fios.","Abrir a porta do veículo."],"O interior do veículo é o local mais seguro. A recomendação é ficar imóvel, evitar contato com o metal e acionar os bombeiros, que são treinados para lidar com riscos elétricos.",""],["2-4-34",2,4,0,55,"Um motorista envolvido em um sinistro percebe um cheiro de combustível e fumaça saindo de um dos carros. Qual deve ser a sua prioridade máxima?","Garantir a própria segurança e a de outros, afastando-se do local e acionando os bombeiros.",["Tentar ligar o carro novamente para tirá-lo do local.","Avaliar os danos materiais para acionar o seguro.","Pegar o extintor de incêndio e tentar apagar a fumaça."],"Fumaça e vazamento de combustível indicam risco de incêndio ou explosão. A primeira ação deve ser sempre proteger a vida, afastando-se e chamando socorro especializado.",""],["2-4-35",2,4,0,53,"Dirigir com sono, mesmo que por poucos segundos, pode causar:","Perda de controle do veículo e maior chance de acidente.",["Nenhum problema, se o cochilo for rápido.","Apenas distração leve, sem risco real.","O carro desacelera automaticamente, prevenindo acidente."],"Cochilar, mesmo por poucos segundos, pode fazer o carro percorrer metros sem controle, aumentando muito o risco de acidentes.",""],["2-4-36",2,4,0,64,"Um motorista nota que as palhetas do limpador de para-brisa estão deixando marcas e rastros de água no vidro, dificultando a visão. O que isso indica?","Que as palhetas estão ressecadas ou gastas e precisam ser trocadas.",["Que o reservatório de água do limpador está vazio.","Que o motor do limpador de para-brisa está sem força.","Que está tudo funcionando corretamente"],"Quando a borracha das palhetas perde a flexibilidade ou se danifica, ela não consegue mais remover a água de forma uniforme, devendo ser substituídas.",""]],"jor":{"1":["1-1-244","1-1-175","1-1-103","1-1-134","1-1-143","1-1-156","1-1-70","1-1-60","1-1-95","1-1-97","1-1-323","1-1-334","1-1-190","1-1-197","1-1-204","1-1-41","1-1-209","1-1-27","1-1-28","1-1-256","1-1-362","1-1-34","1-1-370","1-1-45","1-1-366"],"2":["1-1-285","1-1-288","1-1-289","1-1-287","1-1-292","1-1-293","1-1-299","1-1-235","1-1-249","1-2-1   let html=`<div class="box bow">${guideHTML(F.dom)}<h2 style="margin-top:14px">Domínio por tópico</h2>
   <p>Você domina <b>${dom} de ${tot}</b> tópicos (${Math.round(100*dom/tot)}%). Já respondeu <b>${seenQ} de ${D.q.length}</b> questões do Banco. Caderno de erros: <b>${Object.keys(S.nb).length}</b>.</p>
   <p class="small">Pronta para a prova = todos os tópicos “Dominado”: pelo menos 80% de respostas certas, com prática suficiente e nada pendente no caderno de erros.</p>
   ${weak.length?`<p><b>O que falta agora:</b> ${weak.map(r=>esc(r.t.t)).join('; ')}.</p>`:''}
   <button class="btn go" data-act="reforco" ${TP.some(taught)?'':'disabled'}>Treinar no Reforço</button></div>
   <div class="box scroll"><table><thead><tr><th>Tópico</th><th>Domínio</th><th>Situação</th><th>Vistas</th><th>Caderno</th></tr></thead><tbody>`;
  D.aulas.forEach(A=>{html+=`<tr><th colspan="5" style="background:var(--blush)">Fase ${A.n}: ${esc(A.nome)}${au(A.n).st?'':' (estudo ainda não feito)'}</th></tr>`;
    rows.filter(r=>r.t.a===A.n).forEach(r=>{html+=`<tr><td>${esc(r.t.t)}</td><td><div class="mini" aria-label="${r.s.dom}%"><i style="width:${r.s.dom}%;background:${col[r.s.lv]}"></i></div></td>
      <td class="lvl lv${r.s.lv}">${LVN[r.s.lv]} ${r.s.seen?r.s.dom+'%':''}</td><td>${r.s.seen}/${r.s.total}</td><td>${r.s.nb||''}</td></tr>`;});});
  show(html+'</tbody></table></div>');
}
function scrOpcoes(msg){
  show(`<div class="box bow"><h2>Opções</h2>${msg?`<p class="soft">${esc(msg)}</p>`:''}
   <p>O progresso fica salvo neste navegador. Faça um backup de vez em quando para não perder nada.</p>
   <div class="row"><button class="btn" data-act="export">Exportar backup</button><button class="btn" data-act="import">Importar backup</button></div>
   <div class="row"><button class="btn soft2" data-act="mute">${S.mute?'Ligar o som':'Desligar o som'}</button><button class="btn soft2" data-act="tutAgain">Ver o tutorial de novo</button></div>
   <div class="row"><button class="btn" data-act="reset">Apagar todo o progresso</button></div>
   <p class="small">Conteúdo: módulos, apostila e Banco Nacional de Questões do curso CNH do Brasil (Ministério dos Transportes / Senatran). Placas redesenhadas em vetor a partir do padrão oficial.</p></div>`);
}
function doExport(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='rumo-a-cnh-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);scrOpcoes('Backup exportado. Guarde o arquivo em um lugar seguro.');}
$('fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||x.v!==1||!x.qs)throw 0;S=Object.assign(blank(),x);save();scrOpcoes('Backup importado com sucesso.');}
    catch(err){scrOpcoes('Este arquivo não é um backup válido do Rumo à CNH.');}e.target.value='';};rd.readAsText(f);});
function overlay(html){$('ovbox').innerHTML=html;$('ov').classList.add('on');talk();const b=$('ovbox').querySelector('.btn');if(b)b.focus();}
function closeOv(){$('ov').classList.remove('on');$('ovbox').innerHTML='';}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!$('ovbox').querySelector('[data-act="tut"],[data-act="tutEnd"]'))closeOv();});

/* ================= AÇÕES ================= */
const ACT={
 title:()=>{closeOv();scrTitle();},map:()=>{closeOv();scrMap();},sel:a=>{SFX.click();panel(+a);},
 study:a=>{SFX.page();scrStudy(+a,0);},stNext:()=>{SFX.page();scrStudy(ST.aula,ST.i+1);},stPrev:()=>{SFX.page();scrStudy(ST.aula,ST.i-1);},
 stEnd:()=>{au(ST.aula).st=true;save();SFX.ok();ACT.desafio(ST.aula);},
 desafio:a=>{a=+a;if(S.run&&S.run.type==='desafio'&&S.run.aula===a){renderQ();return;}startRun('desafio',D.jor[a].slice(),{aula:a});},
 chefe:a=>startRun('chefe',bossQueue(+a),{mod:+a}),simulado:()=>startRun('simulado',simQueue()),
 ans:a=>answer(+a),next:()=>next(),quit:()=>{if(S.run&&S.run.type!=='desafio')S.run=null;save();scrMap();},
 reforco:()=>{SFX.page();scrReforco();},rfNext:a=>{SFX.page();scrReforco(+a);},rfGo:()=>startRun('reforco',RP.q),
 painel:()=>{SFX.page();scrPainel();},opcoes:()=>{SFX.page();scrOpcoes();},
 mute:()=>{S.mute=!S.mute;save();hud();const o=document.querySelector('.box h2');if(o&&o.textContent==='Opções')scrOpcoes();},
 export:doExport,import:()=>$('fileIn').click(),
 reset:()=>overlay(`<div class="box"><h2>Apagar tudo?</h2><p>Isso apaga corações, broches, estatísticas e o caderno de erros deste navegador.</p>
   <div class="row"><button class="btn" data-act="closeOv">Cancelar</button><button class="btn go" data-act="resetYes">Apagar</button></div></div>`),
 resetYes:()=>{S=blank();save();closeOv();scrTitle();},closeOv:closeOv,
 zoomPlate:c=>overlay(`<div class="box" style="text-align:center"><div style="width:240px;height:240px;margin:0 auto">${plateSVG(c,PLACAS[c][0])}</div>
   <p class="tag" style="margin-top:10px">${c}</p><h3>${esc(PLACAS[c][0])}</h3><button class="btn go" data-act="closeOv">Fechar</button></div>`),
 tut:a=>{SFX.click();tutorial(+a);},tutEnd:()=>{S.tut=true;save();closeOv();},tutAgain:()=>{S.tut=false;save();scrMap();},
 skipSay:skipSay,
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.arg);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('ov').classList.contains('on')&&!$('ovbox').querySelector('[data-act="tut"]'))closeOv();
  if(S.run&&!S.run.last&&$('screen').querySelector('.opts')&&!$('ov').classList.contains('on')){const k=e.key.toLowerCase();const i='1234'.indexOf(k)>=0?'1234'.indexOf(k):'abcd'.indexOf(k);if(i>=0)answer(i);}
});
scrTitle();
})();

</script>
