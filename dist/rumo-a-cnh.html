a.",""],["1-1-11",1,1,1,6,"Faixa de pedestre elevada serve para:","Forçar redução de velocidade e dar prioridade segura ao pedestre.",["Enfeitar a rua sem função prática.","Servir de estacionamento temporário.","Facilitar ultrapassagens."],"Dispositivo físico de acalmamento de tráfego.",""],["1-1-12",1,1,0,17,"A presença de uma faixa de pedestres exige do motorista:","Parar e dar preferência ao pedestre.",["Acelerar para liberar logo a via.","Tocar buzina para o pedestre correr.","Virar o volante sobre a faixa."],"Prioridade máxima ao pedestre.",""],["1-1-13",1,1,0,6,"Faixa exclusiva de ônibus (horário válido):","Não pode ser usada por carro, só cruzar para conversão onde permitido.",["Pode ser usada para adiantar a viagem.","Pode estacionar “rapidinho”.","Pode trafegar à noite sempre."],"Exclusividade melhora o transporte coletivo e a segurança.",""],["1-1-15",1,1,0,14,"Como os veículos são identificados formalmente?","São identificados por meio de placas externas dianterias e traseiras, com letras e números.",["Com cores que o proprietário escolhe.","Com enfeites ou adesivos colocados pelo condutor.","O condutor coloca cada roda de uma cor."],"A identificação de veículos por placas está prevista no art. 115 do CTB.",""],["1-1-18",1,1,0,48,"Qual é a função das faixas da esquerda em uma via de várias faixas?","Servem para ultrapassagem e para veículos mais rápidos.",["Para caminhões e ônibus.","Para veículos lentos.","Para estacionar."],"Isso mantém o fluxo seguro e organizado.",""],["1-1-19",1,1,2,9,"Quando há obras na via e sinalização provisória para acesso a imóveis, o condutor deve:","Seguir as orientações dos agentes ou trabalhadores da obra.",["Forçar a passagem.","Ignorar as barreiras.","Fazer manobra pela contramão."],"A sinalização provisória garante segurança durante intervenções.",""],["1-1-20",1,1,1,39,"Aproximação de rotatória sem placa de pare nem semáforo. O que fazer?","Reduzir, observar e dar passagem a quem já circula dentro.",["Entrar acelerando porque não tem placa.","Parar dentro da rotatória para decidir a saída.","Parar o veículo completamente."],"Preferência interna é a regra. Art. 29, inciso III, alínea b do CTB",""],["1-1-21",1,1,1,33,"Como se classifica uma pista urbana e elevada, com acesso controlado, sem cruzamentos, com placas de 80 km/h?","Via de trânsito rápido.",["Via coletora.","Via local.","Estrada."],"A classificação de vias encontra-se no anexo do CTB.",""],["1-1-22",1,1,1,33,"Você está em uma via coletora (40 km/h) e vê placa uma 30 km/h . Qual conduta o motorista deve adotar?","Obedecer o limite de 30 km/h, pois sinalização específica prevalece.",["Manter 40 km/h da coletora.","Seguir na velocidade que entender melhor.","Ignorar porque é temporária."],"Placa vigente regula a via naquele trecho.",""],["1-1-23",1,1,1,39,"Em certa rotatória há placas dando preferência a quem se aproxima. Qual é a regra que vale?","Vale a sinalização do local, pois essa prevalece.",["Vale a regra geral sempre.","Vale quem buzina.","Vale quem está mais rápido."],"Sinalização pode alterar a preferência local.",""],["1-1-24",1,1,0,7,"Quando o semáforo passa para a cor amarela, o que um condutor consciente deve fazer?","Reduzir a velocidade e preparar-se para parar.",["Acelerar para aproveitar o sinal.","Parar bruscamente no meio da via.","Buzinar para os pedestres atravessarem rápido."],"A interpretação correta do sinal é uma ação cognitiva essencial.",""],["1-1-25",1,1,0,50,"Qual a conduta a ser adotada quando ver uma escola e alunos na calçada?","Reduzir bem a velocidade e ficar atento a travessias.",["Seguir no limite da via sem reduzir.","Buzinar para avisar.","Acelerar para passar rápido."],"Devem ser respeitadas as sinalizações de trânsito e as áreas de segurança.",""],["1-1-26",1,1,1,21,"No contexto da sinalização horizontal de estacionamentos, o que a cor azul (faixa azul) das vagas representa?","Vaga destinada a pessoas com deficiência.",["Vaga rotativa.","Vaga para idosos.","Vaga para carga e descarga."],"O símbolo azul identifica vagas PCD. A sinalização de vagas especiais de estacionamento deve seguir o padrão de cor azul e ser complementada pela sinalização vertical e pelo símbolo internacional de acesso (para PCD) ou pelo Símbolo Internacional de Acesso para Idosos. A cor azul é universalmente utilizada para indicar estas vagas de uso preferencial ou exclusivo.",""],["1-1-27",1,1,1,3,"Um motorista vê uma placa de curva perigosa. O que deve fazer?","Reduzir a velocidade e manter controle do veículo.",["Frear bruscamente no meio da curva.","Acelerar para sair logo.","Ignorar a sinalização."],"A placa de \"Curva Perigosa\" é uma advertência da condição adversa da via. A Direção Defensiva exige que o motorista reduza a velocidade no trecho reto antes da curva para que, ao entrar nela, possa manter a estabilidade e evitar que a força centrífuga jogue o veículo para a contramão ou para fora da pista.",""],["1-1-28",1,1,1,3,"Um motorista, dirigindo em excesso de velocidade, vê uma placa de curva perigosa e continua na mesma velocidade. Qual o risco?","Perder o controle e causar um sinistro.",["Melhorar o tempo de viagem.","Reduzir o consumo de combustível.","Evitar filas."],"A placa de \"Curva Perigosa\" é uma advertência da condição adversa da via. A Direção Defensiva exige que o motorista reduza a velocidade no trecho reto antes da curva para que, ao entrar nela, possa manter a estabilidade e evitar que a força centrífuga jogue o veículo para a contramão ou para fora da pista.",""],["1-1-29",1,1,2,21,"Carlos estaciona seu veículo de passeio em uma vaga com a placa contendo o texto “Exceto Carga e Descarga – 30 min”. Ele pode permanecer ali com o veículo?","Não, pois a vaga é exclusiva para veículos de carga por até 30 minutos.",["Sim, se não houver caminhões.","Sim, por menos de 10 minutos.","Sim, desde que com pisca-alerta ligado."],"Conforme estabelece o Art. 181, inciso XVII do CTB, estacionar em desacordo com as condições regulamentadas especificamente pela placa (no caso, \"Exceto Carga e Descarga\") é infração grave, sujeita a multa e remoção do veículo. A sinalização vertical restringe o uso da vaga apenas para a finalidade de carga e descarga, vedando o estacionamento de veículos de passeio ou a permanência por motivos que não o manuseio de mercadorias.",""],["1-1-30",1,1,2,2,"Um condutor vê a placa acima junto a outra com o texto “Exceto veículos de emergência”. O que isso significa?","A restrição não se aplica a veículos de emergência, como ambulâncias, em serviço.",["Todos os veículos estão liberados.","Somente ônibus podem passar.","É uma placa de advertência."],"Conforme as normas de Sinalização de Regulamentação do CONTRAN, a placa principal indica uma proibição. A placa adicional com a inscrição “Exceto veículos de emergência” atua como um painel complementar, que estabelece uma exceção à regra geral de proibição. Essa exceção é crucial para garantir que, em situações de urgência e emergência, o local esteja reservado e desimpedido para o acesso rápido e vital desses veículos.","R-14"],["1-1-32",1,1,2,3,"Em curvas indicadas por uma placa como esta acima, por que é importante olhar para o ponto de saída da curva?","Para orientar o traçado da direção e manter a trajetória estável.",["Para observar o retrovisor direito.","Para reduzir o consumo de combustível.","Para verificar o velocímetro."],"Antecipar o olhar ajuda a guiar o veículo com suavidade e segurança.","A-1b"],["1-1-33",1,1,2,2,"Felipe segue pela faixa da direita e encontra a placa acima, seguida de “Fim da proibição de mudar de faixa”. O que isso significa?","Que ele pode mudar de faixa a partir da segunda placa.",["Que a proibição vale até o fim da via.","Que a manobra continua proibida.","Que só motos podem mudar de faixa."],"A placa de “fim de proibição” define o ponto exato onde a manobra volta a ser permitida com segurança.","R-8b"],["1-1-34",1,1,2,2,"Júlia conduz um ônibus e encontra a placa acima próxima a uma rotatória. Qual é o comportamento correto?","Seguir em frente e utilizar a rotatória para mudar de sentido.",["Fazer o retorno antes da rotatória.","Parar sobre a via.","Encostar no acostamento e manobrar."],"A rotatória é o ponto adequado para retornar, respeitando a proibição localizada.","R-5a"],["1-1-35",1,1,2,1,"O formato circular com borda vermelha da placa indica","Uma proibição expressa ao condutor.",["Uma informação turística.","Uma advertência temporária.","Um serviço de utilidade pública."],"As placas circulares de fundo branco e borda vermelha pertencem à classe de regulamentação, sinalizando ordens obrigatórias.",""],["1-1-36",1,1,2,1,"A placa com formato triangular invertido tem como função","Facilitar o reconhecimento mesmo à distância e indicar atenção.",["Diferenciar as placas de informação turística.","Servir apenas para fins estéticos.","Indicar uma área de estacionamento."],"O triângulo invertido é símbolo internacional de advertência e cortesia no trânsito, facilmente identificado por qualquer condutor.",""],["1-1-37",1,1,2,3,"O que acontece se o condutor ignorar essa placa e não parar onde for obrigado?","Ele comete infração gravíssima.",["Ele será apenas advertido verbalmente.","Não acontece nada.","O veículo é removido imediatamente."],"Deixar de parar diante da placa PARE é infração gravíssima (CTB art. 208).","A-15"],["1-1-38",1,1,1,3,"O que essa placa está avisando?","Que a pista tem irregularidades no pavimento.",["Que há um quebra-molas.","Que a pista é nova e lisa.","Que há obras à frente."],"A placa alerta sobre buracos, remendos ou deformações na via.","A-17"],["1-1-39",1,1,1,3,"O que indica a placa acima - Cruz de Santo André?","O início de uma passagem de nível, onde a pista cruza com uma linha de trem.",["Uma ponte sobre o rio.","Um cruzamento entre duas vias urbanas.","Um local de pedágio."],"A placa alerta que o motorista está prestes a cruzar trilhos ferroviários e deve redobrar a atenção.","A-41"],["1-1-40",1,1,1,2,"O que indica a placa acima?","O sentido obrigatório de circulação na rotatória - Neste caso anti-horário.",["O ponto de parada obrigatória.","A entrada proibida na via.","A preferência de pedestres."],"O símbolo de setas circulares indica o sentido único que todos os veículos devem seguir na rotatória.","R-33"],["1-1-41",1,1,1,2,"O que indica a placa acima?","Que pedestres e ciclistas devem compartilhar o mesmo espaço com atenção e respeito mútuo.",["Que apenas ciclistas podem circular.","Que é proibido o trânsito de bicicletas.","Que pedestres devem usar bicicletas para passar."],"Essa placa indica convivência entre pedestres e ciclistas.","R-44"],["1-1-42",1,1,1,3,"O que o motorista deve fazer ao ver essa placa?","Reduzir a velocidade e usar freio motor.",["Acelerar para descer mais rápido.","Ligar o pisca-alerta.","Frear só quando o carro já estiver em alta velocidade."],"A redução de velocidade antes da descida garante segurança e controle do veículo.","A-20a"],["1-1-43",1,1,1,3,"Qual o significado da placa acima?","Indica a presença ou o cruzamento de máquinas agrícolas na pista.",["Indica que o condutor deve ultrapassar sempre que possível, mesmo sem visibilidade.","Indica que o condutor deve ignorar o aviso e seguir em alta velocidade.","Indica que o condutor deve ultrapassar pelo acostamento."],"Indica a presença ou o cruzamento de máquinas agrícolas na pista, comuns em zonas rurais, áreas de produção ou colheita, e alerta o condutor a reduzir a velocidade e manter distãncia segura.","A-31"],["1-1-44",1,1,1,2,"Por que a placa acima é importante em vias urbanas com semáforo?","Porque ajuda a definir fluxos compatíveis com o tempo semafórico.",["Porque indica estacionamento permitido.","Porque dispensa o uso da seta.","Porque reduz a visibilidade."],"Garante harmonia entre sinalização vertical e semafórica, evitando conflitos.","R-25c"],["1-1-45",1,1,2,3,"Qual é a diferença entre a curva indicada pela placa acima à esquerda e a da direita?","A acima à esquerda indica uma curva menos acentuada.",["A acima à esquerda indica uma curva muito mais fechada.","A acima à esquerda proíbe o tráfego de caminhões.","A acima à esquerda é usada apenas em rotatórias."],"A-2a é usada para curvas suaves e a A-1a, para curvas acentuadas.","A-2a"],["1-1-46",1,1,2,3,"Qual é a diferença entre a placa “Trânsito de pedestres” e a placa “Passagem sinalizada de pedestres”?","A primeira indica o trânsito frequente de pedestres, enquanto a segunda indica a presença de faixa de pedestres sinalizada.",["Ambas têm o mesmo significado.","A primeira é obrigatória e a segunda é proibitiva.","A placa indica travessia de ciclistas."],"A diferença está na representação da faixa no pictograma: a A-32b mostra o pedestre sobre a faixa sinalizada, enquanto a A-32a indica apenas a presença de pedestres circulando com frequência.","A-32a e A-32b"],["1-1-47",1,1,2,3,"Qual é o principal motivo de sinistros em locais com junções sucessivas contrárias, conforme sinalizado acima?","Falta de atenção do motorista que não percebe os veículos entrando ou cruzando.",["Defeito no veículo.","Falta de acostamento.","Má conservação da pintura da placa."],"A distração é a causa mais comum de colisões laterais nesses pontos.","A-11a"],["1-1-48",1,1,2,3,"Qual o principal erro que causa sinistro em cruzamentos como o da placa?","Falta de atenção e avanço sem observar os outros veículos.",["Usar o cinto de segurança.","Manter velocidade reduzida.","Parar para observar o trânsito."],"A distração e o avanço apressado são causas comuns de colisão lateral.","A-11a"],["1-1-49",1,1,1,2,"Qual o principal objetivo da restrição indicada pela placa acima?","Aumentar a segurança e preservar o fluxo adequado de veículos leves.",["Reduzir a velocidade dos ônibus nas rodovias.","Induzir o uso de veículos particulares.","Garantir estacionamento público."],"A restrição evita congestionamentos e riscos estruturais.","R-38"],["1-1-50",1,1,1,2,"Se a via deixa de ser duplicada e surge a placa acima, o que isso significa para o condutor?","Que haverá tráfego nos dois sentidos em um mesmo pavimento.",["Que a via passa a ser exclusiva para ônibus.","Que deve parar o veículo.","Que o limite de velocidade aumenta."],"Essa sinalização marca o fim da separação física de pistas.","R-28"],["1-1-51",1,1,0,2,"A placa “PARE” exige que o motorista:","Faça parada total e só siga após garantir segurança.",["Diminua a marcha e buzine antes de cruzar.","Avance se tiver prioridade.","Pare apenas se houver pedestres."],"Parar completamente é uma obrigação legal, mesmo se o cruzamento parecer livre.","R-1"],["1-1-52",1,1,0,2,"A placa “Sentido Proibido” serve para:","A entrada de veículos naquela via ou faixa é proibida, pois o tráfego flui no sentido contrário.",["Avisar sobre obras na pista.","Indicar estacionamento regulamentado.","Mostrar a existência de pedágio."],"É usada para manter a ordem de fluxo e evitar entrada em vias de sentido único no sentido contrário.","R-3"],["1-1-53",1,1,0,2,"A placa acima obriga o condutor a:","Virar à esquerda no local indicado.",["Seguir em frente.","Virar à direita.","Fazer retorno."],"A seta curvada indica que o motorista deve obrigatoriamente virar à esquerda.","R-25a"],["1-1-54",1,1,0,2,"A placa acima proíbe o motorista de:","Fazer conversão à esquerda, inclusive retorno.",["Fazer conversão à direita.","Parar o veículo.","Entrar em via preferencial."],"A seta cortada para a esquerda representa a proibição de virar ou retornar nessa direção.","R-4a"],["1-1-55",1,1,0,2,"A principal diferença entre a placa “Dê a Preferência” e a placa “PARE” é que:","Na placa “dê a preferência” o condutor só para se houver necessidade, na placa “pare” a parada é obrigatória.",["Ambas obrigam parada total.","A “Dê a Preferência” é usada em rodovias e a “PARE” apenas em cidades.","A “Dê a Preferência” indica via sem cruzamento."],"“Dê a Preferência” indica atenção e redução de velocidade, com parada apenas se necessário, já “PARE” exige parada total.",""],["1-1-56",1,1,0,3,"A principal função da placa acima é:","Alertar o motorista sobre o início de uma pista dividida, aumentando a segurança do tráfego.",["Informar que há pedágio adiante.","Indicar pista escorregadia.","Anunciar a presença de curvas perigosas."],"A placa orienta o condutor sobre mudança física na via, melhorando a organização do tráfego.","A-42a"],["1-1-57",1,1,0,2,"Ana dirige em pista simples e encontra a placa acima. Essa proibição deve ser seguida enquanto:","Houver essa sinalização na via.",["O condutor achar que é seguro.","Houver espaço suficiente.","O veículo da frente mantiver a velocidade."],"A sinalização de fim de proibição deve indicar claramente o término da restrição.","R-7"],["1-1-58",1,1,0,2,"André dirige em uma avenida e vê a placa acima. O que deve fazer?","Permanecer na faixa em que está até o final da restrição.",["Mudar de faixa com cuidado, se não houver veículos.","Encostar à direita para seguir devagar.","Ultrapassar pela direita."],"A placa R-8a proíbe qualquer deslocamento lateral da esquerda para a direita enquanto durar o trecho sinalizado.","R-8a"],["1-1-59",1,1,0,2,"Ao aproximar-se de uma interseção sinalizada com “Dê a Preferência”, o condutor deve:","Reduzir a velocidade, observar o tráfego na via principal e só avançar se for seguro.",["Parar sobre a faixa de pedestres.","Seguir direto, pois tem prioridade.","Buzinar para indicar sua intenção de cruzar."],"Essa placa exige comportamento prudente e observação antes de atravessar, sem necessidade de parada total.","R-2"],["1-1-60",1,1,0,3,"Ao dirigir em área rural e ver esta placa, o que o condutor deve prever?","Possível entrada ou saída lenta de tratores.",["Alta velocidade no trecho.","Presença de pedestres.","Obras em pista."],"A sinalização previne acidentes causados por diferença de velocidade entre veículos.","A-31"],["1-1-61",1,1,0,2,"Ao encontrar a placa “PARE” em um cruzamento, o condutor deve:","Parar completamente o veículo antes da linha de retenção e só seguir quando a via estiver livre.",["Reduzir a velocidade e atravessar devagar se não houver veículos.","Parar apenas se houver outro veículo aproximando-se.","Aumentar a velocidade para não atrapalhar o fluxo."],"A parada total é obrigatória mesmo sem trânsito no local. Essa placa indica um ponto de risco elevado.","R-1"],["1-1-62",1,1,0,2,"Ao encontrar a placa acima, o motorista deve:","Sinalizar e virar à esquerda com segurança.",["Seguir reto, sem reduzir a velocidade.","Virar à direita imediatamente.","Parar no acostamento."],"A manobra deve ser feita com antecedência, respeitando pedestres e ciclistas.","R-25a"],["1-1-63",1,1,2,2,"Ao ver a placa “60 km/h”, o condutor deve entender que:","Essa é a velocidade máxima permitida para aquele trecho da via.",["É a velocidade obrigatória.","É apenas uma recomendação.","É a velocidade mínima."],"A placa R-19 fixa o limite máximo permitido, não a velocidade obrigatória.","R-19"],["1-1-64",1,1,0,2,"Ao ver a placa “Dê a Preferência”, o motorista deve:","Reduzir a velocidade e deixar passar os veículos que vêm pela via principal.",["Parar completamente o veículo, mesmo sem outros carros.","Avançar primeiro, pois tem prioridade.","Buzinar para sinalizar que vai passar."],"A placa R-2 orienta o condutor a ceder a passagem, parando apenas se for necessário para evitar colisão.","R-2"],["1-1-65",1,1,0,2,"Ao ver a placa “Proibido Virar à Esquerda”, o motorista deve:","Seguir em frente ou virar à direita, respeitando a proibição.",["Fazer a conversão à esquerda com cuidado.","Parar o veículo no cruzamento.","Reduzir a velocidade e virar rapidamente."],"Essa placa impede qualquer conversão à esquerda naquele ponto, devendo o condutor escolher outro trajeto permitido.","R-4a"],["1-1-66",1,1,0,2,"Ao ver a placa com uma buzina cortada por uma faixa vermelha, o condutor deve entender que:","É proibido usar buzina ou qualquer sinal sonoro no local.",["Deve buzinar para avisar pedestres.","Só pode buzinar durante o dia.","O uso da buzina é obrigatório."],"A placa R-20 indica proibição de sons que possam causar incômodo ou perturbação.","R-20"],["1-1-67",1,1,0,2,"Ao ver a placa com uma seta preta apontando para baixo e à direita, como a figura acima, o condutor deve entender que:","A passagem é obrigatória pelo lado direito do obstáculo.",["Ele deve virar à esquerda.","É permitido passar por qualquer lado.","Deve parar o veículo."],"A placa R-24b obriga o condutor a contornar o obstáculo pelo lado indicado.","R-24b"],["1-1-68",1,1,0,3,"Ao ver esta placa, o motorista deve:","Reduzir a velocidade e ficar atento à travessia de pessoas.",["Aumentar a velocidade.","Buzinar para os pedestres saírem.","Seguir sem se preocupar."],"O respeito ao pedestre é um dos pilares da segurança viária.","A-32a"],["1-1-69",1,1,0,2,"Camila trafega atrás de um caminhão em um trecho com a placa acima. O que ela deve fazer?","Permanecer em sua faixa, mantendo distância segura.",["Ultrapassar pela faixa da esquerda rapidamente.","Deslocar-se pelo acostamento.","Fazer sinal de luz pedindo passagem."],"A segurança exige paciência, ultrapassar em trecho proibido pode causar colisões frontais.","R-7"],["1-1-70",1,1,0,2,"Carla vê a placa acima em uma ponte. Por que ela foi instalada ali?","Para evitar que os veículos mudem de faixa em local estreito e causem colisões.",["Porque há radar de velocidade.","Porque é área de pedágio.","Porque é trecho de ultrapassagem."],"Em pontes e viadutos, mudar de faixa representa risco de choque lateral e deve ser evitado.","R-8a"],["1-1-71",1,1,0,2,"Cláudia conduz um caminhão com carga de fardos empilhados e vê a placa acima antes de um viaduto. O que deve fazer?","Verificar se a carga ultrapassa o limite e não passar se estiver acima.",["Acelerar para passar rápido.","Passar pela calçada lateral.","Pedir ajuda a outro motorista."],"O condutor é responsável por garantir que o veículo e a carga estejam dentro dos limites de altura.","R-15"],["1-1-72",1,1,0,2,"Cláudia dirige um automóvel e vê a placa acima em uma rua do centro da cidade. Ela pode seguir?","Sim, pois a restrição é apenas para caminhões.",["Não, a via é totalmente bloqueada.","Somente se for moradora.","Apenas se for horário noturno."],"A placa R-9 restringe apenas o trânsito de caminhões, veículos de passeio, ônibus e motos podem transitar.","R-9"],["1-1-73",1,1,0,3,"Como o condutor deve agir ao entrar em uma rotatória sinalizada por essa placa?","Deve ceder passagem aos veículos que já circulam dentro dela.",["Deve entrar sem olhar.","Deve parar no meio da pista.","Deve buzinar antes de entrar."],"Nas rotatórias, a preferência é de quem já está circulando nelas. CTB art. 29, III, “c”.","A-12"],["1-1-74",1,1,0,2,"Em quais locais a placa acima é mais utilizada?","Em vias estreitas, áreas residenciais ou centros históricos.",["Em rodovias de pista dupla.","Em estações rodoviárias.","Em faixas de ônibus."],"Essas áreas não comportam veículos grandes com segurança.","R-38"],["1-1-75",1,1,0,2,"Em que locais a placa acima costuma ser instalada?","Antes de canteiros centrais, ilhas, obras e divisores de pista.",["Em estacionamentos subterrâneos.","Em faixas de pedestre.","Em zonas escolares."],"Essa placa orienta o motorista a contornar obstáculos fixos ou temporários com segurança.","R-24b"],["1-1-76",1,1,0,2,"Em que locais costuma ser instalada a placa acima?","No final de vias de mão única, indicando o início do duplo sentido.",["Em pontes de pista dupla.","Em estacionamentos privados.","Em pedágios automáticos."],"É usada na transição entre vias de mão única e mão dupla.","R-28"],["1-1-77",1,1,0,2,"Essa placa é mais comum em quais locais?","Calçadões, parques e ciclovias compartilhadas.",["Rodovias de pista dupla.","Pontes exclusivas para caminhões.","Estacionamentos subterrâneos."],"É usada em locais urbanos voltados à mobilidade ativa.","R-44"],["1-1-78",1,1,0,2,"Fernanda está em uma via de pista dupla e vê a placa acima. Qual é o significado dessa placa?","É proibido fazer retorno à esquerda no local indicado.",["É permitido virar à esquerda para estacionar.","É obrigatório virar à direita.","Indica fim de proibição."],"Essa placa proíbe a manobra de retorno à esquerda, que pode causar risco a veículos vindos no sentido oposto.","R-5a"],["1-1-79",1,1,0,2,"João para o carro por alguns segundos em frente a essa placa acima para deixar um passageiro. Ele está correto?","Não, pois a placa proíbe qualquer parada, mesmo rápida.",["Sim, se o passageiro descer rápido.","Sim, se mantiver o pisca-alerta ligado.","Sim, se o motor permanecer ligado."],"Essa placa proíbe imobilizar o veículo por qualquer motivo, mesmo por tempo curto.","R-6c"],["1-1-80",1,1,0,2,"Júlio para seu carro na frente de um portão onde há a placa acima. Qual é a infração cometida?","Estacionar em local proibido pela sinalização.",["Parar o veículo para embarque rápido.","Transitar em faixa exclusiva.","Nenhuma infração."],"A placa R-6a proíbe estacionar, inclusive em frente a garagens e acessos a propriedades.","R-6a"],["1-1-81",1,1,0,2,"Lucas conduz seu carro e vê a placa acima junto a uma faixa contínua amarela. O que isso significa?","É proibido virar à direita e também mudar de faixa naquele trecho.",["Pode virar se não houver veículos.","É uma advertência temporária.","Serve apenas para ônibus."],"A combinação reforça a proibição de conversão e mudança de direção.","R-4b"],["1-1-82",1,1,0,2,"Marcos dirige em uma rodovia de pista simples e vê a placa acima. O que deve fazer?","Continuar trafegando pela direita da via.",["Manter-se no centro da pista.","Ir para a faixa da esquerda.","Encostar no acostamento e parar."],"O sentido de circulação no Brasil é pela direita, a placa reforça essa regra.","R-23"],["1-1-83",1,1,0,2,"O formato e as cores da placa “Proibido Virar à Esquerda” indicam que se trata de:","Uma placa de regulamentação.",["Uma placa de advertência.","Uma placa educativa.","Uma placa de serviço."],"As placas circulares com fundo branco e borda vermelha expressam proibições, pertencendo à categoria de regulamentação.","R-4a"],["1-1-84",1,1,0,2,"Por que o motorista deve redobrar a atenção ao se deparar com essa placa?","Passará a ter veículos vindo em sentido oposto.",["Poderá usar toda a pista livremente.","Não haverá mais sinalização horizontal.","O tráfego será apenas de pedestres."],"A coexistência de sentidos opostos exige cuidado redobrado e respeito à faixa divisória.","R-28"],["1-1-85",1,1,0,2,"O que a placa acima indica?","O condutor deve seguir em frente ou virar à esquerda.",["O condutor deve obrigatoriamente virar à direita.","O condutor deve retornar.","O condutor deve parar."],"As duas setas indicam as únicas manobras permitidas — seguir ou virar à esquerda.","R-25c"],["1-1-86",1,1,0,3,"O que a placa acima indica?","Que a via termina à frente e o motorista deve virar à direita ou à esquerda.",["Que há uma lombada.","Que a pista é de mão dupla.","Que há um túnel."],"A placa adverte sobre o fim da via e a necessidade de conversão.","A-8"],["1-1-87",1,1,0,2,"O que a placa acima pretende evitar?","Conflitos de tráfego e acidentes em cruzamentos.",["Paradas prolongadas.","Redução de velocidade.","Conversões à direita."],"Essa sinalização organiza o fluxo e evita colisões laterais e frontais.","R-25a"],["1-1-88",1,1,0,2,"O que acontece se um carro particular trafegar em via sinalizada com acima?","O condutor comete infração de trânsito.",["A via é livre para todos.","O veículo tem prioridade sobre o ônibus.","Nenhuma consequência legal."],"Trafegar em faixa exclusiva é infração de natureza média, conforme o CTB.","R-32"],["1-1-89",1,1,0,3,"O que essa placa está avisando?","Que existe um cruzamento à frente, onde podem vir carros dos dois lados.",["Que a via é sem saída.","Que há uma lombada à frente.","Que é obrigatório virar à direita."],"Essa placa alerta para o encontro de duas vias, exigindo cuidado e redução de velocidade.","A-6"],["1-1-90",1,1,0,3,"O que essa placa está avisando?","Que há duas entradas ou saídas próximas, uma à esquerda e outra à direita.",["Que existe um semáforo à frente.","Que há uma lombada dupla.","Que é proibido virar à esquerda."],"A placa indica junções próximas em sentidos opostos, exigindo cuidado.","A-11a"],["1-1-91",1,1,0,3,"O que essa placa está avisando?","Que há uma parada obrigatória mais à frente.",["Que o motorista deve seguir sem parar.","Que há um posto policial.","Que é o fim da pista."],"Essa placa prepara o condutor para parar completamente adiante.","A-15"],["1-1-92",1,1,0,3,"O que essa placa está avisando?","Que há uma via entrando pela esquerda.",["Que a pista é de mão dupla.","Que existe uma lombada.","Que é proibido virar à esquerda."],"A placa indica que outra via se junta à estrada principal pela esquerda.","A-7a"],["1-1-93",1,1,0,3,"O que essa placa indica ao condutor?","Que há uma depressão ou abaixamento na pista à frente.",["Que existe uma lombada.","Que há pista irregular.","Que o pavimento é novo."],"A placa alerta para um rebaixamento que pode causar impacto na suspensão do veículo.","A-19"],["1-1-94",1,1,0,3,"O que essa placa indica ao condutor?","Que há uma rotatória à frente.",["Que a via é sem saída.","Que existe um retorno proibido.","Que há um quebra-molas."],"A placa adverte que o condutor se aproxima de uma interseção circular (rotatória).","A-12"],["1-1-95",1,1,0,3,"O que essa placa indica ao condutor?","Que há uma subida forte à frente.",["Que a pista está em declive.","Que há uma lombada.","Que existe um pedágio logo adiante."],"A placa alerta sobre um trecho de aclive, ou seja, uma subida íngreme.","A-20b"],["1-1-96",1,1,0,3,"O que essa placa indica?","Que a via se divide em duas direções à frente.",["Que há um cruzamento com semáforo.","Que a pista é de mão dupla.","Que a via termina logo adiante."],"A placa alerta que a estrada se divide e o condutor deve decidir o sentido com antecedência.","A-9"],["1-1-97",1,1,0,3,"O que essa placa indica?","Que há um semáforo à frente.",["Que a via é preferencial.","Que há uma lombada dupla.","Que é permitido ultrapassar."],"A placa alerta que o condutor se aproxima de um cruzamento com controle de semáforo.","A-14"],["1-1-98",1,1,0,3,"O que essa placa indica?","Que há uma lombada ou saliência na pista à frente.",["Que há um buraco na via.","Que o trânsito está livre.","Que há pedágio."],"A placa alerta o motorista sobre a presença de uma elevação na pista.","A-18"],["1-1-99",1,1,0,3,"O que essa placa quer dizer para o motorista?","Que a estrada tem várias curvas, começando para a esquerda.",["Que há um cruzamento com semáforo.","Que deve virar à esquerda logo.","Que há um quebra-molas à frente."],"Essa placa avisa que vem um trecho com muitas curvas, exigindo mais cuidado.","A-3a"],["1-1-100",1,1,0,3,"O que essa placa quer dizer?","Que há uma descida forte à frente.",["Que a pista está com lombadas.","Que há uma subida acentuada.","Que a pista é irregular."],"A placa alerta sobre um trecho em declive, que exige controle de velocidade.","A-20a"],["1-1-101",1,1,0,3,"O que esta placa indica?","Que há circulação de tratores ou máquinas agrícolas na via.",["Que há posto de combustível à frente.","Que é uma estrada urbana.","Que é proibido o trânsito de veículos grandes."],"O símbolo do trator indica possível presença de veículos agrícolas lentos.","A-31"],["1-1-102",1,1,0,3,"O que esta placa indica?","Que há pedestres circulando ou atravessando a via.",["Que há ciclistas à frente.","Que o trânsito é só de veículos pesados.","Que é uma estrada rural."],"A placa alerta o condutor sobre a presença frequente de pedestres na pista.","A-32a"],["1-1-103",1,1,0,2,"O que indica a placa acima?","Circulação exclusiva de bicicletas.",["Proibição de circulação de bicicletas.","Faixa compartilhada entre carros e bicicletas.","Proibição de pedestres."],"A placa R-34 garante o uso exclusivo da via ou faixa aos ciclistas.","R-34"],["1-1-104",1,1,0,2,"O que indica a placa acima?","O condutor deve seguir em frente ou virar à direita.",["O condutor deve virar à esquerda.","É proibido estacionar.","Deve realiza
